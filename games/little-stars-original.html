<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ed"><title>Little Stars • Play & Learn</title>
<style>
:root{font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:#28374b;background:#fff8ed;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 5% 5%,#fff0cb,transparent 40%),radial-gradient(circle at 95% 15%,#e7e6ff,transparent 35%),#fff8ed}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #5549b6;outline-offset:4px}button:disabled{cursor:default}button:active:not(:disabled){transform:translateY(3px)}[hidden]{display:none!important}.app{max-width:900px;margin:auto;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}.logo{font-size:clamp(19px,3vw,25px);font-weight:950;letter-spacing:-.7px}.logo span{color:#ef9e36}.tools{display:flex;gap:9px}.round{width:53px;height:53px;border:2px solid #e3e5e7;border-radius:18px;background:white;color:#33465a;box-shadow:0 4px 0 #e4e2df;font-size:24px}.stars{border-radius:18px;padding:12px 14px;background:#fff4d4;border:2px solid #f3dc9b;font-size:18px;font-weight:900;min-width:85px}.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16px 0 28px;gap:18px}.eyebrow{font-weight:900;letter-spacing:2px;text-transform:uppercase;font-size:12px;color:#7160a8}.heading{font-size:clamp(35px,7vw,65px);line-height:1.09;letter-spacing:-2px;margin:0;font-weight:950}.sub{font-size:clamp(17px,3vw,21px);color:#627084;margin:0;line-height:1.5;max-width:500px}.character{font-size:clamp(75px,18vw,132px);line-height:1.1;filter:drop-shadow(0 9px 0 #f0dfb9)}.big{border:0;border-radius:24px;background:#287b67;color:white;padding:18px 35px;min-height:70px;font-size:23px;font-weight:950;box-shadow:0 7px 0 #175849;min-width:min(100%,290px)}.big:active{box-shadow:0 3px 0 #175849}.hint{font-size:15px;color:#6d7b89;margin:0}.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:min(100%,650px)}.mode{min-height:240px;border-radius:34px;border:4px solid white;box-shadow:0 9px 0 #e4e1dd,0 16px 35px #39485c13;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#29384d}.mode.letters{background:#ffe0e9}.mode.numbers{background:#d9eeff}.mode-art{font-size:62px}.mode strong{font-size:clamp(44px,8vw,65px);line-height:1}.mode small{font-size:18px;font-weight:800}.lesson{width:min(100%,680px);display:flex;flex-direction:column;align-items:center;gap:17px}.progress{display:flex;align-items:center;gap:9px;justify-content:center}.progress i{width:44px;height:11px;border-radius:20px;background:#e2e0e0}.progress i.on{background:#6c5ab4}.lesson-title{font-size:clamp(24px,5vw,35px);font-weight:950;margin:0}.learn-card{width:min(100%,440px);min-height:265px;border-radius:35px;background:#fff;border:4px solid #fff;box-shadow:0 9px 0 #e4e1dd,0 17px 30px #33415514;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.letter{font-size:clamp(100px,25vw,150px);font-weight:950;line-height:1;color:#6a54b1}.picture{font-size:72px;line-height:1.3}.word{font-size:25px;font-weight:900}.tap{font-size:14px;color:#68758b}.count-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;background:#fff;border-radius:28px;padding:18px;width:min(100%,540px);box-shadow:0 8px 0 #e7e3de}.item{font-size:clamp(28px,7vw,46px);min-height:76px;background:#f6f8fb;border:3px solid #e6ebf0;border-radius:19px;position:relative}.item.done{background:#dcf4e9;border-color:#69b795}.item b{position:absolute;right:-5px;top:-9px;background:#287b67;color:white;border-radius:50%;font-size:14px;width:25px;height:25px;display:grid;place-items:center}.count-status{font-size:24px;font-weight:950;color:#26755f}.quiz-pics{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;max-width:530px;background:white;border-radius:25px;padding:15px;font-size:clamp(28px,7vw,44px)}.choices{display:flex;justify-content:center;gap:12px;width:100%}.answer{flex:1;max-width:180px;min-height:130px;background:white;border:4px solid #e4e5ed;border-radius:28px;box-shadow:0 6px 0 #dcdde5;font-size:clamp(48px,12vw,78px);font-weight:950;color:#6a54b1}.answer.wrong{background:#fff1e9;border-color:#e6b29c}.answer.correct{background:#dcf5e6;border-color:#66b990}.answer.help{border-color:#e5ad45;box-shadow:0 0 0 5px #ffedbf}.feedback{font-size:20px;font-weight:900;min-height:28px;color:#39735d}.reward-stars{font-size:clamp(55px,13vw,100px);letter-spacing:4px}.secondary{background:white;border:2px solid #e0e3e7;border-radius:18px;padding:12px 22px;min-height:50px;font-size:16px;font-weight:850;color:#3b5067}.footer{text-align:center;padding:8px 0;font-size:12px;color:#87909c}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:390px){.app{padding-left:10px;padding-right:10px}.mode-grid{gap:10px}.mode{min-height:200px;border-radius:25px}.mode-art{font-size:48px}.mode small{font-size:15px}.item{min-height:58px;border-radius:14px}.count-grid{gap:6px;padding:10px}.answer{min-height:102px;border-radius:20px}.stage{gap:13px}}@media(max-height:520px) and (orientation:landscape){.stage{justify-content:flex-start}.mode{min-height:150px}.mode-art{font-size:34px}.character{font-size:60px}.learn-card{min-height:180px}.letter{font-size:80px}.picture{font-size:50px}.item{min-height:48px}.answer{min-height:80px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="app"><header class="top"><div class="logo">⭐ Little <span>Stars</span></div><div class="tools"><button id="home" class="round" aria-label="Go to game menu" hidden>⌂</button><button id="speak" class="round" aria-label="Hear instructions again" hidden>🔊</button><button id="stars" class="stars" aria-label="View collected stars" hidden>⭐ <span id="score">0</span></button></div></header><main id="stage" class="stage" tabindex="-1"></main><footer class="footer">Made for little learners • Ages 3–5</footer></div><div class="sr" aria-live="polite" id="live"></div>
<script>
"use strict";
const LETTERS=[["A","Apple","🍎"],["B","Ball","⚽"],["C","Cat","🐱"],["D","Dog","🐶"],["E","Elephant","🐘"],["F","Fish","🐟"],["G","Grapes","🍇"],["H","House","🏠"],["I","Ice cream","🍦"],["J","Juice","🧃"],["K","Kite","🪁"],["L","Lion","🦁"],["M","Moon","🌙"],["N","Nest","🪺"],["O","Orange","🍊"],["P","Penguin","🐧"],["Q","Queen","👑"],["R","Rainbow","🌈"],["S","Sun","☀️"],["T","Tree","🌳"],["U","Umbrella","☂️"],["V","Violin","🎻"],["W","Whale","🐳"],["X","X-ray","🩻"],["Y","Yo-yo","🪀"],["Z","Zebra","🦓"]];
const OBJECTS=[["🐥","chick","chicks"],["🍓","strawberry","strawberries"],["🎈","balloon","balloons"],["🐞","ladybug","ladybugs"],["🍪","cookie","cookies"],["🌼","flower","flowers"],["🦋","butterfly","butterflies"],["🚗","car","cars"],["⭐","star","stars"],["🐟","fish","fish"]];
const WORDS=["zero","one","two","three","four","five","six","seven","eight","nine","ten"];
const $=id=>document.getElementById(id);const stage=$("stage");const KEY="little-stars-original-v1";
let state={letters:0,numbers:1,stars:0},page="welcome",track="letters",step=0,lessonIndex=0,instruction="",token=0,wrong=0,completed=false,voiceReady=false;
try{const saved=JSON.parse(localStorage.getItem(KEY)||"{}");if(saved&&typeof saved==="object"){state.letters=Number.isInteger(saved.letters)&&saved.letters>=0&&saved.letters<26?saved.letters:0;state.numbers=Number.isInteger(saved.numbers)&&saved.numbers>=1&&saved.numbers<=10?saved.numbers:1;state.stars=Number.isSafeInteger(saved.stars)&&saved.stars>=0?saved.stars:0}}catch{}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function voice(text){instruction=text;$("live").textContent=text;token++;const t=token;try{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.82;u.pitch=1.12;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==="en-US"&&/Samantha|Google|Jenny|Aria/i.test(v.name))||voices.find(v=>v.lang.startsWith("en"))||null;if(t===token)speechSynthesis.speak(u)}catch{}}
function show(html,name){page=name;token++;try{speechSynthesis.cancel()}catch{}stage.innerHTML=html;$("home").hidden=name==="welcome"||name==="menu";$("speak").hidden=name==="welcome";$("stars").hidden=name==="welcome";$("score").textContent=state.stars;stage.focus({preventScroll:true});window.scrollTo(0,0)}
function dots(n){return '<div class="progress" aria-label="Round '+(n+1)+' of 3">'+[0,1,2].map(i=>'<i class="'+(i<=n?"on":"")+'"></i>').join("")+'</div>'}
function button(label="Next ➜"){return '<button class="big" id="next">'+label+'</button>'}
function welcome(){show('<div class="character" aria-hidden="true">🌟</div><div class="eyebrow">A happy place to learn</div><h1 class="heading">Little Stars<br>ABC & 123</h1><p class="sub">Tiny steps. Big discoveries. Lots of smiles.</p><button class="big" id="begin">▶ Let’s play!</button><p class="hint">🔊 Turn up your sound to hear the games</p>',"welcome");$("begin").onclick=()=>{voiceReady=true;menu()}}
function menu(){show('<div class="eyebrow">Choose your adventure</div><h1 class="heading">What shall we<br>play today?</h1><div class="mode-grid"><button class="mode letters" id="letters"><span class="mode-art" aria-hidden="true">🍎 🐱</span><strong>ABC</strong><small>Letter Land</small></button><button class="mode numbers" id="numbers"><span class="mode-art" aria-hidden="true">🐥 🎈</span><strong>123</strong><small>Number Garden</small></button></div><p class="hint">Tap a picture to start exploring!</p>',"menu");$("letters").onclick=()=>start("letters");$("numbers").onclick=()=>start("numbers");voice("Welcome to Little Stars! Choose A B C for letters, or one two three for numbers.")}
function start(which){track=which;step=0;lessonIndex=0;lesson()}
function lesson(){const isLetter=track==="letters";const index=isLetter?state.letters:state.numbers;show('<div class="lesson">'+dots(lessonIndex)+'<div class="eyebrow">'+(isLetter?"Letter Land":"Number Garden")+'</div><h2 class="lesson-title">'+(isLetter?"Meet a new letter!":"Let’s count together!")+'</h2>'+(isLetter?'<button class="learn-card" id="learn" aria-label="Hear letter '+LETTERS[index][0]+'"><span class="letter">'+LETTERS[index][0]+'</span><span class="picture" aria-hidden="true">'+LETTERS[index][2]+'</span><span class="word">'+LETTERS[index][1]+'</span><span class="tap">🔊 Tap to hear</span></button>':'<div class="count-grid">'+Array.from({length:index},(_,i)=>'<button class="item" data-i="'+i+'" aria-label="Count object '+(i+1)+'" aria-pressed="false">'+OBJECTS[(index-1)%10][0]+'</button>').join("")+'</div><div class="count-status" id="count">0 of '+index+'</div>')+'<div id="next-wrap" '+(isLetter?"":"hidden")+ '>'+button("Next ➜")+'</div></div>',"lesson");
if(isLetter){const [l,w]=LETTERS[index];voice(l+". "+l+" is for "+w+". Tap the big arrow when you are ready.");$("learn").onclick=()=>voice(l+". "+l+" is for "+w+".")}else{let count=0;const o=OBJECTS[(index-1)%10];voice("Let’s count "+o[2]+"! Tap each one.");stage.querySelectorAll(".item").forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;b.classList.add("done");b.setAttribute("aria-pressed","true");count++;b.insertAdjacentHTML("beforeend",'<b>'+count+'</b>');$("count").textContent=count+" of "+index;if(count===index){$("next-wrap").hidden=false;voice("Wonderful! "+WORDS[index]+" "+(index===1?o[1]:o[2])+"! Tap next.")}else voice(WORDS[count])})}
$("next").onclick=()=>{if(isLetter)state.letters=(state.letters+1)%26;else state.numbers=state.numbers%10+1;persist();lessonIndex++;if(lessonIndex<3)lesson();else{step=0;quiz()}}}
function optionsFor(answer,max){const pool=Array.from({length:max},(_,i)=>track==="letters"?i:i+1);const out=[answer];while(out.length<Math.min(3,pool.length)){const x=pool[Math.floor(Math.random()*pool.length)];if(!out.includes(x))out.push(x)}return out.sort(()=>Math.random()-.5)}
function quiz(){wrong=0;completed=false;const isLetter=track==="letters";const max=isLetter?26:10;const answer=isLetter?Math.floor(Math.random()*26):1+Math.floor(Math.random()*10);const howMany=!isLetter&&Math.random()<.5;const obj=OBJECTS[(answer-1+10)%10];const label=n=>isLetter?LETTERS[n][0]:String(n);const choices=optionsFor(answer,max);const prompt=howMany?"How many?":"Find "+label(answer);show('<div class="lesson">'+dots(step)+'<div class="eyebrow">Star Challenge</div><h2 class="lesson-title">'+prompt+'</h2>'+(howMany?'<div class="quiz-pics" role="img" aria-label="'+answer+' '+(answer===1?obj[1]:obj[2])+'">'+Array.from({length:answer},()=>'<span aria-hidden="true">'+obj[0]+'</span>').join("")+'</div>':'')+'<div class="choices">'+choices.map(n=>'<button class="answer" data-n="'+n+'" aria-label="'+(isLetter?"Letter ":"Number ")+label(n)+'">'+label(n)+'</button>').join("")+'</div><p class="feedback" id="feedback" role="status">You can do it! 💛</p><div id="next-wrap" hidden>'+button(step===2?"See my stars ⭐":"Next ➜")+'</div></div>',"quiz");
voice(howMany?"How many "+obj[2]+" can you see? Tap the number.":isLetter?"Can you find the letter "+label(answer)+"?":"Can you find the number "+WORDS[answer]+"?");
stage.querySelectorAll(".answer").forEach(b=>b.onclick=()=>{if(completed)return;const n=Number(b.dataset.n);if(n===answer){completed=true;b.classList.add("correct");stage.querySelectorAll(".answer").forEach(x=>x.disabled=true);state.stars++;persist();$("score").textContent=state.stars;$("feedback").textContent="You did it! ⭐";$("next-wrap").hidden=false;voice("Hooray! You found it! You earned a star. Tap next.")}else{wrong++;b.classList.add("wrong");$("feedback").textContent="Good try! Let’s try again 💛";if(wrong>=2)stage.querySelector('[data-n="'+answer+'"]').classList.add("help");voice("Nice try! Let’s find "+(isLetter?label(answer):WORDS[answer])+".")}});$("next").onclick=()=>{if(!completed)return;step++;if(step<3)quiz();else reward()}}
function reward(){show('<div class="character" aria-hidden="true">🥳</div><div class="eyebrow">You are a superstar!</div><h1 class="heading">Amazing job!</h1><div class="reward-stars" aria-label="Three stars">⭐⭐⭐</div><p class="sub">You explored, you tried, you learned!</p>'+button("Play again ➜")+'<button class="secondary" id="other">Choose another game</button>',"reward");$("next").onclick=()=>start(track);$("other").onclick=menu;voice("You did it! Three shiny stars! I am so proud of you. Let's play again!")}
function starJar(){show('<div class="character" aria-hidden="true">🏆</div><div class="eyebrow">My star collection</div><h1 class="heading">'+state.stars+' stars!</h1><div class="reward-stars" aria-hidden="true">⭐</div><p class="sub">Every little discovery makes you shine.</p>'+button("Let’s play ➜"),"jar");$("next").onclick=menu;voice("You have "+state.stars+" stars! Wonderful learning!")}
$("home").onclick=menu;$("speak").onclick=()=>voice(instruction);$("stars").onclick=starJar;welcome();
</script></body></html>
