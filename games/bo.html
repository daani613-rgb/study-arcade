<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>Bo Locust Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
/* Layout: a desert journey through Mitzrayim, 5 stations (pasuk words + each makkah), then the real 25-question test */
:root{
  --bg:#f6ead2; --card:#fffaf0; --ink:#2b2140; --muted:#6c6280; --line:#e6d3ad;
  --accent:#2f6fd6; --accent-soft:#dbe7fb; --good:#1f9a5b; --good-soft:#d5f3e3; --bad:#d63b3b; --bad-soft:#fbe0de; --sun:#f0a92b; --hl:#d6336c;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif; --heb:"Frank Ruhl Libre","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1712; --card:#2a2219; --ink:#f3eadb; --muted:#b8a990; --line:#45392a;
  --accent:#7fa8f0; --accent-soft:#25344f; --good:#4fd18b; --good-soft:#173d2a; --bad:#ff6b6b; --bad-soft:#4a1d1d; --sun:#f5be55; --hl:#ff7aa8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1712; --card:#2a2219; --ink:#f3eadb; --muted:#b8a990; --line:#45392a;
  --accent:#7fa8f0; --accent-soft:#25344f; --good:#4fd18b; --good-soft:#173d2a; --bad:#ff6b6b; --bad-soft:#4a1d1d; --sun:#f5be55; --hl:#ff7aa8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.55rem} h3{font-size:1.2rem}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.hb{font-family:var(--heb);font-weight:700;font-size:1.15em;unicode-bidi:isolate;direction:rtl}
.guide{display:flex;gap:12px;align-items:flex-start}
.guide .face{font-size:3rem;line-height:1;flex:none}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:700;min-width:0}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.btn{font-family:var(--display);font-weight:700;font-size:1.15rem;border:0;border-radius:16px;padding:12px 20px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.soft{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pill{font-family:var(--display);font-weight:700;background:var(--accent-soft);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums}
.stations{display:flex;flex-direction:column;gap:12px}
.station{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 16px;cursor:pointer;text-align:left;width:100%}
.station .ico{font-size:2.2rem;width:58px;height:58px;display:grid;place-items:center;background:var(--bg);border-radius:16px;flex:none}
.station .txt{flex:1;min-width:0}
.station small{display:block;color:var(--muted);font-weight:700;font-size:.9rem}
.stars{font-size:1.05rem;letter-spacing:2px;white-space:nowrap}
.station.final{background:var(--accent);border-color:var(--accent);color:#fff}
.station.final small{color:#fff;opacity:.9}
.station.final .ico{background:rgba(255,255,255,.22)}
.learn{display:flex;flex-direction:column;gap:12px}
.picbox{background:var(--bg);border-radius:18px;padding:14px;display:grid;place-items:center;min-height:120px;text-align:center}
.emo{font-size:3.8rem;line-height:1.15;letter-spacing:6px;text-align:center}
.bigheb{font-family:var(--heb);font-size:2.6rem;font-weight:700;direction:rtl;line-height:1.3}
.bigheb .p1{color:var(--hl)} .bigheb .p2{color:var(--accent)}
.legend{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:1rem;margin-top:6px}
.legend .p1{color:var(--hl)} .legend .p2{color:var(--accent)}
.word{font-family:var(--display);font-size:1.9rem;font-weight:800;color:var(--accent);line-height:1.1}
.say{font-size:1.15rem;font-weight:800;margin:0}
.ex{margin:0;background:var(--good-soft);border-radius:14px;padding:10px 12px;font-weight:700}
.he{margin:0;color:var(--muted);font-weight:700;direction:rtl;text-align:right}
.animals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.animals div{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:.85rem}
.animals span{font-size:2.3rem}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.q{font-size:1.25rem;font-weight:800;margin:0}
.tag{align-self:flex-start;font-family:var(--display);font-weight:700;background:var(--sun);color:#2b1d00;border-radius:999px;padding:2px 12px;font-size:.95rem}
.big-item{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);border-radius:18px;padding:14px;text-align:center}
.big-item .emo{font-size:3.6rem}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bin{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-weight:700;font-size:1.1rem;line-height:1.15}
.bin span{font-size:2.2rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:11px 14px;text-align:left;font-weight:800;cursor:pointer;font-size:1.05rem;display:flex;gap:8px;align-items:baseline}
.opt .l{font-family:var(--display);color:var(--accent);flex:none}
.opt.pick{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 22%,var(--card))}
.opt.ok,.bin.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no,.bin.no{border-color:var(--bad);background:var(--bad-soft)}
.shake{animation:shake .35s}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:100px;max-width:150px;font-weight:800;font-size:.92rem;text-align:center}
.tile span{font-size:2.4rem}
.tile.used{opacity:.25;cursor:default}
.tile.no{border-color:var(--bad)}
.seq{display:flex;gap:8px;justify-content:center;min-height:70px;background:var(--bg);border-radius:16px;padding:8px;flex-wrap:wrap;align-items:center}
.seq span{font-size:2.4rem}
.seq .arrow{font-size:1.3rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{border:3px solid var(--line);background:var(--card);border-radius:14px;padding:10px;font-weight:800;cursor:pointer;min-height:54px;font-size:1.05rem;text-align:center}
.mt.sel{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 25%,var(--card))}
.mt.done{border-color:var(--good);background:var(--good-soft);cursor:default}
.mt.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{font-weight:800;margin:0;min-height:1.4em;padding:10px 12px;border-radius:14px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb:empty{padding:0}
.bar{height:12px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);transition:width .3s}
.huge{font-family:var(--display);font-size:3.6rem;font-weight:800;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.bigstars{font-size:3rem;text-align:center;letter-spacing:6px}
.miss{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.miss li{background:var(--bad-soft);border-radius:14px;padding:10px 12px;font-weight:700}
.miss b{display:block}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .3s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.emo{font-size:3rem}.bigheb{font-size:2.1rem}.animals span{font-size:1.9rem}}
</style>

<div class="wrap" id="app"></div>

<style>
/* additions for Bo: fill-in sentences, typing, Hebrew phrase card */
.hphrase{font-family:var(--heb);font-weight:700;font-size:1.6rem;direction:rtl;text-align:center;line-height:1.5}
.esent{font-size:1.15rem;font-weight:700;text-align:center;margin:0}
.esent .gap{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--accent);margin:0 4px;color:var(--accent)}
.key{color:var(--hl);text-decoration:underline;text-underline-offset:4px}body{padding-bottom:80px}
.typein{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.typein input{font:inherit;font-size:1.2rem;font-weight:700;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-width:0;width:12em;text-align:center}
.typein input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bank button{font:inherit;font-weight:700;border:2px dashed var(--line);background:var(--card);border-radius:12px;padding:6px 12px;cursor:pointer;min-height:44px}
.saybtn{border:2px solid var(--line);background:var(--card);border-radius:999px;min-width:44px;min-height:44px;cursor:pointer;font-size:1.1rem}
.mini{display:flex;flex-direction:column;gap:8px}
.mini .ln{display:grid;grid-template-columns:1fr;gap:2px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.mini .ln .h{font-family:var(--heb);font-weight:700;font-size:1.2rem;direction:rtl;text-align:right}
.mini .ln .e{font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<script>
const H=t=>`<span class="hb" lang="he">${t}</span>`;
const emo=s=>`<div class="emo" aria-hidden="true">${s}</div>`;

/* ===== Every phrase from Rabbi Morris's 5 answer-key pages (Shemos 10:1-11).
   h = Hebrew, e = English with ___ where the sheet has a blank, k = the answer from the key (null = no blank). */
const P=[
 /* Pasuk 1 */
 {p:1,h:"וַיֹּאמֶר יְקֹוָק אֶל־מֹשֶׁה",e:"Hashem said to Moshe,",k:null},
 {p:1,h:"בֹּא אֶל־פַּרְעֹה",e:"\"___ to Pharaoh,",k:"Come"},
 {p:1,h:"כִּי־אֲנִי הִכְבַּדְתִּי אֶת־לִבּוֹ",e:"for I have made his heart ___",k:"heavy"},
 {p:1,h:"וְאֶת־לֵב עֲבָדָיו",e:"and the heart of his servants,",k:null},
 {p:1,h:"לְמַעַן שִׁתִי אֹתֹתַי אֵלֶּה",e:"so that I can put these ___ of Mine",k:"signs"},
 {p:1,h:"בְּקִרְבּוֹ",e:"in his midst.",k:null},
 /* Pasuk 2 */
 {p:2,h:"וּלְמַעַן תְּסַפֵּר",e:"and so that you will ___",k:"tell"},
 {p:2,h:"בְּאָזְנֵי בִנְךָ",e:"in the ears of your son",k:null},
 {p:2,h:"וּבֶן־בִּנְךָ",e:"and your ___",k:"grandson"},
 {p:2,h:"אֵת אֲשֶׁר הִתְעַלַּלְתִּי בְּמִצְרָיִם",e:"how I made a mockery of Mitzrayim,",k:null},
 {p:2,h:"וְאֶת־אֹתֹתַי אֲשֶׁר־שַׂמְתִּי בָם",e:"and My signs that I put among them,",k:null},
 {p:2,h:"וִידַעְתֶּם כִּי־אֲנִי יְקֹוָק",e:"and you will ___ that I am Hashem.\"",k:"know"},
 /* Pasuk 3 */
 {p:3,h:"וַיָּבֹא מֹשֶׁה וְאַהֲרֹן אֶל־פַּרְעֹה",e:"Moshe and Aharon ___ to Pharaoh",k:"came"},
 {p:3,h:"וַיֹּאמְרוּ אֵלָיו",e:"and they said to him,",k:null},
 {p:3,h:"כֹּה־אָמַר יְקֹוָק אֱלֹהֵי הָעִבְרִים",e:"\"So said Hashem, the G-d of the Ivrim:",k:null},
 {p:3,h:"עַד־מָתַי מֵאַנְתָּ",e:"Until when will you ___",k:"refuse"},
 {p:3,h:"לֵעָנֹת מִפָּנָי",e:"to be humbled before Me? (see Rashi)",k:null},
 {p:3,h:"שַׁלַּח עַמִּי וְיַעַבְדֻנִי",e:"___ My people, so they can serve Me.",k:"Send"},
 /* Rashi on pasuk 3 */
 {p:"r3",h:"לֵעָנֹת",e:"\"to be humbled\"",k:null},
 {p:"r3",h:"כְּתַרְגּוּמוֹ",e:"as Onkelos translates it:",k:null},
 {p:"r3",h:"\"לְאִתְכְּנָעָא\"",e:"\"to be humbled\" (in Aramaic),",k:null},
 {p:"r3",h:"וְהוּא מִגִּזְרַת עָנִי",e:"and it comes from the word עָנִי:",k:null},
 {p:"r3",h:"מֵאַנְתָּ לִהְיוֹת עָנִי וְשָׁפָל",e:"you refused to be ___ and lowly",k:"poor"},
 {p:"r3",h:"מִפָּנַי",e:"before Me.",k:null},
 /* Pasuk 4 */
 {p:4,h:"כִּי אִם־מָאֵן אַתָּה",e:"For if you refuse",k:null},
 {p:4,h:"לְשַׁלֵּחַ אֶת־עַמִּי",e:"to send My people,",k:null},
 {p:4,h:"הִנְנִי מֵבִיא מָחָר",e:"behold, I am bringing ___",k:"tomorrow"},
 {p:4,h:"אַרְבֶּה בִּגְבֻלֶךָ",e:"___ into your borders.",k:"Locusts"},
 /* Pasuk 5 */
 {p:5,h:"וְכִסָּה אֶת־עֵין הָאָרֶץ",e:"It will ___ the eye of the land,",k:"cover"},
 {p:5,h:"וְלֹא יוּכַל לִרְאֹת אֶת־הָאָרֶץ",e:"and no one will be able to see the land.",k:null},
 {p:5,h:"וְאָכַל אֶת־יֶתֶר הַפְּלֵטָה",e:"It will ___ the rest of what escaped,",k:"eat"},
 {p:5,h:"הַנִּשְׁאֶרֶת לָכֶם מִן־הַבָּרָד",e:"that was left for you from the hail,",k:null},
 {p:5,h:"וְאָכַל אֶת־כָּל־הָעֵץ",e:"and it will eat all the trees",k:null},
 {p:5,h:"הַצֹּמֵחַ לָכֶם מִן־הַשָּׂדֶה",e:"that are ___ for you in the field.",k:"growing"},
 /* Pasuk 6 */
 {p:6,h:"וּמָלְאוּ בָתֶּיךָ",e:"They will ___ your houses,",k:"fill"},
 {p:6,h:"וּבָתֵּי כָל־עֲבָדֶיךָ",e:"and the houses of all your servants,",k:null},
 {p:6,h:"וּבָתֵּי כָל־מִצְרַיִם",e:"and the houses of all Mitzrayim,",k:null},
 {p:6,h:"אֲשֶׁר לֹא־רָאוּ אֲבֹתֶיךָ",e:"which your ___ never saw,",k:"fathers"},
 {p:6,h:"וַאֲבוֹת אֲבֹתֶיךָ",e:"nor your fathers' fathers,",k:null},
 {p:6,h:"מִיּוֹם הֱיוֹתָם עַל־הָאֲדָמָה",e:"from the day they were on the land",k:null},
 {p:6,h:"עַד הַיּוֹם הַזֶּה",e:"until this ___.",k:"day"},
 {p:6,h:"וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה",e:"And he turned and ___ from Pharaoh.",k:"went out"},
 /* Pasuk 7 */
 {p:7,h:"וַיֹּאמְרוּ עַבְדֵי פַרְעֹה אֵלָיו",e:"Pharaoh's servants said to him,",k:null},
 {p:7,h:"עַד־מָתַי יִהְיֶה זֶה לָנוּ לְמוֹקֵשׁ",e:"\"Until when will this be a ___ for us?",k:"trap"},
 {p:7,h:"שַׁלַּח אֶת־הָאֲנָשִׁים",e:"Send the men,",k:null},
 {p:7,h:"וְיַעַבְדוּ אֶת־יְקֹוָק אֱלֹהֵיהֶם",e:"so they can ___ Hashem their G-d!",k:"serve"},
 {p:7,h:"הֲטֶרֶם תֵּדַע",e:"Don't you know yet",k:null},
 {p:7,h:"כִּי אָבְדָה מִצְרָיִם",e:"that Mitzrayim is ___?\"",k:"lost"},
 /* Pasuk 8 */
 {p:8,h:"וַיּוּשַׁב אֶת־מֹשֶׁה וְאֶת־אַהֲרֹן",e:"Moshe and Aharon were ___",k:"brought back"},
 {p:8,h:"אֶל־פַּרְעֹה",e:"to Pharaoh,",k:null},
 {p:8,h:"וַיֹּאמֶר אֲלֵהֶם",e:"and he said to them,",k:null},
 {p:8,h:"לְכוּ עִבְדוּ אֶת־יְקֹוָק אֱלֹהֵיכֶם",e:"\"___, serve Hashem your G-d.",k:"Go"},
 {p:8,h:"מִי וָמִי הַהֹלְכִים",e:"___ and ___ are the ones going?\"",k:"who"},
 /* Pasuk 9 */
 {p:9,h:"וַיֹּאמֶר מֹשֶׁה",e:"Moshe said,",k:null},
 {p:9,h:"בִּנְעָרֵינוּ וּבִזְקֵנֵינוּ נֵלֵךְ",e:"\"With our ___ and our old we will go;",k:"young"},
 {p:9,h:"בְּבָנֵינוּ וּבִבְנוֹתֵנוּ",e:"with our sons and our ___,",k:"daughters"},
 {p:9,h:"בְּצֹאנֵנוּ וּבִבְקָרֵנוּ נֵלֵךְ",e:"with our sheep and our cattle we will go,",k:null},

let VOICE=null;const pickV=()=>{const v=(speechSynthesis.getVoices?speechSynthesis.getVoices():[]).filter(x=>/^en(-|_)US/i.test(x.lang));VOICE=v.find(x=>/natural|premium|enhanced|samantha|aria|jenny|google us/i.test(x.name))||v[0]||null};
if(window.speechSynthesis){pickV();speechSynthesis.onvoiceschanged=pickV}
const speak=t=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[🦗⭐]/g,""));u.lang="en-US";u.rate=.92;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u)};

/* typed answers: same word, any capitals, small slips forgiven */
const norm=s=>String(s).toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
const lev=(a,b)=>{const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]};
const ALT={locusts:["locust"],"went out":["went"],"brought back":["brought"],"asking for":["asking"],chased:["chased out"]};
const typedOK=(got,k)=>{const g=norm(got),w=norm(k);if(!g)return 0;if(g===w||(ALT[w]||[]).includes(g))return 2;return lev(g,w)<=(w.length>5?1:0)?1:0};

  <div class="stations">${LEVELS.map((l,i)=>`<button class="station" data-i="${i}"><div class="ico" aria-hidden="true">${l.ico}</div><div class="txt"><h3>${i+1}. ${l.name}</h3><small>${l.sub}</small></div><span class="stars" aria-label="${stars[l.id]||0} of 3 stars">${starStr(stars[l.id]||0)}</span></button>`).join("")}
  <button class="station final" id="final"><div class="ico" aria-hidden="true">📝</div><div class="txt"><h3>The Real Sheet</h3><small>All ${BL.length} blanks from Rabbi Morris's sheets. Type the missing word!${best!=null?` Best: ${best} / ${BL.length}`:""}</small></div></button></div>`;
  app.querySelectorAll(".station[data-i]").forEach(b=>b.onclick=()=>learn(+b.dataset.i,0));

}

function learn(li,ci){
  const L=LEVELS[li],C=L.cards[ci];toTop();
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">← Map</button><span class="pill">${L.ico} ${L.name}</span></div>
  ${ci===0?`<div class="guide"><div class="face" aria-hidden="true">🦗</div><div class="bubble">${L.intro}</div></div>`:""}
  <div class="panel learn pop"><div class="picbox">${C.pic()}</div>
   <div class="word">${C.w}</div><div class="row" style="justify-content:center;gap:8px;flex-wrap:nowrap"><p class="say" style="margin:0">${C.say}</p>${sayBtn(C.say)}</div><p class="ex">💡 ${C.ex}</p><p class="he">${C.he}</p>
   <div class="dots" aria-hidden="true">${L.cards.map((c,i)=>`<i class="${i===ci?"on":""}"></i>`).join("")}</div>
   <div class="row"><button class="btn soft" id="prev" ${ci===0?'style="visibility:hidden"':""}>← Back</button>
   <button class="btn" id="next">${ci===L.cards.length-1?"See the whole pasuk →":"Next →"}</button></div></div>`;
  wireSay(app);$("back").onclick=home;$("prev").onclick=()=>learn(li,ci-1);
  $("next").onclick=()=>ci<L.cards.length-1?learn(li,ci+1):review(li);focusMain();
}

function review(li){
  const L=LEVELS[li];toTop();
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">← Map</button><span class="pill">${L.ico} ${L.name}</span></div>
  <div class="panel pop"><h2>The whole thing, line by line</h2><p style="margin:0" class="muted">The pink words are the ones you'll need to write on the sheet.</p>
  <div class="mini">${byP(L.ps).map(x=>`<div class="ln"><span class="h" lang="he">${x.h}</span><span class="e">${sent(x,true)} ${sayBtn(plain(x))}</span></div>`).join("")}</div>
  <button class="btn" id="go">Let's play! 🎮</button></div>`;
  wireSay(app);$("back").onclick=home;$("go").onclick=()=>play(li);focusMain();
}

/* multiple-choice widget (retry until right) */
function question(q,onDone){
  const box=document.createElement("div");box.style.cssText="display:flex;flex-direction:column;gap:12px";
  box.innerHTML=`${q.top||""}<p class="q">${q.q}</p><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="l">(${L4[i]})</span><span>${o}</span></button>`).join("")}</div>`;
  const opts=[...box.querySelectorAll(".opt")];let over=false;
  opts.forEach(o=>o.onclick=()=>{if(over)return;const i=+o.dataset.i;
    if(i===q.a){over=true;o.classList.add("ok");onDone(true)}else{o.classList.add("no");shk(o);setTimeout(()=>o.classList.remove("no"),500);onDone(null)}});
  return box;
}
function pickItems(L){
  const bl=byP(L.ps).filter(x=>x.k),pool=[...new Set(bl.map(x=>x.k))];
  return shuffle(bl).map(x=>{const others=shuffle(pool.filter(k=>k!==x.k)).slice(0,3);
    const opts=shuffle([x.k,...others]).map(o=>o.toLowerCase());
    return {top:`<div class="hphrase" lang="he">${x.h}</div>`,q:`<span class="esent">${sent(x,false)}</span>`,o:opts,a:opts.indexOf(x.k.toLowerCase()),why:`${sent(x,true)}`}});
}

function play(li){
  const L=LEVELS[li];let ai=0,mist=0;
  const steps=[];
  L.acts.forEach(t=>{
    if(t==="pick")pickItems(L).forEach(q=>steps.push({t,q}));
    else if(t==="match"){const bl=byP(L.ps).filter(x=>x.k);for(let i=0;i<bl.length;i+=4)steps.push({t,pairs:bl.slice(i,i+4)})}
    else if(t==="type")shuffle(byP(L.ps).filter(x=>x.k)).forEach(x=>steps.push({t,x}));
    else if(t==="who")shuffle(WHO.filter(w=>w.p<=9)).forEach(it=>steps.push({t:"sort",it,bins:WHO_BINS}));
    else if(t==="whoall")shuffle(WHO).forEach(it=>steps.push({t:"sort",it,bins:WHO_BINS}));
    else if(t==="story")steps.push({t:"order",items:STORY,q:"Put the story of pasuk 1 to 11 in order. Tap what happened FIRST."});
    else if(t==="order5")steps.push({t:"order",items:LOC5,q:"What will the locusts do? Put it in order, the way the pesukim say it."});
  });
  const next=()=>{ai++;ai<steps.length?step():finish()};
  function frame(){toTop();app.innerHTML=`<div class="row"><button class="btn soft" id="back">← Map</button><span class="pill">${L.ico} Game ${ai+1} / ${steps.length}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${ai/steps.length*100}%"></i></div><div class="panel pop" id="pn"><p class="fb" id="fb" role="status" aria-live="polite"></p><button class="btn" id="go" hidden>Next →</button></div>`;
    $("back").onclick=home;$("go").onclick=next;return $("pn")}
  const put=(pn,el)=>{pn.insertBefore(el,$("fb"));wireSay(el)};
  const fb=(ok,t)=>{const f=$("fb");f.className="fb "+(ok?"ok":"no");f.innerHTML=t};
  const ready=()=>{$("go").hidden=false;$("go").focus()};
  function step(){const s=steps[ai],pn=frame();
    if(s.t==="pick"){put(pn,question(s.q,ok=>{if(ok===null){mist++;fb(false,"Not that one. Read the Hebrew again and try!")}else{fb(true,"✅ "+s.q.why);ready()}}))}
    else if(s.t==="type"){const x=s.x,d=document.createElement("div");d.style.cssText="display:flex;flex-direction:column;gap:12px";let tries=0;
      d.innerHTML=`<p class="q">Write the missing English word, like on the sheet:</p><div class="hphrase" lang="he">${x.h}</div><p class="esent">${sent(x,false)}</p>
       <div class="typein"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Missing word"><button class="btn" id="tc">Check</button></div><div class="bank" id="bk" hidden></div>`;put(pn,d);
      const inp=$("ti"),check=()=>{if($("go").hidden===false)return;const r=typedOK(inp.value,x.k);
        if(r){fb(true,(r===1?`✅ Almost perfect! The spelling is <b>${x.k}</b>. `:"✅ "+PRAISE[Math.random()*5|0]+" ")+sent(x,true));inp.disabled=true;ready()}
        else{mist++;tries++;shk(inp);fb(false,tries===1?"Not yet. Look at the Hebrew word and think what it means.":`Here's a hint: it starts with <b>${x.k[0]}</b> and has ${x.k.replace(/ /g,"").length} letters.`);
          if(tries>=2){const pool=[...new Set(byP(L.ps).filter(y=>y.k).map(y=>y.k))];$("bk").hidden=false;$("bk").innerHTML=shuffle([x.k,...shuffle(pool.filter(k=>k!==x.k)).slice(0,3)]).map(k=>`<button>${k.toLowerCase()}</button>`).join("");$("bk").querySelectorAll("button").forEach(b=>b.onclick=()=>{inp.value=b.textContent;check()})}}};
      $("tc").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter")check()};setTimeout(()=>inp.focus(),60)}
    else if(s.t==="sort"){const it=s.it,d=document.createElement("div");d.style.cssText="display:flex;flex-direction:column;gap:12px";
      d.innerHTML=`<p class="q">Who said it?</p><div class="big-item"><div class="emo" aria-hidden="true">💬</div><b>${it.t}</b></div><div class="bins">${s.bins.map(b=>`<button class="bin" data-b="${b.id}"><span aria-hidden="true">${b.e}</span>${b.t}</button>`).join("")}</div>`;put(pn,d);
      let solved=false;d.querySelectorAll(".bin").forEach(b=>b.onclick=()=>{if(solved)return;
        if(b.dataset.b===it.b){solved=true;b.classList.add("ok");fb(true,"✅ "+it.why);ready()}else{mist++;b.classList.add("no");shk(b);setTimeout(()=>b.classList.remove("no"),450);fb(false,"Not quite. Who was talking there?")}})}
    else if(s.t==="order"){const order=s.items;let n=0,d=document.createElement("div");d.style.cssText="display:flex;flex-direction:column;gap:12px";
      d.innerHTML=`<p class="q">${s.q}</p><div class="seq" id="seq" aria-live="polite"></div><div class="tiles">${shuffle(order.map((x,i)=>i)).map(i=>`<button class="tile" data-i="${i}"><span aria-hidden="true">${order[i].e}</span>${order[i].t}</button>`).join("")}</div>`;put(pn,d);
      d.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{if(t.classList.contains("used")||n>=order.length)return;
        if(+t.dataset.i===n){t.classList.add("used");t.disabled=true;$("seq").insertAdjacentHTML("beforeend",(n?'<b class="arrow" aria-hidden="true">→</b>':"")+`<span class="pop" title="${order[n].t}">${order[n].e}</span>`);n++;
          if(n===order.length){fb(true,"🎉 Perfect order!");ready()}else fb(true,"Yes! What happened next?")}
        else{mist++;t.classList.add("no");shk(t);setTimeout(()=>t.classList.remove("no"),450);fb(false,"Hmm, did that happen "+(n?"next":"first")+"? Try another.")}})}
    else if(s.t==="match"){let sel=null,left=s.pairs.length,d=document.createElement("div");d.style.cssText="display:flex;flex-direction:column;gap:12px";
      d.innerHTML=`<p class="q">Match the Hebrew to the English word. Tap the Hebrew first.</p><div class="cols"><div class="col" id="cl"></div><div class="col" id="cr"></div></div>`;put(pn,d);
      shuffle(s.pairs.map((p,i)=>i)).forEach(i=>{const b=document.createElement("button");b.className="mt";b.innerHTML=H(s.pairs[i].h);b.dataset.i=i;
        b.onclick=()=>{if(b.classList.contains("done"))return;d.querySelectorAll("#cl .mt").forEach(x=>{x.classList.remove("sel");x.setAttribute("aria-pressed","false")});b.classList.add("sel");b.setAttribute("aria-pressed","true");sel=b};$("cl").append(b)});
      shuffle(s.pairs.map((p,i)=>i)).forEach(i=>{const b=document.createElement("button");b.className="mt";b.textContent=s.pairs[i].k;b.dataset.i=i;
        b.onclick=()=>{if(b.classList.contains("done"))return;if(!sel){fb(false,"First tap a Hebrew phrase on the left.");return}
          if(sel.dataset.i===b.dataset.i){[sel,b].forEach(x=>{x.classList.remove("sel");x.classList.add("done");x.disabled=true});sel=null;left--;fb(true,PRAISE[Math.random()*5|0]);if(!left){fb(true,"🎉 All matched!");ready()}}
          else{mist++;b.classList.add("no");shk(b);setTimeout(()=>b.classList.remove("no"),450);fb(false,"Not that one. Try again!")}};$("cr").append(b)})}
    focusMain();
  }
  function finish(){const st=mist<=1?3:mist<=4?2:1;stars[L.id]=Math.max(stars[L.id]||0,st);save();toTop();const nxt=li<LEVELS.length-1;
    app.innerHTML=`<div class="panel pop" style="align-items:center;text-align:center"><div class="bigstars" aria-label="${st} of 3 stars">${starStr(st)}</div>
     <h2>${L.name}: done!</h2><p style="margin:0;font-weight:700">${mist===0?"No mistakes at all. Amazing!":"Mistakes: "+mist+(st<3?". Play again to get 3 stars!":"")}</p>
     <div class="row" style="justify-content:center"><button class="btn soft" id="again">Play again</button><button class="btn" id="on">${nxt?"Next station →":"Fill in the Real Sheet 📝"}</button></div>
     <button class="btn soft" id="map">Back to the map</button></div>`;
    $("again").onclick=()=>play(li);$("map").onclick=home;$("on").onclick=()=>nxt?learn(li+1,0):sheet(false);focusMain()}
  step();
}

/* The Real Sheet: every blank, in order, typed. One try each. */
function sheet(onlyMissed){
  const list=onlyMissed?onlyMissed:BL;let i=0,right=0;const missed=[];
  function ask(){const x=list[i];toTop();
    app.innerHTML=`<div class="row"><button class="btn soft" id="back">← Map</button><span class="pill">📝 ${i+1} / ${list.length}</span><span class="pill">✅ ${right}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${i/list.length*100}%"></i></div>
    <div class="panel pop" id="pn"><p class="q" style="margin:0">${typeof x.p==="string"?"Rashi on pasuk "+x.p.slice(1):"Pasuk "+x.p}</p>
     <div class="hphrase" lang="he">${x.h}</div><p class="esent">${sent(x,false)}</p>
     <div class="typein"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Missing word"><button class="btn" id="tc">Check</button></div>
     <p class="fb" id="fb" role="status" aria-live="polite"></p><button class="btn" id="go" hidden>${i===list.length-1?"See my score 🏆":"Next →"}</button></div>`;
    $("back").onclick=home;const inp=$("ti");let done=false;
    const check=()=>{if(done||!inp.value.trim())return;done=true;inp.disabled=true;$("tc").disabled=true;const r=typedOK(inp.value,x.k),f=$("fb");
      if(r){right++;f.className="fb ok";f.innerHTML=(r===1?`✅ Counted! Spelling: <b>${x.k}</b>. `:"✅ ")+sent(x,true)}else{missed.push(x);f.className="fb no";f.innerHTML="The answer: "+sent(x,true)}
      $("go").hidden=false;$("go").focus()};
    $("tc").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter")check()};setTimeout(()=>inp.focus(),60);
    $("go").onclick=()=>{i++;i<list.length?ask():end()}}
  function end(){toTop();const pct=Math.round(right/list.length*100),st=pct>=90?3:pct>=70?2:1;
    if(!onlyMissed)stars.sheet=Math.max(stars.sheet||0,right),save();
    app.innerHTML=`<div class="panel pop" style="text-align:center"><div class="bigstars" aria-label="${st} of 3 stars">${starStr(st)}</div>
    <div class="huge">${right} / ${list.length}</div><span class="pill" style="align-self:center">${pct}%</span>
    <h2>${pct===100?"Perfect! You're ready for the test!":pct>=85?"Excellent! Yasher koach!":pct>=65?"Good job! Almost there!":"Nice try! Let's practice a bit more."}</h2>
    ${missed.length?`<div style="text-align:left"><h3 style="margin-bottom:8px">Words to practice:</h3><ul class="miss">${missed.map(x=>`<li><b lang="he" class="hb">${x.h}</b>${sent(x,true)}</li>`).join("")}</ul></div>`:""}
    <div class="row" style="justify-content:center"><button class="btn soft" id="map">Back to the map</button>${missed.length?`<button class="btn" id="miss">Practice only these (${missed.length})</button>`:""}<button class="btn ${missed.length?"soft":""}" id="again">The whole sheet again</button></div></div>`;
    $("map").onclick=home;$("again").onclick=()=>sheet(false);if($("miss"))$("miss").onclick=()=>sheet(missed);focusMain()}
  ask();
}
home();
</script>

</body></html>
