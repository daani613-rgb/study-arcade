button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}

.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}

<script>const DATA={"id":"sie-ch1","section":"2.1.1","title":"Chapter 1: Equity Securities","heTitle":"פרק 1: מניות וניירות ערך הוניים","lessons":[{"id":"l1","en":"Owning a piece of the company","he":"להיות בעלים של חתיכה מהחברה","story":[{"he":"אבי פתח מאפייה קטנה, \"Golden Crust\". הלחם הצליח, ואבי רוצה לפתוח עוד 10 סניפים. אבל אין לו מספיק כסף.","c":[]},{"he":"הפתרון: אבי הופך את המאפייה ל<b>תאגיד</b> (<span class=en>corporation</span>) ומחלק אותו ל-1,000,000 חתיכות. כל חתיכה נקראת <b>מניה</b> (<span class=en>share of stock</span>). אבי שומר לעצמו 600,000 מניות, ומוכר את השאר למשקיעים. מי שקונה מניה הופך לבעלים של חתיכה קטנה מהמאפייה.","c":["C1"]},{"he":"מניה היא סוג של <b>נייר ערך</b> (<span class=en>security</span>): מסמך שמייצג השקעה, ושאפשר לקנות ולמכור. יש עוד דרך לגייס כסף: לקחת הלוואה. נייר ערך שמייצג הלוואה לחברה נקרא <b>אג\"ח</b> (<span class=en>bond</span>). מי שמחזיק אג\"ח הוא <b>נושה</b>: החברה מתחייבת להחזיר לו את הכסף עם <b>ריבית</b> (<span class=en>interest</span>). מי שמחזיק מניה הוא <b>בעלים</b>. ההבדל הזה חוזר בכל הפרק.","c":["C1","C48"]},{"he":"דנה קונה 10,000 מניות רגילות (<span class=en>common stock</span>) ב-5 דולר למניה, כלומר 50,000 דולר. יש לה 1% מהחברה. מה היא מקבלת? 1) <b>זכות הצבעה</b>: היא משתתפת בבחירת חברי ה<b>דירקטוריון</b> (<span class=en>board of directors</span>), הגוף שמפקח על ההנהלה ומקבל את ההחלטות הגדולות. 2) <b>דיבידנד</b> (<span class=en>dividend</span>): חלק מהרווח, אבל רק אם הדירקטוריון <b>מכריז</b> (<span class=en>declares</span>) על חלוקה. אין הבטחה.","c":["C2","C3","C41"]},{"he":"ומה אם המאפייה פושטת רגל וחייבת מיליונים? דנה לא צריכה לשלם את החובות. הכי הרבה שהיא יכולה להפסיד זה 50,000 הדולר ששילמה. זו <b>אחריות מוגבלת</b> (<span class=en>limited liability</span>). מצד שני, הכסף הזה לא מבוטח: ביטוח הפיקדונות של ה-<span class=en>FDIC</span> מגן על כסף בבנק, לא על מניות. דנה יכולה להפסיד את כל הסכום.","c":["C4","C5"]}],"terms":[["Corporation","תאגיד","חברה שמחולקת למניות. הבעלים שלה הם בעלי המניות.",["C1"]],["Equity security","נייר ערך הוני","נייר ערך שמייצג בעלות, כמו מניה. בהגדרה החוקית נכללים גם זכויות (rights) וכתבי אופציה (warrants) לקנות מניות. לעומת זאת, אג\"ח מייצגת הלוואה.",["C1","C42"]],["Bond / bondholder","אג\"ח / מחזיק אג\"ח","הלוואה לחברה. המחזיק הוא נושה, והחברה מתחייבת להחזיר את הכסף עם ריבית (interest).",["C48"]],["Common stock","מניה רגילה","מניה שנותנת בעלות, בדרך כלל עם זכות הצבעה לבחירת הדירקטוריון.",["C1","C2"]],["Board of directors","דירקטוריון","הגוף שבעלי המניות בוחרים. הוא מפקח על ההנהלה ומחליט על החלטות גדולות, כולל אם לחלק דיבידנד.",["C3","C41"]],["Dividend","דיבידנד","חלק מהרווח שמחולק לבעלי המניות. במניה רגילה, רק אם הדירקטוריון מחליט. לא מובטח.",["C3"]],["Limited liability","אחריות מוגבלת","בעל מניות לא אחראי לחובות החברה. ההפסד המקסימלי שלו הוא הסכום שהשקיע.",["C5"]]],"checks":[{"en":"Golden Crust had a profitable year. Must it pay Dana a dividend on her common stock?","he":"ל-Golden Crust הייתה שנה רווחית. האם היא חייבת לשלם לדנה דיבידנד על המניות הרגילות?","o":[["Yes. A profit requires a dividend","כן. רווח מחייב חלוקת דיבידנד"],["No. Only if the board declares one","לא. רק אם הדירקטוריון מכריז על דיבידנד"]],"a":1,"why":"גם בשנה רווחית, דיבידנד על מניה רגילה משולם רק כשהדירקטוריון מכריז עליו.","c":["C3"]},{"en":"Golden Crust fails, owing $2 million. Dana paid $50,000 for her shares. What is the most Dana can lose?","he":"Golden Crust קורסת עם חוב של 2 מיליון דולר. דנה שילמה 50,000 דולר על המניות. מה ההפסד המקסימלי של דנה?","o":[["$50,000, the amount she paid","50,000 דולר, הסכום ששילמה"],["$50,000 plus 1% of the debt","50,000 דולר ועוד 1% מהחוב"]],"a":0,"why":"אחריות מוגבלת: בעל מניות לא משלם את חובות החברה. הוא יכול להפסיד רק את מה שהשקיע.","c":["C5"]}]},{"id":"l2","en":"Voting: statutory vs. cumulative","he":"הצבעה: סטטוטורית מול מצטברת","story":[{"he":"באסיפה השנתית (<span class=en>annual meeting</span>) של Golden Crust בוחרים דירקטורים. לפני שנגיע למספרים הגדולים של דנה, נתחיל בדוגמה קטנה מאוד, כדי שהרעיון יהיה ברור לגמרי.","c":["C2"]},{"he":"<b>הדוגמה הקטנה:</b> ליוסי יש <b>100 מניות</b>. השנה בוחרים <b>3 דירקטורים</b>, כלומר יש 3 <b>מושבים</b> פנויים בדירקטוריון. הכלל הבסיסי: <b>כל מניה נותנת קול אחד בכל מושב.</b><br>זה כמו 3 קלפיות נפרדות, אחת לכל מושב. בכל קלפי, ליוסי יש 100 קולות.","c":["C6"]},{"he":"<b>שיטה 1: הצבעה סטטוטורית</b> (<span class=en>statutory voting</span>). כל קלפי עומדת לבד. יוסי שם בכל קלפי עד 100 קולות:<br>• מושב 1: 100 קולות למועמד א'<br>• מושב 2: 100 קולות למועמד ב'<br>• מושב 3: 100 קולות למועמד ג'<br>אסור לו להעביר קולות מקלפי לקלפי. הכי הרבה שמועמד אחד יכול לקבל ממנו: <b>100</b>.<br>שימו לב: גם כאן יש ליוסי בסך הכל 300 קולות (100 בכל אחת מ-3 הקלפיות). ההבדל הוא רק כמה מהם מותר לתת למועמד אחד.","c":["C6"]},{"he":"<b>שיטה 2: הצבעה מצטברת</b> (<span class=en>cumulative voting</span>). עכשיו שופכים את 3 הקלפיות לשק אחד גדול. כמה קולות יש בשק? 100 קולות בכל מושב, ויש 3 מושבים:<br><b>100 מניות × 3 מושבים = 300 קולות.</b><br>זו כל הסיבה לכפל: לא נוצרים קולות חדשים. אלה אותם 100 קולות לכל מושב, רק שעכשיו מותר לאסוף אותם יחד.","c":["C7"]},{"he":"ומה יוסי עושה עם השק? מחלק איך שהוא רוצה:<br>• את כל 300 למועמד אחד, או<br>• 150 לשניים, או<br>• 100 לכל אחד (בדיוק כמו בשיטה הסטטוטורית).<br>ההבדל היחיד בין השיטות: האם מותר <b>לרכז</b> קולות על מועמד אחד.","c":["C7"]},{"he":"<b>עכשיו דנה:</b> יש לה 10,000 מניות, ובוחרים 4 דירקטורים.<br>• <b>סטטוטורית:</b> 4 קלפיות, בכל אחת עד 10,000 קולות. הכי הרבה למועמד אחד: 10,000.<br>• <b>מצטברת:</b> 10,000 מניות × 4 מושבים = <b>40,000 קולות</b> בשק. מותר לתת את כולם למועמד אחד.","c":["C6","C7"]},{"he":"<b>למה זה חשוב?</b> דנה וקבוצה של בעלי מניות קטנים מחזיקים יחד 250,000 מניות. אבי והתומכים שלו מחזיקים 750,000. בוחרים 4 דירקטורים.<br>• <b>סטטוטורית:</b> בכל אחת מ-4 הקלפיות, 750,000 מול 250,000. אבי מנצח בכל 4 המושבים.<br>• <b>מצטברת:</b> כל המועמדים מתחרים יחד, ו-4 המועמדים עם הכי הרבה קולות נבחרים. לקבוצה של דנה יש 250,000 × 4 = 1,000,000 קולות, וכולם הולכים למועמד אחד. לקבוצה של אבי יש 750,000 × 4 = 3,000,000. כדי שהמועמד של דנה לא ייכנס, אבי צריך 4 מועמדים שכל אחד מהם מקבל יותר מ-1,000,000: יותר מ-4,000,000 קולות. יש לו רק 3,000,000. לכן המועמד של דנה נבחר בוודאות.<br>לכן אומרים שהצבעה מצטברת <b>עוזרת לבעלי מניות מיעוט</b> (<span class=en>minority shareholders</span>).<br>ושימו לב: המילה <span class=en>cumulative</span> תופיע גם בשיעור הבא, על מניות בכורה, ושם היא אומרת משהו אחר לגמרי: דיבידנד שלא שולם \"מצטבר\".","c":["C7","C8","C13"]}],"terms":[["Statutory voting","הצבעה סטטוטורית","כל מושב הוא קלפי נפרדת. בכל קלפי, קול אחד לכל מניה. אי אפשר להעביר קולות בין מושבים (100 מניות: עד 100 קולות למועמד).",["C6"]],["Cumulative voting","הצבעה מצטברת","כל הקולות לשק אחד: מניות × מושבים פנויים (100 מניות × 3 מושבים = 300 קולות). אפשר לחלק בכל צורה, גם הכל למועמד אחד.",["C7"]],["Minority shareholder","בעל מניות מיעוט","בעל מניות קטן. הצבעה מצטברת מגדילה את הסיכוי שלו להכניס דירקטור.",["C8"]],["Annual meeting","אסיפה שנתית","הפגישה השנתית של בעלי המניות, שבה בוחרים דירקטורים.",["C2"]]],"checks":[{"en":"Cumulative voting. A shareholder owns 100 shares and 5 seats are open. How many votes in total?","he":"הצבעה מצטברת. לבעל מניות יש 100 מניות, ו-5 מושבים פנויים. כמה קולות בסך הכל?","o":[["100 for each seat, at most","לכל היותר 100 לכל מושב"],["500, divided in any way","500, בכל חלוקה שירצה"]],"a":1,"why":"מניות כפול מושבים: 100 × 5 = 500. בהצבעה מצטברת אפשר לחלק אותם בכל צורה. \"100 לכל מושב\" זו השיטה הסטטוטורית.","c":["C7"]},{"en":"Which voting method gives a small shareholder a better chance to elect one director?","he":"איזו שיטת הצבעה נותנת לבעל מניות קטן סיכוי טוב יותר להכניס דירקטור אחד?","o":[["Statutory voting","הצבעה סטטוטורית"],["Cumulative voting","הצבעה מצטברת"]],"a":1,"why":"בהצבעה מצטברת אפשר לרכז את כל הקולות על מועמד אחד.","c":["C8"]}]},{"id":"l3","en":"Preferred stock","he":"מניית בכורה","story":[{"he":"הדודה של דנה, רינה, בפנסיה. היא לא רוצה להצביע, ולא מעניין אותה מי בדירקטוריון. היא רוצה <b>הכנסה קבועה</b>. בשבילה Golden Crust <b>מנפיקה</b> (<span class=en>issues</span>), כלומר יוצרת ומוכרת, סוג חדש של מניה: <b>מניית בכורה</b> (<span class=en>preferred stock</span>). החברה שמנפיקה נייר ערך נקראת <span class=en>issuer</span>.","c":[]},{"he":"מה רינה מקבלת? 1) לכל מניית בכורה יש סכום קבוע שמגיע לה אם החברה נסגרת: למשל 100 דולר למניה. במבחן קוראים לו <span class=en>liquidation preference</span> (ערך הפירוק). 2) בדרך כלל <b>שיעור דיבידנד קבוע</b> (<span class=en>stated dividend rate</span>): למשל 6% בשנה על 100 הדולר, כלומר 6 דולר בשנה. 3) <b>עדיפות בדיבידנד</b>: הדיבידנד שלה משולם <b>לפני</b> הדיבידנד למניות הרגילות. 4) <b>עדיפות בפירוק</b>: אם החברה נסגרת ומוכרת את כל מה שיש לה (<span class=en>liquidation</span>), רינה מקבלת לפני בעלי המניות הרגילות. ובתמורה? בדרך כלל <b>אין לה זכות הצבעה</b>.","c":["C9","C10","C11","C12","C50"]},{"he":"שנה אחת היא רעה, והדירקטוריון מדלג על הדיבידנד. מה קורה? תלוי בסוג. ב<b>מניית בכורה מצטברת</b> (<span class=en>cumulative preferred</span>), הסכום שדולג נשאר <b>בפיגור</b> (<span class=en>in arrears</span>) ומצטבר. אסור לחברה לשלם לבעלי המניות הרגילות אפילו סנט, עד שהיא משלימה לרינה את כל מה שדולג, וגם את הדיבידנד הנוכחי. ב<b>מניית בכורה לא מצטברת</b> (<span class=en>non-cumulative</span>), דיבידנד שדולג לא מצטבר. הוא אבד. אבל גם כאן, <b>הדיבידנד של התקופה הנוכחית</b> משולם לרינה לפני כל דיבידנד למניות הרגילות.","c":["C13","C14","C54"]},{"he":"ויש גם <b>מניית בכורה ניתנת להמרה</b> (<span class=en>convertible preferred</span>): אפשר להחליף אותה במניות רגילות לפי <b>מחיר המרה</b> (<span class=en>conversion price</span>) שנקבע מראש. למשל: ערך פירוק של 100 דולר ומחיר המרה של 25 דולר. 100 חלקי 25 = 4 מניות רגילות. אם Golden Crust תהפוך להצלחה ענקית, רינה יכולה להמיר ולהשתתף בעלייה.","c":["C15","C49"]}],"terms":[["Issue / issuer","הנפקה / מנפיק","הנפקה = יצירה ומכירה של ניירות ערך חדשים. המנפיק (issuer) = החברה שמנפיקה.",[]],["Preferred stock","מניית בכורה","עדיפות על המניה הרגילה בדיבידנד ובפירוק. בדרך כלל בלי זכות הצבעה, ובדרך כלל עם שיעור דיבידנד קבוע (stated dividend rate).",["C9","C10","C11","C12"]],["Cumulative preferred","בכורה מצטברת","דיבידנד שלא שולם נשאר בפיגור (in arrears), וחייבים לשלם אותו לפני כל דיבידנד למניות הרגילות.",["C13"]],["Non-cumulative preferred","בכורה לא מצטברת","דיבידנד שדולג לא מצטבר. דיבידנד התקופה הנוכחית עדיין משולם לפני המניות הרגילות.",["C14","C54"]],["Liquidation preference","ערך פירוק","הסכום הקבוע למניית בכורה שמגיע לה אם החברה מתפרקת. ממנו מחשבים את שיעור הדיבידנד ואת מספר המניות בהמרה.",["C49","C50"]],["Convertible preferred","בכורה ניתנת להמרה","אפשר להמיר אותה במניות רגילות. מספר המניות = ערך הפירוק (liquidation preference) חלקי מחיר ההמרה (conversion price).",["C15","C49"]]],"checks":[{"en":"Golden Crust skipped last year's dividend on its cumulative preferred. It now wants to pay common shareholders. What comes first?","he":"Golden Crust דילגה בשנה שעברה על הדיבידנד במניית בכורה מצטברת. עכשיו היא רוצה לשלם לבעלי המניות הרגילות. מה קודם?","o":[["Paying common now, then catching up preferred","תשלום לרגילות עכשיו, והשלמה לבכורה אחר כך"],["Paying preferred holders what was skipped","תשלום לבעלי הבכורה של מה שדולג"]],"a":1,"why":"בבכורה מצטברת, מה שדולג חייב להיות משולם לפני כל דיבידנד למניות הרגילות.","c":["C13"]},{"en":"Which feature does preferred stock usually NOT have?","he":"איזו תכונה בדרך כלל אין למניית בכורה?","o":[["Priority over common for dividends","עדיפות על הרגילות בדיבידנד"],["The right to vote for directors","זכות הצבעה לבחירת דירקטורים"]],"a":1,"why":"בעלי מניות בכורה בדרך כלל לא מצביעים, אבל מקבלים דיבידנד לפני בעלי המניות הרגילות.","c":["C9","C10"]}]},{"id":"l4","en":"If things go wrong: who gets paid first","he":"אם הכל מתמוטט: מי מקבל כסף ראשון","story":[{"he":"נעשה ניסוי מחשבתי: <b>נניח</b> ש-Golden Crust נקלעת לקשיים ומתפרקת (<span class=en>liquidation</span>). מוכרים הכל: תנורים, מבנים, משאיות. נשארה ערימת כסף, ויש תור ארוך של אנשים שרוצים חלק. (זה רק תרחיש. בשיעורים הבאים החברה ממשיכה לצמוח.)","c":["C16"]},{"he":"הכלל: <b>מי שהלווה כסף (נושה) מקבל לפני מי שקנה בעלות (בעל מניות).</b> הסדר:<br>1) <b>נושים מובטחים</b> (<span class=en>secured creditors</span>): מלווים שההלוואה שלהם מגובה בנכס, למשל הבנק. גם אג\"ח מובטחת נמצאת כאן.<br>2) <b>נושים לא מובטחים</b> (<span class=en>unsecured creditors</span>): ספקים ומחזיקי אג\"ח לא מובטחת.<br>3) <b>חוב נחות</b> (<span class=en>subordinated debt</span>): הלוואות שהסכימו מראש לחכות אחרי הנושים האחרים.<br>4) <b>מניות בכורה</b> (רינה).<br>5) <b>מניות רגילות</b> (דנה), אחרונות בתור.","c":["C16","C44"]},{"he":"דוגמה: אחרי שהנושים המובטחים קיבלו את שלהם, נשארו 3 מיליון דולר. מחזיקי האג\"ח הלא מובטחת צריכים לקבל 2 מיליון: הם מקבלים הכל. נשאר מיליון. בעלי הבכורה צריכים לקבל 1.5 מיליון: הם מקבלים את המיליון שנשאר. לבעלי המניות הרגילות נשאר אפס.","c":["C16"]},{"he":"זה מה שקורה בדרך כלל בפשיטת רגל: לבעלי המניות הרגילות לא נשאר כלום, והמניה שווה אפס. גם כשהחברה מתארגנת מחדש, התוכנית מבטלת לעתים קרובות את המניות הקיימות. זה המחיר של בעלות: הכי הרבה סיכוי לרווח, והכי הרבה סיכון.","c":["C17"]}],"terms":[["Liquidation","פירוק","מכירת כל נכסי החברה וחלוקת הכסף לפי סדר עדיפויות.",["C16"]],["Secured creditor","נושה מובטח","מלווה שההלוואה שלו מגובה בנכס (בטוחה). מקבל ראשון.",["C16","C44"]],["Subordinated debt","חוב נחות","חוב שמקבל אחרי הנושים הרגילים, אבל לפני כל בעלי המניות.",["C44"]],["Order of liquidation","סדר הנשייה בפירוק","נושים מובטחים, נושים לא מובטחים (כולל אג\"ח לא מובטחת), חוב נחות, מניות בכורה, מניות רגילות.",["C16","C44"]]],"checks":[{"en":"Who is paid first in a liquidation: unsecured bondholders or preferred stockholders?","he":"מי מקבל קודם בפירוק: מחזיקי אג\"ח לא מובטחת או בעלי מניות בכורה?","o":[["Preferred stockholders","בעלי מניות בכורה"],["Unsecured bondholders","מחזיקי אג\"ח לא מובטחת"]],"a":1,"why":"מחזיקי אג\"ח הם נושים, ונושים מקבלים לפני כל בעלי המניות, כולל בכורה.","c":["C16"]},{"en":"In most bankruptcies, what happens to common stock?","he":"ברוב פשיטות הרגל, מה קורה למניה הרגילה?","o":[["It is paid back before bonds","היא נפרעת לפני האג\"ח"],["It is likely to be worthless","סביר שהיא תהיה חסרת ערך"]],"a":1,"why":"המניה הרגילה אחרונה בתור, ולכן בדרך כלל לא נשאר לה כלום.","c":["C17"]}]},{"id":"l5","en":"Rights: first in line for new shares","he":"זכויות: הראשונים בתור למניות חדשות","story":[{"he":"Golden Crust רוצה לגייס עוד כסף ולהנפיק 100,000 מניות חדשות. דנה מודאגת: יש לה 1% מהחברה. אם המניות החדשות יימכרו לאחרים, האחוז שלה יקטן. זה נקרא <b>דילול</b> (<span class=en>dilution</span>).","c":["C20"]},{"he":"הפתרון: <b>הנפקת זכויות</b> (<span class=en>rights offering</span>). לפני שמוכרים לציבור, החברה נותנת לבעלי המניות הקיימים <b>זכויות</b> (<span class=en>rights</span>) לקנות מניות חדשות <b>לפי החלק שכבר יש להם</b> (<span class=en>in proportion</span>). לדנה יש 1%, אז היא יכולה לקנות 1% מהמניות החדשות, כלומר 1,000, ולשמור על האחוז שלה. הזכות הזאת נקראת <b>זכות קדימה</b> (<span class=en>preemptive right</span>). שים לב: לא לכל חברה יש זכות קדימה. זה תלוי בתקנון של החברה.","c":["C18","C19","C45"]},{"he":"שלושה פרטים חשובים: 1) מחיר המניות החדשות בדרך כלל <b>בהנחה</b> (<span class=en>discount</span>) ממחיר השוק. 2) זה <b>לטווח קצר</b>: חלון של כמה שבועות. אם דנה לא <b>מממשת</b> (<span class=en>exercise</span>) את הזכויות עד המועד, הן <b>פוקעות</b> בלי ערך, והאחוז שלה בחברה יורד. 3) יש זכויות שאפשר למכור לאחרים (<span class=en>transferable</span>) ויש שלא.","c":["C18","C20","C21","C46"]}],"terms":[["Rights offering","הנפקת זכויות","הצעה לבעלי המניות הקיימים לקנות מניות חדשות לפי חלקם, בדרך כלל בהנחה ובחלון זמן קצר.",["C18","C46"]],["Rights (subscription rights)","זכויות לרכישת מניות","הזכות לקנות את המניות החדשות. פוקעת בלי ערך אם לא מממשים אותה. יש זכויות שאפשר למכור (transferable) ויש שלא.",["C18","C20","C21"]],["Preemptive right","זכות קדימה","הזכות לקנות מניות חדשות כדי לשמור על אחוז הבעלות. לא קיימת בכל חברה.",["C19","C45"]],["Dilution","דילול","ירידה באחוז הבעלות כשהחברה מנפיקה עוד מניות.",["C20"]],["Exercise","מימוש","שימוש בזכות (או בכתב אופציה) כדי לקנות את המניות.",["C18","C23"]]],"checks":[{"en":"In a rights offering, the new shares are usually priced:","he":"בהנפקת זכויות, המחיר של המניות החדשות בדרך כלל:","o":[["Below the market price","מתחת למחיר השוק"],["Above the market price","מעל מחיר השוק"]],"a":0,"why":"בהנפקת זכויות המחיר בדרך כלל בהנחה ממחיר השוק, כדי לעודד את בעלי המניות לממש.","c":["C18"]},{"en":"Dana does nothing with her rights until the window closes. What happens?","he":"דנה לא עושה כלום עם הזכויות עד שהחלון נסגר. מה קורה?","o":[["They turn into new shares automatically","הן הופכות למניות חדשות אוטומטית"],["They expire worthless, and her stake shrinks","הן פוקעות בלי ערך, והחלק שלה קטן"]],"a":1,"why":"זכויות שלא מומשו פוקעות בלי ערך, ומי שלא השתתף מחזיק אחוז קטן יותר.","c":["C20"]}]},{"id":"l6","en":"Warrants: a long-term ticket","he":"כתבי אופציה: כרטיס לטווח ארוך","story":[{"he":"Golden Crust צריכה עוד משקיעים, ורוצה להפוך את העסקה לאטרקטיבית יותר. לכן מי שקונה ממנה ניירות ערך חדשים מקבל גם <b>כתב אופציה</b> (<span class=en>warrant</span>), כמו בונוס מצורף: <b>תמריץ</b> (<span class=en>incentive</span>) לקנות. כתבי אופציה מצורפים לעתים קרובות לנייר ערך אחר.","c":["C25"]},{"he":"מה זה כתב אופציה? <b>זכות, לא חובה</b>, לקנות מניות <b>ישירות מהחברה</b> במחיר קבוע, <b>מחיר מימוש</b> (<span class=en>exercise price</span>), עד <b>מועד פקיעה</b> (<span class=en>expiration date</span>). ההבדל מזכויות: כתב אופציה הוא <b>לטווח ארוך</b>, לעתים קרובות שנים, למשל 5 או 10 שנים. ומחיר המימוש נקבע לעתים קרובות <b>מעל</b> מחיר המניה ביום ההנפקה.","c":["C23","C43"]},{"he":"דנה קנתה אג\"ח חדשה של Golden Crust, וקיבלה איתה כתב אופציה. המניה נסחרת ב-6 דולר, וכתב האופציה מאפשר לה לקנות ב-8 דולר, בכל זמן ב-5 השנים הבאות. היום אין טעם לממש. אם בעוד 3 שנים המניה תעלה ל-15 דולר, דנה תממש: תקנה ב-8 מניה ששווה 15, רווח של 7 דולר למניה. המניות יגיעו אליה ישירות מהחברה. וחשוב: <b>עד שהיא מממשת</b>, אין לה זכות הצבעה ואין לה דיבידנדים. היא עדיין לא בעלת מניות.","c":["C23","C24","C53"]}],"terms":[["Warrant","כתב אופציה","זכות לקנות מניות ישירות מהחברה במחיר קבוע עד מועד פקיעה, לעתים קרובות לטווח של שנים. לעתים קרובות מצורף לנייר ערך אחר.",["C23","C25","C53"]],["Exercise price","מחיר מימוש","המחיר הקבוע שבו קונים את המניה. בכתב אופציה, לעתים קרובות מעל מחיר המניה ביום ההנפקה.",["C23","C43"]],["Rights vs. warrants","זכויות מול כתבי אופציה","זכויות: טווח קצר (שבועות), בדרך כלל במחיר נמוך מהשוק, לבעלי מניות קיימים. כתבי אופציה: טווח ארוך (שנים), מחיר מימוש לעתים קרובות מעל השוק, לעתים קרובות מצורפים לנייר ערך אחר.",["C18","C23","C25","C43","C46"]]],"checks":[{"en":"When a warrant is first issued, its exercise price is often:","he":"כשכתב אופציה מונפק, מחיר המימוש שלו לעתים קרובות:","o":[["Above the stock's current price","מעל המחיר הנוכחי של המניה"],["Below the stock's current price","מתחת למחיר הנוכחי של המניה"]],"a":0,"why":"מחיר המימוש של כתב אופציה נקבע לעתים קרובות בפרמיה, כלומר מעל מחיר המניה ביום ההנפקה. בזכויות זה הפוך: בדרך כלל מתחת לשוק.","c":["C43","C18"]},{"en":"Dana exercises her warrant. Where do the shares come from?","he":"דנה מממשת את כתב האופציה. מאיפה מגיעות המניות?","o":[["Directly from the company","ישירות מהחברה"],["From another investor on the market","ממשקיע אחר בשוק"]],"a":0,"why":"במימוש כתב אופציה, החברה עצמה מנפיקה את המניות.","c":["C53"]}]},{"id":"l7","en":"ADRs: a foreign company, in dollars","he":"ADR: חברה זרה, בדולרים","story":[{"he":"דנה שמעה על מאפייה יפנית מצליחה, \"Sakura Bakery\". אבל המניות שלה נסחרות בבורסה בטוקיו, ביין. לפתוח חשבון ביפן ולהמיר כסף? מסובך.","c":[]},{"he":"הפתרון: <b>ADR</b> (<span class=en>American Depositary Receipt</span>), תעודת פיקדון אמריקאית. בנק אמריקאי, שנקרא <b>בנק הפיקדון</b> (<span class=en>depositary bank</span>), מחזיק את המניות היפניות (דרך <b>משמורן</b>, <span class=en>custodian</span>, ביפן), ו<b>מנפיק</b> נגדן תעודות שנסחרות <b>בארה\"ב, בדולרים</b>. דנה קונה ADR דרך <b>הברוקר</b> הרגיל שלה (<span class=en>broker-dealer</span>: חברה שקונה ומוכרת ניירות ערך בשביל לקוחות, או בשביל עצמה), כמו כל מניה אמריקאית.","c":["C26","C27"]},{"he":"כל ADR יכול לייצג מניה אחת, כמה מניות, או חלק ממניה. היחס (<span class=en>ADR ratio</span>) נקבע כדי שהמחיר יהיה דומה למחיר רגיל של מניה אמריקאית. למשל: ADR אחד = 4 מניות, ומניה שווה 6 דולר, אז ה-ADR נסחר בסביבות 24 דולר. ואם ADR אחד = חצי מניה, ומניה שווה 30 דולר, ה-ADR נסחר בסביבות 15 דולר.","c":["C28"]},{"he":"שים לב: ה-ADR נסחר בדולרים, אבל <b>שער החליפין (<span class=en>exchange rate</span>) עדיין משפיע על השווי</b>. מחיר המניה הוא 900 ין. כשדולר = 150 ין, זה 6 דולר. אם הין נחלש ודולר = 180 ין, אותה מניה שווה רק 5 דולר, וה-ADR יורד, גם אם המניה ביפן לא זזה. זה <b>סיכון מטבע</b> (<span class=en>currency risk</span>).","c":["C31","C51"]},{"he":"שני סוגים: <b>ADR עם חסות</b> (<span class=en>sponsored</span>), כשהחברה הזרה חתמה על הסכם עם בנק הפיקדון. <b>ADR בלי חסות</b> (<span class=en>unsponsored</span>), כשהוא הוקם בלי שיתוף פעולה של החברה, למשל ביוזמת ברוקר.","c":["C29"]},{"he":"ADR ברמה הבסיסית (<span class=en>Level 1</span>) לא משמש לגיוס כסף, ונסחר רק <b>מחוץ לבורסה</b> (<span class=en>OTC, over-the-counter</span>): מסחר ישיר בין ברוקרים, לא בבורסה (<span class=en>stock exchange</span>). זה גם הסוג היחיד שיכול להיות בלי חסות.","c":["C30"]}],"terms":[["ADR (American Depositary Receipt)","תעודת פיקדון אמריקאית","נייר ערך שמנפיק בנק אמריקאי, ומייצג מניות של חברה לא-אמריקאית. נסחר בדולרים.",["C26","C27"]],["Depositary bank","בנק הפיקדון","הבנק האמריקאי שמנפיק את ה-ADR. המניות הזרות מוחזקות בשבילו אצל משמורן (custodian) בארץ של החברה.",["C26"]],["ADR ratio","יחס ADR","כמה מניות זרות כל ADR מייצג: אחת, כמה, או חלק ממניה.",["C28"]],["Sponsored / unsponsored","עם חסות / בלי חסות","עם חסות: החברה הזרה חתומה על הסכם עם הבנק. בלי חסות: הוקם בלי שיתוף פעולה של החברה.",["C29"]],["Currency risk","סיכון מטבע","גם ADR שנסחר בדולרים מושפע משער החליפין. מטבע זר שנחלש מוריד את מחיר ה-ADR.",["C31","C51"]],["OTC (over-the-counter)","מחוץ לבורסה","מסחר ישיר בין ברוקרים, לא בבורסה. ADR ברמה 1 נסחר רק כך.",["C30"]]],"checks":[{"en":"The yen strengthens against the dollar, and the Japanese share price does not change. What happens to the ADR's dollar price?","he":"הין מתחזק מול הדולר, ומחיר המניה ביפן לא משתנה. מה קורה למחיר ה-ADR בדולרים?","o":[["It falls","הוא יורד"],["It rises","הוא עולה"]],"a":1,"why":"ין חזק שווה יותר דולרים, ולכן השווי בדולרים של אותה מניה עולה.","c":["C51"]},{"en":"Who issues an ADR?","he":"מי מנפיק ADR?","o":[["The foreign stock exchange","הבורסה הזרה"],["A U.S. depositary bank","בנק פיקדון אמריקאי"]],"a":1,"why":"בנק פיקדון אמריקאי מנפיק את ה-ADR, נגד המניות הזרות שהוא מחזיק.","c":["C26"]}]},{"id":"l8","en":"Rule 144: selling restricted and control securities","he":"כלל 144: מכירת מניות מוגבלות ומניות של צד קשור","story":[{"he":"עברו כמה שנים. Golden Crust הפכה ל<b>חברה ציבורית</b> (<span class=en>public company</span>), ויש לה היום 5,000,000 <b>מניות במחזור</b> (<span class=en>shares outstanding</span>), כלומר מניות שמוחזקות בידי משקיעים. המניה <b>רשומה למסחר בבורסה</b> (<span class=en>exchange-listed</span>).","c":[]},{"he":"הרגולטור של שוק ההון בארה\"ב הוא ה-<b>SEC</b> (<span class=en>Securities and Exchange Commission</span>), רשות ניירות הערך האמריקאית. כשחברה מציעה ניירות ערך לציבור, היא צריכה <b>לרשום</b> אותם ב-SEC (<span class=en>registration</span>), כלומר לפרסם מידע מלא. Golden Crust גם הפכה ל<b>חברה מדווחת</b> (<span class=en>reporting company</span>): היא מגישה ל-SEC דוחות קבועים.","c":["C47","C52"]},{"he":"אבי הוא דירקטור ובעל מניות גדול, ולכן הוא <b>צד קשור</b> (<span class=en>affiliate</span>): אדם כמו נושא משרה בכירה, דירקטור או בעל מניות גדול, שיש לו <b>שליטה</b> בחברה. (בישראל, המושג הקרוב הוא \"בעל עניין\".) הוא רוצה למכור חלק מהמניות שלו, ו<b>כלל 144</b> (<span class=en>Rule 144</span>) קובע מתי ואיך. שים לב: דירקטור או נושא משרה בכירה נחשב בדרך כלל לצד קשור בגלל התפקיד, גם אם יש לו מעט מניות. משקיע רגיל עם אחוז קטן, ברוקר או בנק שהלווה כסף הם לא צד קשור רק בגלל זה.","c":["C33"]},{"he":"כלל 144 חל על שני סוגים של ניירות ערך. הסוג הראשון: <b>ניירות ערך מוגבלים</b> (<span class=en>restricted securities</span>). הם נקנו בעסקה פרטית (<span class=en>private sale</span>) <b>שלא נרשמה ב-SEC</b> (<span class=en>unregistered</span>), ישירות מהחברה או מצד קשור. בדרך כלל יש עליהם סימון שאומר שאסור למכור אותם בשוק, אלא אם יש פטור מרישום, כמו כלל 144.","c":["C32"]},{"he":"הסוג השני: <b>ניירות שליטה</b> (<span class=en>control securities</span>): כל נייר ערך שמחזיק צד קשור, גם אם קנה אותו בבורסה. אם צד קשור קנה מניות בשוק הפתוח, אין <b>תקופת החזקה</b>, אבל שאר התנאים חלים עליו.","c":["C32","C33","C39"]},{"he":"<b>תקופת החזקה</b> (<span class=en>holding period</span>) למניות מוגבלות: לפחות <b>6 חודשים</b>, אם החברה מדווחת ל-SEC כבר לפחות 90 יום. אם החברה לא מדווחת, לפחות <b>שנה</b>.","c":["C34"]},{"he":"<b>מגבלת כמות</b> לצד קשור: בכל 3 חודשים, מותר למכור את <b>הגבוה מבין</b>: 1% מהמניות במחזור, או (רק אם המניה רשומה בבורסה) ממוצע <b>היקף המסחר השבועי</b> (<span class=en>average weekly trading volume</span>) ב-4 השבועות האחרונים. אצל אבי: 1% מ-5,000,000 = 50,000. היקף המסחר השבועי הממוצע = 60,000. המקסימום: 60,000 מניות.","c":["C35"]},{"he":"<b>טופס 144</b> (<span class=en>Form 144</span>): צד קשור של חברה מדווחת חייב להגיש הודעה ל-SEC אם הוא מוכר <b>יותר מ-5,000 מניות או יותר מ-50,000 דולר</b> בתוך 3 חודשים. מספיק תנאי אחד.","c":["C36"]},{"he":"<b>אופן המכירה</b> (<span class=en>manner of sale</span>): עסקה שגרתית דרך ברוקר או ישירות מול <b>עושה שוק</b> (<span class=en>market maker</span>, חברה שמוכנה תמיד לקנות ולמכור את המניה), עם עמלה רגילה, בלי לחזר אחרי קונים.","c":["C38"]},{"he":"ומה עם מי <b>שאינו</b> צד קשור (<span class=en>non-affiliate</span>)? יוסי, משקיע רגיל, קנה מ-Golden Crust מניות בעסקה פרטית, כלומר מניות מוגבלות. הוא לא צד קשור, ולא היה צד קשור ב-3 החודשים האחרונים. אם הוא מחזיק בהן בין 6 ל-12 חודשים, הוא יכול למכור אם יש <b>מידע ציבורי עדכני</b> (<span class=en>current public information</span>) על החברה. אחרי שנה, הוא יכול למכור בחופשיות, בלי שאר התנאים. טופס 144 ומגבלת הכמות לא חלים עליו.","c":["C37","C40"]}],"terms":[["SEC","רשות ניירות הערך האמריקאית","Securities and Exchange Commission. הרגולטור של שוק ההון בארה\"ב.",["C47"]],["Registration / unregistered","רישום / לא רשום","רישום = הגשת מידע מלא ל-SEC לפני הצעה לציבור. עסקה לא רשומה = עסקה פרטית בלי רישום.",["C47","C32"]],["Reporting company","חברה מדווחת","חברה שמגישה ל-SEC דוחות קבועים.",["C52"]],["Shares outstanding","מניות במחזור","המניות שמוחזקות בידי המשקיעים. 1% מהן הוא אחת משתי מגבלות הכמות.",["C35"]],["Affiliate","צד קשור","אדם כמו נושא משרה בכירה, דירקטור או בעל מניות גדול, ביחסי שליטה עם החברה. קרוב למושג \"בעל עניין\".",["C33"]],["Restricted securities","ניירות ערך מוגבלים","נקנו בעסקה פרטית לא רשומה, מהחברה או מצד קשור. בדרך כלל עם סימון שאוסר מכירה בשוק בלי פטור.",["C32"]],["Control securities","ניירות שליטה","כל נייר ערך שמחזיק צד קשור, גם אם קנה אותו בבורסה.",["C33","C39"]],["Holding period","תקופת החזקה","למניות מוגבלות: 6 חודשים בחברה מדווחת (מדווחת לפחות 90 יום), שנה בחברה לא מדווחת.",["C34"]],["Volume limit","מגבלת כמות","לצד קשור, בכל 3 חודשים: הגבוה מבין 1% מהמניות במחזור, או (רק למניה רשומה בבורסה) ממוצע היקף המסחר השבועי ב-4 שבועות.",["C35"]],["Form 144","טופס 144","הודעה ל-SEC כשצד קשור של חברה מדווחת מוכר יותר מ-5,000 מניות או יותר מ-50,000 דולר ב-3 חודשים.",["C36"]],["Current public information","מידע ציבורי עדכני","תנאי בכלל 144: מידע עדכני על החברה זמין לציבור.",["C40"]]],"checks":[{"en":"Restricted shares of a company that has reported to the SEC for years. Minimum holding period?","he":"מניות מוגבלות של חברה שמדווחת ל-SEC כבר שנים. מה תקופת ההחזקה המינימלית?","o":[["12 months","12 חודשים"],["6 months","6 חודשים"]],"a":1,"why":"בחברה מדווחת (לפחות 90 יום), תקופת ההחזקה היא 6 חודשים. 12 חודשים זה לחברה לא מדווחת.","c":["C34"]},{"en":"An affiliate sells 3,000 shares worth $70,000 within 3 months. Is Form 144 required?","he":"צד קשור מוכר 3,000 מניות בשווי 70,000 דולר בתוך 3 חודשים. האם צריך טופס 144?","o":[["Yes, the value is over $50,000","כן, השווי מעל 50,000 דולר"],["No, the count is under 5,000 shares","לא, הכמות מתחת ל-5,000 מניות"]],"a":0,"why":"מספיק שאחד התנאים מתקיים: יותר מ-5,000 מניות או יותר מ-50,000 דולר.","c":["C36"]}]}],"exam":[{"en":"Which statement is TRUE of a typical common stockholder?","he":"איזו טענה נכונה לגבי בעל מניה רגילה טיפוסי?","o":[["May vote to elect the board of directors","יכול להצביע לבחירת הדירקטוריון"],["May claim a dividend whenever there is profit","יכול לדרוש דיבידנד בכל פעם שיש רווח"],["May vote to declare a dividend on common","יכול להצביע כדי להכריז על דיבידנד למניות הרגילות"],["May claim assets ahead of bondholders","יכול לתבוע נכסים לפני מחזיקי האג\"ח"]],"a":0,"why":"בעל מניה רגילה בוחר את הדירקטוריון. הדירקטוריון, לא בעלי המניות, מכריז על דיבידנד, ואין חובה לחלק גם כשיש רווח. מחזיקי אג\"ח הם נושים וקודמים לבעלי המניות.","c":["C2","C3","C16"]},{"en":"An investor paid $5,000 for common stock. The company fails, owing $2 million it cannot repay. What is the investor's maximum loss?","he":"משקיע שילם 5,000 דולר על מניות רגילות. החברה קורסת עם חוב של 2 מיליון דולר שהיא לא יכולה להחזיר. מה ההפסד המקסימלי של המשקיע?","o":[["The unpaid debt, split among all holders","החוב שלא נפרע, מחולק בין כל בעלי המניות"],["$5,000 plus a share of the unpaid debt","5,000 דולר ועוד חלק מהחוב שלא נפרע"],["$5,000, the amount the investor paid","5,000 הדולר שהמשקיע שילם"],["Half the $5,000; the rest is insured","מחצית מ-5,000 הדולר; השאר מבוטח"]],"a":2,"why":"אחריות מוגבלת: בעל מניות לא אחראי לחובות החברה. ההפסד המקסימלי הוא מה שהשקיע. מניות לא מבוטחות על ידי ה-FDIC.","c":["C4","C5"]},{"en":"Who decides whether a company pays a dividend on its common stock?","he":"מי מחליט אם חברה משלמת דיבידנד על המניות הרגילות?","o":[["The preferred holders, by a separate vote","בעלי הבכורה, בהצבעה נפרדת"],["The board, but only after a shareholder vote","הדירקטוריון, אבל רק אחרי הצבעה של בעלי המניות"],["The shareholders, by a majority vote","בעלי המניות, ברוב קולות"],["The board of directors, by declaring it","הדירקטוריון, בהכרזה על הדיבידנד"]],"a":3,"why":"דיבידנד משולם רק כשהדירקטוריון מכריז עליו. אין צורך בהצבעה של בעלי המניות.","c":["C3"]},{"en":"An investor owns 300 shares. The company is electing 4 directors using cumulative voting. Which BEST describes the investor's voting power?","he":"למשקיע 300 מניות. החברה בוחרת 4 דירקטורים בהצבעה מצטברת. מה מתאר הכי טוב את כוח ההצבעה של המשקיע?","o":[["300 votes; at most 75 per candidate","300 קולות; לכל היותר 75 למועמד"],["1,200 votes; all may go to one candidate","1,200 קולות; אפשר לתת את כולם למועמד אחד"],["300 votes; all may go to one candidate","300 קולות; אפשר לתת את כולם למועמד אחד"],["1,200 votes; at most 300 per candidate","1,200 קולות; לכל היותר 300 למועמד"]],"a":1,"why":"מניות × מושבים = 300 × 4 = 1,200 קולות, ובהצבעה מצטברת אפשר לרכז את כולם על מועמד אחד.","c":["C7"]},{"en":"Under statutory voting, a shareholder with 200 shares votes in an election for 3 open seats. The MOST votes the shareholder may cast for any one candidate is:","he":"בהצבעה סטטוטורית, בעל 200 מניות מצביע בבחירות ל-3 מושבים פנויים. מה המספר הגדול ביותר של קולות שהוא יכול לתת למועמד אחד?","o":[["600","600"],["1","1"],["67","67"],["200","200"]],"a":3,"why":"בהצבעה סטטוטורית: קול אחד למניה לכל מושב. אי אפשר לרכז, ולכן המקסימום למועמד אחד הוא 200.","c":["C6"]},{"en":"Cumulative voting is generally considered to help which group?","he":"הצבעה מצטברת נחשבת בדרך כלל כעוזרת לאיזו קבוצה?","o":[["Directors seeking re-election to the board","דירקטורים שרוצים להיבחר מחדש"],["Majority holders seeking every board seat","בעלי מניות רוב שרוצים את כל המושבים"],["Preferred holders seeking a dividend vote","בעלי בכורה שרוצים הצבעה על דיבידנד"],["Minority holders seeking one board seat","בעלי מניות מיעוט שרוצים מושב אחד בדירקטוריון"]],"a":3,"why":"הצבעה מצטברת מאפשרת לבעל מניות קטן לרכז קולות על מועמד אחד, ולכן עוזרת לבעלי מניות מיעוט.","c":["C8"]},{"en":"All of the following are typical features of preferred stock EXCEPT:","he":"כל אלה תכונות אופייניות של מניית בכורה, חוץ מ:","o":[["Usually a fixed, stated dividend rate","בדרך כלל שיעור דיבידנד קבוע ונקוב"],["Usually paid dividends before common","בדרך כלל מקבלת דיבידנד לפני הרגילות"],["Usually no vote in electing directors","בדרך כלל בלי הצבעה בבחירת דירקטורים"],["Usually paid before bonds in liquidation","בדרך כלל מקבלת לפני האג\"ח בפירוק"]],"a":3,"why":"מחזיקי אג\"ח הם נושים, ולכן קודמים לבעלי הבכורה בפירוק. שלוש האפשרויות האחרות הן תכונות אופייניות של בכורה.","c":["C9","C10","C11","C12","C16"]},{"en":"A cumulative preferred stock pays $2 a year, in quarterly dividends of $0.50. The company skipped the last two quarters. Before paying any common dividend this quarter, it must pay preferred holders, per share:","he":"מניית בכורה מצטברת משלמת 2 דולר בשנה, ב-4 דיבידנדים רבעוניים של 0.50 דולר. החברה דילגה על שני הרבעונים האחרונים. לפני כל דיבידנד למניות הרגילות ברבעון הזה, היא חייבת לשלם לבעלי הבכורה, לכל מניה:","o":[["$0.50","0.50 דולר"],["$2.00","2.00 דולר"],["$1.50","1.50 דולר"],["$1.00","1.00 דולר"]],"a":2,"why":"בבכורה מצטברת: שני הרבעונים שבפיגור (1.00 דולר) ועוד הרבעון הנוכחי (0.50 דולר) = 1.50 דולר.","c":["C13"]},{"en":"A non-cumulative preferred stock pays $4 a year. Last year's dividend was skipped. Before paying common stockholders this year, the company must pay preferred holders, per share:","he":"מניית בכורה לא מצטברת משלמת 4 דולר בשנה. בשנה שעברה דילגו על הדיבידנד. לפני תשלום לבעלי המניות הרגילות השנה, החברה חייבת לשלם לבעלי הבכורה, לכל מניה:","o":[["$8","8 דולר"],["$0","0 דולר"],["$4","4 דולר"],["$2","2 דולר"]],"a":2,"why":"בבכורה לא מצטברת, מה שדולג לא מצטבר. אבל הדיבידנד של השנה הנוכחית (4 דולר) עדיין משולם לפני הרגילות.","c":["C14","C54"]},{"en":"A convertible preferred share has a $100 liquidation preference, a 6% stated dividend rate and a $20 conversion price. The common stock trades at $25. Into how many common shares does it convert?","he":"למניית בכורה ניתנת להמרה יש ערך פירוק של 100 דולר, שיעור דיבידנד נקוב של 6% ומחיר המרה של 20 דולר. המניה הרגילה נסחרת ב-25 דולר. לכמה מניות רגילות היא מומרת?","o":[["20","20"],["6","6"],["4","4"],["5","5"]],"a":3,"why":"מספר המניות = ערך הפירוק חלקי מחיר ההמרה: 100 ÷ 20 = 5. מחיר השוק (25 דולר) ושיעור הדיבידנד לא משנים את החישוב.","c":["C49"]},{"en":"A company is liquidated. After secured creditors are paid, $2.5 million remains. Unsecured bondholders are owed $1.5 million, and preferred stockholders are entitled to $2 million. How much do preferred stockholders receive?","he":"חברה מתפרקת. אחרי תשלום לנושים המובטחים נשארו 2.5 מיליון דולר. למחזיקי האג\"ח הלא מובטחת מגיעים 1.5 מיליון, ולבעלי הבכורה מגיעים 2 מיליון. כמה מקבלים בעלי הבכורה?","o":[["$1.0 million","1.0 מיליון דולר"],["$1.25 million","1.25 מיליון דולר"],["$0","0 דולר"],["$2.0 million","2.0 מיליון דולר"]],"a":0,"why":"האג\"ח קודמות: 2.5 פחות 1.5 = מיליון. בעלי הבכורה מקבלים את המיליון שנשאר, פחות ממה שמגיע להם. לרגילות לא נשאר כלום.","c":["C16"]},{"en":"A director of a public company buys 10,000 of its shares on a stock exchange. Under Rule 144, these shares are:","he":"דירקטור בחברה ציבורית קונה 10,000 ממניותיה בבורסה. לפי כלל 144, המניות האלה הן:","o":[["Control securities, with no holding period","ניירות שליטה, בלי תקופת החזקה"],["Control securities, with a 6-month holding period","ניירות שליטה, עם תקופת החזקה של 6 חודשים"],["Restricted securities, with no holding period","ניירות ערך מוגבלים, בלי תקופת החזקה"],["Restricted securities, with a 6-month holding period","ניירות ערך מוגבלים, עם תקופת החזקה של 6 חודשים"]],"a":0,"why":"דירקטור הוא בדרך כלל צד קשור, ולכן מה שהוא מחזיק הוא ניירות שליטה. הוא קנה בשוק הפתוח, אז אין תקופת החזקה. שאר התנאים של כלל 144 עדיין חלים.","c":["C33","C39"]},{"en":"In a rights offering, the rights go to:","he":"בהנפקת זכויות, הזכויות ניתנות ל:","o":[["Existing shareholders, in proportion to what they own","בעלי המניות הקיימים, לפי החלק שיש להם"],["Any investor, in proportion to the amount they invest","כל משקיע, לפי הסכום שהוא משקיע"],["Existing shareholders, an equal number to each holder","בעלי המניות הקיימים, מספר שווה לכל אחד"],["Any investor, an equal number to each buyer","כל משקיע, מספר שווה לכל קונה"]],"a":0,"why":"בהנפקת זכויות, בעלי המניות הקיימים מקבלים זכויות לפי החלק שכבר יש להם, לפני הציבור.","c":["C18"]},{"en":"The main purpose of a preemptive right is to let existing shareholders:","he":"המטרה העיקרית של זכות קדימה היא לאפשר לבעלי המניות הקיימים:","o":[["Keep their percentage of ownership","לשמור על אחוז הבעלות שלהם"],["Sell their shares back to the company","למכור את המניות בחזרה לחברה"],["Elect one director of their choice","לבחור דירקטור אחד לבחירתם"],["Receive dividends ahead of others","לקבל דיבידנד לפני אחרים"]],"a":0,"why":"זכות קדימה מאפשרת לקנות מניות חדשות לפי החלק שלך, וכך האחוז שלך לא מדולל.","c":["C19"]},{"en":"An investor owns 2,000 of a company's 200,000 shares (1%). The company sells 50,000 new shares in a rights offering, and she lets her rights expire. Her ownership is now:","he":"משקיעה מחזיקה 2,000 מתוך 200,000 מניות של חברה (1%). החברה מוכרת 50,000 מניות חדשות בהנפקת זכויות, והיא נותנת לזכויות שלה לפקוע. כמה מהחברה בבעלותה עכשיו?","o":[["1%","1%"],["0%","0%"],["0.8%","0.8%"],["1.25%","1.25%"]],"a":2,"why":"אחרי ההנפקה יש 250,000 מניות. 2,000 ÷ 250,000 = 0.8%. זה דילול: הזכויות פקעו, והחלק שלה קטן.","c":["C20"]},{"en":"Compared with warrants, rights are typically:","he":"בהשוואה לכתבי אופציה, זכויות הן בדרך כלל:","o":[["Long-term, usually priced above market","לטווח ארוך, בדרך כלל במחיר מעל השוק"],["Long-term, usually priced below market","לטווח ארוך, בדרך כלל במחיר מתחת לשוק"],["Short-term, usually priced below market","לטווח קצר, בדרך כלל במחיר מתחת לשוק"],["Short-term, usually priced above market","לטווח קצר, בדרך כלל במחיר מעל השוק"]],"a":2,"why":"זכויות: כמה שבועות, בדרך כלל בהנחה. כתבי אופציה: שנים, ומחיר מימוש לעתים קרובות מעל השוק.","c":["C18","C43","C46"]},{"en":"Which BEST describes a warrant?","he":"מה מתאר הכי טוב כתב אופציה?","o":[["A duty to buy new shares from the issuer","חובה לקנות מניות חדשות מהמנפיק"],["A right to buy existing shares from other investors","זכות לקנות מניות קיימות ממשקיעים אחרים"],["A right to buy new shares from the issuer","זכות לקנות מניות חדשות מהמנפיק"],["A duty to buy existing shares from other investors","חובה לקנות מניות קיימות ממשקיעים אחרים"]],"a":2,"why":"כתב אופציה הוא זכות, לא חובה, לקנות מניות. במימוש, המניות מגיעות ישירות מהחברה.","c":["C23","C53"]},{"en":"Before a warrant is exercised, its holder:","he":"לפני שכתב אופציה ממומש, המחזיק שלו:","o":[["Votes and receives dividends like a shareholder","מצביע ומקבל דיבידנד כמו בעל מניות"],["Has no voting rights and no dividend rights","אין לו זכות הצבעה ואין לו זכות לדיבידנד"],["Receives dividends but has no right to vote","מקבל דיבידנד אבל לא מצביע"],["Votes but does not receive any dividends","מצביע אבל לא מקבל דיבידנד"]],"a":1,"why":"עד המימוש, למחזיק כתב אופציה אין זכויות של בעל מניות.","c":["C24"]},{"en":"Warrants are often issued:","he":"כתבי אופציה מונפקים לעתים קרובות:","o":[["With a dividend payment, to reward holders","יחד עם תשלום דיבידנד, כדי לתגמל מחזיקים"],["With a rights offering, to extend its deadline","יחד עם הנפקת זכויות, כדי להאריך את המועד"],["With a new bond or stock, to attract buyers","יחד עם אג\"ח או מניה חדשה, כדי למשוך קונים"],["With a stock split, to lower the share price","יחד עם פיצול מניות, כדי להוריד את מחיר המניה"]],"a":2,"why":"כתבי אופציה מצורפים לעתים קרובות לנייר ערך אחר, כתמריץ שהופך את העסקה לאטרקטיבית.","c":["C25"]},{"en":"A broker-dealer sets up an ADR facility without the foreign company's cooperation. The ADR is:","he":"ברוקר מקים ADR בלי שיתוף פעולה של החברה הזרה. ה-ADR הזה הוא:","o":[["Sponsored, and can only be Level 1","עם חסות, ויכול להיות רק ברמה 1"],["Unsponsored, and can only be Level 1","בלי חסות, ויכול להיות רק ברמה 1"],["Sponsored, and can be any level","עם חסות, ויכול להיות בכל רמה"],["Unsponsored, and can be any level","בלי חסות, ויכול להיות בכל רמה"]],"a":1,"why":"ADR שהוקם בלי שיתוף פעולה של החברה הוא בלי חסות. רק ADR ברמה 1 יכול להיות בלי חסות.","c":["C29","C30"]},{"en":"Which statement is TRUE of a Level 1 ADR?","he":"איזו טענה נכונה לגבי ADR ברמה 1?","o":[["It trades OTC and cannot be used to raise capital","נסחר מחוץ לבורסה, ואי אפשר לגייס איתו כסף"],["It trades on an exchange and cannot raise capital","נסחר בבורסה, ואי אפשר לגייס איתו כסף"],["It trades on an exchange and is used to raise capital","נסחר בבורסה, ומשמש לגיוס כסף"],["It trades OTC and is used to raise new capital","נסחר מחוץ לבורסה, ומשמש לגיוס כסף חדש"]],"a":0,"why":"ADR ברמה 1 נסחר רק מחוץ לבורסה (OTC), ולא משמש לגיוס כסף.","c":["C30"]},{"en":"An investor owns an ADR of a Japanese company. The share price in yen does not change, but the exchange rate moves from $1 = 100 yen to $1 = 125 yen. The ADR's dollar price will most likely:","he":"למשקיע ADR של חברה יפנית. מחיר המניה ביין לא משתנה, אבל שער החליפין עובר מ-1 דולר = 100 ין ל-1 דולר = 125 ין. מה סביר שיקרה למחיר ה-ADR בדולרים?","o":[["Rise, because the shares are worth more dollars","יעלה, כי המניות שוות יותר דולרים"],["Fall, because the shares are worth fewer dollars","ירד, כי המניות שוות פחות דולרים"],["Stay the same, because the yen price is unchanged","יישאר אותו דבר, כי המחיר ביין לא השתנה"],["Stay the same, because ADRs trade in dollars","יישאר אותו דבר, כי ADR נסחר בדולרים"]],"a":1,"why":"עכשיו צריך 125 ין לדולר במקום 100: הין נחלש. אותו מחיר ביין שווה פחות דולרים, וה-ADR יורד.","c":["C31","C51"]},{"en":"One ADR represents half a share of a Japanese company. Each share costs 3,000 yen, and $1 = 120 yen. Ignoring fees, the ADR should trade near:","he":"ADR אחד מייצג חצי מניה של חברה יפנית. כל מניה עולה 3,000 ין, ודולר אחד = 120 ין. בלי עמלות, ה-ADR אמור להיסחר בסביבות:","o":[["$6.25","6.25 דולר"],["$25","25 דולר"],["$50","50 דולר"],["$12.50","12.50 דולר"]],"a":3,"why":"מניה אחת: 3,000 ÷ 120 = 25 דולר. ADR אחד = חצי מניה: 12.50 דולר.","c":["C28","C51"]},{"en":"Under Rule 144, which of the following would generally NOT be considered an affiliate of the issuer?","he":"לפי כלל 144, מי מהבאים בדרך כלל לא ייחשב צד קשור של המנפיק?","o":[["An executive officer who owns no shares","נושא משרה בכירה שאין לו מניות"],["A holder with a controlling stake","בעל מניות עם אחזקת שליטה"],["A broker-dealer that trades the stock","ברוקר שסוחר במניה"],["A director who owns 200 shares","דירקטור שמחזיק 200 מניות"]],"a":2,"why":"צד קשור הוא מי שביחסי שליטה עם החברה, כמו נושא משרה בכירה, דירקטור או בעל מניות גדול. ברוקר שרק סוחר במניה אינו צד קשור בגלל זה.","c":["C33"]},{"en":"An investor buys restricted shares in a private sale from a company that does not file reports with the SEC. Under Rule 144, the minimum holding period is:","he":"משקיע קונה מניות מוגבלות בעסקה פרטית מחברה שלא מגישה דוחות ל-SEC. לפי כלל 144, תקופת ההחזקה המינימלית היא:","o":[["18 months","18 חודשים"],["6 months","6 חודשים"],["1 year","שנה"],["2 years","שנתיים"]],"a":2,"why":"בחברה שלא מדווחת ל-SEC: לפחות שנה. בחברה מדווחת: לפחות 6 חודשים.","c":["C34"]},{"en":"An affiliate holds shares of an exchange-listed company that has 8,000,000 shares outstanding. Average weekly trading volume over the past 4 weeks was 60,000 shares. The most the affiliate may sell in any 3-month period is:","he":"צד קשור מחזיק מניות של חברה רשומה בבורסה, שיש לה 8,000,000 מניות במחזור. היקף המסחר השבועי הממוצע ב-4 השבועות האחרונים היה 60,000 מניות. מה הכמות המקסימלית שהוא יכול למכור בכל תקופה של 3 חודשים?","o":[["80,000 shares","80,000 מניות"],["60,000 shares","60,000 מניות"],["240,000 shares","240,000 מניות"],["140,000 shares","140,000 מניות"]],"a":0,"why":"הגבוה מבין 1% מהמניות במחזור (80,000) לבין היקף המסחר השבועי הממוצע (60,000): 80,000.","c":["C35"]},{"en":"An affiliate of a reporting company plans to sell 4,000 shares at $15 each within 3 months. Must the affiliate file Form 144?","he":"צד קשור של חברה מדווחת מתכנן למכור 4,000 מניות ב-15 דולר למניה, בתוך 3 חודשים. האם הוא חייב להגיש טופס 144?","o":[["No, because it is under 5,000 shares","לא, כי זה פחות מ-5,000 מניות"],["Yes, because the sale is over $50,000","כן, כי המכירה מעל 50,000 דולר"],["No, because both limits must be exceeded","לא, כי צריך לעבור את שתי המגבלות"],["Yes, because it is over 1% of outstanding","כן, כי זה מעל 1% מהמניות במחזור"]],"a":1,"why":"4,000 × 15 = 60,000 דולר. מספיק לעבור אחד התנאים: יותר מ-5,000 מניות או יותר מ-50,000 דולר.","c":["C36","C55"]},{"en":"An investor who has never been an affiliate has held restricted shares of a reporting company for 8 months. Which BEST describes her position under Rule 144?","he":"משקיעה שמעולם לא הייתה צד קשור מחזיקה 8 חודשים מניות מוגבלות של חברה מדווחת. מה מתאר הכי טוב את מצבה לפי כלל 144?","o":[["Must wait 4 more months, then sell if information is current","חייבת לחכות עוד 4 חודשים, ואז למכור אם יש מידע עדכני"],["May sell now, if current public information is available","יכולה למכור עכשיו, אם יש מידע ציבורי עדכני"],["May sell now, with no conditions","יכולה למכור עכשיו, בלי תנאים"],["Must wait 4 more months, then sell with no conditions","חייבת לחכות עוד 4 חודשים, ואז למכור בלי תנאים"]],"a":1,"why":"מי שאינו צד קשור, בין 6 ל-12 חודשים בחברה מדווחת: מותר למכור אם יש מידע ציבורי עדכני. אחרי שנה: בלי תנאים.","c":["C40","C37"]}]};</script>
<script>
const D=DATA, app=document.getElementById("app"), $=id=>document.getElementById(id);
const KEY=D.id;
let S={done:{},best:null,attempts:0};try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const toTop=()=>window.scrollTo({top:0,behavior:"smooth"});
const L="ABCD";

function home(){
  const n=D.lessons.filter(l=>S.done[l.id]).length;
  app.innerHTML=`<div><span class="eyebrow">SIE · Section ${D.section} · Understanding Products and Their Risks</span><h1>${D.heTitle}</h1>
   <p class="muted" style="margin:6px 0 0">8 שיעורים קצרים. כל שיעור: סיפור, מונחים בעברית ובאנגלית, ובדיקה קטנה. בסוף: מבחן בסגנון FINRA.</p></div>
  <div class="row"><span class="pill">${n} / ${D.lessons.length} שיעורים</span>${S.best!=null?`<span class="pill">ציון הכי טוב במבחן: ${S.best}%</span>`:""}</div>
  <div class="lessons">${D.lessons.map((l,i)=>`<button class="lesson" data-i="${i}"><span class="n">${i+1}</span><span><h3>${l.he}</h3><small>${l.en}</small></span><span class="st${S.done[l.id]?" done":""}">${S.done[l.id]?"✓ נלמד":"התחל"}</span></button>`).join("")}
   <button class="lesson cta" id="exam"><span class="n">★</span><span><h3>מבחן הפרק</h3><small>${D.exam.length} FINRA-style questions · pass = 70%</small></span><span class="st">התחל</span></button>
   <button class="lesson" id="gloss"><span class="n">אב</span><span><h3>מילון מונחים</h3><small>All terms, English · עברית</small></span><span class="st">פתח</span></button></div>`;
  app.querySelectorAll(".lesson[data-i]").forEach(b=>b.onclick=()=>story(+b.dataset.i,0));
  $("exam").onclick=examIntro;$("gloss").onclick=glossary;
}

function story(li,si){
  const Lz=D.lessons[li],s=Lz.story[si];toTop();
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">→ לתפריט</button><span class="pill">שיעור ${li+1}: ${Lz.he}</span></div>
  <div class="panel"><div class="bars">${Lz.story.map((x,i)=>`<i class="${i<=si?"on":""}"></i>`).join("")}</div>
   <div class="story">${s.he}</div>
   <div class="row"><button class="btn soft" id="prev" ${si===0?'style="visibility:hidden"':""}>→ הקודם</button><button class="btn" id="next">${si===Lz.story.length-1?"למונחים ←":"הבא ←"}</button></div></div>`;
  $("back").onclick=home;$("prev").onclick=()=>story(li,si-1);
  $("next").onclick=()=>si<Lz.story.length-1?story(li,si+1):terms(li);
}

function terms(li){
  const Lz=D.lessons[li];toTop();
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">→ לתפריט</button><span class="pill">שיעור ${li+1}: מונחים</span></div>
  <div class="panel"><h2>המונחים של השיעור</h2><p class="muted" style="margin:0">במבחן האמיתי תראה רק את המונח באנגלית. כדאי לזכור את שניהם.</p>
  ${Lz.terms.map(t=>`<div class="term"><span class="t-en">${t[0]}</span><span class="t-he">${t[1]}</span><p>${t[2]}</p></div>`).join("")}
  <div class="row"><button class="btn soft" id="again">→ חזרה לסיפור</button><button class="btn" id="go">בדיקה קטנה ←</button></div></div>`;
  $("back").onclick=home;$("again").onclick=()=>story(li,0);$("go").onclick=()=>checks(li,0,0);
}

function checks(li,k,right){
  const Lz=D.lessons[li],q=Lz.checks[k];toTop();
  const order=shuffle(q.o.map((o,i)=>i));
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">→ לתפריט</button><span class="pill">בדיקה ${k+1} / ${Lz.checks.length}</span></div>
  <div class="panel"><p class="q enq">${q.en}</p><p class="heq">${q.he}</p>
   <div class="opts">${order.map((oi,p)=>`<button class="opt" data-i="${p}"><span class="l">${L[p]}</span><span>${q.o[oi][0]}<span class="tr">${q.o[oi][1]}</span></span></button>`).join("")}</div>
   <p class="fb" id="fb"></p><button class="btn" id="go" hidden>${k===Lz.checks.length-1?"סיום השיעור ←":"הבא ←"}</button></div>`;
  $("back").onclick=home;let done=false;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;done=true;const ok=order[+b.dataset.i]===q.a;
    app.querySelectorAll(".opt").forEach(x=>{if(order[+x.dataset.i]===q.a)x.classList.add("ok")});if(!ok)b.classList.add("no");
    const f=$("fb");f.className="fb "+(ok?"ok":"no");f.textContent=(ok?"✓ נכון. ":"✗ לא נכון. ")+q.why;$("go").hidden=false;
    $("go").onclick=()=>{const r=right+(ok?1:0);k<Lz.checks.length-1?checks(li,k+1,r):lessonEnd(li,r)}});
}

function lessonEnd(li,r){
  S.done[D.lessons[li].id]=true;save();toTop();const nxt=li<D.lessons.length-1;
  app.innerHTML=`<div class="panel" style="text-align:center;align-items:center"><span class="eyebrow">שיעור ${li+1} הושלם</span><h2>${D.lessons[li].he}</h2>
  <p style="margin:0">ענית נכון על ${r} מתוך ${D.lessons[li].checks.length} בדיקות.</p>
  <div class="row" style="justify-content:center"><button class="btn soft" id="again">→ לחזור על השיעור</button><button class="btn" id="on">${nxt?"לשיעור הבא ←":"למבחן הפרק ←"}</button></div>
  <button class="btn soft" id="home">לתפריט</button></div>`;
  $("again").onclick=()=>story(li,0);$("home").onclick=home;$("on").onclick=()=>nxt?story(li+1,0):examIntro();
}

function examIntro(){
  toTop();
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">→ לתפריט</button><span class="pill">מבחן הפרק</span></div>
  <div class="panel"><h2>מבחן בסגנון FINRA</h2>
  <p style="margin:0">${D.exam.length} שאלות באנגלית, 4 תשובות לכל שאלה, תשובה נכונה אחת. סדר השאלות וסדר התשובות מתערבבים בכל פעם.</p>
  <p style="margin:0">כמו במבחן האמיתי: אין משוב באמצע. אפשר לחזור לשאלות ולשנות תשובה. בסוף תקבל ציון והסבר לכל שאלה. ציון עובר: 70%.</p>
  <p class="muted" style="margin:0">במבחן האמיתי יש בערך 79 שניות לשאלה. השעון כאן רק מראה כמה זמן עבר.</p>
  <button class="btn" id="start">התחל מבחן ←</button></div>`;
  $("back").onclick=home;$("start").onclick=exam;
}

function exam(){
  const Q=shuffle(D.exam.map((q,i)=>i)).map(i=>({i,ord:shuffle([0,1,2,3])}));const ans=new Array(Q.length).fill(null);let cur=0;const t0=Date.now();let tick;
  function draw(){
    const e=Q[cur],q=D.exam[e.i];toTop();
    const mm=()=>{const s=Math.floor((Date.now()-t0)/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`};
    app.innerHTML=`<div class="row"><span class="pill">שאלה ${cur+1} / ${Q.length}</span><span class="pill" id="clock">${mm()}</span><span class="pill">נענו ${ans.filter(x=>x!=null).length}</span></div>
    <div class="bar"><i style="width:${ans.filter(x=>x!=null).length/Q.length*100}%"></i></div>
    <div class="panel"><p class="q enq">${q.en}</p>
     <button class="btn soft" id="tr" style="align-self:flex-start">הצג תרגום לעברית</button><p class="heq" id="heq" hidden>${q.he}</p>
     <div class="opts">${e.ord.map((oi,p)=>`<button class="opt${ans[cur]===oi?" sel":""}" data-i="${p}"><span class="l">${L[p]}</span><span>${q.o[oi][0]}<span class="tr" hidden>${q.o[oi][1]}</span></span></button>`).join("")}</div>
     <div class="row"><button class="btn soft" id="prev" ${cur===0?"disabled":""}>→ הקודמת</button>${cur<Q.length-1?`<button class="btn" id="next">הבאה ←</button>`:`<button class="btn" id="fin">הגש מבחן</button>`}</div></div>
    <div class="panel"><span class="muted">מעבר מהיר בין שאלות</span><div class="grid">${Q.map((x,k)=>`<button class="dot${ans[k]!=null?" ans":""}${k===cur?" cur":""}" data-k="${k}">${k+1}</button>`).join("")}</div>
     <button class="btn soft" id="quit">יציאה בלי לשמור</button></div>`;
    clearInterval(tick);tick=setInterval(()=>{const c=$("clock");if(c)c.textContent=mm();else clearInterval(tick)},1000);
    $("tr").onclick=()=>{$("heq").hidden=!$("heq").hidden;app.querySelectorAll(".opt .tr").forEach(x=>x.hidden=$("heq").hidden);$("tr").textContent=$("heq").hidden?"הצג תרגום לעברית":"הסתר תרגום"};
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[cur]=e.ord[+b.dataset.i];app.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b));
      app.querySelectorAll(".dot")[cur].classList.add("ans");});
    app.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{cur=+b.dataset.k;draw()});
    $("prev").onclick=()=>{if(cur>0){cur--;draw()}};
    if($("next"))$("next").onclick=()=>{cur++;draw()};
    if($("fin"))$("fin").onclick=()=>{const left=ans.filter(x=>x==null).length;if(left&&!$("confirm")){$("fin").insertAdjacentHTML("beforebegin",`<p class="fb no" id="confirm">יש ${left} שאלות בלי תשובה. במבחן האמיתי אין עונש על ניחוש, אז כדאי לענות על הכל. לחץ שוב על "הגש" כדי להגיש בכל זאת.</p>`);return}clearInterval(tick);result(Q,ans,Date.now()-t0)};
    $("quit").onclick=()=>{clearInterval(tick);home()};
  }
  draw();
}

function result(Q,ans,ms){
  const right=Q.filter((e,k)=>ans[k]===D.exam[e.i].a).length,pct=Math.round(right/Q.length*100),pass=pct>=70;
  S.attempts++;if(S.best==null||pct>S.best)S.best=pct;save();toTop();
  const mins=Math.round(ms/60000);
  app.innerHTML=`<div class="panel"><span class="eyebrow">תוצאות המבחן</span>
   <div class="row" style="justify-content:flex-start;gap:14px;align-items:flex-end"><span class="big">${pct}%</span><span class="pill">${right} / ${Q.length} נכונות</span><span class="pill">${mins} דק'</span></div>
   <h2>${pass?"עברת את קו ה-70%.":"עוד לא. קו המעבר הוא 70%."}</h2>
   <p class="muted" style="margin:0">${pass?"כדי להיות בטוח במבחן האמיתי, כדאי להגיע ל-85% ומעלה באופן עקבי.":"עבור על ההסברים למטה, חזור על השיעורים הרלוונטיים, ונסה שוב. השאלות והתשובות יתערבבו מחדש."}</p>
   <div class="row"><button class="btn soft" id="home">לתפריט</button><button class="btn" id="again">מבחן חוזר</button></div></div>
  <div class="panel"><h3>סקירת כל השאלות</h3><div class="review">${Q.map((e,k)=>{const q=D.exam[e.i],ok=ans[k]===q.a;
    return `<div class="rv${ok?"":" wrong"}"><span>${ok?"✓":"✗"} <span class="en">${q.en}</span></span>
     ${ok?"":`<span class="muted">התשובה שלך: <span class="en">${ans[k]==null?"—":q.o[ans[k]][0]}</span></span>`}
     <span>התשובה הנכונה: <span class="en">${q.o[q.a][0]}</span></span><span>${q.why}</span></div>`}).join("")}</div></div>`;
  $("home").onclick=home;$("again").onclick=exam;
}

function glossary(){
  toTop();const all=D.lessons.flatMap((l,i)=>l.terms.map(t=>({t,i})));
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">→ לתפריט</button><span class="pill">${all.length} מונחים</span></div>
  <div class="panel"><h2>מילון מונחים</h2><input class="search" id="q" placeholder="חיפוש בעברית או באנגלית"><div id="list" style="display:flex;flex-direction:column;gap:8px"></div></div>`;
  const draw=f=>{$("list").innerHTML=all.filter(x=>!f||(x.t[0]+x.t[1]+x.t[2]).toLowerCase().includes(f.toLowerCase())).map(x=>`<div class="term"><span class="t-en">${x.t[0]}</span><span class="t-he">${x.t[1]} <span class="muted" style="font-weight:400;font-size:.85rem">(שיעור ${x.i+1})</span></span><p>${x.t[2]}</p></div>`).join("")||`<p class="muted">לא נמצא.</p>`};
  draw("");$("q").oninput=e=>draw(e.target.value);$("back").onclick=home;
}
home();
</script>
</body></html>
