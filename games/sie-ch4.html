<style>
/* Layout: a calm study desk. Home = chapter map; lesson = story slides, then glossary cards, then quick checks; exam = one question per screen, FINRA-like, review at the end. */
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#15212e; --muted:#5b6b7c; --line:#d9e1e8;
  --accent:#0f6b5c; --accent-soft:#dcefea; --navy:#1d3557; --gold:#8a5a12; --gold-soft:#fbf0dc;
  --good:#157347; --good-soft:#dcf3e6; --bad:#c2362f; --bad-soft:#fbe3e1; --on-accent:#fff; --edge:#7f8e9d;
  --he:"Heebo","Arial Hebrew",system-ui,sans-serif; --en:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1720; --card:#17222e; --ink:#e7eef5; --muted:#9fb0c1; --line:#2a3a4a;
  --accent:#4fc3a8; --accent-soft:#163a33; --navy:#9cc3f0; --gold:#e6b45a; --gold-soft:#3a2d14;
  --good:#4fd18b; --good-soft:#163a28; --bad:#ff7a72; --bad-soft:#47201e; --on-accent:#0b1f1a; --edge:#5b6e82; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--he);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.9rem;font-weight:800} h2{font-size:1.4rem;font-weight:800} h3{font-size:1.1rem;font-weight:700}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-weight:600}
.eyebrow{font-size:.85rem;font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.btn{font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--accent);color:var(--on-accent);font-size:1rem}
.btn.soft{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pill{font-size:.85rem;font-weight:700;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* home */
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:right;width:100%}
.lesson .n{font-family:var(--en);font-weight:600;color:var(--accent);font-size:1.2rem;text-align:center}
.lesson small{display:block;color:var(--muted);font-family:var(--en);direction:ltr;text-align:right}
.lesson .st{font-size:.85rem;font-weight:700;color:var(--muted)}
.lesson .st.done{color:var(--good)}
.cta{background:var(--navy);color:var(--bg)}
.cta .n,.cta small,.cta .st{color:var(--bg)}
/* slides */
.bars{display:flex;gap:4px}.bars i{flex:1;height:4px;border-radius:2px;background:var(--line)}.bars i.on{background:var(--accent)}
.story{font-size:1.08rem;min-height:180px}
.story b{color:var(--navy)}
.term{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.term .t-en{font-family:var(--en);direction:ltr;text-align:left;font-size:1.25rem;font-weight:600;color:var(--navy)}
.term .t-he{font-weight:800;font-size:1.05rem}
.term p{margin:0;color:var(--ink)}
/* questions */
.q{font-size:1.08rem;font-weight:600;margin:0}
.q.enq{font-family:var(--en);direction:ltr;text-align:left;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--edge);background:var(--card);border-radius:12px;padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline;text-align:left;direction:ltr;font-family:var(--en)}
.opt .l{font-weight:600;color:var(--accent);flex:none}
.opt .tr{display:block;direction:rtl;text-align:right;font-family:var(--he);color:var(--muted);font-size:.92rem;margin-top:2px}
.opt.sel{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:0;padding:10px 12px;border-radius:12px;font-weight:500}
.fb.ok{background:var(--good-soft)}.fb.no{background:var(--bad-soft)}
.fb:empty{padding:0;border:0;margin:0;min-height:0}
.heq{background:var(--gold-soft);border-radius:12px;padding:10px 12px;margin:0}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.dot{border:1px solid var(--edge);background:var(--card);border-radius:8px;padding:6px 0;font-family:var(--en);font-size:.85rem;cursor:pointer}
.dot.ans{background:var(--accent-soft)}.dot.cur{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.big{font-family:var(--en);font-size:3rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rv.wrong{border-color:var(--bad)}
.rv .en{font-weight:500}
.search{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--edge);background:var(--card);color:var(--ink);font:inherit}
/* v2: words, pronunciation, drills */
.story .en,.say{cursor:pointer;border-bottom:1.5px dotted var(--accent)}
.story .en::after{content:" 🔊";font-size:.85em}
.story .en.nospeak{border-bottom:0;cursor:default}.story .en.nospeak::after{content:none}
.story .en:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.opt.ok .l::after{content:" ✓"}.opt.no .l::after{content:" ✗"}
.fb .en,.heq .en{white-space:nowrap}
.en-block{display:block;font-family:var(--en);font-weight:600;direction:ltr;text-align:left}
.rv-en{margin:0;font-family:var(--en);direction:ltr;text-align:left;font-weight:500}
.rv-lab{font-size:.85rem;color:var(--muted);font-weight:700}
.lesson .h3{display:block;font-size:1.1rem;font-weight:700;line-height:1.25}
.panel:focus{outline:none}
h2.section{font-size:.95rem;font-weight:700;color:var(--muted);margin:6px 0 -2px}
@media (prefers-color-scheme:dark){.cta{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}.cta .n,.cta small,.cta .st{color:var(--ink)}}
.term .t-top{display:flex;align-items:center;gap:10px;direction:ltr;justify-content:flex-start}
.saybtn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);font-size:20px;cursor:pointer;line-height:1}
.term .t-en{font-size:1.45rem}
.t-pr{color:var(--muted);font-size:.95rem}
.t-def{margin:0;font-family:var(--en);direction:ltr;text-align:left;font-weight:500;background:var(--bg);border-radius:10px;padding:8px 10px}
.math{unicode-bidi:isolate;direction:ltr}.story .math,.fb .math{white-space:nowrap}h1[tabindex="-1"]:focus:not(:focus-visible){outline:none}.row .pill{white-space:normal;max-width:100%;overflow-wrap:anywhere}.dot{min-height:44px}
.story table,.grid4{border-collapse:collapse;width:100%;font-size:.9rem;margin:6px 0}.story th,.story td,.grid4 td{border:1px solid var(--edge);padding:6px;text-align:center;vertical-align:top;overflow-wrap:anywhere}.story table{table-layout:fixed}@media (max-width:360px){.story table{font-size:.8rem}.story th,.story td{padding:4px 2px}}.story th{font-weight:700}.grid4 td.hit{outline:3px solid var(--gold);font-weight:700}
body:not(.athome) .lib-back{display:none}.lib-back{min-height:44px;display:inline-flex;align-items:center}.math .mp{white-space:nowrap}
.lesson small:not([lang]){direction:rtl;font-family:var(--he)}
.term .t-hint{margin:0;font-size:.95rem;color:var(--gold)}
.opt.he{direction:rtl;text-align:right;font-family:var(--he)}
.bigterm{display:flex;align-items:center;gap:12px;direction:ltr;justify-content:center;font-family:var(--en);font-size:1.7rem;font-weight:600;color:var(--navy)}
.section{font-size:.95rem;font-weight:700;color:var(--muted);margin:6px 0 -2px}
.lesson .st.mid{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>const DATA={"id":"sie-ch4","section":"2.1.4","title":"Chapter 4: Packaged Products","heTitle":"פרק 4: מוצרים ארוזים (קרנות ואנונה)","lessons":[{"id":"l1","en":"What an investment company is","he":"מה זו חברת השקעות","story":[{"he":"100 שכנים רוצים להשקיע בבורסה, אבל לכל אחד יש רק 1,000 דולר, ואף אחד לא מבין במניות. הם שמים את הכסף בקופה אחת: 100,000 דולר. מנהל מקצועי קונה בכסף הזה עשרות מניות, וכל שכן מחזיק חלק מהקופה. זה הרעיון של <b>קרן</b>: הרבה משקיעים, כסף משותף, תיק אחד.<br>שים לב: המניות שהקרן קונה (למשל של Apple) הן התיק. מה שאתה מקבל הוא חלק בקופה עצמה, ובאנגלית גם הוא נקרא <span class=en>share</span>. כשכתוב כאן \"מניות הקרן\", הכוונה לחלק בקופה.","c":["S2","S17"]},{"he":"בשפה של החוק: <b>חברת השקעות</b> (<span class=en>investment company</span>) היא גוף שהעיסוק העיקרי שלו הוא להשקיע בניירות ערך. החוק שמסדיר אותן הוא ה-<span class=en>Investment Company Act of 1940</span>.","c":["S1"]},{"he":"למה זה טוב? 1) <b>ניהול מקצועי</b> (<span class=en>professional management</span>): מנהלים חוקרים, בוחרים ועוקבים אחרי המניות. 2) <b>פיזור</b> (<span class=en>diversification</span>): הכסף מפוזר על הרבה חברות וענפים, וזה יכול להקטין סיכון.","c":["S57","S58"]},{"he":"אבל: קרן <b>לא</b> מבוטחת ולא מובטחת על ידי ה-FDIC או גוף ממשלתי אחר. אפשר להפסיד חלק מהכסף או את כולו.","c":["S59","S60"]},{"he":"החוק מחלק חברות השקעות ל<b>שלושה סוגים</b>: 1) <span class=en>face-amount certificate company</span> (מנפיקה תעודות בסכום נקוב). 2) <span class=en>unit investment trust</span> (UIT, נכיר בשיעור 3). 3) <span class=en>management company</span> (חברת ניהול): כל מה שאינו אחד משני הראשונים.","c":["S3","S4","S5","S6"]},{"he":"חברות הניהול מתחלקות לשתיים: <b>פתוחה</b> (<span class=en>open-end</span>), שמנפיקה מניות שאפשר למכור לה בחזרה. זה השם המשפטי של <b>קרן נאמנות</b> (<span class=en>mutual fund</span>). ו<b>סגורה</b> (<span class=en>closed-end</span>): כל חברת ניהול שאינה פתוחה. <br>שים לב, יש שתי רשימות של \"שלוש\". בחוק: face-amount, UIT, management company. ה-SEC, לפי מה שמשקיע פוגש: mutual fund, closed-end fund, UIT. ה-SEC פשוט מפרקת את \"חברת ניהול\" לשני החלקים שלה.","c":["S9","S10","S11","S12"]},{"he":"מתי קרן נחשבת <b>מפוזרת</b> (<span class=en>diversified</span>)? כלל 75-5-10: לפחות 75% מהנכסים בנכסים מתאימים. בתוך ה-75% האלה: עד 5% מהנכסים במנפיק אחד, ועד 10% מהמניות עם זכות הצבעה של מנפיק אחד.","c":["S13","S14","S15"]}],"terms":[["Investment company","חברת השקעות","גוף שהעיסוק העיקרי שלו הוא להשקיע בניירות ערך, בכסף של הרבה משקיעים.",["S1","S2"]],["Mutual fund (open-end company)","קרן נאמנות (קרן פתוחה)","חברת ניהול שמנפיקה מניות שאפשר למכור לה בחזרה. open-end company הוא השם המשפטי.",["S9","S11"]],["Management company","חברת ניהול","הסוג הכללי בחוק: כל חברת השקעות שאינה UIT ואינה face-amount company. מתחלקת לפתוחה ולסגורה.",["S6","S9","S10"]],["Face-amount certificate company","חברת תעודות בסכום נקוב","אחד משלושת הסוגים בחוק. מנפיקה תעודות בסכום נקוב.",["S4","S5"]],["Diversified fund","קרן מפוזרת (75-5-10)","75% מהנכסים בנכסים מתאימים; בתוכם עד 5% במנפיק אחד ועד 10% מהמניות המצביעות שלו.",["S13","S14","S15"]],["Professional management","ניהול מקצועי","מנהלים מקצועיים חוקרים, בוחרים ועוקבים אחרי ניירות הערך בקרן.",["S57"]]],"checks":[{"en":"Which statement about mutual funds is TRUE?","he":"איזה משפט על קרנות נאמנות נכון?","o":[["Investors can lose money; funds are not FDIC insured","משקיעים יכולים להפסיד; הקרנות לא מבוטחות על ידי ה-FDIC"],["The FDIC insures them up to $250,000","ה-FDIC מבטח אותן עד 250,000 דולר"]],"a":0,"why":"קרן לא מבוטחת ולא מובטחת על ידי ה-FDIC, ואפשר להפסיד בה כסף.","c":["S59","S60"]},{"en":"Under the 1940 Act, a closed-end company is:","he":"לפי חוק 1940, חברה סגורה (closed-end) היא:","o":[["Any management company that is not open-end","כל חברת ניהול שאינה פתוחה"],["Any investment company that has no board","כל חברת השקעות שאין לה דירקטוריון"]],"a":0,"why":"החוק מגדיר closed-end ככל חברת ניהול שאינה open-end. UIT הוא סוג נפרד.","c":["S10","S4"]}]},{"id":"l2","en":"Open-end funds: buying, redeeming, NAV","he":"קרן פתוחה: קנייה, פדיון ו-NAV","story":[{"he":"ב<b>קרן פתוחה</b> (<span class=en>open-end fund</span>) קונים מניות <b>מהקרן עצמה</b> (או דרך מתווך). כשמגיע משקיע חדש, הקרן פשוט <b>יוצרת מניות חדשות</b> בשבילו. לכן אומרים שהיא בהנפקה מתמשכת (<span class=en>continuous offering</span>).","c":["S18","S19","S20"]},{"he":"וכשרוצים לצאת? לא מחפשים קונה בבורסה. <b>מוכרים את המניות בחזרה לקרן</b>. זה נקרא <b>פדיון</b> (<span class=en>redemption</span>), ומקבלים בערך את החלק היחסי שלך בנכסים נטו של הקרן.","c":["S21","S23"]},{"he":"באיזה מחיר? לפי <b>שווי הנכסים הנקי</b> (<span class=en>net asset value</span>, בקיצור <span class=en>NAV</span>). שלב 1: כל הנכסים של הקרן פחות כל ההתחייבויות. שלב 2: מחלקים במספר המניות. דוגמה: נכסים 100 מיליון, התחייבויות 10 מיליון: NAV של 90 מיליון. ואם יש 9 מיליון מניות: 90 ÷ 9 = <b>10</b> דולר למניה.","c":["S34","S35","S36","S37"]},{"he":"קונה משלם את ה-NAV למניה, <b>ועוד</b> עמלות שנגבות בקנייה, אם יש כאלה. על העמלות נלמד בשיעור 5.","c":["S22"]},{"he":"<b>זהירות, מלכודת לסוחרים:</b> במניה רגילה מקבלים את המחיר של הרגע. בקרן פתוחה לא. לפי כלל 22c-1 של ה-SEC, ההוראה מקבלת את ה-NAV <b>הבא</b> שיחושב <b>אחרי</b> שההוראה התקבלה. זה נקרא <b>תמחור קדימה</b> (<span class=en>forward pricing</span>). כלומר: כשאתה נותן הוראה, אתה עוד לא יודע באיזה מחיר תקבל.","c":["S24","S25","S26"]},{"he":"דוגמה: רינה נותנת הוראת קנייה ב-11:00 בבוקר. רוב הקרנות מחשבות NAV פעם ביום, כשהבורסות נסגרות ב-4 אחר הצהריים (שעון החוף המזרחי). לכן רינה מקבלת את המחיר של 4 אחר הצהריים של אותו יום. מחיר \"של 11:00\" פשוט לא קיים בקרן. החוק עצמו דורש חישוב <b>לפחות</b> פעם ביום, בשעות שקובע הדירקטוריון.","c":["S27","S28","S29","S31"]},{"he":"ומתי מקבלים את הכסף בפדיון? הקרן חייבת לשלם <b>תוך שבעה ימים</b>. החוק אוסר לדחות את התשלום ליותר מזה, חוץ ממקרים חריגים שהחוק מגדיר.","c":["S32","S33"]}],"terms":[["Open-end fund","קרן פתוחה","קונים ממנה ומוכרים לה בחזרה. יוצרת מניות חדשות לפי הביקוש.",["S9","S19","S20","S21"]],["Net asset value (NAV)","שווי נכסים נקי (NAV)","(נכסים − התחייבויות) ÷ מספר המניות. המחיר הבסיסי של מניה בקרן.",["S34","S35"]],["Redemption","פדיון","מכירת מניות הקרן בחזרה לקרן, בתמורה לחלק היחסי בנכסים נטו.",["S21","S23"]],["Forward pricing","תמחור קדימה","ההוראה מקבלת את ה-NAV הבא שיחושב אחרי קבלתה (כלל 22c-1).",["S24","S25","S26"]],["Continuous offering","הנפקה מתמשכת","הקרן מנפיקה מניות חדשות כל הזמן, לכל משקיע חדש.",["S19","S20"]],["Seven-day payment rule","תשלום תוך 7 ימים","בפדיון, הקרן חייבת לשלם תוך שבעה ימים (חוץ מחריגים בחוק).",["S32","S33"]]],"checks":[{"en":"An investor places an order to buy mutual fund shares at 10:30 a.m. The price will be:","he":"משקיע נותן הוראה לקנות מניות של קרן נאמנות ב-10:30 בבוקר. המחיר יהיה:","o":[["The next NAV computed after the order","ה-NAV הבא שיחושב אחרי ההוראה"],["The NAV computed the previous day","ה-NAV שחושב ביום הקודם"]],"a":0,"why":"תמחור קדימה: ההוראה מקבלת את ה-NAV הבא שיחושב אחרי קבלתה.","c":["S25"]},{"en":"A fund has assets of $63 million, liabilities of $5 million and 8 million shares. What is the NAV per share?","he":"לקרן נכסים של 63 מיליון דולר, התחייבויות של 5 מיליון ו-8 מיליון מניות. מה ה-NAV למניה?","o":[["$7.88","7.88 דולר"],["$7.25","7.25 דולר"]],"a":1,"why":"(63 − 5) ÷ 8 = 58 ÷ 8 = 7.25. אסור לשכוח להוריד את ההתחייבויות (63 ÷ 8 = 7.88).","c":["S34","S35"]}]},{"id":"l3","en":"Closed-end funds and UITs","he":"קרן סגורה ו-UIT","story":[{"he":"<b>קרן סגורה</b> (<span class=en>closed-end fund</span>) עובדת אחרת. היא מוכרת <b>מספר קבוע</b> של מניות פעם אחת, בהנפקה ראשונית (<span class=en>IPO</span>). אחרי זה היא לא ממשיכה למכור מניות חדשות.","c":["S39","S40","S41"]},{"he":"מי שרוצה לקנות אחר כך קונה <b>ממשקיע אחר בבורסה</b>, במחיר שוק, כמו מניה רגילה. את המחיר קובעים היצע וביקוש. והקרן <b>לא חייבת</b> לקנות בחזרה מניות מהמשקיעים.","c":["S42","S43","S47"]},{"he":"לכן המחיר בבורסה יכול להיות שונה מה-NAV. דוגמה: NAV של 20 דולר, והמניה נסחרת ב-18. היא נסחרת ב<b>דיסקאונט</b> (<span class=en>discount</span>) של 2 דולר. אם הייתה נסחרת ב-21, זו <b>פרמיה</b> (<span class=en>premium</span>) של 1 דולר. לאורך השנים רוב הקרנות הסגורות נסחרו בדיסקאונט, וחלק בפרמיה.","c":["S44","S45","S46"]},{"he":"עוד שני דברים על קרן סגורה: היא <b>לא חייבת</b> לחשב NAV כל יום כמו קרן פתוחה. והיא יכולה להשתמש ב<b>מינוף</b> (<span class=en>leverage</span>) יותר משאר סוגי הקרנות.","c":["S38","S49"]},{"he":"<b>UIT</b> (<span class=en>unit investment trust</span>, נאמנות יחידות) היא \"סל סגור עם תאריך סיום\". היא מוכרת מספר קבוע של <b>יחידות</b> (<span class=en>units</span>) פעם אחת, והיחידות <b>ניתנות לפדיון</b>: ה-UIT קונה אותן בחזרה בערך לפי ה-NAV.","c":["S50","S51","S8"]},{"he":"הסל של UIT כמעט לא משתנה: היא <b>לא סוחרת באופן פעיל</b>. אין לה דירקטוריון, אין נושאי משרה, ואין יועץ השקעות. היא מסתיימת ב<b>תאריך שנקבע מראש</b>: אז מוכרים את מה שנשאר ומחלקים את הכסף למשקיעים.","c":["S52","S53","S54","S55","S7"]},{"he":"<b>השוואה בין השלושה:</b><table><tr><th></th><th>קרן פתוחה</th><th>קרן סגורה</th><th>UIT</th></tr><tr><th>קונים מ</th><td>הקרן</td><td>משקיע אחר בבורסה (אחרי ה-IPO)</td><td>ההנפקה החד-פעמית</td></tr><tr><th>מוכרים ל</th><td>הקרן (פדיון)</td><td>משקיע אחר בבורסה</td><td>ה-UIT (פדיון)</td></tr><tr><th>מחיר</th><td>NAV הבא</td><td>היצע וביקוש</td><td>בערך NAV</td></tr><tr><th>מניות חדשות</th><td>כל הזמן</td><td>לא</td><td>לא</td></tr><tr><th>סוף</th><td>אין</td><td>אין</td><td>תאריך קבוע</td></tr><tr><th>יועץ השקעות</th><td>יש</td><td>יש</td><td>אין</td></tr></table>","c":["S19","S21","S25","S39","S42","S43","S50","S51","S52","S55","S16","S48"]}],"terms":[["Closed-end fund","קרן סגורה","מוכרת מספר קבוע של מניות ב-IPO. אחר כך המניות נסחרות בבורסה במחיר שוק.",["S39","S40","S42"]],["Premium / discount to NAV","פרמיה / דיסקאונט ביחס ל-NAV","מחיר שוק מעל ה-NAV = פרמיה. מתחת = דיסקאונט. קורה בקרנות סגורות.",["S44","S45","S46"]],["Unit investment trust (UIT)","נאמנות יחידות (UIT)","מוכרת מספר קבוע של יחידות פעם אחת. היחידות ניתנות לפדיון. אין ניהול פעיל ואין דירקטוריון.",["S50","S51","S54","S55"]],["Termination date","תאריך סיום","ה-UIT מסתיימת בתאריך שנקבע כשנוצרה. מוכרים את הנכסים ומחלקים את הכסף.",["S52","S53"]],["Leverage (closed-end funds)","מינוף (בקרנות סגורות)","קרנות סגורות יכולות להשתמש במינוף יותר משאר סוגי חברות ההשקעות.",["S49"]]],"checks":[{"en":"An investor wants to sell shares of a closed-end fund. She will MOST likely:","he":"משקיעה רוצה למכור מניות של קרן סגורה. ככל הנראה היא:","o":[["Redeem them with the fund at the next NAV","תפדה אותן מול הקרן לפי ה-NAV הבא"],["Sell them on an exchange at the market price","תמכור אותן בבורסה במחיר השוק"]],"a":1,"why":"קרן סגורה לא חייבת לקנות בחזרה מניות. המניות נסחרות בבורסה במחיר שקובעים היצע וביקוש.","c":["S42","S43","S47"]},{"en":"Which investment company has no board of directors and ends on a set date?","he":"לאיזו חברת השקעות אין דירקטוריון, והיא מסתיימת בתאריך קבוע?","o":[["A closed-end fund","קרן סגורה"],["A unit investment trust","נאמנות יחידות (UIT)"]],"a":1,"why":"ל-UIT אין דירקטוריון והיא מסתיימת בתאריך שנקבע כשנוצרה.","c":["S7","S52"]}]},{"id":"l4","en":"Who runs a fund, and what it must disclose","he":"מי מפעיל קרן, ומה היא חייבת לגלות","story":[{"he":"מאחורי קרן יש כמה גופים, וכל אחד עם תפקיד. נתחיל ב<b>דירקטוריון</b> (<span class=en>board of directors</span>). לפי החוק, עד 60% מחבריו יכולים להיות \"בעלי עניין\" (<span class=en>interested persons</span>). כלומר לפחות 40% חייבים להיות בלי קשר כזה.","c":["S61","S62"]},{"he":"<b>יועץ ההשקעות</b> (<span class=en>investment adviser</span>) מנהל את ההשקעות לפי המטרות והמדיניות של הקרן. הוא רשום ב-SEC. בקרן פתוחה וגם בקרן סגורה יש יועץ כזה.","c":["S16","S63","S48"]},{"he":"נעקוב אחרי 1,000 הדולר שלך. 1) <b>החתם הראשי</b> (<span class=en>principal underwriter</span>) קונה מניות מהקרן ומפיץ אותן למשקיעים. 2) <b>סוכן ההעברות</b> (<span class=en>transfer agent</span>) רושם אותך ברשימת בעלי המניות ושולח לך דיבידנדים. 3) הקרן קונה ניירות ערך בכסף. מי שומר אותם? <b>המשמורן</b> (<span class=en>custodian</span>), למשל בנק. כמו כספת.","c":["S64","S66","S67","S65"]},{"he":"מה הקרן חייבת לתת למשקיעים? <b>תשקיף</b> (<span class=en>prospectus</span>). יש גרסה מלאה (<span class=en>statutory prospectus</span>), ויש <b>תשקיף מקוצר</b> (<span class=en>summary prospectus</span>) של כמה עמודים עם המידע החשוב. אותו מידע חשוב מופיע גם בתחילת התשקיף המלא, והמסמכים זמינים בחינם באתר שמופיע בעמוד השער.","c":["S68","S69","S70","S71","S74"]},{"he":"חלק חובה בתשקיף הוא <b>טבלת העמלות</b> (<span class=en>fee table</span>). יש בה שני חלקים: עמלות שהמשקיע משלם ישירות (כמו דמי מכירה), והוצאות שנתיות שהקרן משלמת מהנכסים שלה. על שניהם נלמד בהמשך.","c":["S72","S78","S79","S80","T45"]},{"he":"מי שרוצה יותר פרטים מבקש את ה-<b>SAI</b> (<span class=en>Statement of Additional Information</span>): מסמך שמסביר את פעילות הקרן בפירוט רב יותר מהתשקיף. הקרן חייבת לתת אותו <b>בחינם</b> לפי בקשה. בנוסף, הקרן שולחת <b>דוחות למחזיקים</b> (<span class=en>shareholder reports</span>) פעמיים בשנה: שנתי וחצי-שנתי.","c":["S75","S76","S77"]}],"terms":[["Board of directors","דירקטוריון","עד 60% מחבריו יכולים להיות בעלי עניין. לפחות 40% בלי קשר כזה.",["S61","S62"]],["Investment adviser","יועץ השקעות","מנהל את השקעות הקרן לפי המטרות והמדיניות שלה. רשום ב-SEC.",["S16","S63"]],["Custodian","משמורן","מחזיק את ניירות הערך של הקרן, למשל בנק.",["S64"]],["Transfer agent","סוכן העברות","מנהל את רשימת בעלי המניות, רושם העברות ומחלק דיבידנדים.",["S66","S67"]],["Principal underwriter","חתם ראשי","קונה מניות מהקרן כדי להפיץ אותן למשקיעים.",["S65"]],["Prospectus / summary prospectus","תשקיף / תשקיף מקוצר","המסמך שכל קרן חייבת לתת. המקוצר: כמה עמודים עם המידע החשוב, כולל טבלת העמלות.",["S68","S69","S72"]],["Statement of Additional Information (SAI)","מסמך מידע נוסף (SAI)","מסביר את פעילות הקרן בפירוט רב יותר מהתשקיף. ניתן בחינם לפי בקשה.",["S75","S76"]],["Shareholder reports","דוחות למחזיקים","דוח שנתי ודוח חצי-שנתי שהקרן שולחת.",["S77"]]],"checks":[{"en":"Which document explains a fund's operations in more detail than the prospectus and is free on request?","he":"איזה מסמך מסביר את פעילות הקרן בפירוט רב יותר מהתשקיף, וניתן בחינם לפי בקשה?","o":[["The annual shareholder report","הדוח השנתי למחזיקים"],["The SAI","ה-SAI"]],"a":1,"why":"ה-SAI מפרט יותר מהתשקיף, והקרן חייבת לתת אותו בחינם לפי בקשה.","c":["S75","S76"]},{"en":"What is the minimum share of a fund's board that must NOT be interested persons?","he":"מה החלק המינימלי של הדירקטוריון שחייב להיות בלי עניין?","o":[["40%","40%"],["60%","60%"]],"a":0,"why":"עד 60% יכולים להיות בעלי עניין, ולכן לפחות 40% חייבים להיות בלי עניין.","c":["S61","S62"]}]},{"id":"l5","en":"Sales charges: NAV, POP and loads","he":"דמי מכירה: NAV, POP ו-load","story":[{"he":"הרבה קרנות גובות <b>דמי מכירה</b> (<span class=en>sales load</span>, או <span class=en>sales charge</span>). זה כמו עמלה. אפשר לשלם אותה בקנייה, או כשמוכרים בחזרה לקרן.","c":["T1","S81"]},{"he":"<b>דמי מכירה בכניסה</b> (<span class=en>front-end load</span>) יורדים מהכסף שמשקיעים, ולכן פחות כסף קונה מניות. הם מחושבים כאחוז ממחיר המכירה, והולכים לברוקר. דוגמה של ה-SEC: צ'ק של 10,000 דולר ודמי מכירה של 500 דולר. שלב 1: 10,000 − 500 = <b>9,500</b> דולר מושקעים בפועל. שלב 2: 500 ÷ 10,000 = 5% ממה ששולם.","c":["T2","T3","T4","T5","T6"]},{"he":"מחיר הקנייה של מניה בקרן עם דמי כניסה נקרא <b>מחיר ההצעה לציבור</b> (<span class=en>public offering price</span>, בקיצור <span class=en>POP</span>). <b>POP = NAV + דמי המכירה</b>.","c":["T65","S83"]},{"he":"מלכודת: האחוז של דמי המכירה מחושב מה-<b>POP</b>, כלומר ממה שאתה משלם. דוגמה קטנה: שילמת 100 דולר (POP), ודמי המכירה 5%. שלב 1: 5% מ-100 הם 5 דולר. שלב 2: נשארו 95, וזה ה-NAV. כלומר NAV הוא 95% מה-POP.<br>עכשיו הפוך: NAV של 38 דולר. שלב 1: 38 ÷ 0.95 = 40. זה ה-POP. למה לא 38 × 1.05 = 39.90? כי אז דמי המכירה (1.90) הם 5% מה-NAV, לא מה-POP.<br>כלל: נתון כמה שילמת? מכפילים באחוז ומחסירים. נתון NAV ומחפשים POP? מחלקים ב-(1 פחות האחוז). דוגמה נוספת מהמקורות: NAV של 10 דולר ו-5%: 10 ÷ 0.95 = 10.53.","c":["S84","T67","T68","T5"]},{"he":"כמה מותר לגבות? לפי כלל 2341 של FINRA: דמי כניסה ויציאה יחד לא יעלו על <b>8.5% ממחיר ההצעה</b>. במקרים מסוימים התקרה נמוכה יותר.","c":["T39","T40"]},{"he":"<b>דמי מכירה ביציאה</b> (<span class=en>back-end load</span>) משולמים כשמוכרים בחזרה לקרן. הסוג הנפוץ: <b>CDSC</b> (<span class=en>contingent deferred sales charge</span>). \"מותנה\" כי הוא תלוי בכמה זמן מחזיקים: הוא <b>יורד</b> עם השנים, ויכול להגיע לאפס.","c":["T7","T8","T9"]},{"he":"לא לבלבל: <b>עמלת פדיון</b> (<span class=en>redemption fee</span>) היא משהו אחר. השם \"עמלת פדיון\" שמור בפרק הזה רק לה. היא הולכת <b>לקרן</b> עצמה, לא לברוקר. ה-SEC מגבילה אותה בדרך כלל ל-2%.","c":["T49","T50"]}],"terms":[["Sales load (sales charge)","דמי מכירה","עמלה שמשלמים בקנייה (front-end) או במכירה לקרן (back-end). דומה לעמלת ברוקר.",["T1","S81"]],["Front-end load","דמי מכירה בכניסה","יורדים מהסכום שמשקיעים, כאחוז ממחיר המכירה. הולכים לברוקר.",["T2","T3","T4"]],["Public offering price (POP)","מחיר ההצעה לציבור (POP)","NAV + דמי המכירה. האחוז של דמי המכירה מחושב מה-POP.",["T65","S83","S84"]],["Maximum sales charge","תקרת דמי מכירה (8.5%)","כלל 2341 של FINRA: דמי כניסה ויציאה יחד עד 8.5% ממחיר ההצעה. במקרים מסוימים נמוך יותר.",["T39","T40"]],["Back-end load (CDSC)","דמי מכירה ביציאה (CDSC)","משולמים כשמוכרים לקרן. יורדים ככל שמחזיקים יותר זמן, ויכולים להגיע לאפס.",["T7","T8","T9"]],["Redemption fee","עמלת פדיון","עמלה במכירה לקרן שהולכת לקרן עצמה, לא לברוקר. בדרך כלל עד 2%.",["T49","T50"]]],"checks":[{"en":"A fund's front-end load is stated as a percentage of:","he":"דמי המכירה בכניסה של קרן מחושבים כאחוז מ:","o":[["The net asset value","שווי הנכסים הנקי (NAV)"],["The public offering price","מחיר ההצעה לציבור (POP)"]],"a":1,"why":"האחוז מחושב ממחיר ההצעה (POP), ולכן מחלקים את ה-NAV ב-(1 פחות האחוז) כדי לקבל POP.","c":["S84","T39"]},{"en":"How does a redemption fee differ from a back-end load?","he":"במה עמלת פדיון שונה מדמי מכירה ביציאה?","o":[["It is paid to the broker, not to the fund","היא משולמת לברוקר, לא לקרן"],["It is paid to the fund, not to a broker","היא משולמת לקרן, לא לברוקר"]],"a":1,"why":"עמלת פדיון הולכת לקרן. דמי מכירה ביציאה מתגמלים ברוקר.","c":["T49"]}]},{"id":"l6","en":"Share classes A, B and C, and 12b-1 fees","he":"סוגי מניות A, B, C ודמי 12b-1","story":[{"he":"הרבה קרנות מציעות כמה <b>סוגי מניות</b> (<span class=en>share classes</span>). כולם משקיעים <b>באותו תיק בדיוק</b>. ההבדל רק בעמלות, ולכן גם התשואה נטו יכולה להיות שונה.","c":["T11","T12"]},{"he":"לפני שנכיר את הסוגים, מושג אחד: <b>12b-1</b> (זה פשוט מספר הכלל של ה-SEC). זו עמלה שנתית שהקרן משלמת <b>מהנכסים שלה</b> על <b>הפצה</b> (<span class=en>distribution</span>), כלומר שיווק ומכירה (למשל תגמול לברוקרים ופרסום), ולפעמים גם על שירות למשקיעים. לפי FINRA: עד 0.75% בשנה על הפצה, ועוד עד 0.25% על שירות. יחד עד 1%.","c":["T30","T31","T32","T35","T36","T37"]},{"he":"<b>Class A</b>: משלמים דמי מכירה <b>בכניסה</b>. בסכומים גדולים מקבלים הנחה (<span class=en>breakpoint</span>, בשיעור הבא). ודמי ה-12b-1 השנתיים בדרך כלל נמוכים יותר משל B ו-C.","c":["T13","T14","T15"]},{"he":"<b>Class B</b>: אין דמי כניסה, אבל יש <b>CDSC</b> ביציאה שיורד עם השנים עד שנעלם, ודמי 12b-1 גבוהים יותר. בדרך כלל, אחרי שה-CDSC נעלם, המניות <b>מומרות ל-Class A</b> הזול יותר. היום Class B כבר לא נפוץ.","c":["T16","T17","T19","T20","T18"]},{"he":"<b>Class C</b>: \"עמלה שנתית אחידה\" (<span class=en>level load</span>): משלמים <b>כל שנה</b> שמחזיקים. דמי ה-12b-1 בדרך כלל הכי גבוהים, ויש לעתים CDSC קטן אם מוכרים תוך זמן קצר, בדרך כלל שנה. בדרך כלל C לא מומר ל-A.","c":["T21","T22","T24","T25","T26"]},{"he":"איך בוחרים? לפי <b>כמה משקיעים</b> ו<b>כמה זמן מחזיקים</b>. FINRA: Class C יכול להיות זול יותר מ-A או B לטווח קצר, ויקר יותר אם מחזיקים הרבה זמן. דוגמה מומצאת, בלי צמיחה: משקיעים 10,000 דולר. A: דמי כניסה 5% (500 פעם אחת) ועוד 0.25% בשנה (25). C: בלי דמי כניסה, 1% בשנה (100). אחרי שנה: A עלה 525, C עלה 100. אחרי 8 שנים: A עלה 500 + 8 × 25 = 700, C עלה 8 × 100 = 800. למה? ב-A משלמים הרבה פעם אחת, ב-C מעט כל שנה, וזה מצטבר.","c":["T27","T70","T71"]},{"he":"<b>השוואה בין הסוגים:</b><table><tr><th></th><th>Class A</th><th>Class B</th><th>Class C</th></tr><tr><th>מתי משלמים</th><td>בכניסה</td><td>ביציאה (CDSC)</td><td>כל שנה</td></tr><tr><th>12b-1</th><td>נמוך</td><td>גבוה</td><td>הכי גבוה (בדרך כלל)</td></tr><tr><th>CDSC</th><td>בדרך כלל אין</td><td>יורד עם השנים</td><td>קטן, כשנה</td></tr><tr><th>הופך ל-A</th><td>-</td><td>בדרך כלל כן</td><td>בדרך כלל לא</td></tr><tr><th>מתאים ל</th><td>סכום גדול, זמן ארוך</td><td>כבר לא נפוץ</td><td>זמן קצר</td></tr></table>","c":["T13","T15","T16","T17","T19","T20","T22","T24","T25","T70"]},{"he":"ומה זה <b>קרן ללא עמלה</b> (<span class=en>no-load</span>)? אין לה דמי כניסה ואין דמי יציאה, ודמי ה-12b-1 שלה לא עולים על 0.25%. אבל \"ללא עמלת מכירה\" לא אומר \"ללא עמלות בכלל\": יש עדיין הוצאות שנתיות.","c":["T38","T29","T28"]}],"terms":[["Share classes","סוגי מניות","אותו תיק, עמלות שונות. לכן התשואה נטו יכולה להיות שונה.",["T11","T12"]],["Class A shares","מניות Class A","דמי מכירה בכניסה, הנחות בסכומים גדולים, 12b-1 נמוך יחסית.",["T13","T14","T15"]],["Class B shares","מניות Class B","בלי דמי כניסה; CDSC שיורד עם השנים; 12b-1 גבוה יותר; בדרך כלל מומרות ל-A. כבר לא נפוצות.",["T16","T17","T19","T20","T18"]],["Class C shares (level load)","מניות Class C (עמלה שנתית אחידה)","עמלה כל שנה; 12b-1 גבוה; CDSC קטן אם מוכרים תוך כשנה; בדרך כלל לא מומרות.",["T21","T22","T24","T25","T26"]],["12b-1 fee","דמי 12b-1","עמלה שנתית מנכסי הקרן לשיווק ומכירה, ולפעמים לשירות. לפי FINRA עד 0.75% + 0.25%.",["T30","T35","T36","T37"]],["No-load fund","קרן ללא עמלה","בלי דמי כניסה ויציאה, ו-12b-1 עד 0.25%. עדיין יש הוצאות שנתיות.",["T38","T29"]]],"checks":[{"en":"Which share class typically has a front-end sales load?","he":"לאיזה סוג מניות יש בדרך כלל דמי מכירה בכניסה?","o":[["Class A","Class A"],["Class C","Class C"]],"a":0,"why":"A: בכניסה. C: עמלה כל שנה (level load).","c":["T13","T26"]},{"en":"Under FINRA rules, the maximum service fee within 12b-1 charges is:","he":"לפי כללי FINRA, התקרה לדמי השירות בתוך עמלת 12b-1 היא:","o":[["0.25% per year","0.25% בשנה"],["0.75% per year","0.75% בשנה"]],"a":0,"why":"שירות עד 0.25%. הפצה (asset-based sales charge) עד 0.75%.","c":["T35","T36"]}]},{"id":"l7","en":"Breakpoints, rights of accumulation, letters of intent","he":"הנחות: breakpoint, ROA ו-LOI","story":[{"he":"ב-Class A יש <b>הנחת כמות</b>: ככל שמשקיעים יותר, אחוז דמי הכניסה יורד. רמות ההשקעה שבהן ההנחה מתחילה נקראות <b>breakpoints</b>. כל חברת קרנות קובעת את הרמות שלה, והיא לא חייבת להציע אותן בכלל.","c":["T55","T56","T57"]},{"he":"דוגמה (טבלה מומצאת להמחשה, כל קרן קובעת לעצמה): עד 50,000 דולר: 5%. מ-50,000: 4%. מ-100,000: 3%. דנה רוצה להשקיע 48,000. היא קרובה מאוד ל-breakpoint.","c":["T55","T57"]},{"he":"<b>זכות צבירה</b> (<span class=en>right of accumulation</span>, בקיצור <span class=en>ROA</span>): אפשר לספור לטובת ה-breakpoint גם את מה שכבר מחזיקים: השקעות קודמות בקרן, חשבונות אחרים כמו IRA, ולפעמים גם של בני משפחה (למשל בן זוג או ילדים). אם לדנה כבר יש 10,000 בקרן: 48,000 + 10,000 = 58,000, והיא בדרגה של 4%.","c":["T58","T59"]},{"he":"<b>מכתב כוונות</b> (<span class=en>letter of intent</span>, בקיצור <span class=en>LOI</span>): מתחייבים להשקיע סכום מסוים בתקופה, בדרך כלל <b>13 חודשים</b>, ומקבלים את ההנחה <b>כבר עכשיו</b>. דוגמה לפי הטבלה המומצאת: יוסי חותם שישקיע 50,000 בתוך 13 חודשים, ומשלם 4% כבר על הקנייה הראשונה. ואם לא עומדים ביעד? הקרן יכולה לגבות בדיעבד את דמי המכירה הגבוהים, לפי מה שהושקע בפועל.","c":["T60","T61"]},{"he":"ROA מול LOI: ROA מסתכל <b>אחורה</b> (מה כבר יש לך). LOI מסתכל <b>קדימה</b> (מה אתה מתחייב להשקיע).","c":["T58","T60"]},{"he":"מה הברוקר חייב? לתת ללקוח <b>כל הנחה</b> שמגיעה לו, ולא לסמוך על חברת הקרנות שתעשה את זה. ואסור לו למכור בכוונה סכום <b>קצת מתחת</b> ל-breakpoint כדי לקבל עמלה גבוהה יותר. זה נקרא <b>breakpoint sales</b>, וכלל 2342 של FINRA אוסר אותו.","c":["T63","T64"]}],"terms":[["Breakpoint","breakpoint (מדרגת הנחה)","רמת השקעה שממנה אחוז דמי הכניסה יורד. כל קרן קובעת את הרמות.",["T55","T56","T57"]],["Right of accumulation (ROA)","זכות צבירה (ROA)","סופרים לטובת ה-breakpoint גם השקעות קיימות, ולפעמים של בני משפחה.",["T58","T59"]],["Letter of intent (LOI)","מכתב כוונות (LOI)","מתחייבים להשקיע סכום בתקופה, בדרך כלל 13 חודשים, ומקבלים את ההנחה עכשיו.",["T60","T61"]],["Breakpoint sales","מכירה מתחת ל-breakpoint","מכירה בכוונה של סכום קצת מתחת ל-breakpoint כדי לגבות עמלה גבוהה יותר. אסורה (כלל 2342).",["T64"]]],"checks":[{"en":"An investor signs a letter of intent but does not invest the full amount within the period. What MOST likely happens?","he":"משקיע חותם על מכתב כוונות, אבל לא משקיע את כל הסכום בתקופה. מה ככל הנראה קורה?","o":[["The higher sales charge may be collected on what was invested","דמי המכירה הגבוהים עשויים להיגבות לפי מה שהושקע"],["The discount stays, but the letter is cancelled","ההנחה נשארת, אבל המכתב מבוטל"]],"a":0,"why":"אם לא עומדים ביעד, הקרן יכולה לגבות בדיעבד את דמי המכירה הנכונים לפי הסכום שהושקע.","c":["T61"]},{"en":"Counting what an investor already owns in a fund family toward a sales-charge discount is called:","he":"ספירת מה שמשקיע כבר מחזיק במשפחת קרנות לטובת הנחה בדמי המכירה נקראת:","o":[["Letter of intent","מכתב כוונות (LOI)"],["Right of accumulation","זכות צבירה (ROA)"]],"a":1,"why":"ROA מסתכל על מה שכבר יש. LOI הוא התחייבות להשקעה עתידית.","c":["T58","T60"]}]},{"id":"l8","en":"Ongoing costs and exchanges","he":"עלויות שוטפות והחלפה בין קרנות","story":[{"he":"טבלת העמלות בתשקיף מחולקת לשניים. 1) <b>עמלות שהמשקיע משלם ישירות</b> (<span class=en>shareholder fees</span>): דמי מכירה, עמלת פדיון, עמלת החלפה. 2) <b>הוצאות שנתיות של הקרן</b> (<span class=en>annual fund operating expenses</span>): הקרן משלמת אותן מהנכסים שלה, וזה מוריד את שווי הקרן.","c":["T45","T46","T47"]},{"he":"מה יש בהוצאות השנתיות? <b>דמי ניהול</b> (<span class=en>management fee</span>) ליועץ ההשקעות; דמי <b>12b-1</b>; ו<b>הוצאות אחרות</b> (<span class=en>other expenses</span>), כל מה שאינו שני אלה.","c":["T42","T43","T48"]},{"he":"כל ההוצאות השנתיות יחד, כאחוז מהנכסים הממוצעים, נקראות <b>יחס הוצאות</b> (<span class=en>expense ratio</span>). דוגמה: יחס הוצאות של 0.80% על השקעה של 20,000 דולר. שלב 1: 0.80% = 0.008. שלב 2: 20,000 × 0.008 = <b>160</b> דולר בשנה. את זה לא רואים כחיוב, כי זה יורד מתוך שווי הקרן.","c":["T44","T47"]},{"he":"ומה אם רוצים לעבור לקרן אחרת? הרבה חברות קרנות מאפשרות <b>החלפה</b> (<span class=en>exchange privilege</span>) בין קרנות <b>באותה משפחה</b>: מוכרים אחת וקונים אחרת, בדרך כלל בלי דמי מכירה חדשים. חלק מהקרנות גובות <b>עמלת החלפה</b> (<span class=en>exchange fee</span>), אבל רובן לא.","c":["T52","T53","T54"]},{"he":"<b>כל העמלות של הפרק בטבלה אחת:</b><table><tr><th></th><th>מי משלם</th><th>מתי</th><th>לאן הולך</th></tr><tr><th>front-end load</th><td>המשקיע</td><td>בקנייה</td><td>ברוקר</td></tr><tr><th>CDSC</th><td>המשקיע</td><td>במכירה לקרן</td><td>ברוקר</td></tr><tr><th>redemption fee</th><td>המשקיע</td><td>במכירה לקרן</td><td>הקרן</td></tr><tr><th>12b-1</th><td>הקרן, מהנכסים</td><td>כל שנה</td><td>הפצה ושירות</td></tr><tr><th>management fee</th><td>הקרן, מהנכסים</td><td>כל שנה</td><td>יועץ ההשקעות</td></tr><tr><th>exchange fee</th><td>המשקיע</td><td>בהחלפה (אם יש)</td><td>הקרן</td></tr></table>","c":["T4","T7","T49","T30","T42","T52"]}],"terms":[["Shareholder fees vs. operating expenses","עמלות משקיע מול הוצאות שנתיות","הראשונות נגבות ישירות מהמשקיע (כמו דמי מכירה). השניות משולמות מנכסי הקרן כל שנה.",["T45","T46","T47"]],["Management fee","דמי ניהול","משולמים מנכסי הקרן ליועץ ההשקעות על ניהול התיק.",["T42"]],["Expense ratio","יחס הוצאות","כל ההוצאות השנתיות של הקרן כאחוז מהנכסים הממוצעים.",["T44"]],["Exchange privilege","זכות החלפה","מעבר בין קרנות באותה משפחה, בדרך כלל בלי דמי מכירה חדשים.",["T53","T54"]]],"checks":[{"en":"Which cost is paid out of fund assets rather than directly by the investor?","he":"איזו עלות משולמת מנכסי הקרן ולא ישירות על ידי המשקיע?","o":[["A front-end sales load","דמי מכירה בכניסה"],["The management fee","דמי הניהול"]],"a":1,"why":"דמי ניהול הם חלק מההוצאות השנתיות, שמשולמות מנכסי הקרן. דמי כניסה יורדים ישירות מהכסף של המשקיע.","c":["T42","T46","T47"]},{"en":"A fund family lets an investor sell one of its funds and buy another of its funds, usually without a new sales charge. This is:","he":"משפחת קרנות מאפשרת למשקיע למכור קרן אחת שלה ולקנות קרן אחרת שלה, בדרך כלל בלי דמי מכירה חדשים. זו:","o":[["An exchange privilege","זכות החלפה"],["A letter of intent","מכתב כוונות"]],"a":0,"why":"זכות החלפה: מוכרים קרן אחת וקונים אחרת באותה משפחה, בדרך כלל בלי דמי מכירה.","c":["T53","T54"]}]},{"id":"l9","en":"Variable annuities: what they are","he":"אנונה משתנה: מה זה","story":[{"he":"<b>אנונה</b> (<span class=en>annuity</span>) היא <b>חוזה עם חברת ביטוח</b>. משלמים לחברה כסף, ובתמורה מקבלים בעתיד זרם תשלומים, למשל כל חודש. אפשר לחשוב עליה כעל \"פנסיה שקונים\".","c":["U1","U20"]},{"he":"יש שני סוגים עיקריים. <b>אנונה קבועה</b> (<span class=en>fixed annuity</span>): חברת הביטוח מבטיחה ריבית מינימלית ואת התשלומים. <b>אנונה משתנה</b> (<span class=en>variable annuity</span>): הכסף מושקע באפשרויות השקעה, והשווי <b>עולה ויורד</b> לפי הביצועים. כאן הסיכון על המשקיע, ואפשר להפסיד גם מהכסף שהשקעת (<span class=en>principal</span>).","c":["U3","U4","U5","U6","U7"]},{"he":"אנונה משתנה היא <b>נייר ערך</b>: רשומה ב-SEC, נמכרת עם <b>תשקיף</b>, ומפוקחת על ידי ה-SEC וה-FINRA, וגם על ידי רשות הביטוח של המדינה. אנונה קבועה נחשבת מוצר ביטוח שמפקחת עליו רשות הביטוח של המדינה.","c":["U9","U10","U11","U12","U13"]},{"he":"לאן הולך הכסף באנונה משתנה? לתיקים שנקראים <b>תת-חשבונות</b> (<span class=en>subaccounts</span>), בדרך כלל קרנות שבוחרים מתוך תפריט. לפעמים יש גם חשבון קבוע עם ריבית קבועה.","c":["U14","U15","U17"]},{"he":"לאנונה יש שני שלבים. 1) <b>שלב הצבירה</b> (<span class=en>accumulation phase</span>): משלמים לחברה, והכסף יכול לגדול. 2) <b>שלב קבלת הקצבה</b> (<span class=en>payout phase</span>, נקרא גם <span class=en>annuitization</span>): הופכים את הסכום לזרם תשלומים קבועים. זכור: בשלב הצבירה אתה משלם לחברה. בשלב הקצבה החברה משלמת לך. אפשר גם לקחת סכום חד-פעמי. התשלומים יכולים להיות לתקופה קבועה או לכל החיים, גם לחיים המשותפים שלך ושל בן הזוג. ברוב האנונות, אחרי שהתשלומים התחילו כבר אי אפשר למשוך.","c":["U18","U19","U20","U21","U22","U23"]},{"he":"<b>אנונה נדחית</b> (<span class=en>deferred annuity</span>): תשלום אחד או כמה לאורך זמן, והתשלומים אליך יתחילו בעתיד. <b>אנונה מיידית</b> (<span class=en>immediate annuity</span>): תשלום אחד. ו<b>הטבת מוות</b> (<span class=en>death benefit</span>): אם המחזיק נפטר, המוטב שבחר מקבל כסף. לפי FINRA, בדרך כלל מובטח רק החזר הפרמיות, פחות משיכות.","c":["U24","U37","U39"]},{"he":"ושוב: אנונה <b>לא</b> מבוטחת על ידי ה-FDIC. ההבטחות שלה טובות רק כמו <b>האיתנות הפיננסית של חברת הביטוח</b>.","c":["U66","U67"]}],"terms":[["Annuity","אנונה","חוזה עם חברת ביטוח: משלמים לה, ובעתיד מקבלים זרם תשלומים.",["U1","U20"]],["Fixed annuity","אנונה קבועה","חברת הביטוח מבטיחה ריבית מינימלית ואת התשלומים. מוצר ביטוח בפיקוח רשות הביטוח של המדינה.",["U3","U4","U12"]],["Variable annuity","אנונה משתנה","הכסף מושקע באפשרויות השקעה, והשווי עולה ויורד. נייר ערך שרשום ב-SEC ונמכר עם תשקיף.",["U2","U5","U9","U13"]],["Subaccounts","תת-חשבונות","אפשרויות ההשקעה באנונה משתנה, בדרך כלל קרנות מתוך תפריט.",["U14","U15"]],["Accumulation phase","שלב הצבירה","התקופה שבה משלמים לחברה והכסף יכול לגדול.",["U18"]],["Annuitization (payout phase)","שלב קבלת הקצבה (annuitization)","הפיכת הסכום לזרם תשלומים קבועים, לתקופה או לכל החיים.",["U19","U20","U22"]],["Deferred vs. immediate annuity","אנונה נדחית מול מיידית","נדחית: תשלום אחד או כמה, והתשלומים אליך בעתיד. מיידית: תשלום אחד.",["U24"]],["Death benefit","הטבת מוות","אם המחזיק נפטר, המוטב מקבל כסף. בדרך כלל מובטח החזר הפרמיות פחות משיכות.",["U37","U39"]]],"checks":[{"en":"In a variable annuity, who bears the investment risk?","he":"באנונה משתנה, מי נושא בסיכון ההשקעה?","o":[["The contract owner","בעל החוזה"],["The insurance company","חברת הביטוח"]],"a":0,"why":"באנונה משתנה השווי עולה ויורד לפי ההשקעות שבחר המשקיע, ואפשר להפסיד גם מהכסף שהושקע.","c":["U5","U6","U7"]},{"en":"Why is a variable annuity sold with a prospectus?","he":"למה אנונה משתנה נמכרת עם תשקיף?","o":[["It is a security registered with the SEC","היא נייר ערך שרשום ב-SEC"],["The state insurance law requires it for annuities","חוק הביטוח של המדינה מחייב זאת באנונות"]],"a":0,"why":"אנונה משתנה היא נייר ערך שחייב להירשם ב-SEC, ולכן יש לה תשקיף. אנונה קבועה היא מוצר ביטוח.","c":["U9","U12","U13"]}]},{"id":"l10","en":"Annuity costs, taxes and rules","he":"אנונה: עלויות, מיסים וכללים","story":[{"he":"זוכר את ה-CDSC של Class B? באנונה יש אותו רעיון: <b>קנס משיכה מוקדמת</b> (<span class=en>surrender charge</span>). זה סוג של דמי מכירה: משלמים אותה אם מושכים כסף בתוך תקופה מסוימת אחרי הקנייה. בדרך כלל זה אחוז מהסכום שנמשך, והוא <b>יורד</b> עם השנים. התקופה הזאת נקראת <span class=en>surrender period</span>, ונמשכת בדרך כלל שש עד שמונה שנים.","c":["U40","U41","U42","U43"]},{"he":"דוגמה מחומר של ה-SEC: 7% בשנה הראשונה, 6% בשנייה, וכן הלאה, עד שבשנה השמינית אין עמלה. משיכה של 10,000 דולר בשנה הראשונה: 10,000 × 7% = <b>700</b> דולר. הרבה חוזים מאפשרים למשוך כל שנה חלק בלי עמלה, למשל 10% מהשווי. (המספרים כאן הם דוגמה. כל חוזה קובע את שלו.)","c":["U44","U45","U46","U47"]},{"he":"עלויות נוספות: <b>עמלת סיכון תמותה והוצאות</b> (<span class=en>mortality and expense risk charge</span>, בקיצור <span class=en>M&E</span>): אחוז שנתי מהשווי, למשל 1.25%, שמפצה את חברת הביטוח על הסיכונים הביטוחיים. דמי ניהול חשבון. ההוצאות של הקרנות שבתת-החשבונות. ו<b>תוספות</b> (<span class=en>riders</span>), כמו הבטחת הכנסה או הטבת מוות משופרת, שעולות כסף נוסף.","c":["U48","U49","U50","U51","U52","U53"]},{"he":"מיסים, צעד אחר צעד. 1) <b>דחיית מס</b> (<span class=en>tax-deferred</span>): לא משלמים מס על הרווחים עד שמושכים. 2) כשמושכים, הרווח ממוסה כ<b>הכנסה רגילה</b> (<span class=en>ordinary income</span>), לא כרווח הון. מלכודת לסוחר: גם אחרי 20 שנה אין כאן שיעור מס של רווח הון לטווח ארוך. 3) אנונה שנקנתה בכסף אחרי מס (<span class=en>nonqualified</span>): החלק שמחזיר את הכסף ששילמת לא ממוסה שוב.","c":["U26","U27","U28","U29"]},{"he":"מה יוצא קודם במשיכה לפני שלב התשלומים? <b>הרווחים</b> (חייבים במס), ורק אחר כך הכסף ששילמת (פטור). דוגמה: רינה שילמה 40,000, והחוזה שווה עכשיו 52,000. הרווח: 12,000. היא מושכת 15,000. שלב 1: 12,000 הראשונים הם רווח, וממוסים. שלב 2: 3,000 הנותרים הם החזר של הכסף שלה, בלי מס.","c":["U30"]},{"he":"ואם רינה בת 50? רוב המשיכות לפני גיל <b>59½</b> חייבות ב<b>מס נוסף של 10%</b>, רק על החלק שחייב במס: 10% × 12,000 = 1,200. יש חריגים, למשל מוות או נכות.","c":["U32","U33","U34"]},{"he":"שלושה כללים אחרונים. 1) <b>תקופת התחרטות</b> (<span class=en>free look</span>): אפשר לבטל תוך זמן קצר, בדרך כלל 10 עד 30 יום, בלי קנס משיכה מוקדמת. 2) <b>החלפת 1035</b> (<span class=en>1035 exchange</span>, לפי סעיף 1035 בחוק המס): מחליפים אנונה באנונה בלי מס (כשהמבוטח נשאר אותו אדם), אבל אולי משלמים עמלת פדיון בישנה ומתחילים תקופת עמלה חדשה בחדשה. 3) <b>כלל 2330 של FINRA</b>: לפני המלצה על אנונה משתנה נדחית, הברוקר חייב לבדוק התאמה, ומנהל מורשה (<span class=en>registered principal</span>) חייב לבדוק ולהחליט אם לאשר, לא יאוחר משבעה ימי עסקים אחרי שבקשה מלאה ותקינה הגיעה ל-<span class=en>OSJ</span> (המשרד שבו יושב המפקח).","c":["U56","U58","U59","U60","U61","U65","U68","U69"]}],"terms":[["Surrender charge","קנס משיכה מוקדמת","עמלה על משיכה בתוך תקופה אחרי הקנייה. בדרך כלל אחוז מהסכום שנמשך, שיורד עם השנים.",["U40","U41","U42"]],["Mortality and expense (M&E) risk charge","עמלת סיכון תמותה והוצאות (M&E)","עמלה שנתית כאחוז מהשווי, שמפצה את חברת הביטוח על הסיכונים הביטוחיים.",["U48","U49"]],["Rider","תוספת (rider)","הטבה אופציונלית, כמו הבטחת הכנסה, שעולה כסף נוסף.",["U52","U53"]],["Tax deferral","דחיית מס","לא משלמים מס על הרווחים עד שמושכים. אז הרווח ממוסה כהכנסה רגילה.",["U26","U27"]],["10% additional tax","מס נוסף של 10% על משיכה מוקדמת","רוב המשיכות לפני גיל 59½ חייבות בעוד 10%, על החלק שחייב במס. יש חריגים.",["U32","U33","U34"]],["Free look period","תקופת התחרטות","ביטול תוך זמן קצר (בדרך כלל 10 עד 30 יום) בלי קנס משיכה מוקדמת.",["U56"]],["1035 exchange","החלפת 1035","החלפת אנונה באנונה בלי מס. אולי עמלת פדיון בישנה ותקופת עמלה חדשה בחדשה.",["U58","U59"]],["FINRA Rule 2330","כלל 2330 של FINRA","כללי ההמלצה על אנונה משתנה נדחית: בדיקת התאמה, ומנהל מורשה בודק ומחליט אם לאשר.",["U60","U61","U65"]]],"checks":[{"en":"Earnings withdrawn from a nonqualified variable annuity are taxed as:","he":"רווחים שנמשכים מאנונה משתנה שנקנתה בכסף אחרי מס ממוסים כ:","o":[["Long-term capital gains","רווח הון לטווח ארוך"],["Ordinary income","הכנסה רגילה"]],"a":1,"why":"הרווחים באנונה ממוסים כהכנסה רגילה, לא כרווח הון.","c":["U27"]},{"en":"An investor exchanges one annuity for another under Section 1035. Which risk should she consider?","he":"משקיעה מחליפה אנונה באחרת בהחלפת 1035. איזה סיכון היא צריכה לשקול?","o":[["Capital gains tax on the exchange","מס רווח הון על ההחלפה"],["A new surrender period on the new contract","תקופת קנס חדשה בחוזה החדש"]],"a":1,"why":"ההחלפה עצמה בלי מס, אבל אולי יש עמלת פדיון בישנה ותקופת עמלה חדשה בחדשה.","c":["U58","U59"]}]}],"exam":[{"en":"Which statement BEST describes an open-end fund?","he":"איזה משפט מתאר הכי טוב קרן פתוחה?","o":[["It guarantees a minimum rate of return","היא מבטיחה תשואה מינימלית"],["It issues a fixed number of shares that trade on an exchange","היא מנפיקה מספר קבוע של מניות שנסחרות בבורסה"],["It holds a fixed portfolio and ends on a set date","היא מחזיקה תיק קבוע ומסתיימת בתאריך קבוע"],["It issues new shares and redeems shares at NAV","היא מנפיקה מניות חדשות ופודה מניות לפי ה-NAV"]],"a":3,"why":"קרן פתוחה יוצרת מניות חדשות לפי הביקוש ופודה מניות. מספר קבוע בבורסה = קרן סגורה. תיק קבוע ותאריך סיום = UIT.","c":["S19","S20","S21","S24"]},{"en":"A fund has total assets of $86.4 million, liabilities of $4.8 million and 6.4 million shares outstanding. What is the NAV per share?","he":"לקרן נכסים של 86.4 מיליון דולר, התחייבויות של 4.8 מיליון ו-6.4 מיליון מניות. מה ה-NAV למניה?","o":[["$12.00","12 דולר"],["$14.25","14.25 דולר"],["$13.50","13.50 דולר"],["$12.75","12.75 דולר"]],"a":3,"why":"(86.4 − 4.8) ÷ 6.4 = 81.6 ÷ 6.4 = 12.75. בלי להוריד התחייבויות: 86.4 ÷ 6.4 = 13.50.","c":["S34","S35"]},{"en":"An investor enters an order to redeem mutual fund shares at 1:00 p.m. The shares will be redeemed at:","he":"משקיע נותן הוראת פדיון למניות של קרן נאמנות ב-1:00 בצהריים. המניות ייפדו לפי:","o":[["The highest NAV of the week","ה-NAV הגבוה ביותר בשבוע"],["The next NAV computed after the order is received","ה-NAV הבא שיחושב אחרי קבלת ההוראה"],["The NAV computed at the close of the previous day","ה-NAV שחושב בסגירה של היום הקודם"],["The market price at 1:00 p.m.","מחיר השוק ב-1:00 בצהריים"]],"a":1,"why":"תמחור קדימה (כלל 22c-1): ה-NAV הבא שיחושב אחרי שההוראה התקבלה.","c":["S24","S25"]},{"en":"After a mutual fund receives a redemption request, it generally must pay the proceeds within:","he":"אחרי שקרן נאמנות מקבלת בקשת פדיון, בדרך כלל היא חייבת לשלם תוך:","o":[["3 business days","3 ימי עסקים"],["15 days","15 יום"],["30 days","30 יום"],["7 days","7 ימים"]],"a":3,"why":"קרן חייבת לשלם בפדיון תוך שבעה ימים, חוץ מחריגים בחוק.","c":["S32","S33"]},{"en":"Shares of a closed-end fund trade at $14.20. Its NAV is $15.00. The shares trade at:","he":"מניות של קרן סגורה נסחרות ב-14.20 דולר. ה-NAV שלה 15 דולר. המניות נסחרות ב:","o":[["A discount of $0.80","דיסקאונט של 0.80 דולר"],["A premium of $0.53","פרמיה של 0.53 דולר"],["A premium of $0.80","פרמיה של 0.80 דולר"],["A discount of $0.53","דיסקאונט של 0.53 דולר"]],"a":0,"why":"מחיר מתחת ל-NAV = דיסקאונט: 15.00 − 14.20 = 0.80. קרן סגורה נסחרת במחיר שוק.","c":["S43","S44","S46"]},{"en":"Which statement about closed-end funds is TRUE?","he":"מה נכון לגבי קרנות סגורות?","o":[["They are not required to buy back shares from investors","הן לא חייבות לקנות בחזרה מניות ממשקיעים"],["They are prohibited from borrowing to invest","אסור להן ללוות כדי להשקיע"],["They usually must buy back shares within seven days","בדרך כלל הן חייבות לקנות בחזרה מניות תוך שבעה ימים"],["They generally keep offering new shares to the public","בדרך כלל הן ממשיכות להציע מניות חדשות לציבור"]],"a":0,"why":"קרן סגורה לא חייבת לקנות בחזרה מניות, לא מציעה מניות חדשות כל הזמן, ויכולה להשתמש במינוף.","c":["S41","S47","S49"]},{"en":"Which investment company makes a one-time offering of a fixed number of redeemable securities and has no investment adviser?","he":"איזו חברת השקעות מוכרת פעם אחת מספר קבוע של ניירות ערך שניתנים לפדיון, ואין לה יועץ השקעות?","o":[["A face-amount certificate company","חברת תעודות בסכום נקוב"],["A unit investment trust","נאמנות יחידות (UIT)"],["An open-end fund","קרן פתוחה"],["A closed-end fund","קרן סגורה"]],"a":1,"why":"UIT: הנפקה חד-פעמית של יחידות ניתנות לפדיון, בלי דירקטוריון ובלי יועץ השקעות.","c":["S50","S51","S55"]},{"en":"Under the Investment Company Act of 1940, which is one of the three classes of investment companies?","he":"לפי חוק חברות ההשקעות של 1940, מהו אחד משלושת הסוגים של חברות השקעות?","o":[["Management company","חברת ניהול (management company)"],["Holding company","חברת אחזקות (holding company)"],["Insurance company","חברת ביטוח (insurance company)"],["Trust company","חברת נאמנות (trust company)"]],"a":0,"why":"שלושת הסוגים: face-amount certificate companies, UITs ו-management companies.","c":["S3","S4"]},{"en":"Under the 1940 Act, at least what percentage of a fund's board must NOT be interested persons?","he":"לפי חוק 1940, לפחות איזה אחוז מהדירקטוריון של קרן חייב להיות בלי עניין?","o":[["50%","50%"],["75%","75%"],["40%","40%"],["60%","60%"]],"a":2,"why":"עד 60% יכולים להיות בעלי עניין, ולכן לפחות 40% חייבים להיות בלי עניין. 60% הוא התקרה לבעלי העניין, לא המינימום לבלתי תלויים.","c":["S61","S62"]},{"en":"Which entity keeps a mutual fund's securities in safekeeping?","he":"איזה גוף מחזיק ושומר את ניירות הערך של קרן נאמנות?","o":[["The custodian","המשמורן"],["The transfer agent","סוכן ההעברות"],["The principal underwriter","החתם הראשי"],["The investment adviser","יועץ ההשקעות"]],"a":0,"why":"המשמורן מחזיק את ניירות הערך. סוכן ההעברות מנהל את רישום בעלי המניות.","c":["S64","S66"]},{"en":"Which entity maintains a fund's shareholder records and distributes dividends?","he":"איזה גוף מנהל את רשימת בעלי המניות של קרן ומחלק דיבידנדים?","o":[["The SEC","ה-SEC"],["The fund's auditor","רואה החשבון של הקרן"],["The principal underwriter","החתם הראשי"],["The transfer agent","סוכן ההעברות"]],"a":3,"why":"סוכן ההעברות רושם העברות, מנהל את רשימת המחזיקים ומחלק דיבידנדים.","c":["S66","S67"]},{"en":"A customer asks for the fund document that describes its operations beyond the prospectus. The firm should direct her to the:","he":"לקוחה מבקשת את מסמך הקרן שמתאר את הפעילות שלה מעבר לתשקיף. הברוקר צריך להפנות אותה ל:","o":[["Prospectus supplement","תוספת לתשקיף"],["Summary prospectus","תשקיף מקוצר"],["Statement of Additional Information","מסמך המידע הנוסף (SAI)"],["Annual shareholder report","הדוח השנתי למחזיקים"]],"a":2,"why":"ה-SAI מסביר את פעילות הקרן בפירוט רב יותר מהתשקיף, וניתן בחינם לפי בקשה.","c":["S75","S76"]},{"en":"A fund's NAV is $17.86 and its sales charge is 5% of the public offering price. What is the POP?","he":"ה-NAV של קרן הוא 17.86 דולר, ודמי המכירה 5% ממחיר ההצעה לציבור. מה ה-POP?","o":[["$18.75","18.75 דולר"],["$18.80","18.80 דולר"],["$17.86","17.86 דולר"],["$16.97","16.97 דולר"]],"a":1,"why":"האחוז מחושב מה-POP. POP = 17.86 ÷ 0.95 = 18.80. (17.86 × 1.05 = 18.75 היא טעות נפוצה.)","c":["S84","T65","T67"]},{"en":"An investor sends $25,000 to buy shares of a fund with a 4% front-end load. How much is actually invested in shares?","he":"משקיע שולח 25,000 דולר לקנות מניות של קרן עם דמי כניסה של 4%. כמה מושקע בפועל במניות?","o":[["$24,038","24,038 דולר"],["$23,000","23,000 דולר"],["$24,750","24,750 דולר"],["$24,000","24,000 דולר"]],"a":3,"why":"דמי הכניסה יורדים מהסכום ששולם: 25,000 × 4% = 1,000. מושקע: 25,000 − 1,000 = 24,000. (25,000 ÷ 1.04 = 24,038 הוא חישוב לא נכון.)","c":["T2","T5"]},{"en":"Under FINRA Rule 2341, total front-end and deferred sales charges on a fund generally may not exceed:","he":"לפי כלל 2341 של FINRA, דמי הכניסה והיציאה יחד בקרן בדרך כלל לא יעלו על:","o":[["5% of the offering price","5% ממחיר ההצעה"],["8.5% of the NAV","8.5% מה-NAV"],["8.5% of the offering price","8.5% ממחיר ההצעה"],["5% of the NAV","5% מה-NAV"]],"a":2,"why":"התקרה היא 8.5% ממחיר ההצעה (במקרים מסוימים נמוכה יותר).","c":["T39","T40","T37"]},{"en":"Which share class typically has no front-end load but a contingent deferred sales charge that declines over several years?","he":"לאיזה סוג מניות בדרך כלל אין דמי כניסה, אבל יש CDSC שיורד לאורך כמה שנים?","o":[["Class C","Class C"],["Class B","Class B"],["Class I","Class I"],["Class A","Class A"]],"a":1,"why":"B: בלי דמי כניסה, CDSC שיורד עם השנים עד שנעלם. A: דמי כניסה. C: CDSC קטן לכשנה בלבד ועמלה שנתית.","c":["T16","T17","T19","T24"]},{"en":"An investor plans to hold a fund for only about two years and invest a small amount. Which class is MOST likely to cost her less?","he":"משקיעה מתכננת להחזיק קרן כשנתיים בלבד, בסכום קטן. איזה סוג הכי סביר שיעלה לה פחות?","o":[["Class B","Class B"],["Class C","Class C"],["Class A","Class A"],["Class A with a letter of intent","Class A עם מכתב כוונות"]],"a":1,"why":"FINRA: Class C יכול להיות זול יותר מ-A או B לטווח קצר. דמי כניסה מלאים (A) או CDSC ארוך (B) פוגעים יותר בתקופה קצרה.","c":["T70","T71","T27"]},{"en":"Which statement about 12b-1 fees is TRUE?","he":"מה נכון לגבי דמי 12b-1?","o":[["They are paid to the fund when shares are redeemed early","הם משולמים לקרן כשמניות נפדות מוקדם"],["They are usually paid directly by the investor when buying shares","בדרך כלל המשקיע משלם אותם ישירות כשהוא קונה מניות"],["They are paid from fund assets for distribution and sometimes service","הם משולמים מנכסי הקרן על הפצה ולפעמים על שירות"],["They are paid to the custodian for keeping fund securities","הם משולמים למשמורן על שמירת ניירות הערך"]],"a":2,"why":"12b-1 משולמים מנכסי הקרן. לפי FINRA: עד 0.75% הפצה ועוד 0.25% שירות.","c":["T30","T35","T36"]},{"en":"A fund may call itself \"no-load\" only if it has no front-end or deferred sales charge and its 12b-1 and service fees do not exceed:","he":"קרן רשאית לקרוא לעצמה \"no-load\" רק אם אין לה דמי כניסה או יציאה, ודמי ה-12b-1 והשירות שלה לא עולים על:","o":[["0.10% per year","0.10% בשנה"],["1.00% per year","1% בשנה"],["0.25% per year","0.25% בשנה"],["0.75% per year","0.75% בשנה"]],"a":2,"why":"FINRA: אסור לקרוא לקרן no-load אם החיובים השנתיים למכירה ושירות עולים על 0.25%.","c":["T38"]},{"en":"A customer holds $30,000 in a fund family and wants to buy $25,000 more. The firm combines the holdings to reach a lower sales charge. This is:","he":"ללקוח 30,000 דולר במשפחת קרנות, והוא רוצה לקנות עוד 25,000. הברוקר מצרף את ההחזקות כדי להגיע לדמי מכירה נמוכים יותר. זו:","o":[["An exchange privilege","זכות החלפה"],["A right of accumulation","זכות צבירה (ROA)"],["A letter of intent","מכתב כוונות (LOI)"],["A breakpoint sale","מכירה מתחת ל-breakpoint"]],"a":1,"why":"ROA סופרת את מה שכבר יש לטובת ה-breakpoint. LOI הוא התחייבות לעתיד.","c":["T58","T59"]},{"en":"A letter of intent generally gives an investor how long to complete the promised purchases?","he":"מכתב כוונות נותן למשקיע בדרך כלל כמה זמן להשלים את הקניות שהבטיח?","o":[["24 months","24 חודשים"],["12 months","12 חודשים"],["18 months","18 חודשים"],["13 months","13 חודשים"]],"a":3,"why":"LOI: התחייבות להשקיע סכום בתקופה, בדרך כלל 13 חודשים.","c":["T60"]},{"en":"A fund's sales charge drops at $50,000. A representative recommends a $49,500 purchase so that he earns a higher commission. Under FINRA rules, this is called:","he":"דמי המכירה של קרן יורדים מ-50,000 דולר. נציג ממליץ על קנייה של 49,500 דולר כדי שהוא ירוויח עמלה גבוהה יותר. לפי כללי FINRA, זה נקרא:","o":[["Free-riding","free-riding (קנייה בלי לשלם)"],["Breakpoint selling","breakpoint selling (מכירה מתחת למדרגת ההנחה)"],["Front running","front running (קדימה להוראת לקוח)"],["Churning","churning (מסחר מופרז בחשבון)"]],"a":1,"why":"מכירה בכוונה קצת מתחת לסכום שבו דמי המכירה יורדים, כדי לגבות יותר: breakpoint sale, אסורה לפי כלל 2342.","c":["T64","T63"]},{"en":"Which of the following is part of a fund's annual operating expenses?","he":"מה מהבאים הוא חלק מההוצאות השנתיות של קרן?","o":[["The exchange fee","עמלת ההחלפה"],["The management fee","דמי הניהול"],["The redemption fee","עמלת הפדיון"],["The front-end sales load","דמי המכירה בכניסה"]],"a":1,"why":"דמי ניהול, 12b-1 והוצאות אחרות = הוצאות שנתיות. דמי כניסה, עמלת פדיון ועמלת החלפה הן עמלות שהמשקיע משלם ישירות.","c":["T42","T45","T46"]},{"en":"A fund's expense ratio is 0.60%. An investor holds $45,000 in the fund for a year. About how much do operating expenses cost her that year?","he":"יחס ההוצאות של קרן הוא 0.60%. משקיעה מחזיקה 45,000 דולר בקרן במשך שנה. בערך כמה עולות לה ההוצאות השנתיות?","o":[["$300","300 דולר"],["$240","240 דולר"],["$2,700","2,700 דולר"],["$270","270 דולר"]],"a":3,"why":"45,000 × 0.006 = 270.","c":["T44"]},{"en":"In which product does the contract owner choose subaccounts and bear the investment risk?","he":"באיזה מוצר בעל החוזה בוחר תת-חשבונות ונושא בסיכון ההשקעה?","o":[["A fixed annuity","אנונה קבועה"],["A certificate of deposit","פיקדון בנקאי (CD)"],["A variable annuity","אנונה משתנה"],["A unit investment trust","נאמנות יחידות (UIT)"]],"a":2,"why":"באנונה משתנה הכסף מושקע בתת-חשבונות שהבעלים בוחר, והסיכון עליו. באנונה קבועה חברת הביטוח מבטיחה את הריבית.","c":["U5","U6","U14","U4"]},{"en":"Which regulator requires a product to register as a security when its value depends on investment options chosen by the owner?","he":"איזה גוף מחייב מוצר להירשם כנייר ערך כשהשווי שלו תלוי באפשרויות השקעה שהבעלים בוחר?","o":[["The SEC","ה-SEC"],["The MSRB","ה-MSRB"],["The state banking department","מחלקת הבנקאות של המדינה"],["The FDIC","ה-FDIC"]],"a":0,"why":"אנונות משתנות הן ניירות ערך שחייבים להירשם ב-SEC. בנוסף מפקחות עליהן FINRA ורשות הביטוח של המדינה.","c":["U9","U10","U11"]},{"en":"The time during which an annuity owner is still paying money into the contract is called the:","he":"הזמן שבו בעל האנונה עדיין משלם כסף לחוזה נקרא:","o":[["Accumulation phase","שלב הצבירה"],["Surrender period","תקופת הקנס"],["Free look period","תקופת ההתחרטות"],["Annuitization phase","שלב ה-annuitization"]],"a":0,"why":"שלב הצבירה: משלמים והכסף גדל. שלב התשלומים (annuitization): מקבלים תשלומים.","c":["U18","U19"]},{"en":"A contract's surrender charge is 5% in the current year. The owner withdraws $16,000 with no free withdrawal amount. What is the surrender charge?","he":"הקנס על משיכה מוקדמת בחוזה הוא 5% בשנה הנוכחית. הבעלים מושך 16,000 דולר, בלי סכום משיכה חופשי. מה הקנס?","o":[["$800","800 דולר"],["$1,600","1,600 דולר"],["$80","80 דולר"],["$15,200","15,200 דולר"]],"a":0,"why":"הקנס הוא בדרך כלל אחוז מהסכום שנמשך: 16,000 × 5% = 800.","c":["U42"]},{"en":"A 52-year-old paid $30,000 into a nonqualified variable annuity now worth $38,000. She withdraws $5,000. How much of the withdrawal is taxable?","he":"בת 52 שילמה 30,000 דולר לאנונה משתנה שנקנתה בכסף אחרי מס, והיא שווה עכשיו 38,000. היא מושכת 5,000. כמה מהמשיכה חייב במס?","o":[["$1,250","1,250 דולר"],["$1,053","1,053 דולר"],["$5,000","5,000 דולר"],["$0","0 דולר"]],"a":2,"why":"לפני שלב התשלומים, הרווחים יוצאים קודם. הרווח: 38,000 − 30,000 = 8,000. כל ה-5,000 שנמשכו הם מתוך הרווח, ולכן כולם חייבים במס (ועוד 10% מס נוסף, כי היא מתחת ל-59½).","c":["U30","U32"]},{"en":"Which statement about a 1035 exchange of annuities is TRUE?","he":"מה נכון לגבי החלפת 1035 של אנונות?","o":[["It is tax-free but may start a new surrender period","היא בלי מס, אבל עלולה להתחיל תקופת קנס חדשה"],["It is tax-free, but may be used only once per contract","היא בלי מס, אבל מותרת רק פעם אחת לכל חוזה"],["It is taxable but keeps the old surrender period","היא חייבת במס, אבל שומרת על תקופת הקנס הישנה"],["It is taxable unless the owner is over 59½","היא חייבת במס, אלא אם הבעלים מעל גיל 59½"]],"a":0,"why":"החלפה בלי מס, אבל ייתכן שתשלם עמלת פדיון בישנה ותתחיל תקופת עמלה חדשה בחדשה.","c":["U58","U59"]},{"en":"A customer buys a variable annuity and changes her mind 8 days later. Under a typical free look period, she can:","he":"לקוחה קונה אנונה משתנה ומתחרטת אחרי 8 ימים. בתקופת התחרטות רגילה, היא יכולה:","o":[["Cancel without a charge, but only after 30 days","לבטל בלי קנס, אבל רק אחרי 30 יום"],["Keep it until the accumulation phase ends","להחזיק בה עד ששלב הצבירה נגמר"],["Cancel without a surrender charge","לבטל בלי קנס משיכה מוקדמת"],["Exchange it under Section 1035 instead","להחליף אותה בהחלפת 1035 במקום לבטל"]],"a":2,"why":"תקופת התחרטות (בדרך כלל 10 עד 30 יום): אפשר לבטל בלי קנס משיכה מוקדמת. הסכום שמוחזר יכול להשתנות לפי ביצועי ההשקעה.","c":["U56","U57"]},{"en":"Under FINRA Rule 2330, a registered principal must review a recommended deferred variable annuity purchase no later than:","he":"לפי כלל 2330 של FINRA, מנהל מורשה חייב לבדוק המלצה על קניית אנונה משתנה נדחית לא יאוחר מ:","o":[["The end of the contract's first year, when charges are reviewed","סוף השנה הראשונה של החוזה, כשבודקים את העמלות"],["7 business days after the OSJ receives a complete application","7 ימי עסקים אחרי שה-OSJ מקבל בקשה מלאה"],["30 days after the customer's free look period has ended","30 יום אחרי שתקופת ההתחרטות של הלקוח נגמרה"],["The start of the payout phase, before the first payment","תחילת שלב הקצבה, לפני התשלום הראשון"]],"a":1,"why":"כלל 2330: מנהל מורשה בודק ומחליט לא יאוחר משבעה ימי עסקים אחרי שה-OSJ קיבל את הבקשה.","c":["U65"]}],"calcs":["f4nav","f4pop","f4net","f4disc","f4exp","f4surr","f4tax","f4roa"],"words":{"Investment company":{"pr":"אִינְוֶסְטְמֶנְט קוֹמְפַּנִי","def":"A business whose main activity is investing many people's pooled money in securities.","hint":"company = חברה. investment = השקעה."},"Mutual fund (open-end company)":{"pr":"מְיוּצ'וּאָל פַאנְד","def":"A pooled portfolio that sells new shares and buys them back from investors.","hint":"mutual = הדדי, משותף."},"Management company":{"pr":"מֶנֶג'מֶנְט קוֹמְפַּנִי","def":"The catch-all class in the 1940 Act: any investment business that is not a UIT or a face-amount certificate issuer. Split into open-end and closed-end."},"Face-amount certificate company":{"pr":"פֵייס-אֲמַאוּנְט סֶרְטִיפִיקֶט קוֹמְפַּנִי","def":"One of the three classes in the 1940 Act. It issues contracts that promise a stated sum."},"Diversified fund":{"pr":"דַייוֶורְסִיפַייד פַאנְד","def":"At least 75% of assets in qualifying holdings; within that, no more than 5% of assets in one issuer and no more than 10% of one issuer's voting shares."},"Professional management":{"pr":"פְּרוֹפֶשֶנָל מֶנֶג'מֶנְט","def":"Experts research, select and monitor the securities in the portfolio for the investors."},"Open-end fund":{"pr":"אוֹפֶּן-אֶנְד פַאנְד","def":"Sells new shares whenever investors want them and buys shares back on request, at net asset value."},"Net asset value (NAV)":{"pr":"נֶט אֶסֶט וֶולְיוּ","def":"(Total holdings minus total liabilities) ÷ shares outstanding. The basic per-share price of a fund."},"Redemption":{"pr":"רִידֶמְפְּשֶן","def":"Selling fund shares back to the fund itself, for about your proportionate share of its net holdings.","hint":"redeem = לפדות."},"Forward pricing":{"pr":"פוֹרְוּאֶרְד פְּרַייסִינְג","def":"An order receives the next net asset value computed after the order is received (SEC Rule 22c-1).","hint":"forward = קדימה. המחיר הבא, לא הקודם."},"Continuous offering":{"pr":"קוֹנְטִינְיוּאַס אוֹפֶרִינְג","def":"There is no fixed number of shares: the fund issues more whenever new investors arrive."},"Seven-day payment rule":{"pr":"סֶוֶון-דֵיי פֵּיימֶנְט רוּל","def":"The legal deadline for a mutual fund to send the money to an investor who sold shares back to it, except in cases the law allows."},"Closed-end fund":{"pr":"קְלוֹזְד-אֶנְד פַאנְד","def":"Sells a fixed number of shares once, in an IPO. After that, investors buy and sell them on an exchange at market prices."},"Premium / discount to NAV":{"pr":"פְּרִימְיוּם / דִיסְקַאוּנְט טוּ אֶן-אֵיי-וִי","def":"When a fund's market price is above or below the value of its holdings per share. Common with exchange-traded closed-end funds."},"Unit investment trust (UIT)":{"pr":"יוּנִיט אִינְוֶסְטְמֶנְט טְרַאסְט","def":"Sells a fixed number of redeemable pieces once, holds an unmanaged portfolio, has no board or adviser, and ends on a set date."},"Termination date":{"pr":"טֶרְמִינֵיישֶן דֵייט","def":"Set when a UIT is created: on it, the remaining securities are sold and the money is paid out.","hint":"terminate = לסיים."},"Leverage (closed-end funds)":{"pr":"לֶוֶרֶג'","def":"Borrowing to invest more. Closed-end funds may do this more than other types of investment companies.","hint":"lever = מנוף."},"Board of directors":{"pr":"בּוֹרְד אוֹו דַיירֶקְטוֹרְז","def":"No more than 60% of its members may be interested persons, so at least 40% must be independent of the fund."},"Investment adviser":{"pr":"אִינְוֶסְטְמֶנְט אֲדְוַייזֶר","def":"Manages the fund's portfolio according to its objectives and policies. Registered with the SEC."},"Custodian":{"pr":"קַאסְטוֹדְיֶן","def":"Holds the fund's securities in safekeeping, for example a bank.","hint":"custody = משמורת."},"Transfer agent":{"pr":"טְרַנְסְפֶר אֵייגֶ'נְט","def":"Keeps the list of who owns how many shares, and pays out dividends."},"Principal underwriter":{"pr":"פְּרִינְסִיפֶּל אַנְדֶרְרַייטֶר","def":"Buys shares from the fund for its own account in order to distribute them to investors."},"Prospectus / summary prospectus":{"pr":"פְּרוֹסְפֶּקְטֶס","def":"The disclosure document every fund must give investors; the short version is a few pages of key facts, including the fee table."},"Statement of Additional Information (SAI)":{"pr":"סְטֵייטְמֶנְט אוֹו אֲדִישֶנָל אִינְפוֹרְמֵיישֶן","def":"Explains the fund's operations in more detail than the prospectus. Must be provided free on request."},"Shareholder reports":{"pr":"שֶרְהוֹלְדֶר רִיפּוֹרְטְס","def":"The annual and semi-annual updates a fund must send to its investors."},"Sales load (sales charge)":{"pr":"סֵיילְז לוֹד","def":"A commission-like fee paid when buying shares (front-end) or when selling them back to the fund (back-end)."},"Front-end load":{"pr":"פְרוֹנְט-אֶנְד לוֹד","def":"Taken out of the money you invest, as a percent of the offering price, so less money buys shares. Paid to the broker."},"Public offering price (POP)":{"pr":"פַּבְּלִיק אוֹפֶרִינְג פְּרַייס","def":"Net asset value plus the sales load. The load's percentage is figured on this amount, not on NAV."},"Maximum sales charge":{"pr":"מַקְסִימוּם סֵיילְז צ'ַארְג'","def":"Under FINRA Rule 2341, front-end plus deferred loads generally may not exceed 8.5% of the offering price; lower in some cases."},"Back-end load (CDSC)":{"pr":"בֶּק-אֶנְד לוֹד (סִי-דִי-אֶס-סִי)","def":"Paid when you sell shares to the fund. It shrinks the longer you hold, and may reach zero.","hint":"contingent = מותנה. deferred = נדחה."},"Redemption fee":{"pr":"רִידֶמְפְּשֶן פִי","def":"A charge on selling shares back that goes to the fund itself, not to a broker. Generally limited to 2%."},"Share classes":{"pr":"שֶר קְלַאסֶז","def":"Different versions of one fund that hold the same portfolio but charge different fees, so net returns differ."},"Class A shares":{"pr":"קְלַאס אֵיי שֶרְז","def":"Typically a sales charge at purchase, volume discounts for large amounts, and lower yearly distribution fees."},"Class B shares":{"pr":"קְלַאס בִּי שֶרְז","def":"No charge at purchase, a deferred charge that declines over the years, higher yearly fees; often convert to the lower-cost A version later. No longer widely sold."},"Class C shares (level load)":{"pr":"קְלַאס סִי שֶרְז (לֶוֶל לוֹד)","def":"A charge collected every year you hold, generally the highest yearly distribution fee, and often a small deferred charge if sold within about a year."},"12b-1 fee":{"pr":"טְוּוֶלְב-בִּי-וַאן פִי","def":"A yearly charge paid from fund assets for marketing and selling shares, sometimes also for investor services. FINRA caps: 0.75% plus 0.25%."},"No-load fund":{"pr":"נוֹ-לוֹד פַאנְד","def":"Charges nothing at purchase or sale, and its yearly marketing and service costs are at most 0.25%. It still has yearly expenses."},"Breakpoint":{"pr":"בְּרֵייק-פּוֹיְנְט","def":"An investment level at which the front-end sales charge percentage drops. Each fund family sets its own."},"Right of accumulation (ROA)":{"pr":"רַייט אוֹו אֲקְיוּמְיוּלֵיישֶן","def":"Counting holdings you already have, and sometimes those of family members, toward a volume discount.","hint":"accumulate = לצבור. מסתכלים אחורה."},"Letter of intent (LOI)":{"pr":"לֶטֶר אוֹו אִינְטֶנְט","def":"A signed commitment to invest a set amount over a period, usually 13 months, to get the discount now. Miss it and the higher charge may be collected.","hint":"intent = כוונה. מסתכלים קדימה."},"Breakpoint sales":{"pr":"בְּרֵייק-פּוֹיְנְט סֵיילְז","def":"Recommending an amount just below a discount level to earn a higher commission. Prohibited by FINRA Rule 2342."},"Shareholder fees vs. operating expenses":{"pr":"שֶרְהוֹלְדֶר פִיז וֶרְסֶס אוֹפֶּרֵייטִינְג אֶקְסְפֶּנְסֶז","def":"The two parts of the fee table: charges taken directly from the investor, and yearly costs paid out of fund assets."},"Management fee":{"pr":"מֶנֶג'מֶנְט פִי","def":"Paid out of fund assets to the investment adviser for running the portfolio."},"Expense ratio":{"pr":"אֶקְסְפֶּנְס רֵיישְיוֹ","def":"Total yearly fund operating costs as a percent of average net assets."},"Exchange privilege":{"pr":"אֶקְסְצ'ֵיינְג' פְּרִיוִילֶג'","def":"Moving money from one fund to another in the same family, usually without a new sales charge."},"Annuity":{"pr":"אֲנְיוּאִיטִי","def":"A contract with an insurance company: you pay in, and later you can receive a stream of payments."},"Fixed annuity":{"pr":"פִיקְסְד אֲנוּאִיטִי","def":"The insurer guarantees a minimum interest rate and the payout. Treated as an insurance product regulated by the state."},"Variable annuity":{"pr":"וֶרִיאֲבֶּל אֲנוּאִיטִי","def":"An insurance contract whose value rises and falls with the investment options chosen. A security registered with the SEC and sold with a prospectus."},"Subaccounts":{"pr":"סַאבּ-אֲקַאוּנְטְס","def":"The investment choices inside the contract, typically mutual funds picked from a menu."},"Accumulation phase":{"pr":"אֲקְיוּמְיוּלֵיישֶן פֵייז","def":"The period when you make purchase payments and the money can grow."},"Annuitization (payout phase)":{"pr":"אֲנוּאִיטַייזֵיישֶן","def":"Converting the contract into regular income checks, for a set period or for life."},"Deferred vs. immediate annuity":{"pr":"דִיפֶרְד וֶרְסֶס אִימִידְיֶט אֲנוּאִיטִי","def":"Contracts that pay out later (bought with one or many payments) compared with contracts bought with a single payment."},"Death benefit":{"pr":"דֶת' בֶּנֶפִיט","def":"Money the person named in the contract receives when the owner passes away. Generally at least a return of premiums minus withdrawals."},"Surrender charge":{"pr":"סֶרֶנְדֶר צ'ַארְג'","def":"Generally a percent of the amount withdrawn within a set period after purchase. It declines over the years.","hint":"surrender = לוותר, למסור."},"Mortality and expense (M&E) risk charge":{"pr":"מוֹרְטָלִיטִי אֶנְד אֶקְסְפֶּנְס רִיסְק צ'ַארְג'","def":"A yearly percent of contract value that pays the insurer for the insurance exposure it takes on, for example 1.25%.","hint":"mortality = תמותה."},"Rider":{"pr":"רַיידֶר","def":"An optional added benefit, such as a guaranteed income or a stepped-up death benefit, that costs extra."},"Tax deferral":{"pr":"טֶקְס דִיפֶרָל","def":"No tax on earnings until money is taken out; then the earnings are taxed as ordinary income."},"10% additional tax":{"pr":"טֶן פֶּרְסֶנְט אֲדִישֶנָל טֶקְס","def":"An extra penalty on the taxable part of most withdrawals made before age 59½. Exceptions include death and disability."},"Free look period":{"pr":"פְרִי לוּק פִּירִיאֶד","def":"A short time after purchase, usually 10 to 30 days, to cancel without a surrender charge."},"1035 exchange":{"pr":"טֶן-ת'ֶרְטִי-פַייב אֶקְסְצ'ֵיינְג'","def":"Moving from one annuity contract to another without paying tax. May trigger a surrender charge and start a new surrender period."},"FINRA Rule 2330":{"pr":"פִינְרָה רוּל טְוּוֶנְטִי-ת'ְרִי-ת'ֶרְטִי","def":"The self-regulator's standard for recommending deferred variable annuities: suitability checks, and a principal's review within 7 business days."}},"examWords":[["redeem / redemption","לפדות / פדיון","to redeem a coupon = לממש קופון. בקרנות: למכור בחזרה לקרן."],["outstanding (shares)","(מניות) במחזור","shares outstanding = כל המניות שבידי המשקיעים."],["proceeds","התמורה, הכסף שמתקבל","the proceeds of the sale = הכסף שקיבלת מהמכירה."],["at a discount","בהנחה, מתחת לשווי","The shirt is sold at a discount = החולצה נמכרת בהנחה."],["keeps in safekeeping","שומר בצורה בטוחה","A hotel safe keeps your passport in safekeeping."],["maintains records","מנהל רישומים","keeps the list up to date."],["direct her to","להפנות אותה ל","תגיד לה לאן ללכת או מה לקרוא."],["sends","שולח","She sends a check to the company = היא שולחת צ'ק לחברה."],["actually invested","מושקע בפועל","אחרי שירדו העמלות."],["generally may not exceed","בדרך כלל לא יעלה על","תקרה, עם חריגים."],["declines","יורד, קטן","Sales declined last year = המכירות ירדו בשנה שעברה."],["is MOST likely to cost less","הכי סביר שיעלה פחות","משווים את העלות הכוללת לאורך התקופה."],["combines","מצרף, מחבר יחד","She combines two recipes = היא מחברת שני מתכונים."],["to complete the purchases","להשלים את הקניות","לעמוד בהתחייבות עד הסוף."],["commission","עמלה","A salesperson earns a commission on each sale = מוכר מקבל עמלה על כל מכירה."],["operating expenses","הוצאות תפעול","The shop's operating expenses include rent and electricity = הוצאות התפעול של החנות כוללות שכירות וחשמל."],["bears the investment risk","נושא בסיכון ההשקעה","מי שמפסיד אם ההשקעה יורדת."],["purchase payments","תשלומי רכישה","Monthly purchase payments for a car = תשלומים חודשיים על קניית רכב."],["withdraws","מושך (כסף)","withdrawal = משיכה."],["nonqualified","שנקנה בכסף אחרי מס","לא בתוך חשבון פנסיה עם הטבת מס."],["taxable","חייב במס","the taxable part = החלק שמשלמים עליו מס."],["no later than","לא יאוחר מ","המועד האחרון."],["application","בקשה, טופס","a job application = טופס מועמדות לעבודה."],["supervisory","פיקוחי, של פיקוח","a supervisory role = תפקיד של פיקוח על אחרים."],["entity","גוף, ישות","A bank, a company and a government office are all entities. Which entity = איזה גוף."],["principal (3 meanings)","חתם / הכסף שהשקעת / מנהל מפקח","principal underwriter = חתם. lose principal = להפסיד מהכסף שהשקעת. registered principal = מנהל עם רישיון שמאשר עבודה של נציגים."],["exchange (3 meanings)","בורסה / מעבר בין קרנות / החלפת חוזה","stock exchange = בורסה. exchange privilege = מעבר בין קרנות באותה משפחה. 1035 exchange = החלפת חוזה ביטוח."],["regulator / to register","גוף מפקח / לרשום","A regulator writes and enforces rules. To register a car = לרשום רכב."],["changes her mind","מתחרטת, משנה את דעתה","I ordered pizza, then I changed my mind."],["representative / the firm","נציג / החברה (הברוקר)","The representative works for the firm and talks to customers."],["BEST describes / Which of the following","מתאר הכי טוב / מה מהבאים","Several options may be partly true. Choose the most complete one."],["safe","כספת; בטוח","Put the money in the safe = שים את הכסף בכספת."],["securities","ניירות ערך","Stocks and bonds are securities."]],"sorter":{"title":"איזה מבין ארבעת המוצרים?","ask":"Which product is it?","labels":["Open-end fund","Closed-end fund","UIT","Variable annuity"],"intro":"ארבעת המוצרים של הפרק, תמיד באותו סדר. שאלו קודם: מאיפה קונים ולאן מוכרים? יש תאריך סיום? יש חברת ביטוח?","table":"<table class=\"grid4\" dir=\"ltr\" lang=\"en\"><tr><td><b>Open-end fund</b><br>buy from / sell back to the fund<br>new shares any day<br>next NAV (forward pricing)</td><td><b>Closed-end fund</b><br>fixed shares from an IPO<br>trades on an exchange<br>premium or discount to NAV</td></tr><tr><td><b>UIT</b><br>one-time fixed units, redeemable<br>unmanaged, no board<br>set termination date</td><td><b>Variable annuity</b><br>insurance contract<br>subaccounts, value varies<br>surrender charges, tax-deferred</td></tr></table>","rule":"<p style='margin:4px 0 0'>בדיקה מהירה: חברת ביטוח? אנונה. תאריך סיום? UIT. בורסה במחיר שוק? קרן סגורה. מניות חדשות כל יום? קרן פתוחה.</p>","items":[["New shares are created whenever investors buy.","מניות חדשות נוצרות בכל פעם שמשקיעים קונים.",0],["A fixed number of shares is sold once in an IPO and then trades on an exchange.","מספר קבוע של מניות נמכר פעם אחת ב-IPO ואחר כך נסחר בבורסה.",1],["A fixed portfolio that ends on a set date.","תיק קבוע שמסתיים בתאריך קבוע.",2],["A contract with an insurance company whose value varies.","חוזה עם חברת ביטוח שהשווי שלו משתנה.",3],["Its share count grows whenever new investors put money in.","מספר המניות שלה גדל בכל פעם שמשקיעים חדשים מכניסים כסף.",0],["Shares may trade at a premium or a discount to NAV.","המניות יכולות להיסחר בפרמיה או בדיסקאונט ל-NAV.",1],["Has no board of directors or investment adviser.","אין לה דירקטוריון ואין לה יועץ השקעות.",2],["Has an accumulation phase and a payout phase.","יש לה שלב צבירה ושלב תשלומים.",3],["Class A, B and C shares are common here.","סוגי מניות A, B ו-C נפוצים כאן.",0],["Not required to buy back shares from investors.","לא חייבת לקנות בחזרה מניות ממשקיעים.",1],["Makes a one-time offering of redeemable interests.","מוכרת פעם אחת זכויות שניתנות לפדיון.",2],["Money is allocated among subaccounts.","הכסף מחולק בין תת-חשבונות.",3],["Investors buy newly created shares from it on any business day.","משקיעים קונים ממנה מניות חדשות בכל יום עסקים.",0],["May use leverage more than other investment company types.","יכולה להשתמש במינוף יותר משאר סוגי חברות ההשקעות.",1],["Does not actively trade its portfolio.","לא סוחרת באופן פעיל בתיק שלה.",2],["Withdrawals may trigger a surrender charge.","משיכות עלולות לגרור עמלת פדיון מוקדם.",3],["Breakpoints and letters of intent apply to its Class A shares.","breakpoints ומכתבי כוונות חלים על מניות ה-Class A שלה.",0],["Its market price is set by supply and demand.","מחיר השוק שלה נקבע לפי היצע וביקוש.",1],["At the end, remaining securities are sold and proceeds paid out.","בסוף
