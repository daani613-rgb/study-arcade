מוכרים את ניירות הערך שנשארו ומחלקים את הכסף.",2],["Earnings grow tax-deferred until withdrawn.","הרווחים גדלים בדחיית מס עד שמושכים.",3],["Continuously offers its shares to the public.","מציעה את המניות שלה לציבור כל הזמן.",0],["After its first offering, investors trade its shares with each other at market prices.","אחרי ההנפקה הראשונה, משקיעים סוחרים במניות שלה זה עם זה במחיר שוק.",1],["Investors get the proceeds of the remaining securities when it winds up.","המשקיעים מקבלים את התמורה מניירות הערך שנשארו כשהיא מסתיימת.",2],["A 1035 exchange can move it to another contract tax-free.","החלפת 1035 יכולה להעביר אותה לחוזה אחר בלי מס.",3],["Regulated by state insurance regulators as well as the SEC.","מפוקחת על ידי רשויות הביטוח של המדינה וגם על ידי ה-SEC.",3],["Shares are priced only by the fund, never by the market.","מחיר המניות נקבע רק על ידי הקרן, אף פעם לא בשוק.",0],["Has a free look period after purchase.","יש לה תקופת התחרטות אחרי הקנייה.",3],["Buys back its interests at about NAV, though some sponsors also make a market.","קונה בחזרה את הזכויות שלה בערך לפי ה-NAV, וחלק מנותני החסות גם עושים להן שוק.",2]]},"pairs":[{"a":"Back-end load (CDSC)","b":"Surrender charge","he":"אותו רעיון בשני מוצרים: עמלה על יציאה מוקדמת שיורדת עם השנים.","why":"","items":[["Applies to mutual fund shares.","חל על מניות של קרן נאמנות.","a"],["Charged on early withdrawals from an insurance contract.","נגבה על משיכות מוקדמות מחוזה ביטוח.","b"],["Many contracts allow a yearly free withdrawal amount.","הרבה חוזים מאפשרים סכום משיכה חופשי כל שנה.","b"],["Typical of Class B shares.","אופייני למניות Class B.","a"],["A 1035 exchange may start a new period of it.","החלפת 1035 עלולה להתחיל תקופה חדשה שלו.","b"]]},{"a":"Open-end fund","b":"Closed-end fund","he":"שני סוגי חברות ניהול. ההבדל: מאיפה קונים ולאן מוכרים.","why":"","items":[["Investors buy shares from the fund itself.","משקיעים קונים מניות מהקרן עצמה.","a"],["Investors buy shares from other investors on an exchange.","משקיעים קונים מניות ממשקיעים אחרים בבורסה.","b"],["Shares are redeemed at the next NAV.","המניות נפדות לפי ה-NAV הבא.","a"],["Shares may trade at a premium or a discount.","המניות יכולות להיסחר בפרמיה או בדיסקאונט.","b"],["Not required to buy back shares.","לא חייבת לקנות בחזרה מניות.","b"],["Keeps issuing new shares.","ממשיכה להנפיק מניות חדשות.","a"]]},{"a":"NAV","b":"POP","ta":"Net asset value (NAV)","tb":"Public offering price (POP)","he":"מחיר בלי עמלה ומחיר עם עמלה.","why":"","items":[["Total assets minus liabilities, divided by shares.","כל הנכסים פחות ההתחייבויות, חלקי מספר המניות.","a"],["Includes the sales charge.","כולל את דמי המכירה.","b"],["The price a Class A buyer pays.","המחיר ש-Class A משלם בקנייה.","b"],["The price used when shares are redeemed.","המחיר שמשמש כשמניות נפדות.","a"],["The sales charge percentage is figured on this price.","אחוז דמי המכירה מחושב מהמחיר הזה.","b"]]},{"a":"Front-end load","b":"Back-end load (CDSC)","he":"מתי משלמים את דמי המכירה: בכניסה או ביציאה.","why":"","items":[["Reduces the amount that buys shares.","מקטינים את הסכום שקונה מניות.","a"],["Charged on leaving the fund, not on joining it.","נגבים כשעוזבים את הקרן, לא כשמצטרפים.","b"],["Declines the longer the shares are held.","יורדים ככל שמחזיקים את המניות יותר זמן.","b"],["Breakpoints reduce it.","breakpoints מקטינים אותם.","a"]]},{"a":"Class A","b":"Class C","ta":"Class A shares","tb":"Class C shares (level load)","he":"שני הסוגים הנפוצים. אחד משלם בכניסה, השני כל שנה.","why":"","items":[["Front-end sales charge.","דמי מכירה בכניסה.","a"],["A charge collected every year.","עמלה שנגבית כל שנה.","b"],["Qualifies for breakpoint discounts.","זכאי להנחות breakpoint.","a"],["Higher 12b-1 fee.","דמי 12b-1 גבוהים יותר.","b"],["Often a small CDSC if sold within about a year.","לעתים קרובות CDSC קטן אם מוכרים תוך כשנה.","b"],["Usually better for a large, long-term investment.","בדרך כלל עדיף להשקעה גדולה ולטווח ארוך.","a"]]},{"a":"Right of accumulation","b":"Letter of intent","ta":"Right of accumulation (ROA)","tb":"Letter of intent (LOI)","he":"שתי דרכים להגיע ל-breakpoint: מה כבר יש, או מה מתחייבים.","why":"","items":[["Counts holdings the investor already has.","סופרת החזקות שכבר יש למשקיע.","a"],["A commitment to invest more over about 13 months.","התחייבות להשקיע עוד במשך כ-13 חודשים.","b"],["May include family members' accounts.","יכולה לכלול חשבונות של בני משפחה.","a"],["If the goal is missed, the higher charge may be collected.","אם לא עומדים ביעד, אפשר לגבות את דמי המכירה הגבוהים.","b"]]},{"a":"Management fee","b":"12b-1 fee","he":"שתי עמלות שנתיות מנכסי הקרן. על מה כל אחת משלמת?","why":"","items":[["Pays the investment adviser to run the portfolio.","משלמים ליועץ ההשקעות על ניהול התיק.","a"],["Goes to the person who picks the fund's securities.","הולכים למי שבוחר את ניירות הערך של הקרן.","a"],["Pays for marketing and selling fund shares.","משלמים על שיווק ומכירה של מניות הקרן.","b"],["FINRA caps it at 0.75% plus 0.25% for service.","FINRA מגבילה אותם ל-0.75% ועוד 0.25% לשירות.","b"],["Above 0.25%, the fund cannot call itself no-load.","מעל 0.25%, הקרן לא יכולה לקרוא לעצמה no-load.","b"]]},{"a":"Redemption fee","b":"Back-end load","tb":"Back-end load (CDSC)","he":"שתיהן נגבות במכירה לקרן. למי הולך הכסף?","why":"","items":[["Paid to the fund itself.","משולמת לקרן עצמה.","a"],["Compensates the broker.","מתגמלת את הברוקר.","b"],["Generally limited by the SEC to 2%.","בדרך כלל מוגבלת על ידי ה-SEC ל-2%.","a"],["Shrinks to zero over several years in one share class.","קטנה עד אפס במשך כמה שנים באחד מסוגי המניות.","b"]]},{"a":"Custodian","b":"Transfer agent","he":"שני נותני שירות לקרן. אחד שומר נכסים, השני מנהל את רשימת המחזיקים.","why":"","items":[["Holds the fund's securities.","מחזיק את ניירות הערך של הקרן.","a"],["Keeps the list of who owns how many shares.","מחזיק את הרשימה של מי מחזיק כמה מניות.","b"],["Distributes dividends to shareholders.","מחלק דיבידנדים למחזיקים.","b"],["A bank that holds the fund's securities.","בנק שמחזיק את ניירות הערך של הקרן.","a"]]},{"a":"Prospectus","b":"SAI","ta":"Prospectus / summary prospectus","tb":"Statement of Additional Information (SAI)","he":"מסמך הגילוי הבסיסי, ומסמך הפירוט.","why":"","items":[["Every fund must give it to investors.","כל קרן חייבת לתת אותו למשקיעים.","a"],["Provided free only on request.","ניתן בחינם רק לפי בקשה.","b"],["Contains the fee table near the beginning.","מכיל את טבלת העמלות קרוב להתחלה.","a"],["Goes deeper than the main disclosure document.","מעמיק יותר ממסמך הגילוי הראשי.","b"]]},{"a":"Fixed annuity","b":"Variable annuity","he":"מי מבטיח את התשואה: חברת הביטוח, או אף אחד.","why":"","items":[["The insurer guarantees a minimum rate.","חברת הביטוח מבטיחה ריבית מינימלית.","a"],["The owner's account rises and falls with the markets.","החשבון של הבעלים עולה ויורד עם השווקים.","b"],["Registered with the SEC and sold with a prospectus.","רשומה ב-SEC ונמכרת עם תשקיף.","b"],["Regulated only by the state insurance regulator, not registered with the SEC.","מפוקחת רק על ידי רשות הביטוח של המדינה, ולא רשומה ב-SEC.","a"],["The owner can lose principal.","בעל החוזה יכול להפסיד מהכסף שהשקיע.","b"]]},{"a":"Accumulation phase","b":"Annuitization","tb":"Annuitization (payout phase)","he":"שני השלבים של אנונה: משלמים, ואז מקבלים.","why":"","items":[["Purchase payments are made.","משלמים תשלומי רכישה.","a"],["The contract is turned into regular payments.","החוזה הופך לתשלומים קבועים.","b"],["Most contracts no longer allow withdrawals.","רוב החוזים כבר לא מאפשרים משיכות.","b"],["Surrender charges may apply to withdrawals.","עמלות פדיון מוקדם עשויות לחול על משיכות.","a"]]},{"a":"Surrender charge","b":"M&E charge","tb":"Mortality and expense (M&E) risk charge","he":"שתי עלויות של אנונה. אחת על משיכה מוקדמת, השנייה כל שנה.","why":"","items":[["Charged only on early withdrawals.","נגבית רק על משיכות מוקדמות.","a"],["Charged every year as a percent of contract value.","נגבית כל שנה כאחוז משווי החוזה.","b"],["Declines over the surrender period.","יורדת לאורך תקופת הפדיון המוקדם.","a"],["Pays the insurer for the insurance risks it takes.","משלמת לחברת הביטוח על הסיכונים הביטוחיים.","b"]]},{"a":"Free look","b":"1035 exchange","ta":"Free look period","he":"שתי דרכים לצאת מאנונה: לבטל בלי קנס, או להחליף בלי מס.","why":"","items":[["Cancel within a short time after purchase.","ביטול תוך זמן קצר אחרי הקנייה.","a"],["Moves the money to a new contract without tax.","מעבירה את הכסף לחוזה חדש בלי מס.","b"],["May start a new surrender period.","עלולה להתחיל תקופת פדיון מוקדם חדשה.","b"],["Usually 10 to 30 days.","בדרך כלל 10 עד 30 יום.","a"]]}]};</script>
<script>
const D=DATA, app=document.getElementById("app"), $=id=>document.getElementById(id);
const KEY=D.id;
let S={done:{},best:null,attempts:0};try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const toTop=()=>(document.body.classList.remove("athome"),window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}));
const L="ABCD";

/* ---------- v3: pronunciation (device voice, natural voices first) ---------- */
const W=D.words||{};
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Deranged|Hysterical|Pipe|Fred|Junior|Ralph|Grandpa|Grandma|Rocko|Eddy|Reed|Sandy|Shelley|Flo/i;
const WARM=[[/Natural|Neural/i,60],[/Premium/i,55],[/Enhanced/i,50],[/\bAva\b/i,40],[/Samantha/i,34],[/Allison|Susan|Zoe|Nicky|Evan|Joelle|Noelle/i,30],[/Aria|Jenny|Michelle/i,38],[/Google US English/i,32],[/Google UK English Female/i,24]];
function scoreVoice(x){if(!/^en/i.test(x.lang)||NOVELTY.test(x.name))return -1;let sc=/en[-_]US/i.test(x.lang)?20:/en[-_](GB|AU|CA|IE|NZ)/i.test(x.lang)?12:6;WARM.forEach(([r,w])=>{if(r.test(x.name))sc+=w});return sc}
let voice=null;const canSpeak="speechSynthesis" in window;
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(x=>scoreVoice(x)>=0).sort((a,b)=>scoreVoice(b)-scoreVoice(a));voice=v[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(t){try{if(!canSpeak)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/\s*\/\s*/g,", ").replace(/\(|\)/g,", "));if(voice)u.voice=voice;u.lang="en-US";u.rate=.88;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener("click",e=>{const b=e.target.closest(".saybtn,.story .en");if(b){speak(b.dataset.say||b.textContent)}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".story .en")){e.preventDefault();speak(e.target.textContent)}});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const sayBtn=t=>canSpeak?`<button class="saybtn" data-say="${esc(t)}" aria-label="Hear: ${esc(t)}" lang="en">🔊</button>`:"";
const ALLT=D.lessons.flatMap((l,i)=>l.terms.map(t=>({t,li:i})));
const termLi=n=>{const x=ALLT.find(x=>x.t[0]===n);return x?x.li:-1};
const hasDefs=ALLT.some(x=>W[x.t[0]]&&W[x.t[0]].def);
const smooth=()=>matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth";
function focusPanel(){const p=app.querySelector(".panel");if(p){p.setAttribute("tabindex","-1");p.focus({preventScroll:true})}}
S.miss=S.miss||{};S.ld=S.ld||{};
/* missed words come back after 1, 3 and 7 days (local calendar days) */
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5);
const GAPS=[1,3,7];
Object.keys(S.miss).forEach(k=>{if(typeof S.miss[k]!=="object")S.miss[k]={b:0,due:today()}});
function markMiss(term){S.miss[term]={b:0,due:today()};save()}
function markHit(term){const m=S.miss[term];if(!m||m.due>today())return;if(m.b>=GAPS.length)delete S.miss[term];else{m.due=today()+GAPS[m.b];m.b++}save()}
const bidi=h=>String(h).replace(/(\d+½)/g,"\u2066$1\u2069").replace(/[A-Za-z][A-Za-z0-9 .'\/&$%-]*[A-Za-z0-9%]/g,m=>`<bdi lang="en">${m}</bdi>`);
const termCard=(t,li)=>{const w=W[t[0]]||{};return `<div class="term"><div class="t-top">${sayBtn(t[0])}<span class="t-en" lang="en">${t[0]}</span></div>
  ${w.pr?`<span class="t-pr">הגייה: ${w.pr}</span>`:""}${w.def?`<p class="t-def" lang="en" dir="ltr">${w.def}</p>`:""}
  <span class="t-he">${bidi(t[1])}${li!=null?` <span class="muted" style="font-weight:400;font-size:.85rem">(שיעור ${li+1})</span>`:""}</span><p>${bidi(t[2])}</p>${w.hint?`<p class="t-hint">💡 ${bidi(w.hint)}</p>`:""}</div>`};
const lessonBtn=(id,icon,title,sub,st,stCls,extra)=>`<button class="lesson${extra||""}" id="${id}"><span class="n" aria-hidden="true">${icon}</span><span><span class="h3">${title}</span><small lang="en">${sub}</small></span><span class="st${stCls||""}">${st}</span></button>`;

/* ---------- home ---------- */
function home(){
  document.body.classList.add("athome");setTimeout(()=>{const h=app.querySelector("h1");if(h){h.tabIndex=-1;h.focus({preventScroll:true})}},0);
  const n=D.lessons.filter(l=>S.done[l.id]).length;const inList=Object.keys(S.miss).filter(k=>ALLT.some(x=>x.t[0]===k));const weak=inList.filter(k=>S.miss[k].due<=today());const later=inList.length-weak.length;
  app.innerHTML=`<div><span class="eyebrow" lang="en">SIE · ${D.section}</span><h1>${D.heTitle}</h1>
   <p class="muted" style="margin:6px 0 0">${D.lessons.length} שיעורים. בכל שיעור: סיפור, כרטיסי מילים${hasDefs?" עם הגייה והגדרה באנגלית":""}, תרגול מילים ובדיקה קטנה. אחר כך תרגול לפני המבחן, ובסוף מבחן בסגנון FINRA.${canSpeak?" אפשר ללחוץ על כל מונח באנגלית כדי לשמוע אותו.":""}</p></div>
  <div class="row"><span class="pill">${n} / ${D.lessons.length} שיעורים</span>${S.practice!=null?`<span class="pill">תרגול: ${S.practice}%</span>`:""}${S.best!=null?`<span class="pill">מבחן: ${S.best}%</span>`:""}</div>
  <h2 class="section">שלב 1: השיעורים</h2>
  <div class="lessons">${D.lessons.map((l,i)=>`<button class="lesson" data-i="${i}"><span class="n" aria-hidden="true">${i+1}</span><span><span class="h3">${l.he}</span><small lang="en">${l.en}</small></span><span class="st${S.done[l.id]?" done":""}">${S.done[l.id]?"✓ נלמד"+(S.ld[l.id]!=null?` · מילים ${S.ld[l.id]}%`:""):"התחל"}</span></button>`).join("")}</div>
  <h2 class="section">שלב 2: לחבר את המילים באנגלית</h2>
  <div class="lessons">
   ${weak.length?lessonBtn("weak","!",`מילים שפספסתי: לחזור&nbsp;היום&nbsp;(${weak.length})`,"Missed words come back after 1, 3 and 7 days","התחל"," mid"):""}
   ${later?`<p class="muted" style="margin:0">${weak.length?"ועוד ":""}${later} ${later===1?"מילה שפספסת תחזור":"מילים שפספסת יחזרו"} בימים הבאים. מילה יוצאת מהרשימה אחרי שעונים עליה נכון ב-4 ימים שונים.</p>`:""}
   ${lessonBtn("allwords","Aa","כל המילים, לפי שיעורים",hasDefs?"Definition → term · term → definition · term → עברית":"Term → עברית",S.words!=null?"✓ "+S.words+"%":"בחר",S.words!=null?" done":"")}
   ${D.pairs?lessonBtn("pairs","⇄","צמדים מבלבלים",D.pairs.map(p=>p.a.replace(/ \(.*\)/,"")+" / "+p.b).slice(0,2).join(" · ")+" …",S.pairs!=null?"✓ "+S.pairs+"%":"התחל",S.pairs!=null?" done":""):""}
   ${D.sorter?lessonBtn("sorter","⊞",D.sorter.title,D.sorter.labels.join(" · "),S.sorter!=null?"✓ "+S.sorter+"%":"התחל",S.sorter!=null?" done":""):""}
   ${D.examWords?lessonBtn("examwords","?","האנגלית של המבחן",D.examWords.slice(0,4).map(e=>e[0]).join(" · "),S.ew!=null?"✓ "+S.ew+"%":"התחל",S.ew!=null?" done":""):""}
  </div>
  <h2 class="section">שלב 3: תרגול ומבחן</h2>
  <div class="lessons">
   ${lessonBtn("practice","↻","תרגול מעורב באנגלית","20 questions · missed ones come back",S.practice!=null?S.practice+"%":"התחל",S.practice>=80?" done":S.practice!=null?" mid":"")}
   ${D.calcs?lessonBtn("calc","%","תרגול חישובים","New numbers every round · step-by-step solutions",S.calc!=null?S.calc+"%":"התחל",S.calc>=80?" done":S.calc!=null?" mid":""):""}
   ${lessonBtn("exam","★","מבחן הפרק",`${D.exam.length} FINRA-style questions · pass = 70%`,"התחל",""," cta")}
   ${lessonBtn("gloss","אב","מילון מונחים","All terms"+(canSpeak?", with 🔊":""),"פתח")}</div>`;
  app.querySelectorAll(".lesson[data-i]").forEach(b=>b.onclick=()=>story(+b.dataset.i,0));
  $("exam").onclick=examIntro;$("gloss").onclick=glossary;$("practice").onclick=practice;$("allwords").onclick=allWords;
  if($("pairs"))$("pairs").onclick=pairs;if($("calc"))$("calc").onclick=calcHome;if($("sorter"))$("sorter").onclick=sorter;
  if($("examwords"))$("examwords").onclick=()=>runDrill(examWordItems(),"האנגלית של המבחן",r=>{S.ew=r;save()},home);
  if($("weak"))$("weak").onclick=()=>runDrill(wordItems(weak.map(k=>ALLT.find(x=>x.t[0]===k).t)),"מילים שפספסתי",null,home);
}

function story(li,si){
  const Lz=D.lessons[li],s=Lz.story[si];toTop();
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">→ לתפריט</button><span class="pill">שיעור ${li+1}: ${Lz.he}</span></div>

  why:v==="gain"?`call מכוסה: אם המניה עולה מעל ${K}, יממשו לו והוא ימכור ב-${K}. שלב 1: ${K} − ${C} = ${K-C} רווח על המניה. שלב 2: ועוד הפרמיה: ${K-C} + ${pr} = ${r2(K-C+pr)}. שלב 3: × 100 = ${usd(mg)}.`:v==="be"?`הפרמיה מורידה את העלות של המניה: ${C} − ${pr} = ${usd(be)}.`:`המקרה הגרוע: המניה יורדת לאפס. הפרמיה מקטינה את ההפסד: (${C} − ${pr}) × 100 = ${usd(ml)}. ה-call לא מגן מירידה.`}}},
 opp:{t:"put מגן",f:"Protective put: max loss = stock cost − strike + premium; breakeven = stock cost + premium; max gain unlimited",x:"Buy at $62, buy 60 put at 3: max loss $500, breakeven $65",g(){const C=Rn([42,47,53,58,66,72,84]),K=Math.floor((C-1)/5)*5-Rn([0,5]),pr=Rn([1,1.5,2,2.5,3,4]),v=Rn(["loss","loss","be","gain"]);
  const ml=(C-K+pr)*100,be=C+pr;const ok=v==="loss"?usd(ml):v==="be"?usd(be):"Unlimited";
  const q=v==="loss"?["maximum loss","ההפסד המקסימלי"]:v==="be"?["breakeven point","נקודת האיזון"]:["maximum gain","הרווח המקסימלי"];
  return {en:`An investor buys 100 shares at $${C} and buys one ${K} put at ${pr}. What is the ${q[0]}?`,he:`משקיע קונה 100 מניות ב-${C} דולר וקונה put אחד עם מחיר מימוש ${K} בפרמיה של ${pr}. מה ${q[1]}?`,
  ok,must:v==="be"?[]:["Unlimited"],bad:v==="be"?[usd(C-pr),usd(C),usd(C+2*pr),usd(C-2*pr),usd(C+pr+1),usd(C-pr-1)]:[usd(ml),usd(pr*100),usd((C-K)*100),usd((K-pr)*100),usd((C+pr)*100)],
  why:v==="loss"?`גם אם המניה קורסת, הוא יכול למכור ב-${K}. שלב 1: ${C} − ${K} = ${C-K} הפסד על המניה. שלב 2: ועוד הפרמיה: ${C-K} + ${pr} = ${r2(C-K+pr)}. שלב 3: × 100 = ${usd(ml)}.`:v==="be"?`המניה צריכה לעלות מספיק כדי לכסות גם את "הביטוח": ${C} + ${pr} = ${usd(be)}.`:`הוא עדיין מחזיק את המניות, ומחיר מניה יכול לעלות בלי גבול. ה-put רק מגביל את הירידה.`}}},
 ocash:{t:"סילוק במזומן של אופציית מדד",f:"Cash paid on exercise = in-the-money amount × multiplier",x:"3 points in the money × 100 = $300",g(){const L=Rn([2150,2340,2480,2610,2790]),call=Math.random()<.5,d=Rn([5,8,12,15,20,25]),K=call?L-d:L+d;
  return {en:`An index ${call?"call":"put"} with a strike of ${K} and a multiplier of 100 is exercised when the index is at ${L}. How much cash does the assigned writer pay?`,he:`אופציית ${call?"call":"put"} על מדד, עם מחיר מימוש ${K} ומכפיל 100, ממומשת כשהמדד ב-${L}. כמה מזומן משלם הכותב שקיבל הקצאה?`,
  ok:usd(d*100),bad:[usd(d),usd(d*10),usd((d+3)*100),usd(Math.max(1,d-2)*100),usd((d+7)*100)],why:`אופציה על מדד מסולקת במזומן. שלב 1: כמה היא בתוך הכסף: ${call?`${L} − ${K}`:`${K} − ${L}`} = ${d} נקודות. שלב 2: כפול המכפיל: ${d} × 100 = ${usd(d*100)}.`}}},
 /* chapter 4: packaged products */
 f4nav:{t:"NAV למניה",f:"NAV per share = (total assets − total liabilities) ÷ shares outstanding",x:"($100M − $10M) ÷ 9M = $10",g(){const sh=Rn([2,3,5,6,8]),nav=Rn([11,12.5,14,16,24,30]),L=Rn([1,2,3,6]),A=nav*sh+L;
  return {en:`A fund has total assets of $${A} million, liabilities of $${L} million and ${sh} million shares outstanding. What is the NAV per share?`,he:`לקרן נכסים של ${A} מיליון דולר, התחייבויות של ${L} מיליון ו-${sh} מיליון מניות. מה ה-NAV למניה?`,
  ok:usd(nav),bad:[usd(A/sh),usd((A+L)/sh),usd(nav-1),usd(nav-.5),usd((A-L)/(sh+1)),usd(nav+1)],why:`שלב 1: נכסים פחות התחייבויות: ${A} − ${L} = ${A-L} מיליון. שלב 2: חלקי מספר המניות: ${A-L} ÷ ${sh} = ${usd(nav)}. טעות נפוצה: לשכוח את ההתחייבויות (${A} ÷ ${sh} = ${usd(A/sh)}).`}}},
 f4pop:{t:"מחיר ההצעה (POP)",f:"POP = NAV ÷ (1 − sales charge %), because the charge is a percent of POP",x:"NAV $10, 5% → $10 ÷ 0.95 = $10.53",g(){const ld=Rn([2.5,3,4.5,5.75,6,7.5]),nav=Rn([11,13.5,16,21,23.5,28,33]),pop=r2(nav/(1-ld/100)),v=Math.random()<.6;
  if(v)return {en:`A fund's NAV is $${nav.toFixed(2)} and its sales charge is ${ld}% of the public offering price. What is the POP?`,he:`ה-NAV של קרן הוא ${nav.toFixed(2)} דולר, ודמי המכירה ${ld}% ממחיר ההצעה לציבור. מה ה-POP?`,
   ok:usd(nav/(1-ld/100)),bad:[usd(nav*(1+ld/100)),usd(nav*(1-ld/100)),usd(nav),usd(nav/(1-ld/50)),usd(nav+ld/100),usd(nav*(1+ld/200))],why:`האחוז מחושב מה-POP, ולכן ה-NAV הוא מה שנשאר: ${100-ld}% מה-POP. שלב 1: 1 − ${(ld/100).toFixed(4).replace(/0+$/,"")} = ${(1-ld/100).toFixed(4).replace(/0+$/,"")}. שלב 2: POP = ${nav.toFixed(2)} ÷ ${(1-ld/100).toFixed(4).replace(/0+$/,"")} = ${usd(nav/(1-ld/100))}. טעות נפוצה: להכפיל ב-${(1+ld/100).toFixed(4).replace(/0+$/,"")}.`};
  return {en:`A fund's POP is $${pop.toFixed(2)} and its NAV is $${nav.toFixed(2)}. What is the sales charge as a percentage of the POP?`,he:`ה-POP של קרן הוא ${pop.toFixed(2)} דולר, וה-NAV שלה ${nav.toFixed(2)} דולר. מה דמי המכירה באחוזים מה-POP?`,
   ok:pc((pop-nav)/pop*100),bad:[pc((pop-nav)/nav*100),pc((pop-nav)*10)].concat(shuffle([pc(ld+1.25),pc(Math.max(1,ld-.75)),pc(ld+.5),pc(Math.max(1,ld-1.5))]).slice(0,2)),why:`שלב 1: דמי המכירה בדולרים: ${pop.toFixed(2)} − ${nav.toFixed(2)} = ${usd(pop-nav)}. שלב 2: חלקי ה-POP (לא ה-NAV): ${usd(pop-nav)} ÷ ${usd(pop)} = ${pc((pop-nav)/pop*100)}.`}}},
 f4net:{t:"כמה מושקע אחרי דמי כניסה",f:"Amount invested = amount paid − (amount paid × front-end load %)",x:"$10,000 with a $500 load → $9,500 invested",g(){const P=Rn([8000,12000,15000,20000,40000,60000]),ld=Rn([2,3,4.5,5,5.5]),fee=P*ld/100;
  return {en:`An investor sends $${nm(P)} to buy shares of a fund with a ${ld}% front-end load. How much is actually invested in shares?`,he:`משקיע שולח ${nm(P)} דולר לקנות מניות של קרן עם דמי כניסה של ${ld}%. כמה מושקע בפועל במניות?`,
  ok:usd(P-fee),bad:[usd(P),usd(P+fee),usd(P-2*fee),usd(P/(1+ld/100)),usd(P-fee/2),usd(P-1.5*fee)],why:`דמי הכניסה יורדים מהסכום ששולם. שלב 1: ${nm(P)} × ${ld}% = ${usd(fee)}. שלב 2: ${nm(P)} − ${usd(fee)} = ${usd(P-fee)}.`}}},
 f4disc:{t:"פרמיה או דיסקאונט בקרן סגורה",f:"Market price above NAV = premium; below NAV = discount; difference = |price − NAV|",x:"NAV $20, price $18 → discount of $2",g(){const nav=Rn([9,11,12.5,16,22,26]),d=Rn([.3,.45,.6,.9,1.2,1.5]),prem=Math.random()<.35,px=r2(prem?nav+d:nav-d);
  return {en:`A closed-end fund has an NAV of $${nav.toFixed(2)}, and its shares trade at $${px.toFixed(2)}. The shares trade at:`,he:`לקרן סגורה NAV של ${nav.toFixed(2)} דולר, והמניות שלה נסחרות ב-${px.toFixed(2)} דולר. המניות נסחרות ב:`,
  ok:`A ${prem?"premium":"discount"} of ${usd(d)}`,bad:[`A ${prem?"discount":"premium"} of ${usd(d)}`,`A ${prem?"premium":"discount"} of ${usd(d+.2)}`,`A ${prem?"discount":"premium"} of ${usd(Math.max(.1,d-.15))}`,`A ${prem?"premium":"discount"} of ${usd(Math.max(.1,d-.2))}`,`A ${prem?"discount":"premium"} of ${usd(d+.25)}`],why:`המחיר ${prem?"מעל":"מתחת ל"}-NAV, ולכן זה ${prem?"פרמיה":"דיסקאונט"}. הפרש: ${prem?`${px.toFixed(2)} − ${nav.toFixed(2)}`:`${nav.toFixed(2)} − ${px.toFixed(2)}`} = ${usd(d)}.`}}},
 f4exp:{t:"עלות יחס ההוצאות",f:"Yearly cost ≈ amount invested × expense ratio",x:"$20,000 × 0.80% = $160",g(){const B=Rn([10000,15000,25000,30000,50000,80000]),er=Rn([.25,.4,.5,.75,.9,1.1,1.25]),c=B*er/100;
  return {en:`A fund's expense ratio is ${er}%. An investor holds $${nm(B)} in the fund for a year. About how much do operating expenses cost that year?`,he:`יחס ההוצאות של קרן הוא ${er}%. משקיע מחזיק ${nm(B)} דולר בקרן במשך שנה. בערך כמה עולות ההוצאות השנתיות?`,
  ok:usd(c),bad:[usd(B*er/10),usd(B*er/1000),usd(B*(er+.25)/100),usd(B*Math.max(.1,er-.2)/100),usd((B+5000)*er/100),usd(Math.max(1000,B-5000)*er/100)],why:`שלב 1: ${er}% = ${+(er/100).toFixed(4)}. שלב 2: ${nm(B)} × ${+(er/100).toFixed(4)} = ${usd(c)}. העלות לא נגבית כחיוב נפרד: היא יורדת מתוך שווי הקרן.`}}},
 f4surr:{t:"עמלת פדיון מוקדם",f:"Surrender charge = % for that contract year × amount subject to the charge (amount withdrawn − free withdrawal)",x:"7% schedule example: $10,000 in year 1 → $700",g(){const y=Rn([1,2,3,4,5,6]),pct=8-y,V=Rn([40000,50000,60000,80000]),W=Rn([6000,9000,12000,15000,20000]),free=Math.random()<.5,fa=free?V*.1:0,sub=Math.max(0,W-fa),c=sub*pct/100;
  return {en:`A variable annuity's surrender charge starts at 7% in year 1 and falls 1% each year. In year ${y}, the owner withdraws $${nm(W)} from a contract worth $${nm(V)}. ${free?"The contract allows 10% of its value each year free of surrender charges.":"There is no free withdrawal amount."} What is the surrender charge?`,he:`עמלת הפדיון המוקדם של אנונה משתנה מתחילה ב-7% בשנה הראשונה ויורדת ב-1% כל שנה. בשנה ${y} הבעלים מושך ${nm(W)} דולר מחוזה ששווה ${nm(V)} דולר. ${free?"החוזה מאפשר למשוך 10% מהשווי כל שנה בלי עמלה.":"אין סכום משיכה חופשי."} מה עמלת הפדיון?`,
  ok:usd(c),bad:[usd(W*pct/100),usd(Math.max(sub,1000)*(pct+1)/100),usd(W*7/100),usd(Math.max(sub,1000)*Math.max(1,pct-1)/100),usd(V*pct/100),usd(fa*pct/100||W*(pct+2)/100)],why:`שלב 1: האחוז בשנה ${y}: 7 − ${y-1} = ${pct}%. שלב 2: ${free?(W<=fa?`הסכום החופשי: 10% × ${nm(V)} = ${usd(fa)}. כל המשיכה (${usd(W)}) בתוך הסכום החופשי, ולכן אין עמלה.`:`הסכום החופשי: 10% × ${nm(V)} = ${usd(fa)}. חייב בעמלה: ${nm(W)} − ${usd(fa)} = ${usd(sub)}. שלב 3: ${usd(sub)} × ${pct}% = ${usd(c)}.`):`כל ${usd(W)} חייבים בעמלה. שלב 3: ${usd(sub)} × ${pct}% = ${usd(c)}.`}`}}},
 f4tax:{t:"מס על משיכה מאנונה",f:"Before annuitization, earnings come out first and are taxed as ordinary income; before 59½, +10% on the taxable part",x:"Paid $40,000, worth $52,000, withdraw $15,000 → $12,000 taxable",g(){const C=Rn([20000,25000,50000,60000]),gain=Rn([4000,6000,10000,15000]),V=C+gain,W=Rn([3000,7000,9000,18000,20000]),tx=Math.min(W,gain),age=Rn([45,48,55,57,62,66]),pen=age<59.5,askPen=pen&&Math.random()<.5;
  if(askPen)return {en:`A ${age}-year-old paid $${nm(C)} into a nonqualified variable annuity now worth $${nm(V)}. She withdraws $${nm(W)} before annuitizing. No exception applies. What is the 10% additional tax?`,he:`בת ${age} שילמה ${nm(C)} דולר לאנונה משתנה שנקנתה בכסף אחרי מס, והיא שווה עכשיו ${nm(V)} דולר. היא מושכת ${nm(W)} לפני שלב קבלת הקצבה. אין חריג. מה המס הנוסף של 10%?`,
   ok:usd(tx*.1),bad:[usd(W*.1),usd(gain*.1),usd(W*gain/V*.1),usd(V*.1)].concat(W>gain?[usd((W-gain)*.1)]:[usd(tx*.1+200)]),why:`שלב 1: הרווח: ${nm(V)} − ${nm(C)} = ${nm(gain)}. שלב 2: הרווחים יוצאים קודם, אז החלק החייב במס: ${usd(tx)}${W>gain?` (השאר, ${usd(W-gain)}, הוא החזר של הכסף שלה)`:""}. שלב 3: היא מתחת ל-59½: 10% × ${usd(tx)} = ${usd(tx*.1)}.`};
  return {en:`A ${age}-year-old paid $${nm(C)} into a nonqualified variable annuity now worth $${nm(V)}. She withdraws $${nm(W)} before annuitizing. How much of the withdrawal is taxable as ordinary income?`,he:`בת ${age} שילמה ${nm(C)} דולר לאנונה משתנה שנקנתה בכסף אחרי מס, והיא שווה עכשיו ${nm(V)} דולר. היא מושכת ${nm(W)} לפני שלב קבלת הקצבה. כמה מהמשיכה חייב במס כהכנסה רגילה?`,
   ok:usd(tx),bad:[usd(0),usd(W),usd(gain),usd(W*gain/V),usd(Math.max(0,W-gain))],why:`שלב 1: הרווח בחוזה: ${nm(V)} − ${nm(C)} = ${nm(gain)}. שלב 2: לפני שלב קבלת הקצבה, הרווחים יוצאים קודם. היא מושכת ${nm(W)}, ולכן החלק החייב במס הוא ${W>gain?`כל הרווח, ${usd(gain)}. השאר הוא החזר של הכסף שלה, בלי מס`:`כל הסכום, ${usd(W)}, כי הוא כולו מתוך הרווח`}.${pen?" ובגלל שהיא מתחת ל-59½, יש גם מס נוסף של 10% על החלק הזה.":""}`}}},
 f4roa:{t:"breakpoint עם זכות צבירה",f:"With ROA, existing holdings + new purchase decide the breakpoint level",x:"Example schedule: under $50,000 5%; $50,000+ 4%; $100,000+ 3%",g(){const mode=Rn(["same","one","one","two"]),buy=mode==="one"&&Math.random()<.5?Rn([55000,70000,85000]):Rn([15000,20000,30000,40000]),have=mode==="same"?Rn([5000,10000]):mode==="two"?100000-buy+Rn([0,5000,10000]):(buy>=50000?100000:50000)-buy+Rn([0,5000,10000,15000]),tot=have+buy,r=tot>=100000?3:tot>=50000?4:5;
  return {en:`A fund's example schedule: under $50,000, 5%; $50,000 to $99,999, 4%; $100,000 or more, 3%. An investor already holds $${nm(have)} in the fund family and buys $${nm(buy)} more. With rights of accumulation, what sales charge rate applies to the new purchase?`,he:`טבלת דוגמה של קרן: עד 50,000 דולר: 5%; מ-50,000 עד 99,999: 4%; מ-100,000: 3%. למשקיע כבר יש ${nm(have)} דולר במשפחת הקרנות, והוא קונה עוד ${nm(buy)}. עם זכות צבירה, איזה שיעור דמי מכירה חל על הקנייה החדשה?`,
  ok:r+"%",n:2,bad:["5%","4%","3%"],why:`עם ROA סופרים גם את מה שכבר יש: ${nm(have)} + ${nm(buy)} = ${nm(tot)}. לפי הטבלה: ${tot>=100000?"100,000 ומעלה, ולכן 3%":tot>=50000?"בין 50,000 ל-99,999, ולכן 4%":"מתחת ל-50,000, ולכן 5%"}.`}}},
 /* chapter 1 */
 cumvote:{t:"הצבעה מצטברת ורגילה",f:"Cumulative: total votes = shares × seats, any split. Statutory: at most (shares) votes per candidate",x:"500 shares × 4 seats = 2,000 votes",g(){const s=Rn([100,200,300,500,1000,2500,10000]),k=Rn([3,4,5,6]),v=Rn([0,1,2]);
  const base=`שלב 1: כל מניה נותנת קול אחד לכל מושב פנוי. שלב 2: ${nm(s)} מניות × ${k} מושבים = ${nm(s*k)} קולות בסך הכל, בשתי השיטות. שלב 3: ההבדל הוא איך מחלקים: `;
  if(v===0)return {en:`A shareholder owns ${nm(s)} shares. ${k} directors are being elected. Under cumulative voting, how many votes does the shareholder have in total?`,he:`לבעל מניות יש ${nm(s)} מניות. בוחרים ${k} דירקטורים. בהצבעה מצטברת, כמה קולות יש לו בסך הכל?`,ok:nm(s*k),bad:[nm(s),nm(s*(k+1)),nm(s+k),nm(s*(k-1)),nm(s/2)],why:base+`ב-cumulative אפשר לחלק אותם איך שרוצים, גם הכל על מועמד אחד.`};
  if(v===1)return {en:`A shareholder owns ${nm(s)} shares. ${k} directors are being elected. Under statutory voting, what is the most votes the shareholder can give one candidate?`,he:`לבעל מניות יש ${nm(s)} מניות. בוחרים ${k} דירקטורים. בהצבעה רגילה, כמה קולות לכל היותר הוא יכול לתת למועמד אחד?`,ok:nm(s),bad:[nm(s*k),nm(s*(k-1)),nm(k),nm(s/k),nm(s*2)],why:base+`ב-statutory כל מושב מצביעים לבד, ולכל מושב יש לו רק ${nm(s)} קולות. לכן מועמד אחד מקבל ממנו לכל היותר ${nm(s)}.`};
  return {en:`A shareholder owns ${nm(s)} shares. ${k} directors are being elected. Under cumulative voting, what is the most votes the shareholder can give one candidate?`,he:`לבעל מניות יש ${nm(s)} מניות. בוחרים ${k} דירקטורים. בהצבעה מצטברת, כמה קולות לכל היותר הוא יכול לתת למועמד אחד?`,ok:nm(s*k),bad:[nm(s),nm(s*(k-1)),nm(s+k),nm(s*(k+1)),nm(s/2)],why:base+`ב-cumulative מותר לשים את כל ${nm(s*k)} הקולות על מועמד אחד. זה מה שעוזר לבעלי מניות מיעוט.`}}},
 prefdiv:{t:"דיבידנד של מניית בכורה",f:"Annual dividend per share = stated rate × liquidation preference",x:"6% × $100 = $6 a year",g(){const w=Rn(WHO),lp=Rn([25,50,100]),r=Rn([4,5,6,7,8]),n=Rn([100,200,500]),per=lp*r/100;
  return {en:`${w[0]} owns ${n} preferred shares with a $${lp} liquidation preference and a ${r}% stated dividend rate. What are ${w[3]} total yearly dividends, if all are paid?`,he:`ל${w[1]} יש ${n} מניות בכורה עם ערך פירוק של ${lp} דולר ושיעור דיבידנד נקוב של ${r}%. כמה דיבידנד בשנה בסך הכל, אם הכל משולם?`,
  ok:usd(per*n),bad:[usd(per),usd(r*n),usd(per*n/4),usd(per*n*2),usd(per*n/2)],why:`שלב 1: דיבידנד למניה = ${r}% × $${lp} = ${usd(per)} לשנה. שלב 2: כפול מספר המניות: ${usd(per)} × ${n} = ${usd(per*n)}.`}}},
 arrears:{t:"דיבידנדים שלא שולמו",f:"Cumulative: all skipped dividends + this year's, before any common dividend. Non-cumulative: only this year's",x:"$6 a year, 2 years skipped → $18",g(){const r=Rn([4,5,6,7,8]),y=Rn([1,2,3]),cum=Math.random()<.6;
  return {en:`A company skipped the dividend on its $100, ${r}% ${cum?"cumulative":"non-cumulative"} preferred stock for the past ${y} year${y>1?"s":""}. Before it may pay any common dividend this year, how much must it pay per preferred share?`,he:`חברה דילגה על הדיבידנד של מניית הבכורה ${cum?"המצטברת":"הלא מצטברת"} שלה (100 דולר, ${r}%) ב-${y} השנים האחרונות. כמה עליה לשלם לכל מניית בכורה לפני שתשלם השנה דיבידנד כלשהו למניות הרגילות?`,
  ok:usd(cum?r*(y+1):r),bad:cum?[usd(r),usd(r*y),usd(r*(y+2)),"$0"]:[usd(r*(y+1)),usd(r*(y+2)),"$0",usd(r*2+1)],why:`שלב 1: דיבידנד לשנה = ${r}% × $100 = ${usd(r)}. שלב 2: ${cum?`cumulative = מה שדולג נשאר חוב (in arrears): ${y} × ${usd(r)} = ${usd(r*y)}. שלב 3: ועוד השנה הנוכחית: ${usd(r*y)} + ${usd(r)} = ${usd(r*(y+1))}.`:`non-cumulative = מה שדולג לא נצבר. רק הדיבידנד של השנה: ${usd(r)}.`}`}}},
 conv:{t:"המרת מניית בכורה",f:"Common shares received = liquidation preference ÷ conversion price",x:"$100 ÷ $25 = 4 shares",g(){const cp=Rn([10,12.5,20,25,40,50]),m=r2(cp*Rn([.8,1.2,1.5])),sh=100/cp;
  return {en:`A convertible preferred share has a $100 liquidation preference and a ${usd(cp)} conversion price. The common stock trades at ${usd(m)}. How many common shares does one preferred share convert into?`,he:`למניית בכורה ניתנת להמרה יש ערך פירוק של 100 דולר ומחיר המרה של ${cp} דולר. המניה הרגילה נסחרת ב-${m} דולר. לכמה מניות רגילות מומרת מניית בכורה אחת?`,
  ok:String(r2(sh)),bad:[String(r2(100/m)),String(r2(sh*2)),String(r2(sh/2)),String(r2(cp)),String(r2(sh+1))],why:`מספר המניות = ערך הפירוק ÷ מחיר ההמרה = $100 ÷ ${usd(cp)} = ${r2(sh)}. מחיר השוק (${usd(m)}) לא נכנס לחישוב: הוא רק פיתיון.`}}},
 vol144:{t:"מגבלת הכמות ב-Rule 144",f:"Affiliate, per 3 months: the greater of 1% of shares outstanding or average weekly volume (last 4 weeks)",x:"8,000,000 shares → 1% = 80,000",g(){const O=Rn([4,6,8,10,20,50])*1e6,one=O/100,V=Math.round(one*Rn([.5,.8,1.3,1.6])/1000)*1000;
  return {en:`An affiliate wants to sell under Rule 144. The company has ${nm(O)} shares outstanding. The stock is listed on an exchange, and its average weekly reported trading volume over the 4 weeks before the Form 144 filing was ${nm(V)} shares. What is the most the affiliate may sell in a 3-month period?`,he:`בעל שליטה רוצה למכור לפי Rule 144. לחברה ${nm(O)} מניות במחזור. המניה רשומה למסחר בבורסה, ומחזור המסחר השבועי הממוצע ב-4 השבועות האחרונים היה ${nm(V)} מניות. מה הכמות המקסימלית שמותר לו למכור בתקופה של 3 חודשים?`,
  ok:nm(Math.max(one,V))+" shares",bad:[nm(Math.min(one,V))+" shares",nm(4*V)+" shares",nm(one+V)+" shares",nm(O/10)+" shares",nm(Math.max(one,V)/2)+" shares"],why:`שלב 1: 1% מהמניות במחזור = ${nm(O)} × 1% = ${nm(one)}. שלב 2: המחזור השבועי הממוצע = ${nm(V)} (ממוצע לשבוע, לא סכום של 4 שבועות). שלב 3: לוקחים את הגדול מבין השניים: ${nm(Math.max(one,V))}.`}}}
};
const mathLtr=h=>String(h).replace(/(?:\b[A-Z]{2,5} = )?(?:[−+×÷] ?)?[$\d(](?:[\d$.,%\s×÷−+=()]*[\d%)])?(?: = <b>[$\d.,%]+<\/b>)?/g,m=>/[×÷−+=]/.test(m)?`<bdi dir="ltr" class="math">${m.trim().split(/ (?==)/).map(x=>`<span class="mp">${x}</span>`).join(" ")}</bdi>${/\s$/.test(m)?" ":""}`:m);
function calcItem(k){let g,b,tries=0;do{g=CF[k].g();const must=(g.must||[]).filter(x=>x!==g.ok);b=[...must,...shuffle([...new Set(g.bad)].filter(x=>x!==g.ok&&!must.includes(x)))].slice(0,g.n||3);tries++}while(tries<30&&b.length<(g.n||3));
  return {q:`<p class="q enq" lang="en">${g.en}</p>`,qHe:g.he,opts:shuffle([{h:g.ok,ok:1},...b.map(h=>({h}))]),why:mathLtr(bidi(g.why.replace(/\s(שלב \d+:)/g,"<br>$1"))),regen:()=>calcItem(k)}}
function calcHome(){
  toTop();const K=D.calcs.filter(k=>CF[k]);
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">→ לתפריט</button><span class="pill">תרגול חישובים</span></div>
   <div class="panel"><h2>תרגול חישובים</h2><p class="muted" style="margin:0">בכל סבב המספרים חדשים, כדי לתרגל את הנוסחה ולא לזכור תשובה. אחרי כל שאלה מופיע פתרון צעד אחר צעד עם המספרים של השאלה.</p>
   ${K.map(k=>`<div class="term"><span class="t-he">${CF[k].t}</span><p class="t-def" lang="en" dir="ltr">${CF[k].f}</p><p class="muted" lang="en" dir="ltr" style="margin:0">${/^Example/.test(CF[k].x)?"":"Example: "}${CF[k].x}</p></div>`).join("")}
   <button class="btn" id="go">התחל סבב (${K.length*2} שאלות) ←</button></div>`;
  $("back").onclick=home;$("go").onclick=()=>runDrill(shuffle(K.flatMap(k=>[calcItem(k),calcItem(k)])),"תרגול חישובים",r=>{S.calc=r;save()},calcHome,"לרשימת הנוסחאות");focusPanel();
}

/* ---------- sorter: fixed grid of options (e.g. the four option positions) ---------- */
function sorterItems(){const T=D.sorter;if(!T)return [];
  const grid=hit=>`<table class="grid4" dir="ltr" lang="en"><tr>${T.labels.slice(0,2).map((l,i)=>`<td class="${i===hit?"hit":""}">${l}</td>`).join("")}</tr><tr>${T.labels.slice(2,4).map((l,i)=>`<td class="${i+2===hit?"hit":""}">${l}</td>`).join("")}</tr></table>`;
  return T.items.map(([en,he,a])=>({q:`<p class="q enq" lang="en">${en}</p><p class="muted" dir="ltr" lang="en" style="margin:0;text-align:left">${T.ask}</p>`,qHe:he,
    opts:T.labels.map((l,i)=>({h:enSpan(l),ok:i===a?1:0})),fixed:1,why:`${grid(a)}${T.rule}`,say:T.labels[a],term:W[T.labels[a]]?T.labels[a]:null}));
}
function sorter(){toTop();const T=D.sorter;
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">→ לתפריט</button><span class="pill">${T.title}</span></div>
   <div class="panel"><h2>${T.title}</h2><p class="muted" style="margin:0">${T.intro}</p>${T.table}
   <button class="btn" id="go">התחל סבב (20) ←</button></div>`;
  $("back").onclick=home;$("go").onclick=()=>runDrill(shuffle(sorterItems()).slice(0,20),T.title,r=>{S.sorter=r;save()},sorter,"חזרה לטבלה");focusPanel();
}

function lessonEnd(li,r){
  S.done[D.lessons[li].id]=true;save();toTop();const nxt=li<D.lessons.length-1;
  app.innerHTML=`<div class="panel" style="text-align:center;align-items:center"><span class="eyebrow">שיעור ${li+1} הושלם</span><h2>${D.lessons[li].he}</h2>
  <p style="margin:0">ענית נכון על ${r} מתוך ${D.lessons[li].checks.length} בדיקות.</p>
  <div class="row" style="justify-content:center"><button class="btn soft" id="again">→ לחזור על השיעור</button><button class="btn" id="on">${nxt?"לשיעור הבא ←":"לתפריט: תרגול המילים של הפרק ←"}</button></div>
  <button class="btn soft" id="home">לתפריט</button></div>`;
  $("again").onclick=()=>story(li,0);$("home").onclick=home;$("on").onclick=()=>nxt?story(li+1,0):home();focusPanel();
}

function examIntro(){
  toTop();
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">→ לתפריט</button><span class="pill">מבחן הפרק</span></div>
  <div class="panel"><h2>מבחן בסגנון FINRA</h2>
  ${S.practice==null||S.practice<80?`<p class="heq" style="margin:0">המלצה: לפני המבחן, תרגל את המילים ואת התרגול המעורב עד 80% ומעלה. כך המבחן בודק ידע, ולא היכרות ראשונה עם המילים.</p>`:""}
  <p style="margin:0">${D.exam.length} שאלות באנגלית, 4 תשובות לכל שאלה, תשובה נכונה אחת. סדר השאלות וסדר התשובות מתערבבים בכל פעם.</p>
  <p style="margin:0">כמו במבחן האמיתי: אין משוב באמצע. אפשר לחזור לשאלות ולשנות תשובה. בסוף תקבל ציון, הסבר לכל שאלה, ורשימת מילים לתרגל. ציון עובר: 70%.</p>
  <p class="muted" style="margin:0">במבחן האמיתי יש 105 דקות ל-85 שאלות. השעון כאן רק מראה כמה זמן עבר.</p>
  <button class="btn" id="start">התחל מבחן ←</button></div>`;
  $("back").onclick=home;$("start").onclick=exam;focusPanel();
}

function exam(){
  const Q=shuffle(D.exam.map((q,i)=>i)).map(i=>({i,ord:shuffle([0,1,2,3])}));const ans=new Array(Q.length).fill(null);let cur=0;const t0=Date.now();let tick;
  function draw(){
    const e=Q[cur],q=D.exam[e.i];toTop();
    const mm=()=>{const s=Math.floor((Date.now()-t0)/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`};
    const answered=()=>ans.filter(x=>x!=null).length;
    app.innerHTML=`<div class="row"><span class="pill">שאלה ${cur+1} / ${Q.length}</span><span class="pill" id="clock">${mm()}</span><span class="pill" id="cnt">נענו ${answered()}</span></div>
    <div class="bar" aria-hidden="true"><i id="pbar" style="width:${answered()/Q.length*100}%"></i></div>
    <div class="panel"><p class="q enq" lang="en">${q.en}</p>
     <button class="btn soft" id="tr" style="align-self:flex-start">הצג תרגום לעברית</button><p class="heq" id="heq" hidden>${q.he}</p>
     <div class="opts">${e.ord.map((oi,p)=>`<button class="opt${ans[cur]===oi?" sel":""}" data-i="${p}" lang="en" aria-pressed="${ans[cur]===oi}"><span class="l">${L[p]}</span><span>${q.o[oi][0]}<span class="tr" lang="he" hidden>${q.o[oi][1]}</span></span></button>`).join("")}</div>
     <div class="row"><button class="btn soft" id="prev" ${cur===0?"disabled":""}>→ הקודמת</button>${cur<Q.length-1?`<button class="btn" id="next">הבאה ←</button>`:`<button class="btn" id="fin">הגש מבחן</button>`}</div></div>
    <div class="panel"><span class="muted">מעבר מהיר בין שאלות</span><div class="grid">${Q.map((x,k)=>`<button class="dot${ans[k]!=null?" ans":""}${k===cur?" cur":""}" data-k="${k}" aria-label="שאלה ${k+1}${ans[k]!=null?", נענתה":""}">${k+1}</button>`).join("")}</div>
     <button class="btn soft" id="quit">יציאה בלי לשמור</button></div>`;
    clearInterval(tick);tick=setInterval(()=>{const c=$("clock");if(c)c.textContent=mm();else clearInterval(tick)},1000);
    $("tr").onclick=()=>{$("heq").hidden=!$("heq").hidden;app.querySelectorAll(".opt .tr").forEach(x=>x.hidden=$("heq").hidden);$("tr").textContent=$("heq").hidden?"הצג תרגום לעברית":"הסתר תרגום"};
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[cur]=e.ord[+b.dataset.i];app.querySelectorAll(".opt").forEach(x=>{x.classList.toggle("sel",x===b);x.setAttribute("aria-pressed",String(x===b))});
      app.querySelectorAll(".dot")[cur].classList.add("ans");$("cnt").textContent="נענו "+answered();$("pbar").style.width=answered()/Q.length*100+"%"});
    app.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{cur=+b.dataset.k;draw()});
    $("prev").onclick=()=>{if(cur>0){cur--;draw()}};
    if($("next"))$("next").onclick=()=>{cur++;draw()};
    if($("fin"))$("fin").onclick=()=>{const left=ans.filter(x=>x==null).length;if(left&&!$("confirm")){$("fin").insertAdjacentHTML("beforebegin",`<p class="fb no" id="confirm" role="alert">יש ${left} שאלות בלי תשובה. במבחן האמיתי אין עונש על ניחוש, אז כדאי לענות על הכל. לחץ שוב על "הגש" כדי להגיש בכל זאת.</p>`);return}clearInterval(tick);result(Q,ans,Date.now()-t0)};
    $("quit").onclick=()=>{if(!$("qconf")){$("quit").insertAdjacentHTML("beforebegin",`<p class="fb no" id="qconf" role="alert">יציאה תמחק את התשובות במבחן הזה. לחץ שוב כדי לצאת.</p>`);return}clearInterval(tick);home()};
    focusPanel();
  }
  draw();
}

function result(Q,ans,ms){
  const right=Q.filter((e,k)=>ans[k]===D.exam[e.i].a).length,pct=Math.round(right/Q.length*100),pass=pct>=70;
  S.attempts++;if(S.best==null||pct>S.best)S.best=pct;save();toTop();
  const mins=Math.round(ms/60000);
  /* words to practice: terms whose claim IDs match the questions answered wrong */
  const wrongQ=Q.filter((e,k)=>ans[k]!==D.exam[e.i].a).map(e=>new Set(D.exam[e.i].c||[]));
  const toPractice=ALLT.map(x=>({t:x.t,n:wrongQ.filter(cs=>(x.t[3]||[]).some(c=>cs.has(c))).length})).filter(x=>x.n>0&&!(W[x.t[0]]||{}).noDrill).sort((a,b)=>b.n-a.n).slice(0,8).map(x=>x.t);
  app.innerHTML=`<div class="panel"><span class="eyebrow">תוצאות המבחן</span>
   <div class="row" style="justify-content:flex-start;gap:14px;align-items:flex-end"><span class="big">${pct}%</span><span class="pill">${right} / ${Q.length} נכונות</span><span class="pill">${mins} דק'</span></div>
   <h2>${pass?"עברת את קו ה-70%.":"עוד לא. קו המעבר הוא 70%."}</h2>
   <p class="muted" style="margin:0">${pass?"כדי להיות בטוח במבחן האמיתי, כדאי להגיע ל-85% ומעלה באופן עקבי.":"עבור על ההסברים למטה, תרגל את המילים שקשורות לטעויות, ונסה שוב. השאלות והתשובות יתערבבו מחדש."}</p>
   ${toPractice.length?`<div class="heq" style="margin:0"><b>מילים שקשורות לשאלות שטעית בהן:</b><span class="en-block" lang="en" dir="ltr" style="font-weight:500;margin-top:4px">${toPractice.map(t=>t[0]).join(" · ")}</span></div><button class="btn" id="pw">תרגל את המילים האלה ←</button>`:""}
   <div class="row"><button class="btn soft" id="home">לתפריט</button><button class="btn soft" id="again">מבחן חוזר</button></div></div>
  <div class="panel"><h3>סקירת כל השאלות</h3><div class="review">${Q.map((e,k)=>{const q=D.exam[e.i],ok=ans[k]===q.a;
    return `<div class="rv${ok?"":" wrong"}"><span class="rv-lab">${ok?"✓ נכון":"✗ טעות"}</span><p class="rv-en" lang="en" dir="ltr">${q.en}</p>
     ${ok?"":`<span class="rv-lab">התשובה שלך</span><p class="rv-en" lang="en" dir="ltr">${ans[k]==null?"(no answer)":q.o[ans[k]][0]}</p>`}
     <span class="rv-lab">התשובה הנכונה</span><p class="rv-en" lang="en" dir="ltr">${q.o[q.a][0]}</p><span>${mathLtr(bidi(q.why))}</span></div>`}).join("")}</div></div>`;
  $("home").onclick=home;$("again").onclick=exam;
  if($("pw"))$("pw").onclick=()=>{const its=wordItems(toPractice);const defs=its.filter(it=>it.qHe!==undefined&&/Which term/.test(it.q));runDrill(defs.length?defs:its,"מילים מהטעויות במבחן",null,home)};
  focusPanel();
}

function glossary(){
  toTop();
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">→ לתפריט</button><span class="pill">${ALLT.length} מונחים</span></div>
  <div class="panel"><h2>מילון מונחים</h2><input class="search" id="q" dir="auto" placeholder="חיפוש בעברית או באנגלית" aria-label="חיפוש"><p class="muted" id="cnt" role="status" aria-live="polite" style="margin:0"></p><div id="list" style="display:flex;flex-direction:column;gap:8px"></div></div>`;
  const draw=f=>{const fl=(f||"").toLowerCase().trim();
    let res=ALLT.filter(x=>!fl||(x.t[0]+" "+x.t[1]+" "+x.t[2]+" "+((W[x.t[0]]||{}).def||"")).toLowerCase().includes(fl));
    if(fl)res=res.sort((a,b)=>((b.t[0].toLowerCase().includes(fl)||b.t[1].includes(fl))?1:0)-((a.t[0].toLowerCase().includes(fl)||a.t[1].includes(fl))?1:0));
    $("cnt").textContent=fl?`${res.length} תוצאות`:"";
    $("list").innerHTML=res.map(x=>termCard(x.t,x.li)).join("")||`<p class="muted">לא נמצא.</p>`};
  draw("");$("q").oninput=e=>draw(e.target.value);$("back").onclick=home;focusPanel();
}

home();
</script>
</body></html>
