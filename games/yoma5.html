<style>
/* Layout: 5 stations following the Cohen Gadol on Yom Kippur (Yoma Perek 5), then the real 25-question practice test */
:root{
  --bg:#f6ead2; --card:#fffaf0; --ink:#2b2140; --muted:#6c6280; --line:#e6d3ad;
  --accent:#2f6fd6; --accent-soft:#dbe7fb; --good:#1f9a5b; --good-soft:#d5f3e3; --bad:#d63b3b; --bad-soft:#fbe0de; --sun:#f0a92b; --hl:#d6336c;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif; --heb:"Frank Ruhl Libre","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1712; --card:#2a2219; --ink:#f3eadb; --muted:#b8a990; --line:#45392a;
  --accent:#7fa8f0; --accent-soft:#25344f; --good:#4fd18b; --good-soft:#173d2a; --bad:#ff6b6b; --bad-soft:#4a1d1d; --sun:#f5be55; --hl:#ff7aa8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1712; --card:#2a2219; --ink:#f3eadb; --muted:#b8a990; --line:#45392a;
  --accent:#7fa8f0; --accent-soft:#25344f; --good:#4fd18b; --good-soft:#173d2a; --bad:#ff6b6b; --bad-soft:#4a1d1d; --sun:#f5be55; --hl:#ff7aa8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.55rem} h3{font-size:1.2rem}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.hb{font-family:var(--heb);font-weight:700;font-size:1.15em;unicode-bidi:isolate;direction:rtl}
.guide{display:flex;gap:12px;align-items:flex-start}
.guide .face{font-size:3rem;line-height:1;flex:none}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:700;min-width:0}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.btn{font-family:var(--display);font-weight:700;font-size:1.15rem;border:0;border-radius:16px;padding:12px 20px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.soft{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pill{font-family:var(--display);font-weight:700;background:var(--accent-soft);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums}
.stations{display:flex;flex-direction:column;gap:12px}
.station{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 16px;cursor:pointer;text-align:left;width:100%}
.station .ico{font-size:2.2rem;width:58px;height:58px;display:grid;place-items:center;background:var(--bg);border-radius:16px;flex:none}
.station .txt{flex:1;min-width:0}
.station small{display:block;color:var(--muted);font-weight:700;font-size:.9rem}
.stars{font-size:1.05rem;letter-spacing:2px;white-space:nowrap}
.station.final{background:var(--accent);border-color:var(--accent);color:#fff}
.station.final small{color:#fff;opacity:.9}
.station.final .ico{background:rgba(255,255,255,.22)}
.learn{display:flex;flex-direction:column;gap:12px}
.picbox{background:var(--bg);border-radius:18px;padding:14px;display:grid;place-items:center;min-height:120px;text-align:center}
.emo{font-size:3.8rem;line-height:1.15;letter-spacing:6px;text-align:center}
.bigheb{font-family:var(--heb);font-size:2.6rem;font-weight:700;direction:rtl;line-height:1.3}
.bigheb .p1{color:var(--hl)} .bigheb .p2{color:var(--accent)}
.legend{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:1rem;margin-top:6px}
.legend .p1{color:var(--hl)} .legend .p2{color:var(--accent)}
.word{font-family:var(--display);font-size:1.9rem;font-weight:800;color:var(--accent);line-height:1.1}
.say{font-size:1.15rem;font-weight:800;margin:0}
.ex{margin:0;background:var(--good-soft);border-radius:14px;padding:10px 12px;font-weight:700}
.he{margin:0;color:var(--muted);font-weight:700;direction:rtl;text-align:right}
.animals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.animals div{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:.85rem}
.animals span{font-size:2.3rem}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.q{font-size:1.25rem;font-weight:800;margin:0}
.tag{align-self:flex-start;font-family:var(--display);font-weight:700;background:var(--sun);color:#2b1d00;border-radius:999px;padding:2px 12px;font-size:.95rem}
.big-item{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);border-radius:18px;padding:14px;text-align:center}
.big-item .emo{font-size:3.6rem}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bin{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-weight:700;font-size:1.1rem;line-height:1.15}
.bin span{font-size:2.2rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:11px 14px;text-align:left;font-weight:800;cursor:pointer;font-size:1.05rem;display:flex;gap:8px;align-items:baseline}
.opt .l{font-family:var(--display);color:var(--accent);flex:none}
.opt.pick{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 22%,var(--card))}
.opt.ok,.bin.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no,.bin.no{border-color:var(--bad);background:var(--bad-soft)}
.shake{animation:shake .35s}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:100px;max-width:150px;font-weight:800;font-size:.92rem;text-align:center}
.tile span{font-size:2.4rem}
.tile.used{opacity:.25;cursor:default}
.tile.no{border-color:var(--bad)}
.seq{display:flex;gap:8px;justify-content:center;min-height:70px;background:var(--bg);border-radius:16px;padding:8px;flex-wrap:wrap;align-items:center}
.seq span{font-size:2.4rem}
.seq .arrow{font-size:1.3rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{border:3px solid var(--line);background:var(--card);border-radius:14px;padding:10px;font-weight:800;cursor:pointer;min-height:54px;font-size:1.05rem;text-align:center}
.mt.sel{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 25%,var(--card))}
.mt.done{border-color:var(--good);background:var(--good-soft);cursor:default}
.mt.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{font-weight:800;margin:0;min-height:1.4em;padding:10px 12px;border-radius:14px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb:empty{padding:0}
.bar{height:12px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);transition:width .3s}
.huge{font-family:var(--display);font-size:3.6rem;font-weight:800;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.bigstars{font-size:3rem;text-align:center;letter-spacing:6px}
.miss{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.miss li{background:var(--bad-soft);border-radius:14px;padding:10px 12px;font-weight:700}
.miss b{display:block}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .3s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.emo{font-size:3rem}.bigheb{font-size:2.1rem}.animals span{font-size:1.9rem}}
</style>

<div class="wrap" id="app"></div>

<script>
const H=t=>`<span class="hb">${t}</span>`;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const emo=s=>`<div class="emo">${s}</div>`;
const KK=H("קֹדֶשׁ הַקֳּדָשִׁים"), KD=H("קֹדֶשׁ");

/* ===== The real test (Yoma 5 Practice Test, answers from Rabbi Morris's short key) ===== */
const TEST=[
 {n:1,q:"Where did the incense come from that he put into the ladle?",o:["Beis Parva","Beis Avtinas","Beis Garmu","Beis Hillel"],a:[1],why:"From Beis Avtinas."},
 {n:2,q:"What did the Cohen Gadol bring into the Kodesh Kadashim in his left hand?",o:["knife","ladle","incense","shovel"],a:[1,2],why:"In his LEFT hand: the ladle and the incense in it."},
 {n:3,q:"Which of these was in his right hand?",o:["ladle","coals","incense","shovel"],a:[1,3],why:"In his RIGHT hand: the shovel and the coals on it."},
 {n:4,q:`According to the ${H("תַּנָּא קַמָּא")}, how many curtains were there between the ${KD} and the ${KK} during the second Beis Hamikdosh?`,o:["10","4","1","2"],a:[3],why:"2 curtains."},
 {n:5,q:`When the Cohen Gadol walked through the ${KD}, what ${H("כְּלִי")} was on his RIGHT?`,o:["the menorah","the shulchan",`the ${H("אֲרוֹן קֹדֶשׁ")}`,`the golden ${H("מִזְבֵּחַ")}`],a:[1,3],why:"On his right: the shulchan and the golden mizbeach. (The menorah was on his left.)"},
 {n:6,q:"Which side of the curtain did he walk to first?",o:["east","north","west","south"],a:[3],why:"He walked to the south side first."},
 {n:7,q:"What direction did he walk between the curtains?",o:["east","north","north-east","north-west"],a:[1],why:"He walked north between the curtains."},
 {n:8,q:"Which direction did he walk once he got to the Kodesh Kadashim according to the Rambam?",o:["south","south west","east","north"],a:[1],why:"According to the Rambam: south west."},
 {n:9,q:"How long of a tefila did the Cohen Gadol daven when he left the Kodesh Kadashim?",o:["1 hour","a short tefila","a long tefila","however long he wanted, just so he really meant it"],a:[1],why:"A short tefila, so he would not scare the Bnei Yisroel."},
 {n:10,q:`Which direction did the ${H("כֹּהֵן גָּדוֹל")} face when he was leaving the Kodesh Kadashim?`,o:["south","west","toward the Aron (or the stone)","east"],a:[2],why:"Toward the Aron (or the stone), out of respect."},
 {n:11,q:`When the ${H("אֲרוֹן קֹדֶשׁ")} was taken away, there was a stone called`,o:[H("נַחַל קִדְרוֹן"),H("אֶבֶן שְׁתִיָּה"),"the foundation stone",`the ${H("אַמָּה")}`],a:[1],why:`The ${H("אֶבֶן שְׁתִיָּה")}. Your teacher's key marks (b).`},
 {n:12,q:"How far off the ground did this stone reach?",o:[`3 ${H("אַמּוֹת")}`,"4 tefachim",`3 ${H("אֶצְבָּעוֹת")}`,"3 feet"],a:[2],why:`3 ${H("אֶצְבָּעוֹת")} (3 fingers).`},
 {n:13,q:"How high is this rock today? About",o:["12 feet","6 feet","18 feet","10 feet"],a:[1],why:"About 6 feet high today."},
 {n:14,q:`The first blood offered in the ${KK} was from`,o:["a goat","a ram","an ox","a sheep"],a:[2],why:"The first blood was from the ox. He took it from the memares."},
 {n:15,q:`The second blood offered in the ${KK} was from`,o:["another ox","goat","sheep","donkey"],a:[1],why:"The second blood was from the goat."},
 {n:16,q:"How many times did he sprinkle up and down?",o:["1 up and 6 down","7 up and 1 down","1 up and 7 down","7 up and 7 down"],a:[2],why:"1 up and 7 down."},
 {n:17,q:"He sprinkled like a",o:[H("מַצְלִיף"),H("מַחְתֶּה"),"hammer","whip"],a:[3],why:"Like a whip. Your teacher's key marks (d)."},
 {n:18,q:`After being sprinkled in the Kodesh Kadashim, the 2 bloods were sprinkled`,o:[`also in the ${KK}`,`on the golden ${H("מִזְבֵּחַ")}`,`in the ${KD} in front of the curtain`,`on the outer ${H("מִזְבֵּחַ")}`],a:[2],why:"In the Kodesh, in front of the curtain (the paroches)."},
 {n:19,q:"The Cohen Gadol then mixed the two bloods together, and went to smear them",o:["on the gold mizbeach",`on the outer ${H("מִזְבֵּחַ")}`,"in the Kodesh Kadashim","on the curtain"],a:[0],why:"On the gold mizbeach."},
 {n:20,q:"On which corner did the Cohen Gadol end (this word is a hint) when smearing the four corners of the mizbeach?",o:["northwest","southwest","southeast","south"],a:[2],why:"He ENDED at the southeast corner. On the outer mizbeach, a Cohen BEGAN with this corner."},
 {n:21,q:"How many times did the Cohen Gadol sprinkle the mixture on the golden mizbeach?",o:["none, the golden mizbeach was only for incense","none, the blood was only smeared there","3 times","7 times"],a:[3],why:"7 times."},
 {n:22,q:"The extra blood was poured into a hole on which side of the outer mizbeach?",o:["south","west","east","north"],a:[1],why:"The west side. We don't pass by a mitzvah (ain maavirin al hamitzvos)."},
 {n:23,q:"If a Cohen Gadol did the two bloods in the Kodesh Kadashim in the wrong order, which blood would he then have to sprinkle a second time?",o:["ox","goat","combo","none"],a:[1],why:"The goat's blood."},
 {n:24,q:"How was the blood removed from the Temple Courtyard?",o:["the Cohen Gadol washed it out","Cohanim workers washed it out",`the "ama" carried it out`,"Cohen farmers brought it out"],a:[2],why:"The \"ama\" carried it out, into Nachal Kidron."},
 {n:25,q:"What was the blood then used for?",o:["nothing","it was put back on the outer mizbeach","it was sold for fertilizer","fuel"],a:[2],why:"It was sold for fertilizer."}
];
const T=n=>TEST.find(x=>x.n===n);
const B=(q,o,a,why)=>{const ord=shuffle(o.map((x,i)=>i));return {bonus:true,q,o:ord.map(i=>o[i]),a:[ord.indexOf(a)],why}};

const LEVELS=[
 {id:"hands",name:"Into the Kodesh Kadashim",ico:"🔥",sub:"The incense, the ladle and the shovel",
  intro:"Shalom! It's Yom Kippur. The Cohen Gadol is about to go into the Kodesh Kadashim. Let's see what he carries!",
  cards:[
   {w:"Beis Avtinas",pic:()=>emo("🏠🌿💨"),say:"The incense came from Beis Avtinas. They were the family that made the incense.",ex:"In Perek 1, the Cohen Gadol learned chafina there (taking a handful of incense).",he:"הקטורת באה מבית אבטינס"},
   {w:"Their secret",pic:()=>emo("🤫🌿⬆️"),say:"Beis Avtinas refused to teach others the maaleh ashan.",ex:"Maaleh ashan is the herb that made the smoke go straight UP.",he:"מעלה עשן: העשב שגרם לעשן לעלות ישר למעלה"},
   {w:"His two hands",pic:()=>`<div class="animals" style="grid-template-columns:1fr 1fr"><div><span>🥄🌿</span>LEFT hand<br>ladle + incense</div><div><span>🍳🔥</span>RIGHT hand<br>shovel + coals</div></div>`,say:"LEFT hand: the ladle with the incense. RIGHT hand: the shovel with the coals.",ex:"On the test, each of these questions has 2 answers!",he:"שמאל: כף וקטורת. ימין: מחתה וגחלים"},
   {w:"Why the right hand?",pic:()=>emo("🍳🔥💪"),say:"Why was the shovel of coals in his right hand? Because he was fasting.",ex:"It's Yom Kippur, so the Cohen Gadol is fasting too.",he:"כי הוא היה בתענית"}],
  acts:[{type:"sort",q:"Which hand held it?",bins:[{id:"l",t:"LEFT hand",e:"🫲"},{id:"r",t:"RIGHT hand",e:"🫱"}],
     items:[{e:"🥄",t:"The ladle",b:"l",why:"The ladle was in his left hand."},{e:"🌿",t:"The incense",b:"l",why:"The incense was in the ladle, in his left hand."},{e:"🍳",t:"The shovel",b:"r",why:"The shovel was in his right hand."},{e:"🔥",t:"The coals",b:"r",why:"The coals were on the shovel, in his right hand."}]},
   {type:"mcq",qs:[T(1),
     B("What did the Cohen Gadol learn at Beis Avtinas in Perek 1?",["chafina (taking a handful)","how to bake the lechem hapanim","how to light the menorah"],0,"Chafina: taking a handful of incense."),
     B("What did Beis Avtinas refuse to teach others?",["maaleh ashan, the herb that made the smoke rise straight up","how to grow grapes","how to sew the curtains"],0,"The maaleh ashan."),
     T(2),T(3),
     B("Why was the shovel in his RIGHT hand?",["He was fasting.","It was the lightest thing.","Someone else was holding his left hand."],0,"Because he was fasting.")]}]},
 {id:"walk",name:"The Curtains and the Walk",ico:"🧭",sub:"Two curtains, which way he walked",
  intro:"Now the Cohen Gadol walks through the Kodesh to the Kodesh Kadashim. Watch the directions!",
  cards:[
   {w:"2 curtains",pic:()=>emo("🟥 🚶 🟥"),say:"In the second Beis Hamikdosh there were 2 curtains between the Kodesh and the Kodesh Kadashim (says the תַּנָּא קַמָּא).",ex:"In the FIRST Beis Hamikdosh there were 0 curtains. It was a wall!",he:"בבית שני: 2 פרוכות. בבית ראשון: קיר"},
   {w:"Walking through the Kodesh",pic:()=>`<div class="animals" style="grid-template-columns:1fr 1fr"><div><span>🍞🔥</span>RIGHT side<br>shulchan + golden mizbeach</div><div><span>🕎</span>LEFT side<br>menorah</div></div>`,say:"On his RIGHT: the shulchan and the golden mizbeach. On his LEFT: the menorah.",ex:"Question 5 has 2 answers: the shulchan AND the golden mizbeach.",he:"מימין: שולחן ומזבח הזהב. משמאל: מנורה"},
   {w:"The path between the curtains",pic:()=>emo("⬇️ south, then ⬆️ north"),say:"First he walked to the SOUTH side of the curtain. Then he walked NORTH between the curtains.",ex:"If he tried to go east, he might run into the menorah. If he tried to go south, he would run into the wall.",he:"קודם לדרום, ואז בין הפרוכות לצפון"},
   {w:"Inside the Kodesh Kadashim",pic:()=>emo("↙️"),say:"Once he got to the Kodesh Kadashim, he walked south west, according to the Rambam.",ex:"Rambam = south west.",he:"לפי הרמב\"ם: לדרום מערב"}],
  acts:[{type:"sort",q:"Walking through the Kodesh, was it on his right or his left?",bins:[{id:"r",t:"RIGHT",e:"👉"},{id:"l",t:"LEFT",e:"👈"}],
     items:[{e:"🍞",t:"The shulchan",b:"r",why:"The shulchan was on his right."},{e:"🔥",t:"The golden mizbeach",b:"r",why:"The golden mizbeach was on his right."},{e:"🕎",t:"The menorah",b:"l",why:"The menorah was on his left."}]},
   {type:"order",q:"Put his walk in order. Tap what he did FIRST.",items:[{e:"🚶",t:"Walk through the Kodesh"},{e:"⬇️",t:"Go to the south side of the curtain"},{e:"⬆️",t:"Walk north between the curtains"},{e:"↙️",t:"In the Kodesh Kadashim: south west"}]},
   {type:"mcq",qs:[T(4),
     B("What was between the Kodesh and the Kodesh Kadashim in the FIRST Beis Hamikdosh?",["0 curtains: it was a wall","2 curtains","10 curtains"],0,"No curtains. It was a wall."),
     T(5),
     B("Walking through the Kodesh, what was on his LEFT?",["the menorah","the shulchan","the golden mizbeach"],0,"The menorah."),
     T(6),T(7),
     B("What might he run into if he tried to go EAST?",["the menorah","the wall","the Aron"],0,"The menorah."),
     B("What would he run into if he tried to go SOUTH?",["the wall","the Aron","the shulchan"],0,"The wall."),

/* ===== engine ===== */
/* ===== engine ===== */
const app=document.getElementById("app");
const L4="abcd";
const PRAISE=["Awesome!","Great job!","You got it!","Super!","Yasher koach!"];
let stars={};try{stars=JSON.parse(localStorage.getItem("yoma5-stars")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("yoma5-stars",JSON.stringify(stars))}catch(e){}};
const starStr=n=>"⭐".repeat(n)+"☆".repeat(3-n);
const toTop=()=>window.scrollTo({top:0,behavior:"smooth"});
const $=id=>document.getElementById(id);
const shk=el=>{el.classList.add("shake");setTimeout(()=>el.classList.remove("shake"),400)};

function home(){
  const done=LEVELS.filter(l=>stars[l.id]).length;
  app.innerHTML=`<div class="guide"><div class="face">🕯️</div><div class="bubble">Hi! Let's follow the Cohen Gadol into the Kodesh Kadashim on Yom Kippur (Yoma Perek 5). Finish each station to win stars, then take the real test!</div></div>
  <div class="row"><h1>Yoma 5 Quest</h1><span class="pill">${done} / ${LEVELS.length}</span></div>
  <div class="stations">${LEVELS.map((l,i)=>`<button class="station" data-i="${i}"><div class="ico">${l.ico}</div><div class="txt"><h3>${i+1}. ${l.name}</h3><small>${l.sub}</small></div><span class="stars">${starStr(stars[l.id]||0)}</span></button>`).join("")}
  <button class="station final" id="final"><div class="ico">🏆</div><div class="txt"><h3>The Real Test</h3><small>All 25 questions from the Yoma 5 Practice Test. How many can you get?</small></div></button></div>`;
  app.querySelectorAll(".station[data-i]").forEach(b=>b.onclick=()=>learn(+b.dataset.i,0));
  $("final").onclick=finalQuiz;
}

function learn(li,ci){
  const L=LEVELS[li],C=L.cards[ci];toTop();
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">← Map</button><span class="pill">${L.ico} ${L.name}</span></div>
  ${ci===0?`<div class="guide"><div class="face">🕯️</div><div class="bubble">${L.intro}</div></div>`:""}
  <div class="panel learn pop"><div class="picbox">${C.pic()}</div>
   <div class="word">${C.w}</div><p class="say">${C.say}</p><p class="ex">💡 ${C.ex}</p><p class="he">${C.he}</p>
   <div class="dots">${L.cards.map((c,i)=>`<i class="${i===ci?"on":""}"></i>`).join("")}</div>
   <div class="row"><button class="btn soft" id="prev" ${ci===0?'style="visibility:hidden"':""}>← Back</button>
   <button class="btn" id="next">${ci===L.cards.length-1?"Let's play! 🎮":"Next →"}</button></div></div>`;
  $("back").onclick=home;$("prev").onclick=()=>learn(li,ci-1);
  $("next").onclick=()=>ci<L.cards.length-1?learn(li,ci+1):play(li);
}

/* question widget: single or multi answer. mode "learn" = retry until right; "test" = one try */
function question(q,mode,onDone){
  const multi=q.a.length>1;
  const box=document.createElement("div");box.style.cssText="display:flex;flex-direction:column;gap:12px";
  box.innerHTML=`${q.bonus?`<span class="tag">⭐ BONUS</span>`:""}${multi?`<span class="tag">Pick ${q.a.length} answers!</span>`:""}<p class="q">${q.q}</p>
   <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="l">(${L4[i]})</span><span>${o}</span></button>`).join("")}</div>
   ${multi?`<button class="btn" data-check disabled>Check</button>`:""}`;
  const opts=[...box.querySelectorAll(".opt")],chk=box.querySelector("[data-check]");
  let picked=new Set(),over=false;
  const finish=ok=>{over=true;opts.forEach(o=>{if(q.a.includes(+o.dataset.i))o.classList.add("ok")});if(chk)chk.hidden=true;onDone(ok,picked)};
  const judge=()=>{const ok=(picked.size===q.a.length&&q.a.every(i=>picked.has(i)))||(!multi&&q.alt&&q.alt.includes([...picked][0]));
    if(ok||mode==="test"){if(!ok)opts.forEach(o=>{if(picked.has(+o.dataset.i)&&!q.a.includes(+o.dataset.i))o.classList.add("no")});finish(ok)}
    else{onDone(null,picked);opts.forEach(o=>{if(picked.has(+o.dataset.i)){o.classList.add("no");shk(o);setTimeout(()=>o.classList.remove("no","pick"),500)}});picked.clear();if(chk)chk.disabled=true}};
  opts.forEach(o=>o.onclick=()=>{if(over)return;const i=+o.dataset.i;
    if(!multi){picked=new Set([i]);judge();return}
    if(picked.has(i)){picked.delete(i);o.classList.remove("pick")}else if(picked.size<q.a.length){picked.add(i);o.classList.add("pick")}
    chk.disabled=picked.size!==q.a.length});
  if(chk)chk.onclick=judge;
  return box;
}

function play(li){
  const L=LEVELS[li];let ai=0,mist=0;
  const steps=[];L.acts.forEach(a=>{if(a.type==="sort")shuffle(a.items).forEach(it=>steps.push({a,it}));else if(a.type==="mcq")a.qs.forEach(q=>steps.push({a,q}));else steps.push({a})});
  const next=()=>{ai++;ai<steps.length?step():finish()};
  function frame(){toTop();app.innerHTML=`<div class="row"><button class="btn soft" id="back">← Map</button><span class="pill">${L.ico} Game ${ai+1} / ${steps.length}</span></div>
    <div class="bar"><i style="width:${ai/steps.length*100}%"></i></div><div class="panel pop" id="pn"><p class="fb" id="fb"></p><button class="btn" id="go" hidden>Next →</button></div>`;
    $("back").onclick=home;$("go").onclick=next;return $("pn")}
  const put=(pn,el)=>pn.insertBefore(el,$("fb"));
  const fb=(ok,t)=>{const f=$("fb");f.className="fb "+(ok?"ok":"no");f.innerHTML=t};
  const ready=()=>{$("go").hidden=false};
  function step(){const s=steps[ai],a=s.a,pn=frame();
    if(a.type==="mcq"){put(pn,question(s.q,"learn",ok=>{if(ok===null){mist++;fb(false,s.q.a.length>1?"Not quite. Try again! (Pick "+s.q.a.length+")":"Not that one. Try again!")}else{fb(true,"✅ "+s.q.why);ready()}}))}
    else if(a.type==="sort"){const it=s.it,d=document.createElement("div");d.style.cssText="display:flex;flex-direction:column;gap:12px";
      d.innerHTML=`<p class="q">${a.q}</p><div class="big-item"><div class="emo">${it.e}</div><b>${it.t}</b></div><div class="bins">${a.bins.map(b=>`<button class="bin" data-b="${b.id}"><span>${b.e}</span>${b.t}</button>`).join("")}</div>`;put(pn,d);
      let solved=false;d.querySelectorAll(".bin").forEach(b=>b.onclick=()=>{if(solved)return;
        if(b.dataset.b===it.b){solved=true;b.classList.add("ok");fb(true,"✅ "+it.why);ready()}else{mist++;b.classList.add("no");shk(b);setTimeout(()=>b.classList.remove("no"),450);fb(false,"Not quite. Think again!")}})}
    else if(a.type==="order"){const order=a.items;let n=0,d=document.createElement("div");d.style.cssText="display:flex;flex-direction:column;gap:12px";
      d.innerHTML=`<p class="q">${a.q}</p><div class="seq" id="seq"></div><div class="tiles">${shuffle(order.map((x,i)=>i)).map(i=>`<button class="tile" data-i="${i}"><span>${order[i].e}</span>${order[i].t}</button>`).join("")}</div>`;put(pn,d);
      d.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{if(t.classList.contains("used")||n>=order.length)return;
        if(+t.dataset.i===n){t.classList.add("used");$("seq").insertAdjacentHTML("beforeend",(n?'<b class="arrow">→</b>':"")+`<span class="pop">${order[n].e}</span>`);n++;
          if(n===order.length){fb(true,"🎉 Perfect order!");ready()}else fb(true,"Yes! What happened next?")}
        else{mist++;t.classList.add("no");shk(t);setTimeout(()=>t.classList.remove("no"),450);fb(false,"Hmm, did that happen "+(n?"next":"first")+"? Try another.")}})}
    else if(a.type==="match"){let sel=null,left=a.pairs.length,d=document.createElement("div");d.style.cssText="display:flex;flex-direction:column;gap:12px";
      d.innerHTML=`<p class="q">${a.q}</p><div class="cols"><div class="col" id="cl"></div><div class="col" id="cr"></div></div>`;put(pn,d);
      shuffle(a.pairs.map((p,i)=>i)).forEach(i=>{const b=document.createElement("button");b.className="mt";b.innerHTML=H(a.pairs[i][0]);b.dataset.i=i;
        b.onclick=()=>{if(b.classList.contains("done"))return;d.querySelectorAll("#cl .mt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=b};$("cl").append(b)});
      shuffle(a.pairs.map((p,i)=>i)).forEach(i=>{const b=document.createElement("button");b.className="mt";b.textContent=a.pairs[i][1];b.dataset.i=i;
        b.onclick=()=>{if(b.classList.contains("done"))return;if(!sel){fb(false,"First tap a Hebrew word on the left.");return}
          if(sel.dataset.i===b.dataset.i){[sel,b].forEach(x=>{x.classList.remove("sel");x.classList.add("done")});sel=null;left--;fb(true,PRAISE[Math.random()*5|0]);if(!left){fb(true,"🎉 All 5 animals matched!");ready()}}
          else{mist++;b.classList.add("no");shk(b);setTimeout(()=>b.classList.remove("no"),450);fb(false,"Not that one. Try again!")}};$("cr").append(b)})}
  }
  function finish(){const st=mist<=1?3:mist<=4?2:1;stars[L.id]=Math.max(stars[L.id]||0,st);save();toTop();const nxt=li<LEVELS.length-1;
    app.innerHTML=`<div class="panel pop" style="align-items:center;text-align:center"><div class="bigstars">${starStr(st)}</div>
     <h2>${L.name}: done!</h2><p style="margin:0;font-weight:700">${mist===0?"No mistakes at all. Amazing!":"Mistakes: "+mist+(st<3?". Play again to get 3 stars!":"")}</p>
     <div class="row" style="justify-content:center"><button class="btn soft" id="again">Play again</button><button class="btn" id="on">${nxt?"Next station →":"Take the Real Test 🏆"}</button></div>
     <button class="btn soft" id="map">Back to the map</button></div>`;
    $("again").onclick=()=>play(li);$("map").onclick=home;$("on").onclick=()=>nxt?learn(li+1,0):finalQuiz()}
  step();
}

function finalQuiz(){
  let i=0,right=0;const missed=[];
  function ask(){const q=TEST[i];toTop();
    app.innerHTML=`<div class="row"><button class="btn soft" id="back">← Map</button><span class="pill">🏆 Question ${q.n} / 25</span><span class="pill">✅ ${right}</span></div>
    <div class="bar"><i style="width:${i/TEST.length*100}%"></i></div><div class="panel pop" id="pn"><p class="fb" id="fb"></p><button class="btn" id="go" hidden>${i===TEST.length-1?"See my score 🏆":"Next →"}</button></div>`;
    $("back").onclick=home;
    $("pn").insertBefore(question(q,"test",ok=>{const f=$("fb");if(ok){right++;f.className="fb ok";f.innerHTML="✅ "+PRAISE[Math.random()*5|0]+" "+q.why}else{missed.push(q);f.className="fb no";f.innerHTML="The answer: "+q.why}$("go").hidden=false}),$("fb"));
    $("go").onclick=()=>{i++;i<TEST.length?ask():end()}}
  function end(){toTop();const pct=Math.round(right/TEST.length*100),st=pct>=90?3:pct>=70?2:1;
    app.innerHTML=`<div class="panel pop" style="text-align:center"><div class="bigstars">${starStr(st)}</div>
    <div class="huge">${right} / 25</div><span class="pill" style="align-self:center">${pct}%</span>
    <h2>${pct===100?"Perfect! You're ready for the test!":pct>=85?"Excellent! Yasher koach!":pct>=65?"Good job! Almost there!":"Nice try! Let's practice a bit more."}</h2>
    ${missed.length?`<div style="text-align:left"><h3 style="margin-bottom:8px">Questions to review:</h3><ul class="miss">${missed.map(q=>`<li><b>${q.n}. ${q.q}</b>${q.why}</li>`).join("")}</ul></div>`:""}
    <div class="row" style="justify-content:center"><button class="btn soft" id="map">Back to the map</button><button class="btn" id="again">Take the test again</button></div></div>`;
    $("map").onclick=home;$("again").onclick=finalQuiz}
  ask();
}
home();
