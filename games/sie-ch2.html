/* ---------- drills ---------- */
/* distractors: same lesson first, then pair partners, then the rest of the chapter */
function partners(name){return (D.pairs||[]).flatMap(p=>{const a=p.ta||p.a,b=p.tb||p.b;return a===name||b===name?[a,b]:[]})}
function distract(t,n,key){
  const li=termLi(t[0]);const same=ALLT.filter(x=>x.li===li).map(x=>x.t),pp=partners(t[0]).map(p=>ALLT.find(x=>x.t[0]===p)).filter(Boolean).map(x=>x.t);
  const rest=ALLT.map(x=>x.t);const out=[];const seen=new Set([key(t)]);
  for(const grp of [shuffle(same),shuffle(pp),shuffle(rest)])for(const x of grp){if(out.length>=n)break;const k=key(x);if(!seen.has(k)&&!(W[x[0]]&&W[x[0]].noDrill)){seen.add(k);out.push(x)}}
  return out;
}
const enSpan=h=>`<span class="en" lang="en">${h}</span>`;
function wordItems(list){
  const items=[];
  list.forEach(t=>{const w=W[t[0]]||{};
    if(w.def&&!w.noDrill){
      items.push({q:`<p class="q enq" lang="en">${w.def}</p><p class="muted" dir="ltr" lang="en" style="margin:0;text-align:left">Which term matches this definition?</p>`,qHe:t[2],term:t[0],
        opts:shuffle([{h:enSpan(t[0]),ok:1},...distract(t,3,x=>x[0]).map(o=>({h:enSpan(o[0])}))]),why:`${enSpan(t[0])} = ${t[1]}.`,say:t[0]});
      const od=distract(t,3,x=>(W[x[0]]||{}).def||x[0]).filter(o=>(W[o[0]]||{}).def);
      if(od.length>=2)items.push({q:`<div class="bigterm">${sayBtn(t[0])}<span lang="en">${t[0]}</span></div><p class="muted" dir="ltr" lang="en" style="margin:0;text-align:center">Which definition fits this term?</p>`,qHe:t[1],term:t[0],
        opts:shuffle([{h:`<span lang="en">${w.def}</span>`,tr:t[1],ok:1},...od.map(o=>({h:`<span lang="en">${W[o[0]].def}</span>`,tr:o[1]}))]),why:`${t[1]}: ${t[2]}`,say:t[0]});
    }
    items.push({q:`<div class="bigterm">${sayBtn(t[0])}<span lang="en">${t[0]}</span></div><p class="muted" style="margin:0;text-align:center">מה הפירוש?</p>`,term:t[0],
      opts:shuffle([{h:t[1],ok:1},...distract(t,3,x=>x[1]).map(o=>({h:o[1]}))]).map(o=>({...o,he:1})),why:`${t[1]}: ${t[2]}`,say:t[0]});
  });
  return shuffle(items);
}
function examWordItems(){
  const E=D.examWords||[];
  return shuffle(E.flatMap(([en,he,ex],i)=>{const others=shuffle(E.filter((x,j)=>j!==i)).slice(0,3);
    return [{q:`<div class="bigterm">${sayBtn(en)}<span lang="en">${en}</span></div><p class="muted" style="margin:0;text-align:center">מה זה אומר בשאלה?</p>`,
      opts:shuffle([{h:he,ok:1},...others.map(o=>({h:o[1]}))]).map(o=>({...o,he:1})),why:`${enSpan(en)} = ${he}. ${ex}`,say:en}]}));
}
function runDrill(items,title,onScore,onDone,doneLabel){
  items.forEach((it,i)=>{if(it._id==null)it._id=i});const q=items.slice();let first=0;const total=items.length;const missed=new Set();
  function draw(){
    if(!q.length){const pct=total?Math.round(first/total*100):100;onScore&&onScore(pct);toTop();
      app.innerHTML=`<div class="panel" style="text-align:center;align-items:center"><span class="eyebrow">${title}</span><h2>סיימת!</h2>
        <p style="margin:0">נכון בפעם הראשונה (בלי רמז): ${first} מתוך ${total} (${pct}%). כל מה שפספסת חזר עד שענית נכון${missed.size?", ונשמר ברשימת \"מילים שפספסתי\"":""}.</p>
        <div class="row" style="justify-content:center"><button class="btn soft" id="again">עוד סיבוב</button><button class="btn" id="on">${doneLabel||"לתפריט"}</button></div></div>`;
      $("again").onclick=()=>runDrill(shuffle(items).map(it=>({...it,_id:undefined,opts:shuffle(it.opts)})),title,onScore,onDone,doneLabel);$("on").onclick=onDone;focusPanel();return}
    const it=q[0];toTop();let hinted=false;
    app.innerHTML=`<div class="row"><button class="btn soft" id="back">→ לתפריט</button><span class="pill">${title}</span><span class="pill">נשארו ${q.length}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${(total-q.length)/total*100}%"></i></div>
    <div class="panel">${it.q}${it.qHe?`<button class="btn soft" id="tr" style="align-self:flex-start">הצג רמז בעברית</button><p class="heq" id="heq" hidden>${it.qHe}</p>`:""}
     <div class="opts">${it.opts.map((o,p)=>`<button class="opt${o.he?" he":""}" data-p="${p}" ${o.he?"":'lang="en"'}><span class="l">${L[p]}</span><span>${o.h}${o.tr?`<span class="tr" lang="he" hidden>${o.tr}</span>`:""}</span></button>`).join("")}</div>
     <p class="fb" id="fb" role="status" aria-live="polite"></p><button class="btn" id="go" hidden>הבא ←</button></div>`;
    $("back").onclick=home;
    if($("tr"))$("tr").onclick=()=>{hinted=true;$("heq").hidden=!$("heq").hidden;app.querySelectorAll(".opt .tr").forEach(x=>x.hidden=$("heq").hidden);$("tr").textContent=$("heq").hidden?"הצג רמז בעברית":"הסתר עברית"};
    let done=false;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;done=true;const o=it.opts[+b.dataset.p];
      app.querySelectorAll(".opt").forEach(x=>{if(it.opts[+x.dataset.p].ok)x.classList.add("ok")});if(!o.ok)b.classList.add("no");
      const clean=o.ok&&!hinted;
      const f=$("fb");f.className="fb "+(o.ok?"ok":"no");f.innerHTML=(o.ok?(hinted?"✓ נכון (עם רמז, אז זה יחזור). ":"✓ נכון. "):"✗ לא נכון. זה יחזור בהמשך. ")+it.why;
      if(it.say)speak(it.say);
      q.shift();
      if(clean){if(!missed.has(it._id)){first++;if(it.term)markHit(it.term)}}
      else{if(!missed.has(it._id)&&it.term)markMiss(it.term);missed.add(it._id);q.splice(Math.min(q.length,3),0,{...it,opts:shuffle(it.opts)})}
      $("go").hidden=false;$("go").focus();$("go").onclick=draw});
    focusPanel();
  }
  draw();
}

  const mins=Math.round(ms/60000);
  /* words to practice: terms whose claim IDs match the questions answered wrong */
  const wrongQ=Q.filter((e,k)=>ans[k]!==D.exam[e.i].a).map(e=>new Set(D.exam[e.i].c||[]));
  const toPractice=ALLT.map(x=>({t:x.t,n:wrongQ.filter(cs=>(x.t[3]||[]).some(c=>cs.has(c))).length})).filter(x=>x.n>0&&!(W[x.t[0]]||{}).noDrill).sort((a,b)=>b.n-a.n).slice(0,8).map(x=>x.t);
  app.innerHTML=`<div class="panel"><span class="eyebrow">תוצאות המבחן</span>
   <div class="row" style="justify-content:flex-start;gap:14px;align-items:flex-end"><span class="big">${pct}%</span><span class="pill">${right} / ${Q.length} נכונות</span><span class="pill">${mins} דק'</span></div>
   <h2>${pass?"עברת את קו ה-70%.":"עוד לא. קו המעבר הוא 70%."}</h2>
   <p class="muted" style="margin:0">${pass?"כדי להיות בטוח במבחן האמיתי, כדאי להגיע ל-85% ומעלה באופן עקבי.":"עבור על ההסברים למטה, תרגל את המילים שקשורות לטעויות, ונסה שוב. השאלות והתשובות יתערבבו מחדש."}</p>
   ${toPractice.length?`<div class="heq" style="margin:0"><b>מילים שקשורות לשאלות שטעית בהן:</b><span class="en-block" lang="en" dir="ltr" style="font-weight:500;margin-top:4px">${toPractice.map(t=>t[0]).join(" · ")}</span></div><button class="btn" id="pw">תרגל את המילים האלה ←</button>`:""}
   <div class="row"><button class="btn soft" id="home">לתפריט</button><button class="btn soft" id="again">מבחן חוזר</button></div></div>
  <div class="panel"><h3>סקירת כל השאלות</h3><div class="review">${Q.map((e,k)=>{const q=D.exam[e.i],ok=ans[k]===q.a;
    return `<div class="rv${ok?"":" wrong"}"><span class="rv-lab">${ok?"✓ נכון":"✗ טעות"}</span><p class="rv-en" lang="en" dir="ltr">${q.en}</p>
     ${ok?"":`<span class="rv-lab">התשובה שלך</span><p class="rv-en" lang="en" dir="ltr">${ans[k]==null?"(no answer)":q.o[ans[k]][0]}</p>`}
     <span class="rv-lab">התשובה הנכונה</span><p class="rv-en" lang="en" dir="ltr">${q.o[q.a][0]}</p><span>${q.why}</span></div>`}).join("")}</div></div>`;
  $("home").onclick=home;$("again").onclick=exam;
  if($("pw"))$("pw").onclick=()=>{const its=wordItems(toPractice);const defs=its.filter(it=>it.qHe!==undefined&&/Which term/.test(it.q));runDrill(defs.length?defs:its,"מילים מהטעויות במבחן",null,home)};
  focusPanel();
}

function glossary(){
  toTop();
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">→ לתפריט</button><span class="pill">${ALLT.length} מונחים</span></div>
  <div class="panel"><h2>מילון מונחים</h2><input class="search" id="q" dir="auto" placeholder="חיפוש בעברית או באנגלית" aria-label="חיפוש"><p class="muted" id="cnt" role="status" aria-live="polite" style="margin:0"></p><div id="list" style="display:flex;flex-direction:column;gap:8px"></div></div>`;
  const draw=f=>{const fl=(f||"").toLowerCase().trim();
    let res=ALLT.filter(x=>!fl||(x.t[0]+" "+x.t[1]+" "+x.t[2]+" "+((W[x.t[0]]||{}).def||"")).toLowerCase().includes(fl));
    if(fl)res=res.sort((a,b)=>((b.t[0].toLowerCase().includes(fl)||b.t[1].includes(fl))?1:0)-((a.t[0].toLowerCase().includes(fl)||a.t[1].includes(fl))?1:0));
    $("cnt").textContent=fl?`${res.length} תוצאות`:"";
    $("list").innerHTML=res.map(x=>termCard(x.t,x.li)).join("")||`<p class="muted">לא נמצא.</p>`};
  draw("");$("q").oninput=e=>draw(e.target.value);$("back").onclick=home;focusPanel();
}

home();
</script>
</body></html>
