vernment-Sponsored Enterprise."},"Ginnie Mae":{"pr":"ג'יני מֵיי","def":"A U.S. government body within HUD. Its guaranty on mortgage-backed securities carries the full faith and credit of the United States."},"MBS / pass-through":{"pr":"אם-בי-אס / פאס-ת'רוּ","def":"A security made from a pool of mortgage loans. In the simplest form, the borrowers' payments of principal and interest go to the holders, each by their share.","hint":"MBS = Mortgage-Backed Security. pass through = עובר דרך."},"Prepayment / extension risk":{"pr":"פרי-פיימנט / אקסטנשן ריסק","def":"Rates fall: homeowners pay off early, and principal comes back to be reinvested at lower yields. Rates rise: payoffs slow, so the money stays out longer.","hint":"pre = מוקדם. extension = הארכה."},"CMO / tranches":{"pr":"סי-אם-או / טרַנְשִׁז","def":"A mortgage product that splits the pool's cash flows into classes paid in order of priority. The classes can differ in coupon, maturity and prepayment risk.","hint":"CMO = Collateralized Mortgage Obligation. tranche = פרוסה (בצרפתית)."},"Asset-backed security (ABS)":{"pr":"אֶסֶט-בֶּקְט סיקיוריטי (איי-בי-אס)","def":"An investment paid mainly from a pool of loans and receivables, such as car loans, auto leases or credit card debts. MBS are one kind."},"Municipal securities":{"pr":"מיוּניסִיפַּל סיקיוריטיז","def":"Debt issued by states, cities, counties, school districts and other government bodies.","hint":"בקיצור muni (מיוּני)."},"General obligation (GO) bond":{"pr":"ג'נרל אובליגיישן (ג'י-או) בונד","def":"State or city debt backed by the issuer's full faith, credit and taxing power, not by any specific asset. It may need voter approval.","hint":"general = כללי. הכל עומד מאחוריה, כולל מיסים."},"Revenue bond":{"pr":"רֶוֶנְיוּ בונד","def":"Debt repaid from the income of a specific project or source, such as tolls, an airport or a water utility, not from taxing power.","hint":"revenue = הכנסה."},"Double-barreled bond":{"pr":"דאבל-בארלד בונד","def":"Backed by two sources: a defined project income source plus the issuer's full faith and credit.","hint":"double barrel = רובה עם שני קנים. שני מקורות תשלום."},"Moral obligation bond":{"pr":"מוֹרַל אובליגיישן בונד","def":"Has a main source of money for repayment. If that is not enough, there is a promise to help pay, but the law does not force anyone to keep it.","hint":"moral = מוסרי, לא משפטי. אפשר לכסות, לא חייבים."},"Special tax / special assessment":{"pr":"ספֶּשָל טאקס / ספֶּשָל אסֶסְמֶנְט","def":"Repaid from named taxes other than property taxes, or from a dedicated levy charged for the project."},"Private activity / IDB":{"pr":"פרייבט אקטיביטי / איי-די-בי","def":"A muni whose money is used by businesses rather than by governments, for example a plant built for a company. Its interest may be subject to the federal AMT.","hint":"IDB = Industrial Development Bond."},"TAN / RAN / BAN":{"pr":"טאן / ראן / באן","def":"Short-term muni notes repaid from money expected soon: future tax receipts, other future revenues, or a later long-term bond issue.","hint":"AN = Anticipation Note (שטר \"בציפייה ל\"). T = Tax, R = Revenue, B = Bond."},"Muni tax treatment":{"pr":"מיוּני טאקס טריטמנט","def":"The interest is generally free of federal income tax. It may also be free of state tax if you live in the issuing state. Gains from selling can be taxed. Some (private activity bonds) are subject to the AMT."},"Tax-equivalent yield":{"pr":"טאקס-אקוויוולנט יילד","def":"What a taxable bond must pay to match a tax-free one: tax-free rate ÷ (1 − tax bracket). 3.5% ÷ 0.78 = 4.49%.","hint":"equivalent = שווה ערך."},"MSRB":{"pr":"אם-אס-אר-בי","def":"Writes the rules for dealers, banks and municipal advisors in the muni market. It does not enforce them (FINRA, the SEC and bank regulators do), and it cannot regulate issuers.","hint":"MSRB = Municipal Securities Rulemaking Board."},"EMMA / official statement":{"pr":"אֶמָה / אֲפִישָל סטייטמנט","def":"The free website the SEC named in 2009 as the source for muni data and disclosures, and the issuer's disclosure document for a new issue, similar to a prospectus.","hint":"EMMA = Electronic Municipal Market Access."},"Underwriter / syndicate":{"pr":"אנדר-רייטר / סינדיקט","def":"A firm that buys a new issue from the issuer to resell it, and a group of such firms formed to share the risk.","hint":"syndicate = קבוצה שמתאגדת למטרה אחת."},"Negotiated vs. competitive":{"pr":"נגוֹשיאייטד ורסס קומפטיטיב","def":"Two ways to sell a new muni issue. In one, the issuer picks the firm and bargains over the terms. In the other, firms submit firm bids and the lowest interest cost usually wins.","hint":"negotiate = לנהל משא ומתן."},"Money market":{"pr":"מאני מרקט","def":"Trading in short-term debt with original maturities of one year or less, such as T-bills, commercial paper, bankers' acceptances and CDs."},"Commercial paper":{"pr":"קוֹמֶרְשָל פייפר","def":"Unsecured short-term IOUs issued mainly by corporations, due in up to 270 days (about 30 on average). Sold at a discount, usually in $100,000 minimums."},"Banker's acceptance":{"pr":"בנקרז אקסֶפְּטֶנְס","def":"A short-term promise to pay that a bank has guaranteed, so the bank must pay. Used to pay for trade, especially imports and exports. Sold at a discount.","hint":"accept = לקבל על עצמו (את החוב)."},"Certificate of deposit (CD)":{"pr":"סֶרְטִיפִיקֶט אוֹב דִיפּוֹזִיט (סי-די)","def":"A bank account where you put a fixed sum for a fixed period. FDIC insured up to $250,000 per person, per bank, per ownership category. Taking money out early may cost a penalty."},"Brokered CD":{"pr":"ברוֹקֶרְד סי-די","def":"A bank time account sold to customers through a middleman. Selling it before maturity can mean a loss if rates rose. If it is callable, only the bank can call it.","hint":"broker = מתווך."},"Money market fund":{"pr":"מאני מרקט פאנד","def":"A pooled investment that holds high-quality short-term debt. Not FDIC insured, and it can lose value."}},"examWords":[["semiannually","פעמיים בשנה","כל תשלום = חצי מהריבית השנתית. 6% מ-1,000 = 60 בשנה = 30 בכל תשלום."],["par / at par","ערך נקוב / בדיוק בערך הנקוב","par של אג\"ח הוא בדרך כלל 1,000 דולר."],["below par / at a discount","מתחת לערך הנקוב","קורה כשהריבית בשוק עלתה מעל הקופון."],["above par / at a premium","מעל הערך הנקוב","קורה כשהריבית בשוק ירדה מתחת לקופון."],["trades at","נסחרת במחיר","Her bond trades below par = המחיר שלה בשוק נמוך מ-1,000."],["downgrades","מוריד את הדירוג","S&P downgrades a bond = חברת הדירוג הורידה את הציון שלה."],["the LOWEST ... still considered","הנמוך ביותר שעדיין נחשב","מחפשים את הגבול: הדירוג האחרון שעוד בפנים."],["past its call protection","תקופת ההגנה מפדיון מוקדם נגמרה","עכשיו המנפיק כבר רשאי לפדות מוקדם."],["receive the least","יקבל הכי מעט","בשאלות פשיטת רגל: מי אחרון בתור."],["subject to","חייב ב (מס)","subject to federal tax = משלמים עליו מס פדרלי."],["exempt from","פטור מ","exempt from state tax = לא משלמים מס מדינה."],["filled in full","מתמלא במלואו","ההצעה מקבלת את כל הכמות שביקשה."],["accepts the auction yield","מקבל את התשואה שנקבעה במכרז","זו הצעה לא תחרותית (noncompetitive)."],["names its own yield","קובע בעצמו את התשואה","זו הצעה תחרותית (competitive)."],["in the 24% tax bracket","במדרגת מס של 24%","את המספר הזה מכניסים לנוסחה: 1 פחות 0.24."],["falls short","לא מספיק, חסר","Revenues fall short = ההכנסות לא מכסות את התשלום."],["firm bids","הצעות מחייבות","הצעה מחייבת (binding). כך נראית מכירה תחרותית."],["enforce","לאכוף","לבדוק ולהעניש. ה-MSRB כותב כללים, אבל לא אוכף."],["most directly","בצורה הכי ישירה","כמה תשובות אולי קשורות. בוחרים את הקשר הכי ישיר."],["sharply","בחדות","rise sharply = עולה הרבה ומהר."],["before maturity","לפני מועד הפדיון","sell before maturity = למכור בשוק לפני שהמנפיק מחזיר את הכסף."],["guaranty backed by","ערבות שמגובה על ידי","backed by the full faith and credit = הממשלה עצמה עומדת מאחורי זה."],["at a loss / at a gain","בהפסד / ברווח","ביחס למחיר שבו קנית."],["unsecured","בלי בטוחה","אין נכס מסוים ששועבד לטובת המלווה."],["creditor","נושה (מי שהלווה כסף)","מחזיק אג\"ח הוא creditor: הלווה כסף לחברה. בפשיטת רגל מקבל לפני בעלי המניות."],["owner","בעלים","מחזיק מניה הוא owner. לפני המרה, מחזיק אג\"ח להמרה עדיין creditor, לא owner."],["before conversion","לפני ההמרה","כל עוד לא המיר, הוא מחזיק אג\"ח רגיל."],["faces (a risk)","חשוף ל (סיכון)","faces extension risk = הסיכון שלו עכשיו הוא סיכון הארכה. לא face value."],["goes bankrupt","פושטת רגל","מתחילים לחלק את הנכסים לפי סדר העדיפות."],["left over","נשאר","with a little left over = נשאר רק מעט כסף אחרי שהקודמים בתור קיבלו."],["purchase price","המחיר ששילמת","sell below the purchase price = למכור בפחות ממה שקנית."],["state aid","כספי סיוע מהמדינה","זו הכנסה (revenue), לא מס. שטר שנפרע ממנה הוא RAN."],["the right to receive the payments","הזכות לקבל את התשלומים","מי שקונה את הזכות לתשלומי הלוואות מחזיק נייר מגובה נכסים (asset-backed)."],["Which statement ... is TRUE?","איזה משפט נכון?","רק אפשרות אחת נכונה במלואה. חלק מהשאר נכונות רק בחצי."],["Compared with","בהשוואה ל","Compared with the A bond = ביחס לאג\"ח בדירוג A."],["What happens next?","מה קורה אחר כך?","מחפשים את התוצאה לפי הכללים, לא את מה שהיה נחמד שיקרה."]],"pairs":[{"a":"Creditor","b":"Owner","ta":"Bond","he":"מחזיק אג\"ח מול מחזיק מניה. מי הלווה ומי שותף?","why":"","items":[["Lends money to the company.","מלווה כסף לחברה.","a"],["Holds the company's stock.","מחזיק במניות החברה.","b"],["Paid first in bankruptcy.","מקבל ראשון בפשיטת רגל.","a"],["Paid last in bankruptcy.","מקבל אחרון בפשיטת רגל.","b"],["A convertible bondholder, before conversion.","מחזיק אג\"ח להמרה, לפני ההמרה.","a"]]},{"a":"RAN","b":"TAN","ta":"TAN / RAN / BAN","tb":"TAN / RAN / BAN","he":"שני שטרות קצרים של עירייה. ממה הם ייפרעו?","why":"","items":[["Repaid from state aid the city expects to receive.","נפרע מכספי סיוע שהעירייה מצפה לקבל מהמדינה.","a"],["Repaid from property taxes due next month.","נפרע ממסי רכוש שייגבו בחודש הבא.","b"],["Repaid from future revenues other than taxes.","נפרע מהכנסות עתידיות שאינן מיסים.","a"],["Repaid from future tax receipts.","נפרע מגביית מיסים עתידית.","b"]]},{"a":"BAN","b":"TAN","ta":"TAN / RAN / BAN","tb":"TAN / RAN / BAN","he":"שטר שנפרע מהלוואה חדשה ארוכה, מול שטר שנפרע ממיסים.","why":"","items":[["Repaid from a long-term bond the city will sell later.","נפרע מאג\"ח ארוכה שהעירייה תמכור בהמשך.","a"],["Repaid from income tax the city will collect.","נפרע ממס שהעירייה תגבה.","b"],["Bridges the time until permanent financing is ready.","מגשר על הזמן עד שהמימון הקבוע מוכן.","a"]]},{"a":"Current yield","b":"Yield to maturity","tb":"Yield to maturity (YTM)","he":"שתי דרכים לחשב תשואה. אחת רק לפי המחיר היום, השנייה כוללת גם את החזרה ל-par.","why":"","items":[["Annual coupon divided by today's market price.","הקופון השנתי חלקי המחיר בשוק היום.","a"],["Counts the coupons and the gain or loss back to par.","סופרת את הקופונים וגם את הרווח או ההפסד עד החזרה ל-par.","b"],["Assumes you hold the bond until the issuer repays it.","מניחה שמחזיקים את האג\"ח עד שהמנפיק מחזיר את הכסף.","b"],["$40 ÷ $900 = 4.44%.","40 חלקי 900 = 4.44%.","a"],["For a bond bought below par, this is the highest of the three yields.","באג\"ח שנקנתה מתחת ל-par, זו הגבוהה מבין שלוש התשואות.","b"]]},{"a":"Premium","b":"Discount","ta":"Premium / discount","tb":"Premium / discount","he":"מחיר מעל par או מתחת ל-par.","why":"","items":[["A $1,000 bond trades at $1,063.","אג\"ח של 1,000 דולר נסחרת ב-1,063 דולר.","a"],["Market rates rose above the bond's coupon.","הריבית בשוק עלתה מעל הקופון של האג\"ח.","b"],["Market rates fell below the bond's coupon.","הריבית בשוק ירדה מתחת לקופון של האג\"ח.","a"],["The current yield is higher than the coupon rate.","התשואה השוטפת גבוהה משיעור הקופון.","b"],["The YTM is lower than the coupon rate.","התשואה לפדיון נמוכה משיעור הקופון.","a"],["A T-bill is typically sold this way.","שטר אוצר בדרך כלל נמכר כך.","b"]]},{"a":"Secured bond","b":"Debenture","he":"עם בטוחה או בלי בטוחה.","why":"","items":[["Specific assets are pledged to the lenders.","נכסים מסוימים משועבדים למלווים.","a"],["Backed only by the issuer's general credit.","מגובה רק באשראי הכללי של המנפיק.","b"],["Equipment trust certificates are one example.","תעודות equipment trust הן דוגמה.","a"],["Has no specific collateral; ranked senior or junior by contract.","אין לה בטוחה מסוימת; לפי החוזה היא בכירה או נחותה.","b"],["In bankruptcy, its holders are paid first among the bondholders.","בפשיטת רגל, המחזיקים בה מקבלים ראשונים מבין בעלי האג\"ח.","a"]]},{"a":"Callable bond","b":"Convertible bond","he":"שתי אפשרויות \"לסיים\" את האג\"ח מוקדם, אבל אצל צד אחר: מי מחליט?","why":"","items":[["The issuer decides to pay it off early.","המנפיק מחליט לפרוע אותה מוקדם.","a"],["The holder decides to exchange it for common stock.","המחזיק מחליט להמיר אותה במניות רגילות.","b"],["Usually pays a lower yield than similar bonds.","בדרך כלל משלמת תשואה נמוכה מאג\"ח דומות.","b"],["Often pays more, to make up for reinvestment risk.","לעתים קרובות משלמת יותר, כפיצוי על סיכון ההשקעה מחדש.","a"],["Most likely to end early when market rates fall.","הכי סביר שתסתיים מוקדם כשהריבית בשוק יורדת.","a"]]},{"a":"Prepayment risk","b":"Extension risk","ta":"Prepayment / extension risk","tb":"Prepayment / extension risk","he":"שני הסיכונים של אג\"ח מגובות משכנתאות. מה קורה כשהריבית זזה?","why":"","items":[["Rates fall and homeowners refinance.","הריבית יורדת ובעלי בתים ממחזרים משכנתאות.","a"],["Rates rise and homeowners pay off more slowly.","הריבית עולה ובעלי הבתים פורעים לאט יותר.","b"],["Principal comes back early, to be reinvested at lower yields.","הקרן חוזרת מוקדם, ומשקיעים אותה מחדש בתשואה נמוכה יותר.","a"],["The holder's money stays out longer than expected.","הכסף של המחזיק נשאר בחוץ יותר זמן מהצפוי.","b"]]},{"a":"General obligation bond","b":"Revenue bond","ta":"General obligation (GO) bond","tb":"Revenue bond","he":"מאיפה מגיע הכסף להחזר: מיסים או הכנסות של פרויקט.","why":"","items":[["Backed by the issuer's taxing power.","מגובה בכוח המיסוי של המנפיק.","a"],["Repaid from tolls on a bridge.","נפרעת מאגרות מעבר על גשר.","b"],["May need voter approval before it is issued.","ייתכן שצריך אישור של הבוחרים לפני ההנפקה.","a"],["Repaid from an airport's income.","נפרעת מההכנסות של שדה תעופה.","b"],["Backed by the issuer's general taxing power, not by a specific project.","מגובה בכוח המיסוי הכללי של המנפיק, לא בפרויקט מסוים.","a"]]},{"a":"Double-barreled bond","b":"Moral obligation bond","tb":"Moral obligation bond","he":"שתיהן עם מקור שני לגיבוי. ההבדל: האם הגיבוי מחייב.","why":"","items":[["The second source is the issuer's full faith and credit.","המקור השני הוא האמונה והאשראי המלאים של המנפיק.","a"],["The second source is a non-binding pledge.","המקור השני הוא התחייבות לא מחייבת.","b"],["If revenues fall short, the backup may cover it, but need not.","אם ההכנסות לא מספיקות, הגיבוי יכול לכסות אבל לא חייב.","b"],["If revenues fall short, the backup must cover it.","אם ההכנסות לא מספיקות, הגיבוי חייב לכסות.","a"]]},{"a":"Competitive bid","b":"Noncompetitive bid","ta":"Competitive / noncompetitive bid","tb":"Competitive / noncompetitive bid","he":"שני סוגי הצעות במכרז של משרד האוצר האמריקאי.","why":"","items":[["Names the yield it will accept.","קובעת בעצמה את התשואה שתקבל.","a"],["Accepts the yield set at the auction.","מקבלת את התשואה שנקבעה במכרז.","b"],["Limited to $10 million per auction.","מוגבלת ל-10 מיליון דולר למכרז.","b"],["Limited to 35% of the offering.","מוגבלת ל-35% מההנפקה.","a"],["Is filled in full.","מתמלאת במלואה.","b"]]},{"a":"Negotiated sale","b":"Competitive sale","ta":"Negotiated vs. competitive","tb":"Negotiated vs. competitive","he":"שתי דרכים שבהן עירייה מוכרת אג\"ח חדשה לחתמים.","why":"","items":[["The issuer picks the underwriter without public bidding.","המנפיק בוחר את החתם בלי מכרז פומבי.","a"],["Underwriters submit firm bids.","חתמים מגישים הצעות מחייבות.","b"],["The bid with the lowest interest cost usually wins.","בדרך כלל זוכה ההצעה עם עלות הריבית הנמוכה ביותר.","b"],["The rate, call features and price are bargained over.","מתמקחים על הריבית, תנאי הפדיון המוקדם והמחיר.","a"]]},{"a":"Ginnie Mae","b":"Fannie Mae","tb":"GSE","he":"שניהם קשורים למשכנתאות. רק אחד מגובה בממשלה עצמה.","why":"","items":[["Its guaranty is backed by the full faith and credit of the U.S.","הערבות שלו מגובה באמונה ובאשראי המלאים של ארה\"ב.","a"],["A government-sponsored enterprise, not a government agency.","חברה בחסות ממשלתית, לא סוכנות ממשלתית.","b"],["Located within HUD.","נמצא בתוך HUD (משרד השיכון האמריקאי).","a"],["Its securities lack full faith and credit backing.","לניירות שלו אין גיבוי של האמונה והאשראי המלאים.","b"]]},{"a":"STRIPS","b":"Treasury receipts","he":"שניהם אג\"ח אוצר שפורקו לחתיכות ללא קופון. ההבדל: מי יצר אותן.","why":"","items":[["A program of the U.S. Treasury itself.","תוכנית של משרד האוצר האמריקאי עצמו.","a"],["Created by broker-dealers, not by the government.","נוצרו על ידי ברוקר-דילרים, לא על ידי הממשלה.","b"],["TIGRs and CATS are examples.","TIGRs ו-CATS הן דוגמאות.","b"],["Began in 1985.","התחילה ב-1985.","a"]]},{"a":"Treasury bill","b":"Treasury bond","ta":"Treasury bill (T-bill)","tb":"Treasury bond","he":"הקצר ביותר והארוך ביותר. שימו לב גם לאופן התשלום.","why":"","items":[["Issued for 52 weeks or less.","מונפק ל-52 שבועות או פחות.","a"],["Issued for 20 or 30 years.","מונפק ל-20 או 30 שנה.","b"],["Pays interest every six months.","משלם ריבית כל חצי שנה.","b"],["Sold at a discount, with no periodic interest.","נמכר בהנחה, בלי ריבית תקופתית.","a"]]},{"a":"Commercial paper","b":"Banker's acceptance","he":"שני מכשירים קצרים של שוק הכסף. מי מתחייב לשלם?","why":"","items":[["Unsecured IOUs issued mainly by corporations.","שטרי חוב בלי בטוחה, שמנפיקות בעיקר חברות.","a"],["The accepting institution becomes primarily liable for payment.","המוסד שחתם עליו נעשה האחראי העיקרי לתשלום.","b"],["Used to finance international trade.","משמש למימון סחר בינלאומי.","b"],["Exempt from SEC registration if due in 270 days or less.","פטור מרישום ב-SEC אם הפירעון תוך 270 יום או פחות.","a"]]},{"a":"Certificate of deposit","b":"Money market fund","ta":"Certificate of deposit (CD)","tb":"Money market fund","he":"שניהם \"מקום בטוח לכסף\". רק אחד מבוטח.","why":"","items":[["Insured by the FDIC up to $250,000.","מבוטח על ידי ה-FDIC עד 250,000 דולר.","a"],["Not FDIC insured, and can lose money.","לא מבוטחת על ידי ה-FDIC, ויכולה להפסיד.","b"],["A fixed sum for a fixed period at a bank.","סכום קבוע לתקופה קבועה בבנק.","a"],["A pooled investment holding high-quality short-term debt.","השקעה משותפת שמחזיקה חוב קצר ואיכותי.","b"]]},{"a":"Treasury interest","b":"Municipal interest","ta":"Federal vs. state tax","tb":"Muni tax treatment","he":"מי גובה מס על הריבית? בודקים בנפרד: מס פדרלי, ומס מדינה.","why":"","items":[["Always subject to federal tax and exempt from state tax.","תמיד חייבת במס פדרלי ופטורה ממס מדינה.","a"],["Generally exempt from federal income tax.","בדרך כלל פטורה ממס הכנסה פדרלי.","b"],["May also be exempt from state tax, for residents of the issuing state.","ייתכן שתהיה פטורה גם ממס מדינה, לתושבי המדינה המנפיקה.","b"],["Exempt from state tax wherever the investor lives.","פטורה ממס מדינה בכל מקום שהמשקיע גר.","a"]]},{"a":"Investment grade","b":"High-yield","tb":"High-yield (junk) bonds","he":"הקו עובר בין BBB ל-BB.","why":"","items":[["Rated BBB or better.","בדירוג BBB ומעלה.","a"],["Rated BB or below.","בדירוג BB ומטה.","b"],["Also called speculative or junk.","נקראות גם ספקולטיביות או זבל.","b"],["Baa3 at Moody's.","Baa3 אצל Moody's.","a"],["Pays more to make up for more default risk.","משלמת יותר כפיצוי על יותר סיכון חדלות פירעון.","b"]]},{"a":"Interest rate risk","b":"Credit risk","tb":"Credit (default) risk","he":"שני סיכונים שונים: השוק זז, או המנפיק לא משלם.","why":"","items":[["Market rates rise and the bond's price falls.","הריבית בשוק עולה ומחיר האג\"ח יורד.","a"],["The issuer misses an interest payment.","המנפיק לא משלם תשלום ריבית.","b"],["Even Treasuries have it.","גם לאג\"ח אוצר יש אותו.","a"],["Ratings agencies measure it.","חברות הדירוג מודדות אותו.","b"],["Generally larger for longer maturities and lower coupons.","בדרך כלל גדול יותר כשהפדיון רחוק וכשהקופון נמוך.","a"]]}]};</script>
<script>
const D=DATA, app=document.getElementById("app"), $=id=>document.getElementById(id);
const KEY=D.id;
let S={done:{},best:null,attempts:0};try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const toTop=()=>(document.body.classList.remove("athome"),window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}));
const L="ABCD";

/* ---------- v3: pronunciation (device voice, natural voices first) ---------- */
const W=D.words||{};
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Deranged|Hysterical|Pipe|Fred|Junior|Ralph|Grandpa|Grandma|Rocko|Eddy|Reed|Sandy|Shelley|Flo/i;
const WARM=[[/Natural|Neural/i,60],[/Premium/i,55],[/Enhanced/i,50],[/\bAva\b/i,40],[/Samantha/i,34],[/Allison|Susan|Zoe|Nicky|Evan|Joelle|Noelle/i,30],[/Aria|Jenny|Michelle/i,38],[/Google US English/i,32],[/Google UK English Female/i,24]];
function scoreVoice(x){if(!/^en/i.test(x.lang)||NOVELTY.test(x.name))return -1;let sc=/en[-_]US/i.test(x.lang)?20:/en[-_](GB|AU|CA|IE|NZ)/i.test(x.lang)?12:6;WARM.forEach(([r,w])=>{if(r.test(x.name))sc+=w});return sc}
let voice=null;const canSpeak="speechSynthesis" in window;
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(x=>scoreVoice(x)>=0).sort((a,b)=>scoreVoice(b)-scoreVoice(a));voice=v[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(t){try{if(!canSpeak)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/\s*\/\s*/g,", ").replace(/\(|\)/g,", "));if(voice)u.voice=voice;u.lang="en-US";u.rate=.88;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener("click",e=>{const b=e.target.closest(".saybtn,.story .en");if(b){speak(b.dataset.say||b.textContent)}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".story .en")){e.preventDefault();speak(e.target.textContent)}});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const sayBtn=t=>canSpeak?`<button class="saybtn" data-say="${esc(t)}" aria-label="Hear: ${esc(t)}" lang="en">🔊</button>`:"";
const ALLT=D.lessons.flatMap((l,i)=>l.terms.map(t=>({t,li:i})));
const termLi=n=>{const x=ALLT.find(x=>x.t[0]===n);return x?x.li:-1};
const hasDefs=ALLT.some(x=>W[x.t[0]]&&W[x.t[0]].def);
const smooth=()=>matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth";
function focusPanel(){const p=app.querySelector(".panel");if(p){p.setAttribute("tabindex","-1");p.focus({preventScroll:true})}}
S.miss=S.miss||{};S.ld=S.ld||{};
/* missed words come back after 1, 3 and 7 days (local calendar days) */
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5);
const GAPS=[1,3,7];
Object.keys(S.miss).forEach(k=>{if(typeof S.miss[k]!=="object")S.miss[k]={b:0,due:today()}});
function markMiss(term){S.miss[term]={b:0,due:today()};save()}
function markHit(term){const m=S.miss[term];if(!m||m.due>today())return;if(m.b>=GAPS.length)delete S.miss[term];else{m.due=today()+GAPS[m.b];m.b++}save()}
const bidi=h=>String(h).replace(/[A-Za-z][A-Za-z0-9 .'\/&$%-]*[A-Za-z0-9%]/g,m=>`<bdi lang="en">${m}</bdi>`);
const termCard=(t,li)=>{const w=W[t[0]]||{};return `<div class="term"><div class="t-top">${sayBtn(t[0])}<span class="t-en" lang="en">${t[0]}</span></div>
  ${w.pr?`<span class="t-pr">הגייה: ${w.pr}</span>`:""}${w.def?`<p class="t-def" lang="en" dir="ltr">${w.def}</p>`:""}
  <span class="t-he">${bidi(t[1])}${li!=null?` <span class="muted" style="font-weight:400;font-size:.85rem">(שיעור ${li+1})</span>`:""}</span><p>${bidi(t[2])}</p>${w.hint?`<p class="t-hint">💡 ${bidi(w.hint)}</p>`:""}</div>`};
const lessonBtn=(id,icon,title,sub,st,stCls,extra)=>`<button class="lesson${extra||""}" id="${id}"><span class="n" aria-hidden="true">${icon}</span><span><span class="h3">${title}</span><small lang="en">${sub}</small></span><span class="st${stCls||""}">${st}</span></button>`;

/* ---------- home ---------- */
function home(){
  document.body.classList.add("athome");setTimeout(()=>{const h=app.querySelector("h1");if(h){h.tabIndex=-1;h.focus({preventScroll:true})}},0);
  const n=D.lessons.filter(l=>S.done[l.id]).length;const inList=Object.keys(S.miss).filter(k=>ALLT.some(x=>x.t[0]===k));const weak=inList.filter(k=>S.miss[k].due<=today());const later=inList.length-weak.length;
  app.innerHTML=`<div><span class="eyebrow" lang="en">SIE · ${D.section}</span><h1>${D.heTitle}</h1>
   <p class="muted" style="margin:6px 0 0">${D.lessons.length} שיעורים. בכל שיעור: סיפור, כרטיסי מילים${hasDefs?" עם הגייה והגדרה באנגלית":""}, תרגול מילים ובדיקה קטנה. אחר כך תרגול לפני המבחן, ובסוף מבחן בסגנון FINRA.${canSpeak?" אפשר ללחוץ על כל מונח באנגלית כדי לשמוע אותו.":""}</p></div>
  <div class="row"><span class="pill">${n} / ${D.lessons.length} שיעורים</span>${S.practice!=null?`<span class="pill">תרגול: ${S.practice}%</span>`:""}${S.best!=null?`<span class="pill">מבחן: ${S.best}%</span>`:""}</div>
  <h2 class="section">שלב 1: השיעורים</h2>
  <div class="lessons">${D.lessons.map((l,i)=>`<button class="lesson" data-i="${i}"><span class="n" aria-hidden="true">${i+1}</span><span><span class="h3">${l.he}</span><small lang="en">${l.en}</small></span><span class="st${S.done[l.id]?" done":""}">${S.done[l.id]?"✓ נלמד"+(S.ld[l.id]!=null?` · מילים ${S.ld[l.id]}%`:""):"התחל"}</span></button>`).join("")}</div>
  <h2 class="section">שלב 2: לחבר את המילים באנגלית</h2>
  <div class="lessons">
   ${weak.length?lessonBtn("weak","!",`מילים שפספסתי: לחזור&nbsp;היום&nbsp;(${weak.length})`,"Missed words come back after 1, 3 and 7 days","התחל"," mid"):""}
   ${later?`<p class="muted" style="margin:0">${weak.length?"ועוד ":""}${later} ${later===1?"מילה שפספסת תחזור":"מילים שפספסת יחזרו"} בימים הבאים. מילה יוצאת מהרשימה אחרי שעונים עליה נכון ב-4 ימים שונים.</p>`:""}
   ${lessonBtn("allwords","Aa","כל המילים, לפי שיעורים",hasDefs?"Definition → term · term → definition · term → עברית":"Term → עברית",S.words!=null?"✓ "+S.words+"%":"בחר",S.words!=null?" done":"")}
   ${D.pairs?lessonBtn("pairs","⇄","צמדים מבלבלים",D.pairs.map(p=>p.a.replace(/ \(.*\)/,"")+" / "+p.b).slice(0,2).join(" · ")+" …",S.pairs!=null?"✓ "+S.pairs+"%":"התחל",S.pairs!=null?" done":""):""}
   ${D.sorter?lessonBtn("sorter","⊞",D.sorter.title,D.sorter.labels.join(" · "),S.sorter!=null?"✓ "+S.sorter+"%":"התחל",S.sorter!=null?" done":""):""}
   ${D.examWords?lessonBtn("examwords","?","האנגלית של המבחן",D.examWords.slice(0,4).map(e=>e[0]).join(" · "),S.ew!=null?"✓ "+S.ew+"%":"התחל",S.ew!=null?" done":""):""}
  </div>

 ytw:{t:"התשואה הגרועה ביותר",f:"Yield to worst = the lower of YTM and yield to call",x:"YTM 6.20%, YTC 5.70% → 5.70%",g(){const c=Rn([3,4,5,6,7]),disc=Math.random()<.5,x=Rn([.4,.6,.8,1]),z=Rn([.3,.5,.7]);

 oshort:{t:"מוכר: רווח והפסד מקסימליים",f:"Writer's max gain = premium. Uncovered call max loss: unlimited. Uncovered put max loss = (strike − premium) × 100",x:"60 call at 2: max gain $200, max loss unlimited",g(){const K=Rn([20,30,40,50,60,75,90]),pr=Rn([1,2,3,4,5,6]),call=Math.random()<.5,gain=Math.random()<.5;

 omoney:{t:"בתוך הכסף או מחוצה לו",f:"Call ITM: stock above strike. Put ITM: stock below strike. Equal: at the money",x:"Stock $55: 50 call ITM, 60 put ITM",g(){const S=Rn([32,43,45,52,55,58,60,63,67,70,72,78]),K=Math.round(S/5)*5+Rn([-5,0,0,5]),call=Math.random()<.5;

    <div class="bar" aria-hidden="true"><i id="pbar" style="width:${answered()/Q.length*100}%"></i></div>
    <div class="panel"><p class="q enq" lang="en">${q.en}</p>
     <button class="btn soft" id="tr" style="align-self:flex-start">הצג תרגום לעברית</button><p class="heq" id="heq" hidden>${q.he}</p>
     <div class="opts">${e.ord.map((oi,p)=>`<button class="opt${ans[cur]===oi?" sel":""}" data-i="${p}" lang="en" aria-pressed="${ans[cur]===oi}"><span class="l">${L[p]}</span><span>${q.o[oi][0]}<span class="tr" lang="he" hidden>${q.o[oi][1]}</span></span></button>`).join("")}</div>
     <div class="row"><button class="btn soft" id="prev" ${cur===0?"disabled":""}>→ הקודמת</button>${cur<Q.length-1?`<button class="btn" id="next">הבאה ←</button>`:`<button class="btn" id="fin">הגש מבחן</button>`}</div></div>
    <div class="panel"><span class="muted">מעבר מהיר בין שאלות</span><div class="grid">${Q.map((x,k)=>`<button class="dot${ans[k]!=null?" ans":""}${k===cur?" cur":""}" data-k="${k}" aria-label="שאלה ${k+1}${ans[k]!=null?", נענתה":""}">${k+1}</button>`).join("")}</div>
     <button class="btn soft" id="quit">יציאה בלי לשמור</button></div>`;
    clearInterval(tick);tick=setInterval(()=>{const c=$("clock");if(c)c.textContent=mm();else clearInterval(tick)},1000);
    $("tr").onclick=()=>{$("heq").hidden=!$("heq").hidden;app.querySelectorAll(".opt .tr").forEach(x=>x.hidden=$("heq").hidden);$("tr").textContent=$("heq").hidden?"הצג תרגום לעברית":"הסתר תרגום"};
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[cur]=e.ord[+b.dataset.i];app.querySelectorAll(".opt").forEach(x=>{x.classList.toggle("sel",x===b);x.setAttribute("aria-pressed",String(x===b))});
      app.querySelectorAll(".dot")[cur].classList.add("ans");$("cnt").textContent="נענו "+answered();$("pbar").style.width=answered()/Q.length*100+"%"});
    app.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{cur=+b.dataset.k;draw()});
    $("prev").onclick=()=>{if(cur>0){cur--;draw()}};
    if($("next"))$("next").onclick=()=>{cur++;draw()};
    if($("fin"))$("fin").onclick=()=>{const left=ans.filter(x=>x==null).length;if(left&&!$("confirm")){$("fin").insertAdjacentHTML("beforebegin",`<p class="fb no" id="confirm" role="alert">יש ${left} שאלות בלי תשובה. במבחן האמיתי אין עונש על ניחוש, אז כדאי לענות על הכל. לחץ שוב על "הגש" כדי להגיש בכל זאת.</p>`);return}clearInterval(tick);result(Q,ans,Date.now()-t0)};
    $("quit").onclick=()=>{if(!$("qconf")){$("quit").insertAdjacentHTML("beforebegin",`<p class="fb no" id="qconf" role="alert">יציאה תמחק את התשובות במבחן הזה. לחץ שוב כדי לצאת.</p>`);return}clearInterval(tick);home()};
    focusPanel();
  }
  draw();
}

function result(Q,ans,ms){
  const right=Q.filter((e,k)=>ans[k]===D.exam[e.i].a).length,pct=Math.round(right/Q.length*100),pass=pct>=70;
  S.attempts++;if(S.best==null||pct>S.best)S.best=pct;save();toTop();
  const mins=Math.round(ms/60000);
  /* words to practice: terms whose claim IDs match the questions answered wrong */
  const wrongQ=Q.filter((e,k)=>ans[k]!==D.exam[e.i].a).map(e=>new Set(D.exam[e.i].c||[]));
  const toPractice=ALLT.map(x=>({t:x.t,n:wrongQ.filter(cs=>(x.t[3]||[]).some(c=>cs.has(c))).length})).filter(x=>x.n>0&&!(W[x.t[0]]||{}).noDrill).sort((a,b)=>b.n-a.n).slice(0,8).map(x=>x.t);
  app.innerHTML=`<div class="panel"><span class="eyebrow">תוצאות המבחן</span>
   <div class="row" style="justify-content:flex-start;gap:14px;align-items:flex-end"><span class="big">${pct}%</span><span class="pill">${right} / ${Q.length} נכונות</span><span class="pill">${mins} דק'</span></div>
   <h2>${pass?"עברת את קו ה-70%.":"עוד לא. קו המעבר הוא 70%."}</h2>
   <p class="muted" style="margin:0">${pass?"כדי להיות בטוח במבחן האמיתי, כדאי להגיע ל-85% ומעלה באופן עקבי.":"עבור על ההסברים למטה, תרגל את המילים שקשורות לטעויות, ונסה שוב. השאלות והתשובות יתערבבו מחדש."}</p>
   ${toPractice.length?`<div class="heq" style="margin:0"><b>מילים שקשורות לשאלות שטעית בהן:</b><span class="en-block" lang="en" dir="ltr" style="font-weight:500;margin-top:4px">${toPractice.map(t=>t[0]).join(" · ")}</span></div><button class="btn" id="pw">תרגל את המילים האלה ←</button>`:""}
   <div class="row"><button class="btn soft" id="home">לתפריט</button><button class="btn soft" id="again">מבחן חוזר</button></div></div>
  <div class="panel"><h3>סקירת כל השאלות</h3><div class="review">${Q.map((e,k)=>{const q=D.exam[e.i],ok=ans[k]===q.a;
    return `<div class="rv${ok?"":" wrong"}"><span class="rv-lab">${ok?"✓ נכון":"✗ טעות"}</span><p class="rv-en" lang="en" dir="ltr">${q.en}</p>
     ${ok?"":`<span class="rv-lab">התשובה שלך</span><p class="rv-en" lang="en" dir="ltr">${ans[k]==null?"(no answer)":q.o[ans[k]][0]}</p>`}
     <span class="rv-lab">התשובה הנכונה</span><p class="rv-en" lang="en" dir="ltr">${q.o[q.a][0]}</p><span>${q.why}</span></div>`}).join("")}</div></div>`;
  $("home").onclick=home;$("again").onclick=exam;
  if($("pw"))$("pw").onclick=()=>{const its=wordItems(toPractice);const defs=its.filter(it=>it.qHe!==undefined&&/Which term/.test(it.q));runDrill(defs.length?defs:its,"מילים מהטעויות במבחן",null,home)};
  focusPanel();
}

function glossary(){
  toTop();
  app.innerHTML=`<div class="row"><button class="btn soft" id="back">→ לתפריט</button><span class="pill">${ALLT.length} מונחים</span></div>
  <div class="panel"><h2>מילון מונחים</h2><input class="search" id="q" dir="auto" placeholder="חיפוש בעברית או באנגלית" aria-label="חיפוש"><p class="muted" id="cnt" role="status" aria-live="polite" style="margin:0"></p><div id="list" style="display:flex;flex-direction:column;gap:8px"></div></div>`;
  const draw=f=>{const fl=(f||"").toLowerCase().trim();
    let res=ALLT.filter(x=>!fl||(x.t[0]+" "+x.t[1]+" "+x.t[2]+" "+((W[x.t[0]]||{}).def||"")).toLowerCase().includes(fl));
    if(fl)res=res.sort((a,b)=>((b.t[0].toLowerCase().includes(fl)||b.t[1].includes(fl))?1:0)-((a.t[0].toLowerCase().includes(fl)||a.t[1].includes(fl))?1:0));
    $("cnt").textContent=fl?`${res.length} תוצאות`:"";
    $("list").innerHTML=res.map(x=>termCard(x.t,x.li)).join("")||`<p class="muted">לא נמצא.</p>`};
  draw("");$("q").oninput=e=>draw(e.target.value);$("back").onclick=home;focusPanel();
}

home();
</script>
</body></html>
