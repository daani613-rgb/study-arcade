<style>
/* Layout: a calm study desk. Home = chapter map; lesson = story slides, then glossary cards, then quick checks; exam = one question per screen, FINRA-like, review at the end. */
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#15212e; --muted:#5b6b7c; --line:#d9e1e8;
  --accent:#0f6b5c; --accent-soft:#dcefea; --navy:#1d3557; --gold:#8a5a12; --gold-soft:#fbf0dc;
  --good:#157347; --good-soft:#dcf3e6; --bad:#c2362f; --bad-soft:#fbe3e1; --on-accent:#fff; --edge:#7f8e9d;
  --he:"Heebo","Arial Hebrew",system-ui,sans-serif; --en:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1720; --card:#17222e; --ink:#e7eef5; --muted:#9fb0c1; --line:#2a3a4a;
  --accent:#4fc3a8; --accent-soft:#163a33; --navy:#9cc3f0; --gold:#e6b45a; --gold-soft:#3a2d14;
  --good:#4fd18b; --good-soft:#163a28; --bad:#ff7a72; --bad-soft:#47201e; --on-accent:#0b1f1a; --edge:#5b6e82; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--he);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.9rem;font-weight:800} h2{font-size:1.4rem;font-weight:800} h3{font-size:1.1rem;font-weight:700}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-weight:600}
.eyebrow{font-size:.85rem;font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.btn{font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--accent);color:var(--on-accent);font-size:1rem}
.btn.soft{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pill{font-size:.85rem;font-weight:700;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* home */
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:right;width:100%}
.lesson .n{font-family:var(--en);font-weight:600;color:var(--accent);font-size:1.2rem;text-align:center}
.lesson small{display:block;color:var(--muted);font-family:var(--en);direction:ltr;text-align:right}
.lesson .st{font-size:.85rem;font-weight:700;color:var(--muted)}
.lesson .st.done{color:var(--good)}
.cta{background:var(--navy);color:var(--bg)}
.cta .n,.cta small,.cta .st{color:var(--bg)}
/* slides */
.bars{display:flex;gap:4px}.bars i{flex:1;height:4px;border-radius:2px;background:var(--line)}.bars i.on{background:var(--accent)}
.story{font-size:1.08rem;min-height:180px}
.story b{color:var(--navy)}
.term{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.term .t-en{font-family:var(--en);direction:ltr;text-align:left;font-size:1.25rem;font-weight:600;color:var(--navy)}
.term .t-he{font-weight:800;font-size:1.05rem}
.term p{margin:0;color:var(--ink)}
/* questions */
.q{font-size:1.08rem;font-weight:600;margin:0}
.q.enq{font-family:var(--en);direction:ltr;text-align:left;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--edge);background:var(--card);border-radius:12px;padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline;text-align:left;direction:ltr;font-family:var(--en)}
.opt .l{font-weight:600;color:var(--accent);flex:none}
.opt .tr{display:block;direction:rtl;text-align:right;font-family:var(--he);color:var(--muted);font-size:.92rem;margin-top:2px}
.opt.sel{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:0;padding:10px 12px;border-radius:12px;font-weight:500}
.fb.ok{background:var(--good-soft)}.fb.no{background:var(--bad-soft)}
.fb:empty{display:none}
.heq{background:var(--gold-soft);border-radius:12px;padding:10px 12px;margin:0}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.dot{border:1px solid var(--edge);background:var(--card);border-radius:8px;padding:6px 0;font-family:var(--en);font-size:.85rem;cursor:pointer}
.dot.ans{background:var(--accent-soft)}.dot.cur{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.big{font-family:var(--en);font-size:3rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rv.wrong{border-color:var(--bad)}
.rv .en{font-weight:500}
.search{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--edge);background:var(--card);color:var(--ink);font:inherit}
/* v2: words, pronunciation, drills */
.story .en,.say{cursor:pointer;border-bottom:1.5px dotted var(--accent)}
.story .en::after{content:" 🔊";font-size:.85em}
.story .en.nospeak{border-bottom:0;cursor:default}.story .en.nospeak::after{content:none}
.story .en:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.opt.ok .l::after{content:" ✓"}.opt.no .l::after{content:" ✗"}
.fb .en,.heq .en{white-space:nowrap}
.en-block{display:block;font-family:var(--en);font-weight:600;direction:ltr;text-align:left}
.rv-en{margin:0;font-family:var(--en);direction:ltr;text-align:left;font-weight:500}
.rv-lab{font-size:.85rem;color:var(--muted);font-weight:700}
.lesson .h3{display:block;font-size:1.1rem;font-weight:700;line-height:1.25}
.panel:focus{outline:none}
h2.section{font-size:.95rem;font-weight:700;color:var(--muted);margin:6px 0 -2px}
@media (prefers-color-scheme:dark){.cta{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}.cta .n,.cta small,.cta .st{color:var(--ink)}}
.term .t-top{display:flex;align-items:center;gap:10px;direction:ltr;justify-content:flex-start}
.saybtn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);font-size:20px;cursor:pointer;line-height:1}
.term .t-en{font-size:1.45rem}
.t-pr{color:var(--muted);font-size:.95rem}
.t-def{margin:0;font-family:var(--en);direction:ltr;text-align:left;font-weight:500;background:var(--bg);border-radius:10px;padding:8px 10px}
.term .t-hint{margin:0;font-size:.95rem;color:var(--gold)}
.opt.he{direction:rtl;text-align:right;font-family:var(--he)}
.bigterm{display:flex;align-items:center;gap:12px;direction:ltr;justify-content:center;font-family:var(--en);font-size:1.7rem;font-weight:600;color:var(--navy)}
.section{font-size:.95rem;font-weight:700;color:var(--muted);margin:6px 0 -2px}
.lesson .st.mid{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>const DATA={"id":"sie-ch2","section":"2.1.2","title":"Chapter 2: Debt Instruments","heTitle":"פרק 2: אגרות חוב ומכשירי חוב","lessons":[{"id":"l1","en":"What a bond is","he":"מה זו אג\"ח","story":[{"he":"Golden Crust גדלה, ואבי רוצה לבנות מפעל חדש. הפעם הוא לא רוצה למכור עוד מניות ולתת לאחרים חלק מהבעלות. הוא רוצה <b>ללוות</b> כסף.","c":[]},{"he":"אז Golden Crust מנפיקה <b>אגרות חוב</b> (<span class=en>bonds</span>), ובקיצור <b>אג\"ח</b>. אג\"ח היא <b>הלוואה</b> שהמשקיע נותן לחברה, כמו פתק \"אני חייב לך\" (<span class=en>IOU</span>). מי שקונה אג\"ח <b>מלווה כסף</b> לחברה. החברה מתחייבת לשלם לו <b>ריבית</b> (<span class=en>interest</span>), ובסוף להחזיר לו את הסכום שהלווה. הסכום הזה נקרא <b>הקרן</b> (<span class=en>principal</span>).","c":["A1","A2","A3"]},{"he":"שלושה מספרים מגדירים כל אג\"ח:<br>1) <b>ערך נקוב</b> (<span class=en>par value</span>, או <span class=en>face value</span>): הקרן שתוחזר בסוף. בדרך כלל 1,000 דולר לאג\"ח.<br>2) <b>שיעור הקופון</b> (<span class=en>coupon rate</span>), שנקרא גם ריבית נקובה: הריבית השנתית, כאחוז מהערך הנקוב.<br>3) <b>מועד פדיון</b> (<span class=en>maturity date</span>): היום שבו החברה מחזירה את הקרן.","c":["A4","A5","A6","A9"]},{"he":"באג\"ח בריבית קבועה, הקופון נקבע ביום ההנפקה <b>ולא משתנה</b> כל חיי האג\"ח, גם אם הריבית במשק משתנה. תזכרו את זה, כי זה הבסיס לשיעור הבא.","c":["A7"]},{"he":"דנה קונה אג\"ח אחת של Golden Crust: ערך נקוב 1,000 דולר, קופון 4%, פדיון בעוד 10 שנים. כל שנה היא תקבל 4% מ-1,000, כלומר 40 דולר. רוב האג\"ח משלמות <b>פעמיים בשנה</b> (<span class=en>semiannually</span>), ולכן היא תקבל 20 דולר כל חצי שנה. בעוד 10 שנים היא תקבל בחזרה את ה-1,000.","c":["A8"]},{"he":"דנה כבר בעלים של מניות Golden Crust (פרק 1). <b>באג\"ח הזאת</b> היא גם <b>נושה</b> (<span class=en>creditor</span>): מלווה. כמלווה אין לה זכות הצבעה. אבל אם החברה פושטת רגל (<span class=en>bankruptcy</span>), מחזיקי האג\"ח מקבלים <b>לפני</b> בעלי המניות.","c":["A46"]},{"he":"מי שומר על ההבטחות של החברה? החוזה של האג\"ח נקרא <b>שטר נאמנות</b> (<span class=en>indenture</span>), ו<b>נאמן</b> (<span class=en>trustee</span>) עוקב שהחברה עומדת בו. לפי חוק שטרי הנאמנות מ-1939 (<span class=en>Trust Indenture Act of 1939</span>), אג\"ח שמוצעת לציבור צריכה, עם חריגים, שטר נאמנות ונאמן מוסדי.","c":["A47","A48","A49"]}],"terms":[["Bond","אגרת חוב (אג\"ח)","הלוואה שהמשקיע נותן למנפיק. המנפיק מתחייב לשלם ריבית ולהחזיר את הקרן.",["A1","A2","A3"]],["Principal","קרן","הסכום שהלווה המשקיע, ושיוחזר בפדיון.",["A3"]],["Par value / face value","ערך נקוב","הקרן שמוחזרת בפדיון. בדרך כלל 1,000 דולר לאג\"ח.",["A4","A5"]],["Coupon rate","שיעור הקופון (ריבית נקובה)","הריבית השנתית כאחוז מהערך הנקוב. באג\"ח בריבית קבועה הוא לא משתנה.",["A6","A7"]],["Maturity date","מועד פדיון","היום שבו המנפיק מחזיר את הקרן.",["A9"]],["Semiannual interest","ריבית חצי-שנתית","רוב האג\"ח משלמות פעמיים בשנה: 4% על 1,000 = 40 דולר בשנה, 20 דולר כל חצי שנה.",["A8"]],["Indenture / trustee","שטר נאמנות / נאמן","שטר הנאמנות הוא החוזה של האג\"ח. הנאמן עוקב שהמנפיק עומד בו.",["A47","A48","A49"]]],"checks":[{"en":"A bond has a $1,000 par value and an 8% coupon, paid semiannually. How much is each interest payment?","he":"לאג\"ח ערך נקוב של 1,000 דולר וקופון של 8%, שמשולם פעמיים בשנה. כמה כל תשלום ריבית?","o":[["$40","40 דולר"],["$80","80 דולר"]],"a":0,"why":"8% מ-1,000 = 80 דולר בשנה. פעמיים בשנה: 40 דולר בכל תשלום.","c":["A8"]},{"en":"Market interest rates rise after Dana buys her 4% fixed-rate bond. What happens to the coupon she receives?","he":"הריבית במשק עולה אחרי שדנה קנתה אג\"ח בקופון קבוע של 4%. מה קורה לקופון שהיא מקבלת?","o":[["It stays at 4% of par","הוא נשאר 4% מהערך הנקוב"],["It rises with market rates","הוא עולה יחד עם הריבית במשק"]],"a":0,"why":"באג\"ח בריבית קבועה, הקופון נקבע בהנפקה ולא משתנה.","c":["A7"]}]},{"id":"l2","en":"The seesaw: prices and interest rates","he":"הנדנדה: מחירים וריבית","story":[{"he":"שנה אחרי שדנה קנתה את האג\"ח בקופון 4%, הריבית בשוק עלתה. חברות חדשות מנפיקות עכשיו אג\"ח בקופון 6%. אם דנה תרצה למכור את האג\"ח שלה, מי ישלם לה 1,000 דולר על אג\"ח של 4%, כשאפשר לקנות חדשה של 6%? אף אחד. כדי למכור, היא תצטרך <b>להוריד את המחיר</b>.","c":["A12"]},{"he":"<b>כמה המחיר יורד? דוגמה קטנה.</b> נניח שלאג\"ח של דנה נשארה רק שנה אחת. בסוף השנה היא תשלם 40 דולר ריבית ועוד 1,000 קרן: סך הכל 1,040 דולר. אג\"ח חדשה ב-6% עולה 1,000 ותחזיר 1,060. כמה קונה ישלם היום על ה-1,040 של דנה, כדי להרוויח גם הוא 6%? 1,040 ÷ 1.06 = בערך 981 דולר. כלומר, דנה תצטרך להוריד את המחיר בכ-19 דולר.","c":["A12"]},{"he":"זה הכלל הכי חשוב בפרק: <b>מחיר האג\"ח והריבית בשוק זזים בכיוונים הפוכים</b>, כמו נדנדה.<br>• ריבית עולה ← מחיר האג\"ח יורד.<br>• ריבית יורדת ← מחיר האג\"ח עולה.<br>למה? כי הקופון של האג\"ח הישנה קבוע. כשאג\"ח חדשות משלמות יותר, הישנה שווה פחות. כשהן משלמות פחות, הישנה שווה יותר.","c":["A12"]},{"he":"דוגמה נוספת: אג\"ח ממשלתית בקופון 3%.<br>• הריבית יורדת ל-2%: המחיר עולה לכ-1,082 דולר.<br>• הריבית עולה ל-4%: המחיר יורד לכ-925 דולר.","c":["A13"]},{"he":"שתי מילים לזכור:<br>• כשהמחיר <b>מעל</b> הערך הנקוב, האג\"ח נסחרת <b>בפרמיה</b> (<span class=en>premium</span>). למשל 1,063 דולר: פרמיה של 63.<br>• כשהמחיר <b>מתחת</b> לערך הנקוב, האג\"ח נסחרת <b>בניכיון</b> (<span class=en>discount</span>). למשל 970 דולר: ניכיון של 30.","c":["A14","A15"]},{"he":"מי זז יותר על הנדנדה?<br>1) <b>פדיון ארוך</b>: אם לאג\"ח של דנה נשארו 10 שנים ולא שנה, החיסרון שלה (20 דולר בשנה פחות מאג\"ח חדשה) חוזר 10 פעמים. לכן המחיר יורד לא ל-981, אלא לכ-853 דולר. יותר שנים = שינוי גדול יותר במחיר.<br>2) <b>קופון נמוך</b>: זה כלל לזכור. באג\"ח עם קופון נמוך, רוב הכסף מגיע רק בסוף, כשה-1,000 חוזרים, ולכן היא רגישה יותר.<br>הסיכון הזה נקרא <b>סיכון ריבית</b> (<span class=en>interest rate risk</span>), והוא קיים בכל אג\"ח, גם באג\"ח של ממשלת ארה\"ב.","c":["A16","A17","A50"]}],"terms":[["Price and interest rates","מחיר וריבית","זזים בכיוונים הפוכים: ריבית עולה, מחיר האג\"ח יורד.",["A12"]],["Premium / discount","פרמיה / ניכיון","פרמיה: מחיר מעל הערך הנקוב. ניכיון: מחיר מתחת לערך הנקוב.",["A14","A15"]],["Interest rate risk","סיכון ריבית","הסיכון שעליית ריבית תוריד את מחיר האג\"ח. גדול יותר בפדיון ארוך ובקופון נמוך. קיים בכל אג\"ח.",["A16","A17","A50"]]],"checks":[{"en":"New bonds now pay less than Dana's 4% coupon. Her bond will most likely sell:","he":"אג\"ח חדשות משלמות עכשיו פחות מהקופון של דנה (4%). סביר שהאג\"ח שלה תימכר:","o":[["Above par, at a premium","מעל הערך הנקוב, בפרמיה"],["Below par, at a discount","מתחת לערך הנקוב, בניכיון"]],"a":0,"why":"כשהריבית יורדת, אג\"ח עם קופון גבוה יותר שווה יותר, ולכן נמכרת מעל הערך הנקוב.","c":["A12","A14"]},{"en":"Rates rise by the same amount. Which bond's price generally falls more?","he":"הריבית עולה באותו שיעור. המחיר של איזו אג\"ח בדרך כלל יורד יותר?","o":[["One maturing in 2 years","אחת שנפדית בעוד שנתיים"],["One maturing in 20 years","אחת שנפדית בעוד 20 שנה"]],"a":1,"why":"ככל שהפדיון ארוך יותר, המחיר רגיש יותר לשינויי ריבית.","c":["A16"]}]},{"id":"l3","en":"Yields: what you really earn","he":"תשואות: כמה באמת מרוויחים","story":[{"he":"עמית, חבר של דנה, רוצה לקנות ממנה את האג\"ח. כמה הוא באמת ירוויח? זה תלוי במחיר שהוא ישלם. בשביל זה יש מדדים שנקראים <b>תשואות</b> (<span class=en>yields</span>).","c":[]},{"he":"<b>תשואה שוטפת</b> (<span class=en>current yield</span>): כמה ריבית מקבלים ביחס <b>למחיר ששילמת</b>.<br><b>תשואה שוטפת = הריבית השנתית ÷ מחיר השוק</b><br>דוגמה: אג\"ח שמשלמת 45 דולר בשנה ונסחרת ב-1,030 דולר. 45 ÷ 1,030 = 4.37%.","c":["A18","A19"]},{"he":"<b>תשואה לפדיון</b> (<span class=en>yield to maturity, YTM</span>) היא התשואה <b>הכוללת</b> למי שקונה במחיר השוק ומחזיק עד הפדיון. היא כוללת גם את מה שמרוויחים או מפסידים בין המחיר ששילמת לבין הערך הנקוב שיוחזר בסוף.","c":["A20"]},{"he":"נראה את שלושתן על אותה אג\"ח: קופון 4% (40 דולר בשנה), ערך נקוב 1,000, ונניח לשם הפשטות שנשארו 10 שנים. (במבחן לא מחשבים תשואה לפדיון. צריך רק לדעת אם היא גבוהה או נמוכה מהאחרות.)<br>• עמית קונה <b>ב-1,000</b>: כל התשואות שוות, 4%.<br>• עמית קונה <b>ב-900</b> (ניכיון): תשואה שוטפת 40 ÷ 900 = 4.44%. אבל בסוף הוא יקבל 1,000, כלומר 100 דולר רווח נוסף. על פני 10 שנים זה בערך 10 דולר לשנה. לכן בפועל הוא מרוויח כ-50 דולר בשנה, לא 40 (ביחס להשקעה של כ-950 בממוצע). התשואה לפדיון: כ-5.3%.<br>• עמית קונה <b>ב-1,100</b> (פרמיה): תשואה שוטפת 40 ÷ 1,100 = 3.64%. בסוף הוא יקבל רק 1,000, כלומר יפסיד 100, בערך 10 דולר לשנה. בפועל הוא מרוויח כ-30 דולר בשנה. התשואה לפדיון: כ-2.8%.","c":["A21","A22","A23","A24"]},{"he":"הכלל לזכור:<br>• <b>בניכיון</b>: קופון &lt; תשואה שוטפת &lt; תשואה לפדיון. (הקופון הכי נמוך.)<br>• <b>בפרמיה</b>: קופון &gt; תשואה שוטפת &gt; תשואה לפדיון. (הקופון הכי גבוה.)<br>טריק לזכור: מחיר ותשואה הם שני צדי הנדנדה. מחיר למטה (ניכיון) ← התשואות עולות לאורך השורה. מחיר למעלה (פרמיה) ← התשואות יורדות לאורך השורה. ולמה בכלל יש ניכיון? כי הריבית בשוק עלתה מעל הקופון.","c":["A24"]}],"terms":[["Current yield","תשואה שוטפת","הריבית השנתית ÷ מחיר השוק.",["A18"]],["Yield to maturity (YTM)","תשואה לפדיון","התשואה הכוללת למי שקונה במחיר השוק ומחזיק עד הפדיון.",["A20"]],["Discount vs. premium yields","תשואות בניכיון ובפרמיה","ניכיון: קופון < תשואה שוטפת < תשואה לפדיון. פרמיה: קופון > תשואה שוטפת > תשואה לפדיון.",["A21","A22","A23","A24"]]],"checks":[{"en":"A bond pays $60 a year and trades at $1,200. What is its current yield?","he":"אג\"ח משלמת 60 דולר בשנה ונסחרת ב-1,200 דולר. מה התשואה השוטפת?","o":[["5%","5%"],["6%","6%"]],"a":0,"why":"60 ÷ 1,200 = 5%. 6% זה הקופון (60 ÷ 1,000).","c":["A18"]},{"en":"Amit buys a bond below par and holds it to maturity. Why is his YTM higher than his current yield?","he":"עמית קונה אג\"ח מתחת לערך הנקוב ומחזיק עד הפדיון. למה התשואה לפדיון שלו גבוהה מהתשואה השוטפת?","o":[["He also gains the gap up to par","הוא מרוויח גם את ההפרש עד הערך הנקוב"],["His coupon rises over time","הקופון שלו עולה עם הזמן"]],"a":0,"why":"התשואה לפדיון כוללת גם את הרווח מהמחיר הנמוך ששילם ועד הערך הנקוב שיקבל בפדיון.","c":["A20","A22"]}]},{"id":"l4","en":"Ratings: can they pay you back?","he":"דירוג: האם יחזירו לך?","story":[{"he":"דודה רינה (מפרק 1) רוצה לקנות אג\"ח, אבל מפחדת: מה אם החברה לא תחזיר? זה <b>סיכון אשראי</b> (<span class=en>credit risk</span>), שנקרא גם <b>סיכון חדלות פירעון</b> (<span class=en>default risk</span>): הסיכון שהמנפיק לא ישלם ריבית או קרן בזמן.","c":["A31"]},{"he":"בשביל זה יש <b>חברות דירוג אשראי</b> (<span class=en>credit rating agencies</span>). הן כמו מורה שנותן ציון: בודקות את סיכון החדלות של אג\"ח ונותנות לה ציון באותיות. ה-SEC רושם חברות כאלה (<span class=en>NRSROs</span>, <span class=en>Nationally Recognized Statistical Rating Organizations</span>). השלוש המוכרות: <span class=en>S&P Global Ratings</span>, <span class=en>Moody's</span> ו-<span class=en>Fitch</span>.","c":["A26","A27"]},{"he":"הסולם, מהגבוה לנמוך (S&P ו-Fitch):<br><b>AAA, AA, A, BBB</b> | <b>BB, B, CCC, CC, C, D</b><br>(D = לא שילמו, <span class=en>default</span>.) אצל Moody's האותיות קצת שונות: Aaa, Aa, A, Baa | Ba, B ...<br>הקו באמצע הוא הקו החשוב. הדירוג נקרא גם <b>איכות האשראי</b> (<span class=en>credit quality</span>) של האג\"ח.","c":["O5","A28","A29"]},{"he":"• <b>מעל הקו: דירוג השקעה</b> (<span class=en>investment grade</span>): ארבע הדרגות הגבוהות, BBB ומעלה (אצל Moody's: Baa ומעלה).<br>• <b>מתחת לקו: אג\"ח בתשואה גבוהה</b> (<span class=en>high-yield</span>), שנקראות גם <b>אג\"ח זבל</b> (<span class=en>junk bonds</span>) או ספקולטיביות: BB ומטה (אצל Moody's: Ba ומטה).","c":["A28","A29","A30"]},{"he":"למה מישהו קונה אג\"ח זבל? כי <b>סיכון גבוה יותר = ריבית גבוהה יותר</b>. חברה מסוכנת חייבת להציע למשקיעים יותר, כפיצוי על הסיכון. רינה, שרוצה ביטחון, בוחרת בדירוג השקעה ומסתפקת בריבית נמוכה יותר.","c":["A32"]},{"he":"ועוד מושג שקשור לריבית: <b>עקום התשואות</b> (<span class=en>yield curve</span>). זה גרף של תשואות של אג\"ח באותו דירוג, עם מועדי פדיון שונים. למה? זוכרים: פדיון ארוך = יותר סיכון ריבית (שיעור 2). בעקום <b>רגיל</b> (<span class=en>normal</span>) הוא עולה: פדיון ארוך יותר, תשואה גבוהה יותר. בעקום <b>הפוך</b> (<span class=en>inverted</span>) התשואות הארוכות נמוכות מהקצרות. לעתים קרובות זה קרה לפני <b>מיתון</b> (<span class=en>recession</span>), תקופה שבה הכלכלה מאטה.","c":["D43","D44","D45","A16"]}],"terms":[["Credit (default) risk","סיכון אשראי (חדלות פירעון)","הסיכון שהמנפיק לא ישלם ריבית או קרן בזמן.",["A31"]],["Rating agencies (NRSROs)","חברות דירוג אשראי","מדרגות אג\"ח לפי סיכון החדלות. למשל S&P, Moody's, Fitch.",["A26","A27"]],["Rating scale","סולם הדירוג","AAA, AA, A, BBB | BB, B, CCC, CC, C, D.",["O5"]],["Investment grade","דירוג השקעה","ארבע הדרגות הגבוהות: BBB ומעלה (S&P, Fitch), Baa ומעלה (Moody's).",["A28"]],["High-yield (junk) bonds","אג\"ח תשואה גבוהה (זבל)","BB/Ba ומטה. סיכון גבוה יותר, ולכן ריבית גבוהה יותר.",["A29","A30","A32"]],["Yield curve","עקום התשואות","גרף של תשואות לפי מועד פדיון, באותו דירוג. רגיל: עולה. הפוך: התשואות הארוכות נמוכות מהקצרות.",["D43","D44","D45"]]],"checks":[{"en":"S&P rates a bond A. Where does it fall?","he":"S&P מדרגת אג\"ח בדירוג A. איפה היא נמצאת?","o":[["High-yield (junk)","תשואה גבוהה (זבל)"],["Investment grade","דירוג השקעה"]],"a":1,"why":"A היא אחת מארבע הדרגות הגבוהות (AAA, AA, A, BBB), ולכן דירוג השקעה.","c":["A28"]},{"en":"Rina wants the lowest default risk. Which bond fits her best?","he":"רינה רוצה את סיכון החדלות הנמוך ביותר. איזו אג\"ח מתאימה לה יותר?","o":[["A CCC-rated bond","אג\"ח בדירוג CCC"],["An AAA-rated bond","אג\"ח בדירוג AAA"]],"a":1,"why":"AAA הוא הדירוג הגבוה ביותר בסולם. CCC נמצא הרבה מתחת לקו.","c":["O5"]}]},{"id":"l5","en":"Corporate bond features","he":"תכונות של אג\"ח קונצרניות","story":[{"he":"אג\"ח שמנפיקה חברה נקראת <b>אג\"ח קונצרנית</b> (<span class=en>corporate bond</span>). Golden Crust מנפיקה כמה סדרות, וכל אחת שונה. השאלה הראשונה: <b>מה מבטיח את ההחזר?</b>","c":["A2"]},{"he":"<b>אג\"ח מובטחת</b> (<span class=en>secured bond</span>): החברה <b>משעבדת</b> נכס מסוים, כלומר מתחייבת שאם לא תשלם, הנכס ישמש להחזר. שלוש דוגמאות:<br>• <span class=en>mortgage bond</span> (אג\"ח משכנתא): מובטחת בנדל\"ן, למשל המפעל.<br>• <span class=en>equipment trust certificate</span>: מובטחת בציוד, למשל משאיות או מטוסים.<br>• <span class=en>collateral trust bond</span>: מובטחת בנכסים פיננסיים, כמו ניירות ערך שהחברה מחזיקה.","c":["A40","A41","A42","A43"]},{"he":"<b>אג\"ח לא מובטחת</b> (<span class=en>debenture</span>): בלי שעבוד של נכס. היא מגובה רק באשראי הכללי של החברה, כלומר ביכולת שלה לשלם. וגם בין האג\"ח הלא מובטחות יש תור: <b>בכירות</b> (<span class=en>senior</span>) מקבלות לפני <b>נחותות</b> (<span class=en>subordinated</span>).","c":["A44","A45"]},{"he":"<b>אג\"ח ניתנת לפדיון מוקדם</b> (<span class=en>callable bond</span>): החברה יכולה להחזיר את הכסף ולסגור את האג\"ח <b>לפני</b> מועד הפדיון. מתי היא תעשה זאת? כשהריבית בשוק יורדת מתחת לקופון. כמו שממחזרים משכנתא כשהריבית יורדת: החברה פודה את האג\"ח היקרה, ומגייסת מחדש בזול. למשל: Golden Crust משלמת 60 דולר בשנה על אג\"ח בקופון 6%. הריבית ירדה ל-4%. היא לווה מחדש ב-4% (40 דולר), פודה את הישנה, וחוסכת 20 דולר בשנה על כל אג\"ח.","c":["A33","A34"]},{"he":"כמה היא משלמת בפדיון המוקדם? <b>מחיר הפדיון</b> (<span class=en>call price</span>) הוא בדרך כלל הערך הנקוב, ולפעמים עוד <b>פרמיית פדיון</b> (<span class=en>call premium</span>). בנוסף, המשקיע מקבל את הריבית שהצטברה מאז התשלום האחרון ועדיין לא שולמה. ויש <b>הגנת פדיון</b> (<span class=en>call protection</span>): תקופה ראשונה שבה אסור לפדות.","c":["A35","A37"]},{"he":"אילו האג\"ח של דנה הייתה ניתנת לפדיון מוקדם, ונפדתה אחרי שהריבית ירדה, מה הבעיה? דנה מקבלת את הכסף בחזרה בדיוק כשהריבית נמוכה, וצריכה להשקיע אותו מחדש בריבית נמוכה יותר. זה <b>סיכון השקעה מחדש</b> (<span class=en>reinvestment risk</span>). לכן אג\"ח ניתנות לפדיון מוקדם משלמות לעתים קרובות <b>ריבית גבוהה יותר</b>, כפיצוי על הסיכון.","c":["A36","A51"]},{"he":"באג\"ח כזאת מחשבים גם <b>תשואה לפדיון מוקדם</b> (<span class=en>yield to call, YTC</span>): כמו תשואה לפדיון, אבל בהנחה שהאג\"ח נפדית מוקדם. <b>התשואה הגרועה ביותר</b> (<span class=en>yield to worst</span>) היא <b>הנמוכה מבין שתיים</b>: התשואה לפדיון והתשואה לפדיון מוקדם. הקופון והתשואה השוטפת לא משתתפים. למה \"הגרועה\"? כי המנפיק יבחר מה שטוב לו, לא לך, ולכן מסתכלים על התרחיש הגרוע.","c":["A25"]},{"he":"שתי דוגמאות: אג\"ח בקופון 4%, שהמנפיק יכול לפדות בעוד 3 שנים ב-1,000.<br>• קנית <b>ב-1,100 (פרמיה)</b>: פדיון מוקדם רע לך, כי תפסיד את ה-100 תוך 3 שנים במקום תוך 10. תשואה לפדיון כ-2.8%, תשואה לפדיון מוקדם כ-0.6%. הגרועה ביותר: כ-0.6%.<br>• קנית <b>ב-900 (ניכיון)</b>: פדיון מוקדם דווקא טוב לך, כי תקבל את רווח ה-100 מהר. תשואה לפדיון כ-5.3%, תשואה לפדיון מוקדם כ-7.8%. הגרועה ביותר: כ-5.3%, התשואה לפדיון.","c":["A25"]},{"he":"<b>אג\"ח להמרה</b> (<span class=en>convertible bond</span>): אפשר להמיר אותה במניות רגילות של אותה חברה, במחיר שנקבע מראש. עד ההמרה, המחזיק הוא נושה. בגלל הסיכוי להרוויח אם המניה תעלה, אג\"ח להמרה משלמת בדרך כלל תשואה נמוכה יותר מאג\"ח דומה שלא ניתנת להמרה.","c":["A38","A39"]}],"terms":[["Corporate bond","אג\"ח קונצרנית","אג\"ח שמנפיקה חברה.",["A2"]],["Secured bond","אג\"ח מובטחת","מובטחת בנכס מסוים: mortgage bond (נדל\"ן), equipment trust certificate (ציוד), collateral trust bond (נכסים פיננסיים).",["A40","A41","A42","A43"]],["Debenture","אג\"ח לא מובטחת","מגובה רק באשראי הכללי של המנפיק.",["A44"]],["Subordinated debenture","אג\"ח נחותה","אג\"ח לא מובטחת שמקבלת אחרי האג\"ח הבכירות.",["A45"]],["Callable bond","אג\"ח ניתנת לפדיון מוקדם","המנפיק יכול לפדות לפני הפדיון, בדרך כלל כשהריבית יורדת.",["A33","A34"]],["Call protection","הגנת פדיון","תקופה ראשונה שבה המנפיק לא יכול לפדות.",["A37"]],["Reinvestment risk","סיכון השקעה מחדש","הסיכון שלא תוכל להשקיע מחדש בריבית דומה, באותה רמת סיכון.",["A36","A51"]],["Yield to call / yield to worst","תשואה לפדיון מוקדם / התשואה הגרועה ביותר","תשואה בהנחה שהאג\"ח נפדית מוקדם. התשואה הגרועה ביותר היא הנמוכה מבין שתיהן: התשואה לפדיון או התשואה לפדיון מוקדם.",["A25"]],["Convertible bond","אג\"ח להמרה","אפשר להמיר במניות רגילות של המנפיק, במחיר שנקבע מראש. בדרך כלל בתשואה נמוכה יותר.",["A38","A39"]]],"checks":[{"en":"Market rates rise well above a callable bond's coupon. Is the issuer likely to call it now?","he":"הריבית בשוק עולה הרבה מעל הקופון של אג\"ח ניתנת לפדיון מוקדם. סביר שהמנפיק יפדה אותה עכשיו?","o":[["Yes, rising rates force a call","כן, ריבית עולה מחייבת פדיון"],["No, refinancing would cost more","לא, גיוס מחדש יעלה לו יותר"]],"a":1,"why":"מנפיק פודה מוקדם כשהריבית יורדת, כדי לגייס מחדש בזול. כשהריבית עולה, אין לו סיבה.","c":["A34"]},{"en":"A bond is secured by trucks the company owns. It is:","he":"אג\"ח מובטחת במשאיות שהחברה מחזיקה. היא:","o":[["An equipment trust certificate","equipment trust certificate"],["A debenture","debenture (לא מובטחת)"]],"a":0,"why":"equipment trust certificate מובטחת בציוד. debenture היא לא מובטחת.","c":["A42","A44"]}]},{"id":"l6","en":"U.S. Treasury securities","he":"אג\"ח של ממשלת ארה\"ב","story":[{"he":"רינה רוצה את הדבר הכי בטוח שיש. הפתרון: <b>אג\"ח של משרד האוצר האמריקאי</b> (<span class=en>U.S. Treasury securities</span>). הריבית והקרן מובטחות ב<b>גיבוי המלא של ממשלת ארה\"ב</b> (<span class=en>full faith and credit</span>).","c":["B28"]},{"he":"יש שלושה סוגים עיקריים, לפי אורך החיים. הראשון: <b>שטרי אוצר</b> (<span class=en>Treasury bills, T-bills</span>): עד 52 שבועות. אין להם קופון בכלל. קונים אותם <b>בניכיון</b>, ובפדיון מקבלים את הערך הנקוב. ההפרש הוא הריבית. למשל: רינה משלמת 980 דולר על שטר של 1,000 דולר. בפדיון היא מקבלת 1,000. ה-20 דולר הם הריבית שלה.","c":["B1","B3","B4","B5"]},{"he":"שני הסוגים האחרים משלמים ריבית <b>כל חצי שנה</b>:<br>• <b>אג\"ח אוצר בינוניות</b> (<span class=en>Treasury notes</span>): 2, 3, 5, 7 או 10 שנים. באג\"ח ל-10 שנים יש 20 תשלומי ריבית, ואת הקרן בסוף.<br>• <b>אג\"ח אוצר ארוכות</b> (<span class=en>Treasury bonds</span>): 20 או 30 שנה.<br>מינימום קנייה: 100 דולר.","c":["B8","B9","B10","B11","B12","B26"]},{"he":"עכשיו מס. בארה\"ב משלמים שני מיסי הכנסה: <b>מס פדרלי</b> (<span class=en>federal</span>), לממשלה בוושינגטון, ו<b>מס של המדינה</b> (<span class=en>state</span>), למשל אוהיו או ניו יורק. הריבית על אג\"ח אוצר <b>חייבת במס הפדרלי</b>, אבל <b>פטורה ממס המדינה ומהמס המקומי</b>.","c":["B29"]},{"he":"איך הממשלה מוכרת? ב<b>מכרז</b> (<span class=en>auction</span>). הממשלה רוצה ללוות בזול, ולכן היא מעדיפה את מי שמבקש את התשואה <b>הנמוכה</b>. דוגמה קטנה: הממשלה מוכרת 100 מיליון.<br>1) קודם היא ממלאת את כל ההצעות הלא תחרותיות: נניח 10 מיליון.<br>2) נשארו 90. עכשיו ההצעות התחרותיות, מהתשואה הנמוכה לגבוהה: א' רוצה 40 ב-4.0%, ב' רוצה 40 ב-4.1%, ג' רוצה 40 ב-4.2%. א' וב' מקבלים הכל, ג' מקבל רק 10.<br>3) ד' ביקש 4.3%: גבוה מדי, הוא לא מקבל כלום.<br>4) התשואה הגבוהה ביותר <b>שהממשלה קיבלה</b> היא 4.2%, ו<b>כל</b> הזוכים מקבלים 4.2%, גם א' וגם הלא תחרותיים.","c":["B31","B33","B36","B37"]},{"he":"יש שני סוגי הצעות:<br>• <b>הצעה תחרותית</b> (<span class=en>competitive bid</span>): המציע קובע איזו תשואה הוא מוכן לקבל. אם ביקש תשואה גבוהה מדי, ייתכן שלא יקבל כלום. כל מציע מוגבל ל-35% מההנפקה.<br>• <b>הצעה לא תחרותית</b> (<span class=en>noncompetitive bid</span>): המציע מסכים לקבל את התשואה שתיקבע במכרז, ובתמורה מקבל את כל הכמות שביקש. כל מציע מוגבל ל-10 מיליון דולר.","c":["B32","B33","B34","B35","B36"]}],"terms":[["Full faith and credit","הגיבוי המלא של ממשלת ארה\"ב","הגיבוי של הממשלה לריבית ולקרן של אג\"ח האוצר.",["B28"]],["Treasury bill (T-bill)","שטר אוצר","עד 52 שבועות. נמכר בניכיון, בלי קופון, ונפרע בערך הנקוב.",["B1","B3","B4","B5"]],["Treasury note","אג\"ח אוצר בינונית","2, 3, 5, 7 או 10 שנים. ריבית כל חצי שנה.",["B8","B9"]],["Treasury bond","אג\"ח אוצר ארוכה","20 או 30 שנה. ריבית כל חצי שנה.",["B11","B12"]],["Federal vs. state tax","מס פדרלי מול מס המדינה","ריבית על אג\"ח אוצר: חייבת במס הפדרלי, פטורה ממס המדינה ומהמס המקומי.",["B29"]],["Competitive / noncompetitive bid","הצעה תחרותית / לא תחרותית","תחרותית: המציע קובע תשואה (עד 35% מההנפקה), ואולי לא יקבל. לא תחרותית: מקבל את תשואת המכרז ואת כל הכמות (עד 10 מיליון דולר).",["B32","B33","B34","B35","B36"]]],"checks":[{"en":"Rina pays $980 for a $1,000 T-bill and holds it to maturity. What is the $20 difference?","he":"רינה משלמת 980 דולר על שטר אוצר של 1,000 דולר ומחזיקה עד הפדיון. מה הם 20 הדולר שבהפרש?","o":[["Her interest","הריבית שלה"],["A fee to the broker","עמלה לברוקר"]],"a":0,"why":"שטר אוצר נקנה בניכיון ונפרע בערך הנקוב. ההפרש הוא הריבית.","c":["B3","B4"]},{"en":"Which tax does NOT apply to the interest on a Treasury bond?","he":"איזה מס לא חל על הריבית של אג\"ח אוצר?","o":[["State income tax","מס ההכנסה של המדינה (state)"],["Federal income tax","מס ההכנסה הפדרלי"]],"a":0,"why":"ריבית על אג\"ח אוצר פטורה ממס המדינה ומהמס המקומי, וחייבת במס הפדרלי.","c":["B29"]}]},{"id":"l7","en":"TIPS, STRIPS and receipts","he":"TIPS, STRIPS ותעודות","story":[{"he":"רינה דואגת מ<b>אינפלציה</b>: אם המחירים עולים, תשלומי הריבית שהיא מקבלת יקנו פחות לחם. זה <b>סיכון אינפלציה</b> (<span class=en>inflation risk</span>).","c":["A52"]},{"he":"הפתרון: <b>TIPS</b> (<span class=en>Treasury Inflation-Protected Securities</span>), אג\"ח אוצר מוגנות אינפלציה. הקרן שלהן <b>עולה עם האינפלציה</b> ויורדת ב<b>דפלציה</b> (ירידת מחירים), לפי מדד המחירים לצרכן (<span class=en>CPI</span>). הריבית היא אחוז קבוע <b>מהקרן המעודכנת</b>, ולכן סכום הריבית בדולרים משתנה. משלמות כל חצי שנה.","c":["B14","B15","B16","B17"]},{"he":"דוגמה: TIPS של 1,000 דולר בריבית 2%. הייתה אינפלציה של 3%, והקרן עלתה ל-1,030 דולר. תשלום חצי-שנתי: 1,030 × 2% ÷ 2 = 10.30 דולר, במקום 10 דולר. ובפדיון רינה מקבלת את <b>הגבוה מבין השניים</b>: הקרן המעודכנת או הקרן המקורית. כלומר, אם הייתה דפלציה והקרן ירדה ל-980, בפדיון רינה מקבלת בכל זאת 1,000.","c":["B16","B18","B19"]},{"he":"מוצר אחר: <b>STRIPS</b> (<span class=en>Separate Trading of Registered Interest and Principal of Securities</span>). קחו אג\"ח אוצר ל-10 שנים: 20 תשלומי ריבית, ועוד 1,000 בסוף. \"מפרקים\" אותה ל-21 חתיכות, וכל חתיכה נמכרת בנפרד. כל חתיכה היא <b>אג\"ח ללא קופון</b> (<span class=en>zero-coupon</span>): תשלום אחד בלבד, בסוף. איך מרוויחים? בדיוק כמו בשטר אוצר: קונים <b>בניכיון</b>. למשל, ה-1,000 שיגיעו בעוד 10 שנים עשויים להימכר היום בכ-700.","c":["B20","B21","B22"]},{"he":"שני פרטים: 1) משרד האוצר לא מוכר STRIPS ישירות. קונים אותם דרך בנקים וברוקרים. 2) <b>ריבית רפאים</b> (<span class=en>phantom interest</span>): החתיכה שקנית ב-700 שווה כל שנה קצת יותר, עד 1,000 בפדיון. רשויות המס רואות בעלייה הזאת ריבית, ולכן ייתכן שתשלם מס כל שנה, למרות שלא קיבלת בפועל אף דולר.","c":["B23","B25"]},{"he":"ובמבחן תראו גם <b>Treasury receipts</b>: תעודות ללא קופון שברוקרים יצרו בעצמם, כשהם \"פירקו\" אג\"ח אוצר והפרידו את הקופונים. ההבדל מ-STRIPS: STRIPS הן תוכנית של משרד האוצר, ו-receipts נוצרו על ידי ברוקרים.","c":["O1","O3","B20"]}],"terms":[["Inflation risk","סיכון אינפלציה","הסיכון שהתשלומים יקנו פחות סחורות ושירותים.",["A52"]],["TIPS","אג\"ח אוצר מוגנות אינפלציה","הקרן מתעדכנת לפי ה-CPI. ריבית קבועה על הקרן המעודכנת. בפדיון: הגבוה מבין הקרן המעודכנת והמקורית.",["B14","B15","B16","B18"]],["STRIPS","STRIPS","ריבית וקרן של אג\"ח אוצר שנסחרות בנפרד, כל חלק ללא קופון. תוכנית של משרד האוצר. נקנות דרך בנקים וברוקרים.",["B20","B21","B22","B23"]],["Treasury receipts","תעודות אוצר (receipts)","תעודות ללא קופון שברוקרים יצרו מאג\"ח אוצר שפורקו.",["O3"]],["Zero-coupon","ללא קופון","אג\"ח שלא משלמת ריבית תקופתית. ייתכן מס שנתי על ריבית שנצברה (phantom interest).",["B21","B25"]]],"checks":[{"en":"Inflation lifts a TIPS principal to $1,030. The 2% fixed rate is applied to:","he":"האינפלציה מעלה את הקרן של TIPS ל-1,030 דולר. הריבית הקבועה של 2% מחושבת על:","o":[["$1,000, the original principal","1,000 דולר, הקרן המקורית"],["$1,030, the adjusted principal","1,030 דולר, הקרן המעודכנת"]],"a":1,"why":"ב-TIPS, הריבית הקבועה מחושבת על הקרן המעודכנת לפי האינפלציה.","c":["B16"]},{"en":"How does a STRIPS pay its holder?","he":"איך STRIPS משלמת למחזיק?","o":[["Interest every six months","ריבית כל חצי שנה"],["One payment at maturity, no coupons","תשלום אחד בפדיון, בלי קופונים"]],"a":1,"why":"כל חלק של STRIPS הוא ללא קופון: הוא משלם רק סכום אחד בפדיון.","c":["B21"]}]},{"id":"l8","en":"Agency securities and mortgage-backed securities","he":"אג\"ח של סוכנויות ואג\"ח מגובות משכנתאות","story":[{"he":"מלבד משרד האוצר, יש עוד גופים שקשורים לממשלה ומנפיקים חוב. נייר ערך של <b>סוכנות</b> (<span class=en>agency security</span>) הוא חוב שמונפק או מובטח על ידי סוכנות פדרלית.","c":["B40"]},{"he":"דנה קנתה דירה ולקחה משכנתא. הבנק לא מחזיק את ההלוואה: הוא מוכר אותה, והיא נכנסת ל<b>סל</b> (<span class=en>pool</span>) עם אלפי משכנתאות אחרות. מהסל יוצרים <b>אג\"ח מגובות משכנתאות</b> (<span class=en>mortgage-backed securities, MBS</span>): ניירות ערך שמקבלים את התשלומים מכל המשכנתאות בסל.","c":["B48"]},{"he":"ב<b>אג\"ח מסוג pass-through</b>, כל מחזיק מקבל את החלק היחסי שלו מכל תשלומי הריבית והקרן שהלווים משלמים. כשדנה משלמת את המשכנתא החודשית, חלק מהתשלום מגיע בסוף למחזיקי ה-MBS.","c":["B49","B50"]},{"he":"מי עומד מאחורי רוב ה-MBS?<br>• <b>Ginnie Mae</b>: סוכנות ממשלתית בתוך משרד השיכון האמריקאי (<span class=en>HUD</span>). הערבות שלה מגובה ב<b>גיבוי המלא של ממשלת ארה\"ב</b>.<br>• <b>Fannie Mae</b> ו-<b>Freddie Mac</b>: <b>חברות בחסות ממשלתית</b> (<span class=en>GSEs, government-sponsored enterprises</span>). הן לא סוכנויות ממשלתיות, והניירות שלהן <b>לא</b> מגובים בגיבוי המלא.","c":["B41","B42","B44","B45","B58"]},{"he":"הסיכון המיוחד של MBS. נניח שה-MBS משלמות 6%, כי המשכנתאות בסל הן ב-6%.<br>• הריבית <b>יורדת ל-4%</b>: דנה ממחזרת, ומחזירה עכשיו את כל המשכנתא הישנה. הכסף חוזר למחזיק ה-MBS מוקדם, והוא יכול להשקיע אותו רק ב-4%. זה <b>סיכון פירעון מוקדם</b> (<span class=en>prepayment risk</span>). זה בדיוק כמו אג\"ח שנפדתה מוקדם (שיעור 5).<br>• הריבית <b>עולה ל-8%</b>: אף אחד לא ממחזר משכנתא של 6%. הפירעונות מאטים, והמחזיק תקוע ב-6% יותר זמן ממה שציפה, בזמן שאג\"ח חדשות משלמות 8%. זה <b>סיכון הארכה</b> (<span class=en>extension risk</span>).<br>לזכור: ריבית יורדת = פירעון מוקדם. ריבית עולה = הארכה.","c":["B51","B52","B53"]},{"he":"<b>CMO</b> (<span class=en>collateralized mortgage obligation</span>) לוקח את תזרים המשכנתאות ומחלק אותו לשכבות שנקראות <b>tranches</b>, לפי סדר תשלום. למשל 3 שכבות: כל הקרן שחוזרת הולכת קודם לשכבה A עד שהיא נפרעת, אחר כך ל-B, ובסוף ל-C. לכן A קצרה ו-C ארוכה. השכבות יכולות להיות שונות בקופון, בסיכון הפירעון המוקדם ובמועד הפדיון.","c":["B54","B55"]},{"he":"ו<b>אג\"ח מגובות נכסים</b> (<span class=en>asset-backed securities, ABS</span>) מגובות בהלוואות אחרות, כמו הלוואות רכב או חובות כרטיסי אשראי. MBS הן בעצם סוג אחד של ABS.","c":["B56","B57"]}],"terms":[["Agency security","נייר ערך של סוכנות","חוב שמונפק או מובטח על ידי סוכנות פדרלית.",["B40"]],["GSE","חברה בחסות ממשלתית","Fannie Mae, Freddie Mac. לא סוכנויות ממשלתיות, ולא מגובות בגיבוי המלא של הממשלה.",["B41","B42"]],["Ginnie Mae","Ginnie Mae","סוכנות בתוך HUD. הערבות שלה ל-MBS מגובה בגיבוי המלא של ממשלת ארה\"ב.",["B44","B45"]],["MBS / pass-through","אג\"ח מגובות משכנתאות","מקבלות את תשלומי הריבית והקרן מסל (pool) של משכנתאות, באופן יחסי.",["B48","B49","B50"]],["Prepayment / extension risk","סיכון פירעון מוקדם / סיכון הארכה","ריבית יורדת: פירעונות מואצים, והכסף מושקע מחדש בריבית נמוכה. ריבית עולה: פירעונות מאטים.",["B51","B53"]],["CMO / tranches","CMO / שכבות","חלוקת תזרים המשכנתאות לשכבות לפי סדר תשלום.",["B54","B55"]],["ABS","אג\"ח מגובות נכסים","מגובות בהלוואות כמו רכב או כרטיסי אשראי. MBS הן סוג של ABS.",["B56","B57"]]],"checks":[{"en":"Fannie Mae is a:","he":"Fannie Mae היא:","o":[["Government agency with full backing","סוכנות ממשלתית עם גיבוי מלא"],["Government-sponsored enterprise (GSE)","חברה בחסות ממשלתית (GSE)"]],"a":1,"why":"Fannie Mae היא GSE, לא סוכנות ממשלתית, והניירות שלה לא מגובים בגיבוי המלא.","c":["B41","B42"]},{"en":"Rates drop and many homeowners refinance. What happens to an MBS holder's principal?","he":"הריבית יורדת ובעלי בתים רבים ממחזרים. מה קורה לקרן של מחזיק MBS?","o":[["It comes back later than expected","היא חוזרת מאוחר מהצפוי"],["It comes back sooner than expected","היא חוזרת מוקדם מהצפוי"]],"a":1,"why":"מחזור משכנתאות מאיץ את הפירעונות, והקרן חוזרת מוקדם. זה סיכון פירעון מוקדם.","c":["B51","B52"]}]},{"id":"l9","en":"Municipal bonds","he":"אג\"ח מוניציפליות","story":[{"he":"העיר שבה גרה רינה רוצה לבנות בית ספר חדש. היא מנפיקה <b>אג\"ח מוניציפליות</b> (<span class=en>municipal securities</span>, ובקיצור <span class=en>munis</span>): חוב שמנפיקים מדינות, ערים, מחוזות וגופים ממשלתיים אחרים, כמו מחוזות בתי ספר. הכסף משמש לתשתיות (בתי ספר, כבישים, ביוב), וגם להוצאות השוטפות.","c":["M1","M2","M3","M4"]},{"he":"הסוג הראשון: <b>אג\"ח כלליות</b> (<span class=en>general obligation bonds, GO</span>). הן מגובות ב<b>גיבוי המלא</b> (<span class=en>full faith and credit</span>) וב<b>כוח המיסוי</b> של המנפיק: העיר יכולה לגבות מס מהתושבים כדי לשלם. הן לא מובטחות בנכס מסוים, ולפעמים צריך <b>אישור של הבוחרים</b> לפני ההנפקה.","c":["M5","M6","M7","M8"]},{"he":"הסוג השני: <b>אג\"ח הכנסה</b> (<span class=en>revenue bonds</span>). הן נפרעות מהכנסות של פרויקט או מקור מסוים: כביש אגרה, גשר, שדה תעופה, או חברת מים וחשמל. הן <b>לא</b> מגובות בכוח המיסוי. אם הגשר לא מכניס מספיק, אין מיסים שיכסו.","c":["M9","M10"]},{"he":"סוגים מיוחדים, עם מערכת המים של העיר:<br>• <b>Double-barreled</b>: נפרעת מהכנסות המים, <b>ועוד</b> מגובה בגיבוי המלא של העיר. שני מקורות, ושניהם מחייבים.<br>• <b>Moral obligation</b>: נפרעת מהכנסות המים. אם הן לא מספיקות, הגוף שמחליט על התקציב <b>רשאי, אבל לא חייב</b>, לכסות את החוסר. כלומר, \"נשתדל\", לא \"חייבים\".","c":["M16","M17"]},{"he":"ועוד שלושה:<br>• <b>Special tax</b>: מובטחת במס מיוחד (למשל על דלק), לא במס רכוש (<span class=en>property tax</span>, בדומה לארנונה).<br>• <b>Special assessment</b>: נפרעת מהיטל מיוחד, למשל על בעלי הנכסים ברחוב שקיבל מדרכה חדשה.<br>• <b>Private activity bond</b>: הכסף משמש גוף פרטי אחד או יותר. סוג אחד: <span class=en>industrial development bond</span>, שמונפקת בשביל חברות עסקיות.","c":["M14","M15","M18","M19"]},{"he":"לפעמים העיר צריכה כסף רק לכמה חודשים. למשל, המיסים ייגבו רק באפריל, אבל המשכורות צריכות להשתלם עכשיו. בשביל זה יש <b>שטרות</b> (<span class=en>notes</span>), חוב לטווח קצר:<br>• <span class=en>TAN</span> (<span class=en>tax anticipation note</span>): נפרע מ<b>מיסים</b> שעוד ייגבו.<br>• <span class=en>RAN</span> (<span class=en>revenue anticipation note</span>): נפרע מ<b>הכנסות</b> צפויות אחרות.<br>• <span class=en>BAN</span> (<span class=en>bond anticipation note</span>): נפרע מכסף של <b>הנפקת אג\"ח ארוכה</b> מאוחרת יותר.","c":["M20","M21","M22","M23"]},{"he":"ועוד מכשיר: <span class=en>VRDO</span> (<span class=en>variable rate demand obligation</span>). זו אג\"ח ארוכה, אבל הריבית שלה מתעדכנת מדי פעם. ולמשקיע יש זכות לדרוש שיקנו ממנו את האג\"ח בחזרה (<span class=en>put</span>).","c":["M24","M25"]}],"terms":[["Municipal securities","אג\"ח מוניציפליות","חוב של מדינות, ערים, מחוזות וגופים ממשלתיים אחרים.",["M1","M2"]],["General obligation (GO) bond","אג\"ח כללית","מגובה בגיבוי המלא (full faith and credit) ובכוח המיסוי של המנפיק. לפעמים צריך אישור בוחרים.",["M5","M6","M8"]],["Revenue bond","אג\"ח הכנסה","נפרעת מהכנסות של פרויקט מסוים. לא מגובה בכוח המיסוי.",["M9","M10"]],["Double-barreled bond","Double-barreled","מקור הכנסה מוגדר ועוד הגיבוי המלא של המנפיק. שני מקורות מחייבים.",["M17"]],["Moral obligation bond","Moral obligation","מקור עיקרי ועוד התחייבות לא מחייבת לכסות חוסר.",["M16"]],["Special tax / special assessment","Special tax / special assessment","מס מיוחד שאינו מס רכוש / היטל מיוחד.",["M18","M19"]],["Private activity / IDB","אג\"ח לפעילות פרטית","הכסף משמש גוף פרטי. IDB: בשביל חברות עסקיות.",["M14","M15"]],["TAN / RAN / BAN","שטרות לטווח קצר","נפרעים ממיסים / מהכנסות / מהנפקת אג\"ח ארוכה.",["M21","M22","M23"]]],"checks":[{"en":"A city's bond is repaid only from airport fees. If fee revenue falls short, are bondholders entitled to city tax money?","he":"אג\"ח של עיר נפרעת רק מאגרות שדה התעופה. אם ההכנסות לא מספיקות, האם למחזיקים יש זכות לכסף ממיסי העיר?","o":[["No, it is a revenue bond","לא, זו אג\"ח הכנסה"],["Yes, it is a GO bond","כן, זו אג\"ח כללית"]],"a":0,"why":"אג\"ח הכנסה נפרעת רק מהכנסות הפרויקט, ולא מגובה בכוח המיסוי.","c":["M9"]},{"en":"A city expects property tax payments in April and borrows until then. It issues a:","he":"עיר מצפה לתשלומי מס רכוש באפריל, ולווה עד אז. היא מנפיקה:","o":[["BAN","BAN"],["TAN","TAN"]],"a":1,"why":"TAN נפרע ממיסים שעוד ייגבו. BAN נפרע מהנפקת אג\"ח ארוכה.","c":["M21","M23"]}]},{"id":"l10","en":"Munis: taxes, rules and how they are sold","he":"אג\"ח מוניציפליות: מס, כללים ואיך מוכרים","story":[{"he":"למה אנשים אוהבים אג\"ח מוניציפליות? בגלל המס. הריבית עליהן בדרך כלל <b>פטורה ממס ההכנסה הפדרלי</b>. למי שגר במדינה שהנפיקה, היא לפעמים פטורה גם ממס המדינה ומהמס המקומי. שימו לב: זה ההפך מאג\"ח אוצר (שיעור 6), שם המס הפדרלי חל, ומס המדינה לא.","c":["M28","M29"]},{"he":"אבל יש חריגים:<br>• <b>רווח הון</b> (<span class=en>capital gain</span>), כלומר רווח ממכירת האג\"ח ביותר ממה ששילמו, יכול להיות חייב במס.<br>• יש אג\"ח, כמו private activity, שחייבות ב<b>מס מינימום חלופי</b> (<span class=en>AMT</span>), מס פדרלי נוסף על חלק מהמשקיעים.<br>• ויש <b>אג\"ח מוניציפליות חייבות במס</b> (<span class=en>taxable munis</span>), כשמטרת המימון לא מזכה בפטור.","c":["M26","M30","M31"]},{"he":"איך משווים אג\"ח פטורה ממס לאג\"ח חייבת? דוגמה: דנה משלמת 37% מס (זה <b>שיעור המס</b> שלה, <span class=en>tax bracket</span>). אג\"ח מוניציפלית של 1,000 בתשואה 3% נותנת לה 30 דולר, בלי מס. כמה צריכה לתת אג\"ח <b>חייבת</b> במס, כדי שיישארו לה אותם 30 אחרי המס? המס לוקח 37%, ולכן נשארים לה 63% מהריבית. צריך: 30 ÷ 0.63 = 47.62 דולר, כלומר 4.76%. בדיקה: 47.62 פחות 37% מס (17.62) = 30.<br>הכלל: <b>תשואה שוות-מס</b> (<span class=en>tax-equivalent yield</span>) = <b>התשואה הפטורה ÷ (1 − שיעור המס)</b>.","c":["M32","M33"]},{"he":"מי שומר על השוק? ה-<b>MSRB</b> (<span class=en>Municipal Securities Rulemaking Board</span>), שנוסד ב-1975. הוא <b>כותב את חוקי המשחק</b> לברוקרים ולבנקים שקונים, מוכרים וחותמים על אג\"ח מוניציפליות. מ-2010 הוא כותב כללים גם ל<b>יועצים מוניציפליים</b> (<span class=en>municipal advisors</span>), שמייעצים לערים על הנפקות.","c":["M34","M35","M36","M43"]},{"he":"ומה ה-MSRB <b>לא</b> עושה? הוא לא שוטר: הוא <b>לא אוכף</b> את הכללים בעצמו. את זה עושים FINRA, ה-SEC ורגולטורים של בנקים. והוא <b>לא מפקח על המנפיקים</b>, כלומר על הערים והמדינות עצמן.","c":["M37","M38"]},{"he":"איפה מוצאים מידע? ב-<b>EMMA</b>, אתר המידע הרשמי והחינמי. שם נמצא ה<b>תשקיף המוניציפלי</b> (<span class=en>official statement</span>): מסמך הגילוי של המנפיק בהנפקה חדשה, בדומה לתשקיף.","c":["M40","M41","M42"]},{"he":"ואיך מוכרים אג\"ח חדשה? דרך <b>חתמים</b> (<span class=en>underwriters</span>). החתם הוא כמו סיטונאי שקונה את כל הלחם של אבי ומוכר לחנויות: הוא קונה את כל ההנפקה מהמנפיק, ומוכר אותה למשקיעים. לפעמים כמה חתמים מתאגדים ל<b>סינדיקט</b> (<span class=en>syndicate</span>), כדי לחלוק את הסיכון.","c":["D32","D33","D34","O4"]},{"he":"יש שתי דרכים לבחור חתם:<br>• <b>מכירה במשא ומתן</b> (<span class=en>negotiated sale</span>): המנפיק בוחר חתם או סינדיקט, ומתמקח איתו על הריבית, תנאי הפדיון המוקדם והמחיר.<br>• <b>מכירה תחרותית</b> (<span class=en>competitive sale</span>): חתמים מגישים <b>הצעות מחייבות</b> (<span class=en>firm bids</span>), וההנפקה הולכת בדרך כלל להצעה עם עלות הריבית הנמוכה ביותר.","c":["D35","D36","M44","M45"]}],"terms":[["Muni tax treatment","מיסוי אג\"ח מוניציפליות","ריבית בדרך כלל פטורה ממס פדרלי, ולפעמים ממס המדינה לתושבי המדינה. רווח הון חייב. חלק חייבות ב-AMT.",["M28","M29","M30","M31"]],["Tax-equivalent yield","תשואה שוות-מס","תשואה פטורה ÷ (1 − שיעור המס).",["M32","M33"]],["MSRB","MSRB","כותב כללים לעוסקים באג\"ח מוניציפליות וליועצים מוניציפליים. לא אוכף, ולא מפקח על מנפיקים.",["M35","M36","M37","M38"]],["EMMA / official statement","EMMA / תשקיף מוניציפלי","EMMA: אתר המידע הרשמי והחינמי. התשקיף המוניציפלי: מסמך הגילוי של המנפיק.",["M40","M41","M42"]],["Underwriter / syndicate","חתם / סינדיקט","החתם קונה הנפקה חדשה ומוכר למשקיעים. סינדיקט: קבוצת חתמים שחולקת את הסיכון.",["D32","D33","D34","O4"]],["Negotiated vs. competitive","משא ומתן מול תחרותית","משא ומתן: המנפיק בוחר חתם ומתמקח. תחרותית: הצעות מחייבות (firm bids), בדרך כלל הזולה ביותר זוכה.",["D35","D36","M44","M45"]]],"checks":[{"en":"Two investors buy the same muni yielding 3%. Who gets the higher tax-equivalent yield?","he":"שני משקיעים קונים אותה אג\"ח מוניציפלית בתשואה 3%. למי התשואה שוות-המס גבוהה יותר?","o":[["The one in the 37% bracket","מי שבשיעור מס 37%"],["The one in the 12% bracket","מי שבשיעור מס 12%"]],"a":0,"why":"ככל ששיעור המס גבוה יותר, (1 − שיעור המס) קטן יותר, והתשואה שוות-המס גדלה. 3% ÷ 0.63 = 4.76% לעומת 3% ÷ 0.88 = 3.41%.","c":["M32"]},{"en":"Where would an investor find the official statement for a new muni issue?","he":"איפה משקיע ימצא את התשקיף המוניציפלי של הנפקה חדשה?","o":[["On EMMA","ב-EMMA"],["On the Treasury's website","באתר של משרד האוצר"]],"a":0,"why":"EMMA הוא אתר המידע הרשמי לאג\"ח מוניציפליות, ושם נמצאים מסמכי הגילוי.","c":["M40","M42"]}]},{"id":"l11","en":"Money market instruments","he":"מכשירי שוק הכסף","story":[{"he":"Golden Crust צריכה כסף לחודש-חודשיים, עד שלקוח גדול ישלם. אג\"ח ל-10 שנים זה לא מתאים. בשביל זה יש <b>שוק הכסף</b> (<span class=en>money market</span>): שוק של הלוואות קצרות, עם תקופה מקורית של <b>שנה או פחות</b>. המכשירים שם קצרים ונזילים מאוד.","c":["D1","D4"]},{"he":"הפתרון של Golden Crust: <b>נייר ערך מסחרי</b> (<span class=en>commercial paper</span>). זה שטר חוב קצר <b>ולא מובטח</b>, שמנפיקות בעיקר חברות. התקופה: עד 270 יום (בממוצע כ-30). עד 270 יום הוא <b>פטור מרישום</b> ב-SEC, כלומר לא צריך להגיש תשקיף.","c":["D25","D26","D27","D28"]},{"he":"נייר ערך מסחרי נמכר <b>בניכיון</b>, בדרך כלל ביחידות של 100,000 דולר ומעלה. לכן מי שקונה אותו הם בעיקר מוסדות: קרנות, קרנות כספיות וחברות.","c":["D30","D31"]},{"he":"<b>קיבול בנקאי</b> (<span class=en>banker's acceptance</span>) משמש למימון סחר, בעיקר סחר בינלאומי. Golden Crust קונה מ-Sakura ביפן קמח מיוחד, ומבטיחה לשלם בעוד 90 יום. Sakura לא מכירה את Golden Crust. אז הבנק של Golden Crust חותם על השטר, כלומר \"מקבל\" אותו (<span class=en>accepts</span>), ומאותו רגע <b>הבנק</b> אחראי לתשלום. ומה אם Sakura לא רוצה לחכות 90 יום? יש לה עכשיו שטר שהבנק התחייב לשלם, וזה כמעט כמו מזומן. היא יכולה למכור אותו למשקיע, למשל ב-98,500 דולר במקום 100,000. בעוד 90 יום המשקיע גובה 100,000 מהבנק, וההפרש של 1,500 הוא הרווח שלו. לכן קיבול בנקאי נסחר <b>בניכיון</b>.","c":["D21","D22","D23","D24"]},{"he":"רינה פותחת <b>פיקדון לזמן קצוב</b> (<span class=en>certificate of deposit, CD</span>) בבנק: מפקידה סכום קבוע לתקופה קבועה. הריבית בדרך כלל קבועה, אבל יש גם CDs בריבית משתנה. משיכה לפני הזמן עלולה לגרור קנס.","c":["D9","D10","D14"]},{"he":"CD בבנק מבוטח ב-<span class=en>FDIC</span>, ביטוח הפיקדונות האמריקאי, עד <b>250,000 דולר</b> לכל מפקיד, בכל בנק, בכל סוג בעלות (למשל חשבון יחיד וחשבון משותף נספרים בנפרד).","c":["D11","D12"]},{"he":"<b>CD דרך ברוקר</b> (<span class=en>brokered CD</span>): בנק מנפיק, וברוקר מוכר ללקוחות. אם מוכרים אותו לפני הפדיון אחרי שהריבית עלתה, ייתכן שיהיה צורך למכור אותו בניכיון, כלומר בהפסד. למה? זו הנדנדה משיעור 2. וביטוח ה-FDIC לא עוזר כאן: הוא מגן אם הבנק קורס, לא מפני ירידת מחיר בשוק. ו-CD שניתן לפדיון מוקדם? <b>רק הבנק</b> יכול לפדות אותו, לא המשקיע.","c":["D15","D17","D18","D19"]},{"he":"ולסיום, <b>קרן כספית</b> (<span class=en>money market fund</span>): קרן שמשקיעה בניירות קצרים ואיכותיים. נשמע כמו פיקדון, אבל זה לא: היא <b>לא</b> מבוטחת ב-FDIC, ויכולה להפסיד כסף.","c":["D5","D6"]}],"terms":[["Money market","שוק הכסף","שוק להלוואות קצרות, עם תקופה מקורית של שנה או פחות.",["D1"]],["Commercial paper","נייר ערך מסחרי","שטר חוב קצר ולא מובטח של חברות. עד 270 יום, בניכיון, בדרך כלל 100,000 דולר ומעלה.",["D25","D26","D27","D30"]],["Banker's acceptance","קיבול בנקאי","שטר שבנק קיבל ואחראי לתשלומו. משמש למימון סחר בינלאומי. נסחר בניכיון.",["D21","D22","D24"]],["Certificate of deposit (CD)","פיקדון לזמן קצוב","סכום קבוע לתקופה קבועה. מבוטח ב-FDIC עד 250,000 דולר לכל מפקיד, בנק וסוג בעלות.",["D9","D11","D12"]],["Brokered CD","CD דרך ברוקר","CD שברוקר מוכר. מכירה לפני הפדיון עלולה להיות בהפסד. רק הבנק יכול לפדות CD מוקדם.",["D15","D17","D19"]],["Money market fund","קרן כספית","משקיעה בניירות קצרים ואיכותיים. לא מבוטחת ב-FDIC.",["D5","D6"]]],"checks":[{"en":"Why do mostly institutions buy commercial paper?","he":"למה בעיקר מוסדות קונים נייר ערך מסחרי?","o":[["It usually comes in $100,000+ units","הוא בדרך כלל ביחידות של 100,000 דולר ומעלה"],["Individuals are barred from owning it","לאנשים פרטיים אסור להחזיק בו"]],"a":0,"why":"נייר ערך מסחרי מונפק בדרך כלל ביחידות של 100,000 דולר ומעלה, ולכן הקונים הם בעיקר מוסדות.","c":["D30","D31"]},{"en":"In a banker's acceptance, who becomes responsible for paying?","he":"בקיבול בנקאי, מי נעשה אחראי לתשלום?","o":[["The FDIC","ה-FDIC"],["The accepting bank","הבנק שקיבל את השטר"]],"a":1,"why":"ברגע שהבנק מקבל את השטר, הבנק נעשה אחראי ראשי לתשלום.","c":["D21"]}]}],"exam":[{"en":"A corporate bond has a $1,000 par value and a 5% coupon, paid semiannually. How much is each interest payment?","he":"לאג\"ח קונצרנית ערך נקוב של 1,000 דולר וקופון של 5%, שמשולם פעמיים בשנה. כמה כל תשלום ריבית?","o":[["$50","50 דולר"],["$25","25 דולר"],["$12.50","12.50 דולר"],["$100","100 דולר"]],"a":1,"why":"5% מ-1,000 = 50 דולר בשנה, כלומר 25 דולר בכל אחד משני התשלומים.","c":["A6","A8"]},{"en":"Which statement BEST describes the holder of a corporate bond?","he":"מה מתאר הכי טוב את מי שמחזיק אג\"ח קונצרנית?","o":[["An owner, paid after creditors in bankruptcy","בעלים, שנפרע אחרי הנושים בפשיטת רגל"],["A creditor, paid before owners in bankruptcy","נושה, שנפרע לפני הבעלים בפשיטת רגל"],["A creditor, paid after owners in bankruptcy","נושה, שנפרע אחרי הבעלים בפשיטת רגל"],["An owner, paid before creditors in bankruptcy","בעלים, שנפרע לפני הנושים בפשיטת רגל"]],"a":1,"why":"מחזיק אג\"ח הלווה כסף, ולכן הוא נושה. בפשיטת רגל, מחזיקי אג\"ח קודמים לבעלי המניות.","c":["A2","A46"]},{"en":"Dana owns a 4% coupon bond. New bonds of the same quality now pay 6%. Her bond most likely trades:","he":"לדנה אג\"ח בקופון 4%. אג\"ח חדשות באותה איכות משלמות עכשיו 6%. סביר שהאג\"ח שלה נסחרת:","o":[["Above par, with a current yield below 4%","מעל הערך הנקוב, עם תשואה שוטפת מתחת ל-4%"],["Below par, with a current yield below 4%","מתחת לערך הנקוב, עם תשואה שוטפת מתחת ל-4%"],["Above par, with a current yield above 4%","מעל הערך הנקוב, עם תשואה שוטפת מעל 4%"],["Below par, with a current yield above 4%","מתחת לערך הנקוב, עם תשואה שוטפת מעל 4%"]],"a":3,"why":"הריבית בשוק עלתה מעל הקופון, ולכן המחיר יורד מתחת לערך הנקוב. אותם 40 דולר חלקי מחיר נמוך יותר = תשואה שוטפת מעל 4%.","c":["A12","A14","A18"]},{"en":"Market rates rise by 1%. All four bonds are of equal credit quality. Which bond's price will generally fall the MOST?","he":"הריבית עולה ב-1%. לכל ארבע האג\"ח אותה איכות אשראי. המחיר של איזו אג\"ח בדרך כלל ירד הכי הרבה?","o":[["20-year maturity, 6% coupon","פדיון 20 שנה, קופון 6%"],["2-year maturity, 2% coupon","פדיון שנתיים, קופון 2%"],["20-year maturity, 2% coupon","פדיון 20 שנה, קופון 2%"],["2-year maturity, 6% coupon","פדיון שנתיים, קופון 6%"]],"a":2,"why":"סיכון הריבית גדול יותר בפדיון ארוך ובקופון נמוך. לכן אג\"ח ל-20 שנה בקופון 2% הכי רגישה.","c":["A16","A17"]},{"en":"A $1,000 par, 5% coupon bond trades at $1,040. Which BEST describes its yields?","he":"אג\"ח בערך נקוב 1,000 דולר ובקופון 5% נסחרת ב-1,040 דולר. מה מתאר הכי טוב את התשואות שלה?","o":[["Current yield below 5%, YTM below the current yield","תשואה שוטפת מתחת ל-5%, תשואה לפדיון מתחת לתשואה השוטפת"],["Current yield above 5%, YTM below the current yield","תשואה שוטפת מעל 5%, תשואה לפדיון מתחת לתשואה השוטפת"],["Current yield below 5%, YTM above the current yield","תשואה שוטפת מתחת ל-5%, תשואה לפדיון מעל התשואה השוטפת"],["Current yield above 5%, YTM above the current yield","תשואה שוטפת מעל 5%, תשואה לפדיון מעל התשואה השוטפת"]],"a":0,"why":"50 ÷ 1,040 = כ-4.81%, מתחת לקופון. בסוף המשקיע מקבל רק 1,000, כלומר מפסיד 40, ולכן התשואה לפדיון עוד יותר נמוכה.","c":["A18","A23","A24"]},{"en":"A bond has a $1,000 par value and a 5% coupon. It trades at $800. What is its current yield?","he":"לאג\"ח ערך נקוב של 1,000 דולר וקופון של 5%. היא נסחרת ב-800 דולר. מה התשואה השוטפת שלה?","o":[["5.00%","5.00%"],["4.00%","4.00%"],["7.50%","7.50%"],["6.25%","6.25%"]],"a":3,"why":"הריבית השנתית: 5% מ-1,000 = 50 דולר. תשואה שוטפת = 50 ÷ 800 = 6.25%. 5% הוא הקופון.","c":["A18"]},{"en":"A 4% coupon bond is trading at a discount. Which ranking of its yields is correct, from highest to lowest?","he":"אג\"ח בקופון 4% נסחרת בניכיון. מה הסדר הנכון של התשואות שלה, מהגבוהה לנמוכה?","o":[["Current yield, yield to maturity, coupon","תשואה שוטפת, תשואה לפדיון, קופון"],["Coupon, yield to maturity, current yield","קופון, תשואה לפדיון, תשואה שוטפת"],["Coupon, current yield, yield to maturity","קופון, תשואה שוטפת, תשואה לפדיון"],["Yield to maturity, current yield, coupon","תשואה לפדיון, תשואה שוטפת, קופון"]],"a":3,"why":"בניכיון: תשואה לפדיון > תשואה שוטפת > קופון. בפרמיה הסדר הפוך.","c":["A22","A24"]},{"en":"A callable bond with a 4% coupon has a yield to maturity of 5.0% and a yield to call of 5.6%. What is its yield to worst?","he":"לאג\"ח ניתנת לפדיון מוקדם בקופון 4% יש תשואה לפדיון של 5.0% ותשואה לפדיון מוקדם של 5.6%. מה התשואה הגרועה ביותר?","o":[["5.3%","5.3%"],["5.0%","5.0%"],["5.6%","5.6%"],["4.0%","4.0%"]],"a":1,"why":"התשואה הגרועה ביותר היא הנמוכה מבין התשואה לפדיון (5.0%) והתשואה לפדיון מוקדם (5.6%). הקופון לא משתתף בהשוואה.","c":["A25"]},{"en":"Which of the following S&P ratings is the LOWEST that is still considered investment grade?","he":"איזה מדירוגי S&P הבאים הוא הנמוך ביותר שעדיין נחשב דירוג השקעה?","o":[["B","B"],["A","A"],["BB","BB"],["BBB","BBB"]],"a":3,"why":"דירוג השקעה הוא ארבע הדרגות הגבוהות: AAA, AA, A, BBB. מ-BB ומטה זו תשואה גבוהה.","c":["A28","A29","O5"]},{"en":"Two bonds have the same maturity. One is rated A, the other BB. Compared with the A bond, the BB-rated bond is:","he":"לשתי אג\"ח אותו פדיון. אחת בדירוג A, השנייה BB. בהשוואה לאג\"ח בדירוג A, האג\"ח בדירוג BB היא:","o":[["Investment grade, with more default risk","בדירוג השקעה, עם יותר סיכון חדלות פירעון"],["Below investment grade, with more default risk","מתחת לדירוג השקעה, עם יותר סיכון חדלות פירעון"],["Below investment grade, with less default risk","מתחת לדירוג השקעה, עם פחות סיכון חדלות פירעון"],["Investment grade, with less default risk","בדירוג השקעה, עם פחות סיכון חדלות פירעון"]],"a":1,"why":"BB נמצא מתחת לקו (BB ומטה), ולכן תשואה גבוהה, עם יותר סיכון חדלות פירעון.","c":["A29","O5"]},{"en":"S&P downgrades a bond from A to BBB. The bond is now:","he":"S&P מורידה את הדירוג של אג\"ח מ-A ל-BBB. האג\"ח היא עכשיו:","o":[["Investment grade, with lower default risk","בדירוג השקעה, עם סיכון חדלות פירעון נמוך יותר"],["Investment grade, with higher default risk","בדירוג השקעה, עם סיכון חדלות פירעון גבוה יותר"],["High yield, with higher default risk","בדירוג תשואה גבוהה, עם סיכון חדלות פירעון גבוה יותר"],["High yield, with lower default risk","בדירוג תשואה גבוהה, עם סיכון חדלות פירעון נמוך יותר"]],"a":1,"why":"BBB עדיין מעל הקו (דירוג השקעה), אבל דירוג נמוך יותר אומר סיכון חדלות גבוה יותר.","c":["A28","A29","A31"]},{"en":"Golden Crust goes bankrupt. Its assets cover the secured bonds and the senior debentures, with a little left over. Who will most likely receive the least?","he":"Golden Crust פושטת רגל. הנכסים שלה מכסים את האג\"ח המובטחות ואת האג\"ח הבכירות הלא מובטחות, ונשאר קצת. מי כנראה יקבל הכי מעט?","o":[["Subordinated debenture holders","מחזיקי אג\"ח נחותות (subordinated debentures)"],["Senior debenture holders","מחזיקי אג\"ח בכירות (senior debentures)"],["Equipment trust certificate holders","מחזיקי equipment trust certificates"],["Common stockholders","בעלי המניות הרגילות"]],"a":3,"why":"כל מחזיקי האג\"ח, גם הנחותות, קודמים לבעלי המניות. אחרי הבכירות, מה שנשאר הולך קודם לנחותות, ובעלי המניות אחרונים.","c":["A44","A45","A46"]},{"en":"All four callable bonds are past their call protection. Which is the issuer MOST likely to call?","he":"כל ארבע האג\"ח ניתנות לפדיון מוקדם, ותקופת הגנת הפדיון של כולן הסתיימה. את איזו מהן המנפיק הכי סביר שיפדה?","o":[["5% coupon, market rates now 5%","קופון 5%, ריבית השוק עכשיו 5%"],["6% coupon, market rates now 4%","קופון 6%, ריבית השוק עכשיו 4%"],["6% coupon, market rates now 6%","קופון 6%, ריבית השוק עכשיו 6%"],["4% coupon, market rates now 6%","קופון 4%, ריבית השוק עכשיו 6%"]],"a":1,"why":"מנפיק פודה כשהריבית בשוק נמוכה מהקופון: כך הוא מגייס מחדש בזול. רק באפשרות הראשונה הקופון גבוה מריבית השוק.","c":["A34","A37"]},{"en":"Which investor faces reinvestment risk most directly?","he":"איזה משקיע מתמודד הכי ישירות עם סיכון השקעה מחדש?","o":[["Holder of a callable bond when rates fall","מחזיק אג\"ח ניתנת לפדיון מוקדם, כשהריבית יורדת"],["Holder of a zero-coupon bond held to maturity","מחזיק אג\"ח ללא קופון עד הפדיון"],["Holder of a callable bond when rates rise","מחזיק אג\"ח ניתנת לפדיון מוקדם, כשהריבית עולה"],["Holder of an MBS when rates rise","מחזיק MBS, כשהריבית עולה"]],"a":0,"why":"כשהריבית יורדת, המנפיק פודה מוקדם, והמשקיע צריך להשקיע את הכסף מחדש בריבית נמוכה יותר.","c":["A34","A36","A51","B53"]},{"en":"Before conversion, the holder of a convertible bond is:","he":"לפני ההמרה, מי שמחזיק אג\"ח להמרה הוא:","o":[["An owner, usually with a lower yield","בעלים, בדרך כלל בתשואה נמוכה יותר"],["A creditor, usually with a lower yield","נושה, בדרך כלל בתשואה נמוכה יותר"],["An owner, usually with a higher yield","בעלים, בדרך כלל בתשואה גבוהה יותר"],["A creditor, usually with a higher yield","נושה, בדרך כלל בתשואה גבוהה יותר"]],"a":1,"why":"עד ההמרה זו אג\"ח, והמחזיק נושה. בגלל אפשרות ההמרה למניות, התשואה בדרך כלל נמוכה מאג\"ח דומה.","c":["A38","A39"]},{"en":"Rina pays $9,850 for a $10,000, 26-week Treasury bill. What does she receive?","he":"רינה משלמת 9,850 דולר על שטר אוצר של 10,000 דולר ל-26 שבועות. מה היא מקבלת?","o":[["$10,000 at maturity, nothing before","10,000 דולר בפדיון, ושום דבר לפני"],["$75 after 13 weeks, then $10,000","75 דולר אחרי 13 שבועות, ואז 10,000"],["$9,850 back plus a $150 coupon","9,850 דולר בחזרה ועוד קופון של 150"],["$10,150 at maturity, nothing before","10,150 דולר בפדיון, ושום דבר לפני"]],"a":0,"why":"שטר אוצר אין לו קופון: הוא נקנה בניכיון, ובפדיון משולם רק הערך הנקוב, 10,000 דולר. ההפרש של 150 הוא הריבית.","c":["B3","B4","B5"]},{"en":"Which Treasury security is issued with a 30-year maturity and pays interest every six months?","he":"איזו אג\"ח אוצר מונפקת לפדיון של 30 שנה ומשלמת ריבית כל חצי שנה?","o":[["Treasury bond","Treasury bond"],["Treasury note","Treasury note"],["Treasury STRIPS","Treasury STRIPS"],["Treasury bill","Treasury bill"]],"a":0,"why":"Treasury bonds מונפקות ל-20 או 30 שנה עם ריבית חצי-שנתית. notes: עד 10 שנים. bills: עד 52 שבועות. STRIPS הן ללא קופון.","c":["B11","B12","B8","B1","B21"]},{"en":"An investor lives in a U.S. state with an income tax and buys a Treasury note. The interest is:","he":"משקיע גר במדינה (state) בארה\"ב שגובה מס הכנסה, וקונה Treasury note. הריבית:","o":[["Subject to federal tax, exempt from state tax","חייבת במס הפדרלי, פטורה ממס המדינה"],["Exempt from federal tax, subject to state tax","פטורה מהמס הפדרלי, חייבת במס המדינה"],["Subject to both federal and state tax","חייבת גם במס הפדרלי וגם במס המדינה"],["Exempt from both federal and state tax","פטורה גם מהמס הפדרלי וגם ממס המדינה"]],"a":0,"why":"ריבית על אג\"ח אוצר חייבת במס הפדרלי, ופטורה ממס המדינה ומהמס המקומי.","c":["B29"]},{"en":"Which statement about a noncompetitive bid in a Treasury auction is TRUE?","he":"איזו טענה על הצעה לא תחרותית במכרז של משרד האוצר נכונה?","o":[["It accepts the auction yield; limited to 35% of the issue","מקבלת את תשואת המכרז; מוגבלת ל-35% מההנפקה"],["It accepts the auction yield; limited to $10 million","מקבלת את תשואת המכרז; מוגבלת ל-10 מיליון דולר"],["It names its own yield; limited to $10 million","קובעת תשואה בעצמה; מוגבלת ל-10 מיליון דולר"],["It names its own yield; limited to 35% of the issue","קובעת תשואה בעצמה; מוגבלת ל-35% מההנפקה"]],"a":1,"why":"הצעה לא תחרותית מקבלת את התשואה שנקבעה במכרז, ומוגבלת ל-10 מיליון דולר. 35% הוא הגבול להצעה תחרותית, שקובעת תשואה בעצמה.","c":["B32","B33","B34","B35"]},{"en":"Deflation lowers a TIPS principal from $1,000 to $980. At maturity, the holder receives:","he":"דפלציה מורידה את הקרן של TIPS מ-1,000 ל-980 דולר. בפדיון, המחזיק מקבל:","o":[["$1,020","1,020 דולר"],["$990","990 דולר"],["$980","980 דולר"],["$1,000","1,000 דולר"]],"a":3,"why":"בפדיון TIPS משלמות את הגבוה מבין הקרן המעודכנת (980) לקרן המקורית (1,000): 1,000 דולר.","c":["B14","B18"]},{"en":"Which statement about Treasury STRIPS is TRUE?","he":"איזו טענה על Treasury STRIPS נכונה?","o":[["They are zero-coupon, bought through banks and brokers","הן ללא קופון, ונקנות דרך בנקים וברוקרים"],["They are zero-coupon, bought directly from the Treasury","הן ללא קופון, ונקנות ישירות ממשרד האוצר"],["They pay semiannual interest, bought from the Treasury","הן משלמות ריבית חצי-שנתית, ונקנות ממשרד האוצר"],["They pay semiannual interest, bought through brokers","הן משלמות ריבית חצי-שנתית, ונקנות דרך ברוקרים"]],"a":0,"why":"STRIPS הן ללא קופון. משרד האוצר לא מוכר אותן ישירות: קונים דרך מוסדות פיננסיים וברוקרים.","c":["B21","B23"]},{"en":"Which of these mortgage-backed securities carries a guaranty backed by the full faith and credit of the U.S. government?","he":"לאיזו מהאג\"ח מגובות המשכנתאות הבאות יש ערבות שמגובה בגיבוי המלא של ממשלת ארה\"ב?","o":[["Ginnie Mae","Ginnie Mae"],["Freddie Mac","Freddie Mac"],["A corporate mortgage bond","אג\"ח משכנתא של חברה"],["Fannie Mae","Fannie Mae"]],"a":0,"why":"Ginnie Mae היא סוכנות ממשלתית בתוך HUD, והערבות שלה מגובה בגיבוי המלא. Fannie Mae ו-Freddie Mac הן GSEs, בלי גיבוי כזה.","c":["B42","B44","B45"]},{"en":"Interest rates rise sharply. An MBS holder now faces mainly:","he":"הריבית עולה חדות. מחזיק MBS מתמודד עכשיו בעיקר עם:","o":[["Prepayment risk","סיכון פירעון מוקדם"],["Reinvestment risk","סיכון השקעה מחדש"],["Default risk","סיכון חדלות פירעון"],["Extension risk","סיכון הארכה"]],"a":3,"why":"כשהריבית עולה, בעלי בתים מפסיקים למחזר, הפירעונות מאטים, והכסף נשאר מושקע בריבית הישנה יותר זמן. זה סיכון הארכה.","c":["B53"]},{"en":"A bank sells investors the right to receive the payments on thousands of car loans. The investors own:","he":"בנק מוכר למשקיעים את הזכות לקבל את התשלומים על אלפי הלוואות רכב. המשקיעים מחזיקים:","o":[["An asset-backed security","אג\"ח מגובת נכסים (ABS)"],["A pass-through MBS","אג\"ח מגובת משכנתאות (MBS, pass-through)"],["An equipment trust certificate","תעודת נאמנות על ציוד (equipment trust certificate)"],["A corporate debenture","אג\"ח לא מובטחת של חברה (debenture)"]],"a":0,"why":"ABS מגובות בתזרים מהלוואות כמו הלוואות רכב. MBS מגובות במשכנתאות. equipment trust מובטחת בציוד של החברה. debenture לא מובטחת בכלל.","c":["B56","B57"]},{"en":"A municipal bond is backed by the full faith, credit and taxing power of the issuing city. It is a:","he":"אג\"ח מוניציפלית מגובה באמונה, באשראי ובכוח המיסוי של העיר המנפיקה. היא:","o":[["General obligation bond","אג\"ח כללית"],["Industrial development bond","industrial development bond"],["Revenue bond","אג\"ח הכנסה"],["Special assessment bond","special assessment"]],"a":0,"why":"אג\"ח כללית (GO) מגובה באמונה, באשראי ובכוח המיסוי של המנפיק.","c":["M5","M6"]},{"en":"A city issues a short-term note to be repaid from state aid it expects to receive. This is MOST likely a:","he":"עיר מנפיקה שטר לטווח קצר, שייפרע מכספי סיוע מהמדינה שהיא מצפה לקבל. זה הכי סביר:","o":[["RAN","RAN"],["GO bond","אג\"ח כללית (GO)"],["BAN","BAN"],["TAN","TAN"]],"a":0,"why":"RAN נפרע מהכנסות צפויות אחרות, לא ממיסים (למשל סיוע מהמדינה). TAN: מיסים. BAN: הנפקת אג\"ח ארוכה. GO היא אג\"ח ארוכה, לא שטר קצר.","c":["M20","M21","M22","M23"]},{"en":"Water revenues fall short on a city's double-barreled bond. What happens next?","he":"הכנסות המים לא מספיקות לאג\"ח double-barreled של עיר. מה קורה עכשיו?","o":[["The state must cover it from state funds","המדינה חייבת לכסות את החוסר מכספה"],["Bondholders wait until water revenues recover","המחזיקים מחכים שהכנסות המים יתאוששו"],["The city may choose to cover it, but need not","העיר רשאית לכסות את החוסר, אבל לא חייבת"],["The city's full faith and credit must cover it","הגיבוי המלא של העיר חייב לכסות את החוסר"]],"a":3,"why":"double-barreled מגובה בשני מקורות מחייבים: הכנסה מוגדרת, ועוד הגיבוי המלא של המנפיק. \"רשאית אבל לא חייבת\" מתאר moral obligation.","c":["M16","M17"]},{"en":"An investor in the 24% tax bracket is offered a municipal bond yielding 3.0%. What is its tax-equivalent yield?","he":"משקיע בשיעור מס 24% מקבל הצעה לאג\"ח מוניציפלית בתשואה 3.0%. מה התשואה שוות-המס?","o":[["3.95%","3.95%"],["3.72%","3.72%"],["4.76%","4.76%"],["2.28%","2.28%"]],"a":0,"why":"3.0% ÷ (1 − 0.24) = 3.0% ÷ 0.76 = כ-3.95%.","c":["M32"]},{"en":"Which statement about the MSRB is TRUE?","he":"איזו טענה על ה-MSRB נכונה?","o":[["It writes rules for municipal dealers; others enforce them","כותב כללים לעוסקים באג\"ח מוניציפליות; אחרים אוכפים"],["It writes rules for municipal issuers; others enforce them","כותב כללים למנפיקי אג\"ח מוניציפליות; אחרים אוכפים"],["It writes rules for municipal issuers and enforces them","כותב כללים למנפיקי אג\"ח מוניציפליות ואוכף אותם"],["It writes rules for municipal dealers and enforces them","כותב כללים לעוסקים באג\"ח מוניציפליות ואוכף אותם"]],"a":0,"why":"ה-MSRB כותב כללים לברוקרים, לבנקים וליועצים מוניציפליים. FINRA, ה-SEC ורגולטורים של בנקים אוכפים. הוא לא מפקח על המנפיקים.","c":["M35","M37","M38"]},{"en":"Which statement about a competitive municipal sale is TRUE?","he":"איזו טענה על מכירה תחרותית של אג\"ח מוניציפליות נכונה?","o":[["Underwriters submit firm bids; usually the lowest interest cost wins","חתמים מגישים הצעות מחייבות; בדרך כלל ההצעה עם עלות הריבית הנמוכה ביותר זוכה"],["Underwriters submit firm bids; usually the highest interest cost wins","חתמים מגישים הצעות מחייבות; בדרך כלל ההצעה עם עלות הריבית הגבוהה ביותר זוכה"],["The city picks one underwriter and bargains over the terms","העיר בוחרת חתם אחד ומתמקחת איתו על התנאים"],["Each bidder accepts the auction yield, up to $10 million","כל מציע מקבל את תשואת המכרז, עד 10 מיליון דולר"]],"a":0,"why":"במכירה תחרותית חתמים מגישים הצעות מחייבות, והזולה ביותר זוכה בדרך כלל. בחירת חתם ומשא ומתן זו מכירה במשא ומתן. קבלת תשואת המכרז היא הצעה לא תחרותית במכרז של משרד האוצר.","c":["D35","D36","M44","M45","B32"]},{"en":"Which BEST describes commercial paper?","he":"מה התיאור הטוב ביותר של נייר ערך מסחרי?","o":[["Secured company debt, sold at a discount","חוב מובטח של חברה, שנמכר בניכיון"],["Secured company debt, paying a coupon","חוב מובטח של חברה, שמשלם קופון"],["Unsecured company debt, paying a coupon","חוב לא מובטח של חברה, שמשלם קופון"],["Unsecured company debt, sold at a discount","חוב לא מובטח של חברה, שנמכר בניכיון"]],"a":3,"why":"נייר ערך מסחרי הוא שטר חוב קצר ולא מובטח של חברות, שנמכר בניכיון.","c":["D25","D26","D30"]},{"en":"An investor sells a brokered CD before maturity, after interest rates have risen. The investor will most likely:","he":"משקיע מוכר CD שקנה דרך ברוקר לפני הפדיון, אחרי שהריבית עלתה. מה סביר שיקרה?","o":[["Sell at the purchase price, since the bank must buy it back","ימכור במחיר הקנייה, כי הבנק חייב לקנות אותו בחזרה"],["Sell above the purchase price, possibly at a gain","ימכור מעל מחיר הקנייה, אולי ברווח"],["Sell at par, since FDIC insurance protects its value","ימכור בערך הנקוב, כי ביטוח ה-FDIC מגן על השווי שלו"],["Sell below the purchase price, possibly at a loss","ימכור מתחת למחיר הקנייה, אולי בהפסד"]],"a":3,"why":"כשהריבית עולה, מחיר ה-CD בשוק יורד. מכירה לפני הפדיון עלולה להיות בניכיון, כלומר בהפסד. ביטוח ה-FDIC לא מגן מפני ירידת מחיר בשוק.","c":["D17","D18"]}]};</script>
<script>
const D=DATA, app=document.getElementById("app"), $=id=>document.getElementById(id);
const KEY=D.id;
let S={done:{},best:null,attempts:0};try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const toTop=()=>window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
const L="ABCD";

/* ---------- v3: pronunciation (device voice, natural voices first) ---------- */
const W=D.words||{};
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Deranged|Hysterical|Pipe|Fred|Junior|Ralph|Grandpa|Grandma|Rocko|Eddy|Reed|Sandy|Shelley|Flo/i;
const WARM=[[/Natural|Neural/i,60],[/Premium/i,55],[/Enhanced/i,50],[/\bAva\b/i,40],[/Samantha/i,34],[/Allison|Susan|Zoe|Nicky|Evan|Joelle|Noelle/i,30],[/Aria|Jenny|Michelle/i,38],[/Google US English/i,32],[/Google UK English Female/i,24]];
function scoreVoice(x){if(!/^en/i.test(x.lang)||NOVELTY.test(x.name))return -1;let sc=/en[-_]US/i.test(x.lang)?20:/en[-_](GB|AU|CA|IE|NZ)/i.test(x.lang)?12:6;WARM.forEach(([r,w])=>{if(r.test(x.name))sc+=w});return sc}
let voice=null;const canSpeak="speechSynthesis" in window;
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(x=>scoreVoice(x)>=0).sort((a,b)=>scoreVoice(b)-scoreVoice(a));voice=v[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(t){try{if(!canSpeak)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/\s*\/\s*/g,", ").replace(/\(|\)/g,", "));if(voice)u.voice=voice;u.lang="en-US";u.rate=.88;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener("click",e=>{const b=e.target.closest(".saybtn,.story .en");if(b){speak(b.dataset.say||b.textContent)}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".story .en")){e.preventDefault();speak(e.target.textContent)}});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const sayBtn=t=>canSpeak?`<button class="saybtn" data-say="${esc(t)}" aria-label="Hear: ${esc(t)}" lang="en">🔊</button>`:"";
const ALLT=D.lessons.flatMap((l,i)=>l.terms.map(t=>({t,li:i})));
const termLi=n=>{const x=ALLT.find(x=>x.t[0]===n);return x?x.li:-1};
const hasDefs=ALLT.some(x=>W[x.t[0]]&&W[x.t[0]].def);
const smooth=()=>matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth";
function focusPanel(){const p=app.querySelector(".panel");if(p){p.setAttribute("tabindex","-1");p.focus({preventScroll:true})}}
S.miss=S.miss||{};S.ld=S.ld||{};
function markMiss(term){S.miss[term]=(S.miss[term]||0)+1;save()}
function markHit(term){if(S.miss[term]){S.miss[term]--;if(S.miss[term]<=0)delete S.miss[term];save()}}
const bidi=h=>String(h).replace(/[A-Za-z][A-Za-z0-9 .'\/&$%-]*[A-Za-z0-9%]/g,m=>`<bdi lang="en">${m}</bdi>`);
const termCard=(t,li)=>{const w=W[t[0]]||{};return `<div class="term"><div class="t-top">${sayBtn(t[0])}<span class="t-en" lang="en">${t[0]}</span></div>
  ${w.pr?`<span class="t-pr">הגייה: ${w.pr}</span>`:""}${w.def?`<p class="t-def" lang="en" dir="ltr">${w.def}</p>`:""}
  <span class="t-he">${bidi(t[1])}${li!=null?` <span class="muted" style="font-weight:400;font-size:.85rem">(שיעור ${li+1})</span>`:""}</span><p>${bidi(t[2])}</p>${w.hint?`<p class="t-hint">💡 ${bidi(w.hint)}</p>`:""}</div>`};
const lessonBtn=(id,icon,title,sub,st,stCls,extra)=>`<button class="lesson${extra||""}" id="${id}"><span class="n" aria-hidden="true">${icon}</span><span><span class="h3">${title}</span><small lang="en">${sub}</small></span><span class="st${stCls||""}">${st}</span></button>`;

/* ---------- home ---------- */
function home(){
  const n=D.lessons.filter(l=>S.done[l.id]).length;const weak=Object.keys(S.miss).filter(k=>ALLT.some(x=>x.t[0]===k));
  app.innerHTML=`<div><span class="eyebrow" lang="en">SIE · ${D.section}</span><h1>${D.heTitle}</h1>
   <p class="muted" style="margin:6px 0 0">${D.lessons.length} שיעורים. בכל שיעור: סיפור, כרטיסי מילים${hasDefs?" עם הגייה והגדרה באנגלית":""}, תרגול מילים ובדיקה קטנה. אחר כך תרגול לפני המבחן, ובסוף מבחן בסגנון FINRA.${canSpeak?" אפשר ללחוץ על כל מונח באנגלית כדי לשמוע אותו.":""}</p></div>
  <div class="row"><span class="pill">${n} / ${D.lessons.length} שיעורים</span>${S.practice!=null?`<span class="pill">תרגול: ${S.practice}%</span>`:""}${S.best!=null?`<span class="pill">מבחן: ${S.best}%</span>`:""}</div>
  <h2 class="section">שלב 1: השיעורים</h2>
  <div class="lessons">${D.lessons.map((l,i)=>`<button class="lesson" data-i="${i}"><span class="n" aria-hidden="true">${i+1}</span><span><span class="h3">${l.he}</span><small lang="en">${l.en}</small></span><span class="st${S.done[l.id]?" done":""}">${S.done[l.id]?"✓ נלמד"+(S.ld[l.id]!=null?` · מילים ${S.ld[l.id]}%`:""):"התחל"}</span></button>`).join("")}</div>
  <h2 class="section">שלב 2: לחבר את המילים באנגלית</h2>
  <div class="lessons">
   ${weak.length?lessonBtn("weak","!",`מילים שפספסתי (${weak.length})`,"Practice only the words you missed","התחל"," mid"):""}
   ${lessonBtn("allwords","Aa","כל המילים, לפי שיעורים",hasDefs?"Definition → term · term → definition · term → עברית":"Term → עברית",S.words!=null?"✓ "+S.words+"%":"בחר",S.words!=null?" done":"")}
   ${D.pairs?lessonBtn("pairs","⇄","צמדים מבלבלים",D.pairs.map(p=>p.a.replace(/ \(.*\)/,"")+" / "+p.b).slice(0,2).join(" · ")+" …",S.pairs!=null?"✓ "+S.pairs+"%":"התחל",S.pairs!=null?" done":""):""}
   ${D.examWords?lessonBtn("examwords","?","האנגלית של המבחן","EXCEPT · NOT · BEST describes · MOST likely",S.ew!=null?"✓ "+S.ew+"%":"התחל",S.ew!=null?" done":""):""}
  </div>
  <h2 class="section">שלב 3: תרגול ומבחן</h2>
  <div class="lessons">
   ${lessonBtn("practice","↻","תרגול מעורב באנגלית","20 questions · missed ones come back",S.practice!=null?S.practice+"%":"התחל",S.practice>=80?" done":S.practice!=null?" mid":"")}
   ${lessonBtn("exam","★","מבחן הפרק",`${D.exam.length} FINRA-style questions · pass = 70%`,"התחל",""," cta")}
   ${lessonBtn("gloss","אב","מילון מונחים","All terms"+(canSpeak?", with 🔊":""),"פתח")}</div>`;
  app.querySelectorAll(".lesson[data-i]").forEach(b=>b.onclick=()=>story(+b.dataset.i,0));
  $("exam").onclick=examIntro;$("gloss").onclick=glossary;$("practice").onclick=practice;$("allwords").onclick=allWords;
  if($("pairs"))$("pairs").onclick=pairs;
  if($("examwords"))$("examwords").onclick=()=>runDrill(examWordItems(),"האנגלית של המבחן",r=>{S.ew=r;save()},home);
  if($("weak"))$("weak").onclick=()=>runDrill(wordItems(weak.map(k=>ALLT.find(x=>x.t[0]===k).t)),"מילים שפספסתי",null,home);
}

function story(li,si){
