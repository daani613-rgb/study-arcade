<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIE Study: Options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=IBM+Plex+Sans:wght@500;600&display=swap">
<style>
/* Layout: a calm study desk. Home = chapter map; lesson = story slides, then glossary cards, then quick checks; exam = one question per screen, FINRA-like, review at the end. */
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#15212e; --muted:#5b6b7c; --line:#d9e1e8;
  --accent:#0f6b5c; --accent-soft:#dcefea; --navy:#1d3557; --gold:#8a5a12; --gold-soft:#fbf0dc;
  --good:#157347; --good-soft:#dcf3e6; --bad:#c2362f; --bad-soft:#fbe3e1; --on-accent:#fff; --edge:#7f8e9d;
  --he:"Heebo","Arial Hebrew",system-ui,sans-serif; --en:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1720; --card:#17222e; --ink:#e7eef5; --muted:#9fb0c1; --line:#2a3a4a;
  --accent:#4fc3a8; --accent-soft:#163a33; --navy:#9cc3f0; --gold:#e6b45a; --gold-soft:#3a2d14;
  --good:#4fd18b; --good-soft:#163a28; --bad:#ff7a72; --bad-soft:#47201e; --on-accent:#0b1f1a; --edge:#5b6e82; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--he);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.9rem;font-weight:800} h2{font-size:1.4rem;font-weight:800} h3{font-size:1.1rem;font-weight:700}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-weight:600}
.eyebrow{font-size:.85rem;font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.btn{font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--accent);color:var(--on-accent);font-size:1rem}
.btn.soft{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pill{font-size:.85rem;font-weight:700;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* home */
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:right;width:100%}
.lesson .n{font-family:var(--en);font-weight:600;color:var(--accent);font-size:1.2rem;text-align:center}
.lesson small{display:block;color:var(--muted);font-family:var(--en);direction:ltr;text-align:right}
.lesson .st{font-size:.85rem;font-weight:700;color:var(--muted)}
.lesson .st.done{color:var(--good)}
.cta{background:var(--navy);color:var(--bg)}
.cta .n,.cta small,.cta .st{color:var(--bg)}
/* slides */
.bars{display:flex;gap:4px}.bars i{flex:1;height:4px;border-radius:2px;background:var(--line)}.bars i.on{background:var(--accent)}
.story{font-size:1.08rem;min-height:180px}
.story b{color:var(--navy)}
.term{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.term .t-en{font-family:var(--en);direction:ltr;text-align:left;font-size:1.25rem;font-weight:600;color:var(--navy)}
.term .t-he{font-weight:800;font-size:1.05rem}
.term p{margin:0;color:var(--ink)}
/* questions */
.q{font-size:1.08rem;font-weight:600;margin:0}
.q.enq{font-family:var(--en);direction:ltr;text-align:left;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--edge);background:var(--card);border-radius:12px;padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline;text-align:left;direction:ltr;font-family:var(--en)}
.opt .l{font-weight:600;color:var(--accent);flex:none}
.opt .tr{display:block;direction:rtl;text-align:right;font-family:var(--he);color:var(--muted);font-size:.92rem;margin-top:2px}
.opt.sel{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:0;padding:10px 12px;border-radius:12px;font-weight:500}
.fb.ok{background:var(--good-soft)}.fb.no{background:var(--bad-soft)}
.fb:empty{padding:0;border:0;margin:0;min-height:0}
.heq{background:var(--gold-soft);border-radius:12px;padding:10px 12px;margin:0}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.dot{border:1px solid var(--edge);background:var(--card);border-radius:8px;padding:6px 0;font-family:var(--en);font-size:.85rem;cursor:pointer}
.dot.ans{background:var(--accent-soft)}.dot.cur{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.big{font-family:var(--en);font-size:3rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rv.wrong{border-color:var(--bad)}
.rv .en{font-weight:500}
.search{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--edge);background:var(--card);color:var(--ink);font:inherit}
/* v2: words, pronunciation, drills */
.story .en,.say{cursor:pointer;border-bottom:1.5px dotted var(--accent)}
.story .en::after{content:" 🔊";font-size:.85em}
.story .en.nospeak{border-bottom:0;cursor:default}.story .en.nospeak::after{content:none}
.story .en:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.opt.ok .l::after{content:" ✓"}.opt.no .l::after{content:" ✗"}
.fb .en,.heq .en{white-space:nowrap}
.en-block{display:block;font-family:var(--en);font-weight:600;direction:ltr;text-align:left}
.rv-en{margin:0;font-family:var(--en);direction:ltr;text-align:left;font-weight:500}
.rv-lab{font-size:.85rem;color:var(--muted);font-weight:700}
.lesson .h3{display:block;font-size:1.1rem;font-weight:700;line-height:1.25}
.panel:focus{outline:none}
h2.section{font-size:.95rem;font-weight:700;color:var(--muted);margin:6px 0 -2px}
@media (prefers-color-scheme:dark){.cta{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}.cta .n,.cta small,.cta .st{color:var(--ink)}}
.term .t-top{display:flex;align-items:center;gap:10px;direction:ltr;justify-content:flex-start}
.saybtn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);font-size:20px;cursor:pointer;line-height:1}
.term .t-en{font-size:1.45rem}
.t-pr{color:var(--muted);font-size:.95rem}
.t-def{margin:0;font-family:var(--en);direction:ltr;text-align:left;font-weight:500;background:var(--bg);border-radius:10px;padding:8px 10px}
.math{unicode-bidi:isolate;direction:ltr}.story .math{white-space:nowrap}.row .pill{white-space:normal;max-width:100%;overflow-wrap:anywhere}.dot{min-height:44px}
.story table,.grid4{border-collapse:collapse;width:100%;font-size:.9rem;margin:6px 0}.story th,.story td,.grid4 td{border:1px solid var(--edge);padding:6px;text-align:center;vertical-align:top}.story th{font-weight:700}.grid4 td.hit{outline:3px solid var(--gold);font-weight:700}
body:not(.athome) .lib-back{display:none}.lib-back{min-height:44px;display:inline-flex;align-items:center}.math .mp{white-space:nowrap}
.lesson small:not([lang]){direction:rtl;font-family:var(--he)}
.term .t-hint{margin:0;font-size:.95rem;color:var(--gold)}
.opt.he{direction:rtl;text-align:right;font-family:var(--he)}
.bigterm{display:flex;align-items:center;gap:12px;direction:ltr;justify-content:center;font-family:var(--en);font-size:1.7rem;font-weight:600;color:var(--navy)}
.section{font-size:.95rem;font-weight:700;color:var(--muted);margin:6px 0 -2px}
.lesson .st.mid{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>.lib-back{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;font:700 14px system-ui,sans-serif;padding:8px 14px;border-radius:999px;background:rgba(20,20,40,.82);color:#fff;text-decoration:none}</style></head><body><a class="lib-back" href="../">&larr; All games</a>

<script>const DATA={"id":"sie-ch3","section":"2.1.3","title":"Chapter 3: Options","heTitle":"פרק 3: אופציות","lessons":[{"id":"l1","en":"What an option is","he":"מה זו אופציה","story":[{"he":"דנה מתחתנת בעוד שלושה חודשים. היא מוצאת אולם שעולה היום 20,000 דולר, אבל היא עוד לא בטוחה. בעל האולם מציע לה עסקה: \"תשלמי לי עכשיו 500 דולר, ואני מתחייב להשכיר לך את האולם ב-20,000 דולר בכל יום עד סוף החודש השלישי. את לא חייבת. אם תוותרי, ה-500 נשארים אצלי.\"","c":[]},{"he":"שימו לב לשלושה דברים: 1) לדנה יש <b>זכות</b>, לא חובה. 2) לבעל האולם יש <b>חובה</b>: אם דנה רוצה, הוא חייב. 3) דנה שילמה מראש סכום קטן, והוא לא חוזר אליה בשום מקרה. זה בדיוק הרעיון של <b>אופציה</b> (<span class=en>option</span>). ה-20,000 הוא המחיר הקבוע מראש. באופציות קוראים לו <b>מחיר המימוש</b> (<span class=en>strike price</span>). נכיר אותו לעומק בשיעור 3.","c":["P3","P15","P16"]},{"he":"בשוק ההון: אופציה היא <b>חוזה</b> בין קונה למוכר. היא נותנת לקונה את הזכות לקנות או למכור כמות מסוימת של נכס, במחיר קבוע מראש. לנכס הזה קוראים <b>נכס הבסיס</b> (<span class=en>underlying</span>). למשל: מניות של Golden Crust, או מדד מניות.","c":["P1","P2","P22","P23"]},{"he":"הערך של אופציה <b>נגזר</b> מהמחיר של נכס הבסיס. לכן קוראים לה <b>נגזר</b> (<span class=en>derivative</span>). אם מחיר המניה זז, גם המחיר של האופציה זז.","c":["P21"]},{"he":"מי שקונה את האופציה נקרא <span class=en>holder</span> (המחזיק). יש לו זכויות. מי שמוכר אותה נקרא <span class=en>writer</span> (הכותב). יש לו חובות. דנה היא ה-holder. בעל האולם הוא ה-writer.","c":["P6","P7","P8","P3"]},{"he":"הסכום שהקונה משלם למוכר נקרא <b>פרמיה</b> (<span class=en>premium</span>). הפרמיה משולמת <b>מראש</b> למוכר, <b>ולא מוחזרת</b>, גם אם הקונה לא ישתמש בזכות. טיפ לזיכרון: גם בביטוח קוראים לתשלום premium. משלמים מראש, וזה לא חוזר.","c":["P14","P15"]}],"terms":[["Option","אופציה","חוזה שנותן לקונה זכות (לא חובה) לקנות או למכור נכס במחיר קבוע מראש.",["P1","P2","P3"]],["Underlying","נכס הבסיס","הנכס שהאופציה עליו: למשל מניה או מדד מניות.",["P22","P23"]],["Derivative","נגזר","מכשיר שהערך שלו נגזר ממחיר של נכס אחר. אופציה היא נגזר.",["P21"]],["Holder (buyer)","המחזיק (הקונה)","קונה את האופציה ומשלם פרמיה. יש לו זכות.",["P6","P7","P3"]],["Writer (seller)","הכותב (המוכר)","מוכר את האופציה ומקבל פרמיה. יש לו חובה לבצע את החוזה אם הקונה מממש.",["P8","P9","P3"]],["Premium","פרמיה","המחיר שהקונה משלם למוכר על האופציה. משולם מראש ולא מוחזר.",["P14","P15"]]],"checks":[{"en":"Which statement about an option is TRUE?","he":"איזה משפט על אופציה נכון?","o":[["The buyer has an obligation; the seller has a right","לקונה יש חובה; למוכר יש זכות"],["The buyer has a right; the seller has an obligation","לקונה יש זכות; למוכר יש חובה"]],"a":1,"why":"הקונה (holder) קנה זכות. המוכר (writer) קיבל פרמיה, ובתמורה התחייב.","c":["P3"]},{"en":"Who receives the premium?","he":"מי מקבל את הפרמיה?","o":[["The writer (seller)","הכותב (המוכר)"],["The holder (buyer)","המחזיק (הקונה)"]],"a":0,"why":"הקונה משלם את הפרמיה למוכר, מראש.","c":["P14","P15"]}]},{"id":"l2","en":"Calls and puts","he":"Call ו-Put","story":[{"he":"יש רק שני סוגים של אופציות. <b>Call</b> (<span class=en>call option</span>) = הזכות <b>לקנות</b>. <b>Put</b> (<span class=en>put option</span>) = הזכות <b>למכור</b>. העסקה של דנה עם האולם דומה ל-call: זכות \"לקנות\" במחיר קבוע.","c":["P4","P5"]},{"he":"טיפ לזיכרון: <span class=en>call</span> = \"לקרוא\" למניה שתבוא אליך (לקנות אותה). <span class=en>put</span> = \"לשים\" אותה אצל מישהו אחר (למכור לו).","c":["P4","P5"]},{"he":"בכל אופציה יש שני צדדים, ולכן יש <b>ארבע</b> עמדות. מי שקנה נמצא ב<b>עמדת long</b> (<span class=en>long position</span>). מי שמכר (כתב) נמצא ב<b>עמדת short</b> (<span class=en>short position</span>). long = קונה = holder. short = מוכר = writer.<br><b>זהירות, מלכודת:</b> במסחר במניות, short פירושו הימור על ירידה. באופציות short פירושו רק <b>מכרתי (כתבתי) את החוזה</b>. short put הוא דווקא שורי: המוכר רוצה שהמניה לא תרד. כשרואים short, שואלים מיד: על call או על put?","c":["P12","P13","R36"]},{"he":"שתי שאלות קובעות הכל: 1) call או put? 2) קנית או מכרת?<table><tr><th></th><th>call (זכות לקנות)</th><th>put (זכות למכור)</th></tr><tr><th>קנית (long)</th><td>אתה מחליט אם לקנות</td><td>אתה מחליט אם למכור</td></tr><tr><th>מכרת (short)</th><td>אם הקונה מממש: <b>חייב למכור</b> לו</td><td>אם הקונה מממש: <b>חייב לקנות</b> ממנו</td></tr></table>כלל המראה: המוכר עושה תמיד את ההפך ממה שכתוב בזכות של הקונה. מכרת call (זכות לקנות ממך)? אתה חייב למכור. מכרת put (זכות למכור לך)? אתה חייב לקנות.","c":["P10","P11"]},{"he":"מה כל אחד מקווה שיקרה? מי שקונה call מרוויח כשהמניה <b>עולה</b>: הוא <span class=en>bullish</span> (שורי, אופטימי). מי שקונה put מרוויח כשהמניה <b>יורדת</b>: הוא <span class=en>bearish</span> (דובי, פסימי).","c":["R9","R19"]},{"he":"המוכרים הפוכים לקונים. מי שמוכר call מקווה שהמניה <b>לא תעלה</b> (ניטרלי עד דובי). מי שמוכר put מקווה שהמניה <b>לא תרד</b> (ניטרלי עד שורי). כלל פשוט: long call ו-short put רוצים מחיר גבוה. long put ו-short call רוצים מחיר נמוך.","c":["R29","R36"]}],"terms":[["Call","אופציית רכש (call)","הזכות לקנות את נכס הבסיס במחיר המימוש.",["P4"]],["Put","אופציית מכר (put)","הזכות למכור את נכס הבסיס במחיר המימוש.",["P5"]],["Long position","עמדת long (קונה)","מי שקנה את האופציה. הוא ה-holder.",["P12"]],["Short position","עמדת short (מוכר)","מי שכתב (מכר) את האופציה. הוא ה-writer, ויש לו חובה.",["P13"]],["Bullish / bearish","שורי / דובי","bullish = מצפה לעלייה. bearish = מצפה לירידה. קונה call שורי, קונה put דובי.",["R9","R19","R29","R36"]]],"checks":[{"en":"An investor expects a stock to fall and wants to profit with limited risk. She should:","he":"משקיעה מצפה שמניה תרד ורוצה להרוויח עם סיכון מוגבל. היא צריכה:","o":[["Buy a call","לקנות call"],["Buy a put","לקנות put"]],"a":1,"why":"קונה put מרוויח כשהמניה יורדת, והסיכון שלו מוגבל לפרמיה.","c":["R19","R23"]},{"en":"If the holder of a put exercises it, the writer must:","he":"אם הקונה של put מממש אותו, הכותב חייב:","o":[["Buy the shares at the strike price","לקנות את המניות במחיר המימוש"],["Sell the shares at the strike price","למכור את המניות במחיר המימוש"]],"a":0,"why":"ה-holder של put מממש זכות למכור. מישהו צריך לקנות ממנו: זה ה-writer.","c":["P11"]}]},{"id":"l3","en":"The terms of the contract","he":"התנאים של החוזה","story":[{"he":"כל אופציה רשומה בבורסה (<span class=en>listed</span>) מוגדרת בכמה פרטים קבועים. נכיר אותם דרך דוגמה אחת: \"<span class=en>1 GCR May 105 call at 3</span>\". GCR הוא הסימול של Golden Crust.","c":["R15"]},{"he":"<b>105</b> הוא <b>מחיר המימוש</b> (<span class=en>strike price</span>, נקרא גם <span class=en>exercise price</span>). זה המחיר הקבוע שבו ה-holder יכול לקנות (ב-call) או למכור (ב-put). אצל דנה זה היה 20,000 דולר לאולם.","c":["P16","P17"]},{"he":"<b>May</b> מסמן את חודש הפקיעה. בתוכו נקבע <b>מועד הפקיעה</b> (<span class=en>expiration date</span>). זה היום האחרון שבו אפשר לממש. אחרי התאריך הזה החוזה כבר לא קיים. אופציה שפוקעת <b>מחוץ לכסף</b> (נלמד בשיעור 4) <b>לא שווה כלום</b>, והקונה מפסיד את כל הפרמיה.","c":["P18","P19","P20","Q24"]},{"he":"<b>חוזה אחד</b> של אופציה על מניה מכסה בדרך כלל <b>100 מניות</b> (<span class=en>contract size</span>). לכן \"3 חוזים\" = 3 × 100 = 300 מניות.","c":["P24","P25","P26"]},{"he":"<b>3</b> הוא הפרמיה, והיא מצוטטת <b>למניה</b>. כדי לדעת כמה עולה חוזה אחד, מכפילים ב-100. שלב 1: 3 דולר למניה. שלב 2: 3 × 100 = <b>300</b> דולר לחוזה. עוד דוגמה מאתר ה-SEC: פרמיה של 2.20 = 220 דולר לחוזה.","c":["R3","R4","R15"]},{"he":"למה זה חשוב במבחן? כמעט בכל שאלת חישוב תשאלו את עצמכם: התשובה מבוקשת <b>למניה</b> (<span class=en>per share</span>) או <b>לחוזה</b> (<span class=en>per contract</span>)? אם לחוזה, לא לשכוח את ×100.","c":["R3"]}],"terms":[["Strike price (exercise price)","מחיר המימוש","המחיר הקבוע שבו ה-holder יכול לקנות (call) או למכור (put) את נכס הבסיס.",["P16","P17"]],["Expiration date","מועד הפקיעה","היום האחרון שאפשר לממש. אחריו החוזה לא קיים. אופציה שפוקעת מחוץ לכסף לא שווה כלום.",["P18","P19","Q24"]],["Contract size","גודל חוזה (בדרך כלל 100 מניות)","חוזה אופציה רגיל על מניה מכסה בדרך כלל 100 מניות.",["P24","P25"]],["Per share vs. per contract","למניה מול לחוזה","הפרמיה מצוטטת למניה. לחוזה אחד: כפול 100.",["R3","R4","Q22"]]],"checks":[{"en":"An investor buys 2 call contracts at a premium of 4. What is the total cost?","he":"משקיע קונה 2 חוזי call בפרמיה של 4. מה העלות הכוללת?","o":[["$8","8 דולר"],["$800","800 דולר"]],"a":1,"why":"4 דולר למניה × 100 מניות = 400 דולר לחוזה. 2 חוזים = 800 דולר.","c":["R3","Q22"]},{"en":"A call is out of the money at expiration. The holder:","he":"call נמצא מחוץ לכסף בפקיעה. הקונה:","o":[["Loses the entire premium","מפסיד את כל הפרמיה"],["Gets back half of the premium","מקבל בחזרה חצי מהפרמיה"]],"a":0,"why":"אופציה שפוקעת מחוץ לכסף לא שווה כלום, והפרמיה לא מוחזרת.","c":["Q24","P15"]}]},{"id":"l4","en":"In, at and out of the money","he":"בתוך הכסף, על הכסף, מחוץ לכסף","story":[{"he":"שאלה פשוטה: אם האופציה הייתה פוקעת <b>עכשיו</b>, האם הייתה שווה משהו? בואו נבדוק עם call. מחיר המימוש 50, והמניה נסחרת ב-55. הזכות לקנות ב-50 משהו שעולה 55 שווה 5 דולר. ה-call הזה <b>בתוך הכסף</b> (<span class=en>in the money</span>).","c":["Q1","Q51"]},{"he":"עכשיו call עם מחיר מימוש 60, כשהמניה ב-55. אף אחד לא ירצה לקנות ב-60 משהו שאפשר לקנות בשוק ב-55. ה-call הזה <b>מחוץ לכסף</b> (<span class=en>out of the money</span>).","c":["Q2","Q52"]},{"he":"ב-put הכל הפוך, כי put הוא זכות <b>למכור</b>. put עם מימוש 60 כשהמניה ב-55: הזכות למכור ב-60 משהו ששווה 55 שווה 5 דולר. ה-put <b>בתוך הכסף</b>. put עם מימוש 50 כשהמניה ב-55: מחוץ לכסף. כלל: call בתוך הכסף כשהמחיר <b>מעל</b> מחיר המימוש. put בתוך הכסף כשהמחיר <b>מתחת</b> למחיר המימוש.","c":["Q1","Q3","Q4"]},{"he":"ואם המחיר <b>שווה</b> בדיוק למחיר המימוש? האופציה <b>בכסף</b> (<span class=en>at the money</span>), וזה נכון גם ל-call וגם ל-put.","c":["Q5","Q6"]},{"he":"הסכום שבו האופציה בתוך הכסף נקרא <b>ערך פנימי</b> (<span class=en>intrinsic value</span>). ב-call של 50 כשהמניה ב-55: 55 − 50 = 5. רק לאופציה בתוך הכסף יש ערך פנימי. לאופציה מחוץ לכסף הערך הפנימי הוא <b>אפס</b>.<br>למה לא מינוס? call של 60 כשהמניה ב-55: 55 − 60 יוצא מינוס 5, אבל הערך הפנימי הוא 0. לקונה יש זכות, לא חובה. אם המימוש מפסיד, הוא פשוט לא מממש. במבחן: ערך פנימי שלילי הוא תמיד מלכודת.","c":["Q7","Q8","Q9","Q10","P3"]},{"he":"ה-call של 50 (כשהמניה ב-55) <b>נסחר בפרמיה של 7</b>, באנגלית <span class=en>trades at a premium of 7</span>. אבל הערך הפנימי רק 5. מי משלם עוד 2? מי שמקווה שעד הפקיעה המניה תעלה עוד. החלק הזה נקרא <b>ערך זמן</b> (<span class=en>time value</span>). שלב 1: ערך פנימי = 55 − 50 = 5. שלב 2: ערך זמן = 7 − 5 = 2. כלל: <b>פרמיה = ערך פנימי + ערך זמן</b>. וה-call של 60 שנסחר ב-1.50? ערך פנימי 0, אז כל ה-1.50 הוא ערך זמן.","c":["Q12","Q13","Q51","Q52"]},{"he":"ערך הזמן הוא מחיר של <b>סיכוי</b>. 1) זמן: פחות ימים עד הפקיעה = פחות סיכוי לתזוזה גדולה. לכן ערך הזמן <b>יורד</b> (<span class=en>decreases</span>) ככל שהפקיעה מתקרבת, ומהר יותר לקראת הסוף. 2) <b>תנודתיות</b> (<span class=en>volatility</span>): מניה שזזה הרבה יכולה להגיע רחוק. לכן על מניה תנודתית הפרמיה <b>גבוהה יותר</b> (<span class=en>higher</span>).","c":["Q15","Q16","Q18","Q19"]}],"terms":[["In the money","בתוך הכסף","call: מחיר המניה מעל מחיר המימוש. put: מחיר המניה מתחת למחיר המימוש.",["Q1","Q3"]],["Out of the money","מחוץ לכסף","call: מחיר המימוש מעל מחיר המניה. put: מחיר המימוש מתחת למחיר המניה.",["Q2","Q4"]],["At the money","בכסף (בדיוק על מחיר המימוש)","מחיר המניה שווה למחיר המימוש. אותו דבר ב-call וב-put.",["Q5","Q6"]],["Intrinsic value","ערך פנימי","הסכום שבו האופציה בתוך הכסף. אפס אם היא מחוץ לכסף. אף פעם לא שלילי.",["Q7","Q8","Q9","Q10"]],["Time value","ערך זמן","החלק של הפרמיה שמעל הערך הפנימי. יורד ככל שהפקיעה מתקרבת.",["Q12","Q13","Q15"]],["Volatility","תנודתיות","כמה המחיר של נכס הבסיס זז. תנודתיות גבוהה = פרמיה גבוהה יותר.",["Q18","Q19"]]],"checks":[{"en":"A stock trades at $42. Which option is in the money?","he":"מניה נסחרת ב-42 דולר. איזו אופציה בתוך הכסף?","o":[["A 45 call","call עם מחיר מימוש 45"],["A 45 put","put עם מחיר מימוש 45"]],"a":1,"why":"put בתוך הכסף כשהמחיר מתחת למחיר המימוש: 42 מתחת ל-45. call של 45 מחוץ לכסף.","c":["Q2","Q3"]},{"en":"A 30 call trades at a premium of 5 when the stock is at $32. What is its time value?","he":"call עם מחיר מימוש 30 נסחר בפרמיה של 5 כשהמניה ב-32. מה ערך הזמן?","o":[["3","3"],["2","2"]],"a":0,"why":"ערך פנימי = 32 − 30 = 2. ערך זמן = פרמיה פחות ערך פנימי = 5 − 2 = 3.","c":["Q7","Q12","Q13"]}]},{"id":"l5","en":"Exercise, assignment and the OCC","he":"מימוש, הקצאה ו-OCC","story":[{"he":"כשה-holder מחליט להשתמש בזכות שלו, הוא <b>מממש</b> (<span class=en>exercise</span>). הוא נותן הוראה לחברת הברוקרים שלו.","c":["P28","P29"]},{"he":"בצד השני, מישהו צריך לבצע את החוזה. ההודעה שמקבל המוכר נקראת <b>הקצאה</b> (<span class=en>assignment</span>). רק מי שיש לו עמדת short פתוחה יכול לקבל הקצאה.","c":["P30","P31"]},{"he":"מה זה <span class=en>OCC</span>? <span class=en>Options Clearing Corporation</span>, מסלקת האופציות. היא <b>מנפיקה</b> את האופציות הרשומות (listed), ו<b>מבטיחה</b> שכל צד יקבל את מה שמגיע לו. היא נעשית הקונה של כל מוכר והמוכר של כל קונה. לכן לא צריך לסמוך על האדם שמולך.","c":["P48","P49","P50"]},{"he":"יש אלפי מוכרים. מי מקבל את ההקצאה? שלב 1: ה-OCC (המסלקה מהשקופית הקודמת) בוחרת <b>באקראי</b> (<span class=en>random</span>) חברת ברוקרים שיש לה לקוחות בעמדת short. שלב 2: חברת הברוקרים בוחרת לקוח, באחת משתי דרכים שמותרות לפי FINRA: באקראי, או לפי הסדר: מי שנכנס ראשון מקבל ראשון (<span class=en>first-in first-out</span>).","c":["P32","P33","P34","P36"]},{"he":"מתי מותר לממש? באופציה <b>אמריקאית</b> (<span class=en>American-style</span>): <b>בכל זמן</b> עד הפקיעה. לכן מוכר של אופציה אמריקאית יכול לקבל הקצאה בכל יום. באופציה <b>אירופאית</b> (<span class=en>European-style</span>): <b>רק בפקיעה</b>. השם לא קשור למקום: זה רק סגנון המימוש.","c":["P37","P38","P39"]},{"he":"ועוד שני מונחים: <b>עסקת פתיחה</b> (<span class=en>opening transaction</span>) יוצרת עמדה או מגדילה אותה. <b>עסקת סגירה</b> (<span class=en>closing transaction</span>) מקטינה או מבטלת עמדה קיימת. למשל: מי שקנה call ומוכר אותו בחזרה בשוק סוגר את העמדה, בלי לממש.","c":["P64","P65"]}],"terms":[["Exercise","מימוש","ה-holder משתמש בזכות לקנות (call) או למכור (put) במחיר המימוש.",["P28","P29"]],["Assignment","הקצאה","ההודעה למוכר שהאופציה שלו מומשה, ולכן הוא חייב לבצע. רק מי שבעמדת short יכול לקבל אותה.",["P30","P31","P34","P36"]],["OCC (Options Clearing Corporation)","מסלקת האופציות","מנפיקה את האופציות הרשומות ומבטיחה אותן: הקונה של כל מוכר והמוכר של כל קונה.",["P48","P49","P50"]],["American-style","סגנון אמריקאי","אפשר לממש בכל זמן עד הפקיעה.",["P37","P39"]],["European-style","סגנון אירופאי","אפשר לממש רק בפקיעה.",["P38"]],["Opening / closing transaction","עסקת פתיחה / סגירה","פתיחה יוצרת או מגדילה עמדה. סגירה מקטינה או מבטלת עמדה קיימת.",["P64","P65"]]],"checks":[{"en":"Which option may be exercised at any time before it expires?","he":"איזו אופציה אפשר לממש בכל זמן לפני הפקיעה?","o":[["A European-style option","אופציה בסגנון אירופאי"],["An American-style option","אופציה בסגנון אמריקאי"]],"a":1,"why":"אמריקאית: בכל זמן. אירופאית: רק בפקיעה.","c":["P37","P38"]},{"en":"Who issues and guarantees listed options?","he":"מי מנפיק ומבטיח אופציות רשומות?","o":[["The Options Clearing Corporation","מסלקת האופציות (OCC)"],["The exchange where the option trades","הבורסה שבה האופציה נסחרת"]],"a":0,"why":"ה-OCC מנפיקה את האופציות הרשומות ומשמשת צד נגדי מרכזי שמבטיח אותן.","c":["P48","P49"]}]},{"id":"l6","en":"Equity and index options","he":"אופציות על מניות ועל מדדים","story":[{"he":"עד עכשיו דיברנו על אופציות על <b>מניה</b> (<span class=en>equity option</span>). כשממשים אותן, בדרך כלל המניות עצמן עוברות ידיים. למשל: מי שקיבל הקצאה על call <b>מוסר</b> את המניות במחיר המימוש ומקבל כסף. זה נקרא <b>מסירה פיזית</b> (<span class=en>physical delivery</span>).","c":["P45","P46"]},{"he":"יש גם אופציות על <b>מדד</b> (<span class=en>index option</span>). מדד מבוסס על המחירים של קבוצת ניירות ערך. אי אפשר \"למסור מדד\". לכן אופציות על מדד מסולקות <b>במזומן</b> (<span class=en>cash settlement</span>): במימוש עובר רק כסף בין מי שמימש לבין מי שקיבל הקצאה.","c":["P42","P43","P44"]},{"he":"כמה כסף? הגודל של אופציית מדד נקבע לפי <b>מכפיל</b> (<span class=en>multiplier</span>). דוגמה ממסמך הגילוי של ה-OCC: מימוש 80, והמדד ב-85. שלב 1: 85 − 80 = 5 נקודות בתוך הכסף. שלב 2: 5 × 100 = 500 דולר, שעוברים במזומן.","c":["P27","P44","P66"]},{"he":"סגנון המימוש: Cboe מתארת אופציות על מניות כאמריקאיות, ואת אופציות המדד שלה כאירופאיות. במבחן: אופציה על מניה בדרך כלל אמריקאית. על מדד: לבדוק מה כתוב בשאלה.","c":["P40","P41"]},{"he":"ומה קורה ביום הפקיעה אם שכחתם לממש? אופציה על מניה שנמצאת בתוך הכסף בפקיעה <b>ממומשת אוטומטית</b> בדרך כלל, אלא אם המחזיק נתן הוראה אחרת. ב-OCC זה חל על אופציות שבתוך הכסף בסנט אחד או יותר (<span class=en>exercise by exception</span>).","c":["Q49","Q50"]}],"terms":[["Equity option","אופציה על מניה","נכס הבסיס הוא מניה. חוזה רגיל מכסה 100 מניות, ובמימוש המניות עוברות ידיים.",["P24","P46"]],["Index option","אופציה על מדד","נכס הבסיס הוא מדד, שמבוסס על מחירים של קבוצת ניירות ערך. מסולקת במזומן.",["P42","P43"]],["Physical delivery","מסירה פיזית","במימוש עובר נכס הבסיס עצמו (המניות) במחיר המימוש.",["P45","P46"]],["Cash settlement","סילוק במזומן","במימוש עובר רק כסף בין מי שמימש לבין מי שקיבל הקצאה.",["P43","P44"]],["Automatic exercise","מימוש אוטומטי","אופציה על מניה שבתוך הכסף בסנט או יותר בפקיעה ממומשת בדרך כלל אוטומטית, אלא אם המחזיק הורה אחרת.",["Q49","Q50"]]],"checks":[{"en":"How is an index option settled when it is exercised?","he":"איך מסולקת אופציה על מדד כשהיא ממומשת?","o":[["In cash","במזומן"],["By delivery of the stocks in the index","במסירת המניות שבמדד"]],"a":0,"why":"אופציות על מדד מסולקות במזומן.","c":["P43","P44"]},{"en":"The writer of an equity call is assigned. The writer must:","he":"כותב של call על מניה קיבל הקצאה. הוא חייב:","o":[["Deliver the stock at the strike price","למסור את המניות במחיר המימוש"],["Pay the difference in cash","לשלם את ההפרש במזומן"]],"a":0,"why":"אופציה על מניה מסולקת בדרך כלל במסירה פיזית: מוסרים את המניות במחיר המימוש.","c":["P10","P46"]}]},{"id":"l7","en":"Buying options: long calls and long puts","he":"קנייה: long call ו-long put","story":[{"he":"רינה בטוחה ש-GCR תעלה. המניה ב-100. היא קונה <span class=en>1 GCR 105 call at 3</span>. העלות: 3 × 100 = 300 דולר. זה <span class=en>long call</span>, עמדה שורית.","c":["R9","R15"]},{"he":"<b>מה הכי הרבה שהיא יכולה להפסיד?</b> אם המניה לא עולה מעל 105 עד הפקיעה, האופציה פוקעת בלי ערך. רינה מפסידה את כל ה-300, ולא יותר. כלל: <b>ההפסד המקסימלי של קונה = הפרמיה ששילם</b> (<span class=en>maximum loss</span>).","c":["R6","R12","R16","Q27"]},{"he":"<b>נקודת האיזון</b> (<span class=en>breakeven</span>): המחיר בפקיעה שבו רינה יוצאת \"תיקו\". נבדוק, למניה:<br>מניה ב-105: לא כדאי לממש. 0, פחות 3 ששילמה = מינוס 3.<br>מניה ב-106: מרוויחה 1, פחות 3 = מינוס 2.<br>מניה ב-108: מרוויחה 3, פחות 3 = <b>0</b>.<br>מניה ב-110: פלוס 2.<br>למה? כל דולר מעל 105 מחזיר לה דולר מה-3 ששילמה. כלל ל-call: <b>מחיר מימוש + פרמיה</b>: 105 + 3 = 108.","c":["R13","R17"]},{"he":"ואם בפקיעה המניה ב-115? הרווח למניה = 115 − 108 = 7. לחוזה: 7 × 100 = 700 דולר. וכמה הכי הרבה היא יכולה להרוויח? מחיר מניה יכול לעלות בלי גבול, ולכן <b>הרווח המקסימלי של long call לא מוגבל</b> (תיאורטית).","c":["R11","R18"]},{"he":"יוסי חושב ההפך: מניה אחרת תרד. הוא קונה <span class=en>1 put</span> עם מחיר מימוש 45, בפרמיה של 5. זה <span class=en>long put</span>, עמדה דובית. נקודת האיזון: הוא צריך שהמניה תרד 5 מתחת ל-45. שלב 1: 45. שלב 2: − 5. שלב 3: <b>40</b>. כלל ל-put: <b>מחיר מימוש − פרמיה</b>.","c":["R19","R24","R26","R27"]},{"he":"הרווח המקסימלי של יוסי: המקרה הכי טוב הוא שהמניה יורדת לאפס. אז הוא מוכר ב-45 משהו ששווה 0, אבל שילם 5. שלב 1: 45 − 5 = 40 למניה. שלב 2: 40 × 100 = <b>4,000</b> דולר לחוזה. ההפסד המקסימלי שלו: הפרמיה, 500 דולר.","c":["R21","R22","R23","R28"]},{"he":"<b>הטבלה של הקונים</b>, לזכור בעל פה:<table><tr><th></th><th>long call</th><th>long put</th></tr><tr><th>ציפייה</th><td>עלייה (bullish)</td><td>ירידה (bearish)</td></tr><tr><th>נקודת איזון</th><td>מימוש + פרמיה</td><td>מימוש − פרמיה</td></tr><tr><th>רווח מקסימלי</th><td>לא מוגבל</td><td>(מימוש − פרמיה) × 100</td></tr><tr><th>הפסד מקסימלי</th><td>הפרמיה</td><td>הפרמיה</td></tr></table>בשיעור הבא נראה שהמוכרים הם תמונת מראה של הטבלה הזאת.","c":["R9","R11","R12","R13","R19","R22","R23","R24"]},{"he":"למה אנשים קונים אופציות? בגלל <b>מינוף</b> (<span class=en>leverage</span>): עם פרמיה קטנה מקבלים חשיפה לתנועה של 100 מניות. תנועה קטנה לטובתך יכולה לתת אחוז רווח גדול. אבל המינוף מגדיל גם את אחוז ההפסד.","c":["Q28","Q29","Q30"]}],"terms":[["Long call","קניית call","עמדה שורית. רווח מקסימלי: לא מוגבל. הפסד מקסימלי: הפרמיה. איזון: מחיר מימוש + פרמיה.",["R9","R11","R12","R13"]],["Long put","קניית put","עמדה דובית. רווח מקסימלי: מחיר מימוש − פרמיה. הפסד מקסימלי: הפרמיה. איזון: מחיר מימוש − פרמיה.",["R19","R22","R23","R24"]],["Breakeven","נקודת איזון","מחיר המניה בפקיעה שבו אין רווח ואין הפסד. call: מימוש + פרמיה. put: מימוש − פרמיה.",["R13","R24"]],["Maximum loss (buyer)","הפסד מקסימלי של קונה","קונה של אופציה יכול להפסיד לכל היותר את הפרמיה ששילם.",["R6","Q23","Q27"]],["Leverage","מינוף","פרמיה קטנה נותנת חשיפה גדולה. מגדיל את אחוז הרווח וגם את אחוז ההפסד.",["Q28","Q29","Q30"]]],"checks":[{"en":"An investor buys a 72 call at 3. What is the breakeven at expiration?","he":"משקיע קונה call עם מחיר מימוש 72 בפרמיה של 3. מה נקודת האיזון בפקיעה?","o":[["$69","69 דולר"],["$75","75 דולר"]],"a":1,"why":"call: מחיר מימוש + פרמיה = 72 + 3 = 75.","c":["R13"]},{"en":"What is the maximum loss for the buyer of a put?","he":"מה ההפסד המקסימלי של קונה put?","o":[["The premium paid","הפרמיה ששילם"],["The strike price minus the premium","מחיר המימוש פחות הפרמיה"]],"a":0,"why":"קונה (call או put) מפסיד לכל היותר את הפרמיה. מחיר מימוש פחות פרמיה הוא הרווח המקסימלי של קונה put.","c":["R6","R22","R23"]}]},{"id":"l8","en":"Selling options: short calls and short puts","he":"מכירה: short call ו-short put","story":[{"he":"עכשיו הצד השני. המוכר (writer) <b>מקבל</b> את הפרמיה מראש. כשהוא מוכר אופציה בלי להחזיק מניות, זה הרווח המקסימלי שלו: <b>הרווח המקסימלי של מוכר לא מכוסה = הפרמיה שקיבל</b>. הוא מקווה שהאופציה תפקע בלי ערך, ושהפרמיה תישאר אצלו.","c":["R8","R30","R37"]},{"he":"אבי מוכר <span class=en>1 GCR 60 call</span> בפרמיה של 2, <b>בלי</b> להחזיק מניות GCR. זה <b>call לא מכוסה</b> (<span class=en>uncovered call</span>, או <span class=en>naked call</span>). הרווח המקסימלי: 2 × 100 = 200 דולר. נקודת האיזון: 60 + 2 = 62, בדיוק כמו אצל הקונה.","c":["Q38","R33","R34"]},{"he":"GCR קופצת ל-70, וה-holder מממש. אבי חייב למסור 100 מניות ב-60, ואין לו. שלב 1: קונה אותן בשוק ב-70. שלב 2: מוסר ב-60. הפסד: 70 − 60 = 10 למניה. שלב 3: הפרמיה שקיבל מקטינה את ההפסד: 10 − 2 = 8. שלב 4: 8 × 100 = 800 דולר. (קיצור: 70 − 62, כי 62 היא נקודת האיזון.)<br>ב-80 ההפסד 1,800. ב-100 הוא 3,800. אין גבול למחיר מניה, ולכן <b>אין גבול להפסד של מוכר call לא מכוסה</b>. זה הסיכון הכי גדול בפרק.","c":["R31","R32","R35","Q39"]},{"he":"דנה מוכרת <span class=en>put</span> עם מחיר מימוש 45, בפרמיה של 5. היא מקבלת 500 דולר. זה <span class=en>short put</span>: היא מקווה שהמניה לא תרד (ניטרלית עד שורית). נקודת האיזון: 45 − 5 = 40.","c":["R36","R39","R40"]},{"he":"מה המקרה הכי גרוע לדנה? המניה יורדת לאפס, והיא חייבת לקנות אותה ב-45. אבל היא קיבלה 5. שלב 1: 45 − 5 = 40 למניה. שלב 2: 40 × 100 = <b>4,000</b> דולר. כלל: <b>ההפסד המקסימלי של short put = מחיר מימוש − פרמיה</b>. גדול, אבל מוגבל.","c":["R38","R41","Q42"]},{"he":"מה ההבדל בין <b>מכוסה</b> (<span class=en>covered</span>) ל<b>לא מכוסה</b> (<span class=en>uncovered</span>)? call מכוסה = מוכרים call ו<b>מחזיקים</b> את המניות. אם יבקשו, פשוט מוסרים אותן. call לא מכוסה = מוכרים בלי להחזיק מניות. מי שכותב אופציות לא מכוסות חייב להפקיד <b>בטוחה</b> (<span class=en>margin</span>), ואם השוק זז נגדו, ייתכן שיידרש להוסיף עוד.","c":["Q35","Q38","Q46","Q47"]},{"he":"<b>הטבלה המלאה, שבונים מחדש במבחן:</b><table><tr><th></th><th>long call</th><th>short call</th><th>long put</th><th>short put</th></tr><tr><th>ציפייה</th><td>עלייה</td><td>לא תעלה</td><td>ירידה</td><td>לא תרד</td></tr><tr><th>איזון</th><td>K&nbsp;+&nbsp;P</td><td>K&nbsp;+&nbsp;P</td><td>K&nbsp;−&nbsp;P</td><td>K&nbsp;−&nbsp;P</td></tr><tr><th>רווח מקס׳</th><td>לא מוגבל</td><td>P</td><td>K&nbsp;−&nbsp;P</td><td>P</td></tr><tr><th>הפסד מקס׳</th><td>P</td><td>לא מוגבל</td><td>P</td><td>K&nbsp;−&nbsp;P</td></tr></table>K = מחיר המימוש, P = הפרמיה (למניה; לחוזה כפול 100).<br>איך לא לשכוח: זוכרים רק את שני הקונים. המוכר הוא מראה: הרווח המקסימלי שלו = ההפסד המקסימלי של הקונה, וההפסד המקסימלי שלו = הרווח המקסימלי של הקונה. נקודת האיזון זהה לשניהם.","c":["R11","R12","R13","R22","R23","R24","R30","R31","R33","R37","R38","R39"]}],"terms":[["Short call","מכירת call","ניטרלי עד דובי. רווח מקסימלי: הפרמיה. איזון: מימוש + פרמיה. אם לא מכוסה: הפסד לא מוגבל.",["R29","R30","R31","R33"]],["Short put","מכירת put","ניטרלי עד שורי. רווח מקסימלי: הפרמיה. הפסד מקסימלי: מימוש − פרמיה. איזון: מימוש − פרמיה.",["R36","R37","R38","R39"]],["Uncovered (naked) call","call לא מכוסה","מכירת call בלי להחזיק את המניות. ההפסד האפשרי לא מוגבל.",["Q38","Q39","R32"]],["Covered vs. uncovered","מכוסה מול לא מכוסה","call מכוסה: המוכר מחזיק את המניות שאולי יצטרך למסור. call לא מכוסה: לא מחזיק אותן.",["Q35","Q38"]],["Margin","בטוחה (מרג'ין) לכותבים לא מכוסים","מי שכותב אופציות לא מכוסות חייב להפקיד בטוחה, ואולי להוסיף אם השוק זז נגדו.",["Q46","Q47"]]],"checks":[{"en":"Which position has unlimited potential loss?","he":"לאיזו עמדה יש הפסד אפשרי לא מוגבל?","o":[["Writing an uncovered call","כתיבת call לא מכוסה"],["Writing an uncovered put","כתיבת put לא מכוסה"]],"a":0,"why":"מחיר מניה יכול לעלות בלי גבול. ב-put ההפסד מוגבל, כי מחיר מניה לא יורד מתחת לאפס.","c":["Q39","R38"]},{"en":"An investor writes a 40 put at 2. What is the maximum gain?","he":"משקיע כותב put עם מחיר מימוש 40 בפרמיה של 2. מה הרווח המקסימלי?","o":[["$3,800","3,800 דולר"],["$200","200 דולר"]],"a":1,"why":"רווח מקסימלי של מוכר = הפרמיה: 2 × 100 = 200. 3,800 הוא ההפסד המקסימלי: (40 − 2) × 100.","c":["R37","R38"]}]},{"id":"l9","en":"Hedging and speculation: covered calls and protective puts","he":"גידור וספקולציה: covered call ו-protective put","story":[{"he":"יש שתי סיבות עיקריות להשתמש באופציות. <b>ספקולציה</b> (<span class=en>speculation</span>): להמר על כיוון המחיר. שורי קונה call, דובי קונה put. <b>גידור</b> (<span class=en>hedging</span>): להקטין סיכון על משהו שכבר יש לך. כמו ביטוח.","c":["Q33","Q34","Q31"]},{"he":"רינה מחזיקה 100 מניות GCR שקנתה ב-62. היא עדיין אופטימית, אבל חוששת מנפילה חדה. היא קונה <span class=en>1 GCR 60 put</span> בפרמיה של 3. זה <b>put מגן</b> (<span class=en>protective put</span>): ביטוח על המניות. אם היא קונה את ה-put באותו זמן שהיא קונה את המניות, קוראים לזה <span class=en>married put</span>.","c":["R50","R51","R52","R56"]},{"he":"מה הכי הרבה שהיא יכולה להפסיד? גם אם המניה קורסת, היא יכולה למכור ב-60. שלב 1: קנתה ב-62, מוכרת ב-60: הפסד 2. שלב 2: ועוד הפרמיה, 3. שלב 3: 2 + 3 = 5 למניה, כלומר <b>500</b> דולר. כלל: <b>מחיר קנייה − מחיר מימוש + פרמיה</b>. הרווח המקסימלי: לא מוגבל, כי היא עדיין מחזיקה את המניות.","c":["R53","R54","R56"]},{"he":"נקודת האיזון של רינה: המניה צריכה לעלות מספיק כדי לכסות גם את הביטוח. 62 + 3 = <b>65</b>. כלל: <b>מחיר קנייה + פרמיה</b>.","c":["R55","R56"]},{"he":"יוסי מחזיק 100 מניות GCR שקנה ב-58. הוא חושב שהמניה תזוז מעט. הוא <b>מוכר</b> <span class=en>1 GCR 60 call</span> בפרמיה של 2. זה <b>call מכוסה</b> (<span class=en>covered call</span>): הוא מקבל הכנסה, ואם יממשו, יש לו מניות למסור. העמדה ניטרלית עד שורית מעט.","c":["R43","R44","Q35","R49"]},{"he":"הרווח המקסימלי של יוסי מוגבל: אם המניה עולה מעל 60, יממשו לו והוא ימכור ב-60. שלב 1: 60 − 58 = 2 רווח על המניה. שלב 2: + 2 פרמיה. שלב 3: 4 למניה = <b>400</b> דולר. כלל: <b>מחיר מימוש − מחיר קנייה + פרמיה</b>. כלומר הוא ויתר על הרווח שמעל 60.","c":["R46","R49","Q36"]},{"he":"ונקודת האיזון שלו: הפרמיה הורידה לו את העלות. 58 − 2 = <b>56</b>. כלל: <b>מחיר קנייה − פרמיה</b>. וההפסד המקסימלי? אם המניה יורדת לאפס: 56 × 100 = 5,600 דולר. ה-call לא מגן עליו מירידה, רק מקטין אותה בגובה הפרמיה.","c":["R47","R48","R49","Q37"]}],"terms":[["Hedging","גידור","שימוש באופציות כדי להקטין סיכון על עמדה שכבר מחזיקים. למשל: לקנות put על מניות שבידיך.",["Q33","Q31"]],["Speculation","ספקולציה","שימוש באופציות כדי להמר על כיוון המחיר: שורי קונה call, דובי קונה put.",["Q34"]],["Protective put","put מגן","קניית put על מניות שמחזיקים. הפסד מקסימלי: מחיר קנייה − מימוש + פרמיה. איזון: מחיר קנייה + פרמיה.",["R50","R52","R54","R55"]],["Married put","married put","put שנקנה באותו זמן שקונים את המניות.",["R51"]],["Covered call","call מכוסה","מחזיקים 100 מניות ומוכרים call אחד. רווח מקסימלי: מימוש − מחיר קנייה + פרמיה. איזון: מחיר קנייה − פרמיה.",["R43","R44","R46","R48"]]],"checks":[{"en":"An investor owns 100 shares and wants protection against a sharp decline. She should:","he":"משקיעה מחזיקה 100 מניות ורוצה הגנה מפני ירידה חדה. היא צריכה:","o":[["Sell a call on the stock","למכור call על המניה"],["Buy a put on the stock","לקנות put על המניה"]],"a":1,"why":"put מגן נותן זכות למכור במחיר המימוש גם אם המניה קורסת. מכירת call רק מקטינה את ההפסד בגובה הפרמיה, ולא עוצרת ירידה.","c":["R50","Q36"]},{"en":"An investor buys 100 shares at $40 and sells a 45 call at 2. What is the breakeven?","he":"משקיע קונה 100 מניות ב-40 דולר ומוכר call עם מחיר מימוש 45 בפרמיה של 2. מה נקודת האיזון?","o":[["$42","42 דולר"],["$38","38 דולר"]],"a":1,"why":"call מכוסה: מחיר קנייה − פרמיה = 40 − 2 = 38.","c":["R48"]}]},{"id":"l10","en":"Rules: the ODD and account approval","he":"כללים: ODD ואישור חשבון","story":[{"he":"לאופציות יש סיכונים מיוחדים: למשל, קונה יכול להפסיד את כל הפרמיה בזמן קצר, ומוכר call לא מכוסה חשוף להפסד לא מוגבל. לכן יש כללים מיוחדים לפני שלקוח מתחיל לסחור בהן.","c":["Q25","Q39"]},{"he":"<b>מסמך הגילוי</b>: לפני שקונים או מוכרים אופציה, צריך לקרוא את המסמך <span class=en>Characteristics and Risks of Standardized Options</span>. קוראים לו <span class=en>ODD</span> (<span class=en>Options Disclosure Document</span>). הברוקר חייב למסור אותו ללקוח.","c":["P55","P56"]},{"he":"מתי? לפי כלל 2360 של FINRA: <b>לפני אישור החשבון למסחר באופציות, או באותו זמן</b> (<span class=en>at or before</span>).","c":["P57"]},{"he":"<b>אישור חשבון</b>: הברוקר לא רשאי לקבל הוראה באופציות לפני שהחשבון אושר למסחר באופציות. האישור ניתן בכתב, על ידי מנהל סניף או מנהל מורשה לאופציות (<span class=en>Registered Options Principal</span>, בקיצור <span class=en>ROP</span>), או על ידי בעל רישיון מנהל מתאים אחר.","c":["P58","P59"]},{"he":"לפני האישור, הברוקר צריך לאסוף מידע על הלקוח: ידע, ניסיון, גיל, מצב כלכלי ויעדים. הוא יכול לאשר רק סוגים מסוימים של עסקאות: למשל רק קניית אופציות, בלי כתיבה לא מכוסה. בנוסף, הלקוח חותם על הסכם בכתב לפעול לפי הכללים של FINRA ושל ה-OCC.","c":["P61","P62","P63"]},{"he":"ואיזה אופציות מכסים הכללים האלה? אופציה <b>סטנדרטית</b> (<span class=en>standardized</span>) היא אופציה שמנפיקה מסלקה רשומה, כמו ה-OCC. אופציות כאלה נסחרות בבורסות (<span class=en>listed options</span>). אופציה <b>לא סטנדרטית</b> (<span class=en>conventional</span>) היא אופציה שלא הונפקה על ידי מסלקה כזאת.","c":["P48","P52","P53","P54"]}],"terms":[["ODD (Options Disclosure Document)","מסמך הגילוי לאופציות","Characteristics and Risks of Standardized Options. חייבים למסור אותו ללקוח לפני אישור החשבון לאופציות או באותו זמן.",["P55","P56","P57"]],["Options account approval","אישור חשבון לאופציות","אסור לקבל הוראה באופציות לפני שהחשבון אושר בכתב. אפשר לאשר רק סוגים מסוימים של עסקאות.",["P58","P59","P62"]],["Registered Options Principal (ROP)","מנהל מורשה לאופציות","אחד מבעלי התפקידים שיכולים לאשר חשבון למסחר באופציות.",["P59","P60"]],["Standardized (listed) option","אופציה סטנדרטית (רשומה)","אופציה שמנפיקה מסלקה רשומה כמו ה-OCC. נסחרת בבורסות.",["P48","P52","P53"]],["Conventional option","אופציה לא סטנדרטית","אופציה שלא הונפקה על ידי מסלקה רשומה.",["P54"]]],"checks":[{"en":"When must a firm deliver the ODD to a new options customer?","he":"מתי הברוקר חייב למסור את ה-ODD ללקוח אופציות חדש?","o":[["At or before approval of the account for options","לפני אישור החשבון לאופציות או באותו זמן"],["Within 15 days after the first trade","תוך 15 יום אחרי העסקה הראשונה"]],"a":0,"why":"כלל 2360 של FINRA: at or before the time the account is approved.","c":["P57"]},{"en":"A firm may accept a customer's first options order:","he":"הברוקר רשאי לקבל את הוראת האופציות הראשונה של לקוח:","o":[["Before approval, if the ODD was already delivered","לפני האישור, אם ה-ODD כבר נמסר"],["Only after the account is approved for options","רק אחרי שהחשבון אושר לאופציות"]],"a":1,"why":"אסור לקבל הוראה באופציות לפני שהחשבון אושר למסחר באופציות. מסירת ה-ODD לבדה לא מספיקה.","c":["P58","P57"]}]}],"exam":[{"en":"Which statement BEST describes the buyer of a call option?","he":"איזה משפט מתאר הכי טוב את הקונה של אופציית call?","o":[["Has the obligation to buy the stock at the strike price","יש לו חובה לקנות את המניה במחיר המימוש"],["Has the right to buy the stock at the strike price","יש לו זכות לקנות את המניה במחיר המימוש"],["Has the obligation to sell the stock at the strike price","יש לו חובה למכור את המניה במחיר המימוש"],["Has the right to sell the stock at the strike price","יש לו זכות למכור את המניה במחיר המימוש"]],"a":1,"why":"call = זכות לקנות. לקונה יש זכות, לא חובה.","c":["P3","P4"]},{"en":"An investor writes a call. If the investor is assigned, the investor must:","he":"משקיע כותב call. אם המשקיע מקבל הקצאה, הוא חייב:","o":[["Sell the stock at the strike price","למכור את המניה במחיר המימוש"],["Buy the stock at the strike price","לקנות את המניה במחיר המימוש"],["Buy the stock at the market price","לקנות את המניה במחיר השוק"],["Sell the stock at the market price","למכור את המניה במחיר השוק"]],"a":0,"why":"ה-holder מימש זכות לקנות, ולכן הכותב שקיבל הקצאה חייב למכור לו מניות במחיר המימוש.","c":["P10","P15"]},{"en":"Which of the following is TRUE about an option premium?","he":"מה נכון לגבי פרמיה של אופציה?","o":[["It is paid by the seller and refunded if the option is exercised","המוכר משלם אותה, והיא מוחזרת אם האופציה ממומשת"],["It is paid by the buyer to the seller and is not refunded","הקונה משלם אותה למוכר, והיא לא מוחזרת"],["It is paid by the buyer and refunded if the option is not exercised","הקונה משלם אותה, והיא מוחזרת אם האופציה לא ממומשת"],["It is paid by the seller to the buyer and is not refunded","המוכר משלם אותה לקונה, והיא לא מוחזרת"]],"a":1,"why":"הפרמיה משולמת מראש מהקונה למוכר, ולא מוחזרת.","c":["P14","P15"]},{"en":"An investor buys 3 put contracts on a stock at a premium of 1.75. What is the total premium paid?","he":"משקיע קונה 3 חוזי put על מניה בפרמיה של 1.75. כמה פרמיה שילם בסך הכל?","o":[["$5.25","5.25 דולר"],["$525","525 דולר"],["$175","175 דולר"],["$825","825 דולר"]],"a":1,"why":"1.75 למניה × 100 = 175 לחוזה. 3 חוזים × 175 = 525.","c":["R3","P24"]},{"en":"XYZ stock trades at $61. Which option is in the money?","he":"מניית XYZ נסחרת ב-61 דולר. איזו אופציה בתוך הכסף?","o":[["XYZ 55 put","put של XYZ עם מחיר מימוש 55"],["XYZ 60 call","call של XYZ עם מחיר מימוש 60"],["XYZ 65 call","call של XYZ עם מחיר מימוש 65"],["XYZ 60 put","put של XYZ עם מחיר מימוש 60"]],"a":1,"why":"call בתוך הכסף כשהמחיר מעל המימוש: 61 מעל 60. ה-call של 65 מחוץ לכסף. ה-puts של 55 ו-60 בתוך הכסף רק אם המחיר מתחת להם, והוא לא.","c":["Q1","Q4","Q5"]},{"en":"ABC stock trades at $38. What is the intrinsic value of an ABC 40 put?","he":"מניית ABC נסחרת ב-38 דולר. מה הערך הפנימי של put על ABC עם מחיר מימוש 40?","o":[["$0","0 דולר"],["$40","40 דולר"],["$2","2 דולר"],["$38","38 דולר"]],"a":2,"why":"put בתוך הכסף כשהמחיר מתחת למימוש. ערך פנימי = 40 − 38 = 2.","c":["Q3","Q7"]},{"en":"DEF stock trades at $47. What is the intrinsic value of a DEF 50 call?","he":"מניית DEF נסחרת ב-47 דולר. מה הערך הפנימי של call על DEF עם מחיר מימוש 50?","o":[["$50","50 דולר"],["$0","0 דולר"],["$47","47 דולר"],["$3","3 דולר"]],"a":1,"why":"ה-call מחוץ לכסף (47 מתחת ל-50), ולכן הערך הפנימי אפס. ערך פנימי אף פעם לא שלילי.","c":["Q2","Q9","Q10"]},{"en":"A 75 call trades at a premium of 6 when the stock is at $79. How much of the premium is time value?","he":"call עם מחיר מימוש 75 נסחר בפרמיה של 6 כשהמניה ב-79. כמה מהפרמיה הוא ערך זמן?","o":[["4","4"],["2","2"],["6","6"],["10","10"]],"a":1,"why":"ערך פנימי = 79 − 75 = 4. ערך זמן = 6 − 4 = 2.","c":["Q7","Q12","Q13"]},{"en":"All else being equal, as an option gets closer to expiration, its time value generally:","he":"אם כל השאר לא משתנה, ככל שאופציה מתקרבת לפקיעה, ערך הזמן שלה בדרך כלל:","o":[["Stays the same","נשאר זהה"],["Doubles","מוכפל"],["Increases","עולה"],["Decreases","יורד"]],"a":3,"why":"ערך הזמן יורד ככל שהפקיעה מתקרבת, ב-call וב-put.","c":["Q15"]},{"en":"Which change would MOST likely increase an option's premium?","he":"איזה שינוי הכי סביר שיעלה את הפרמיה של אופציה?","o":[["Less time until expiration","פחות זמן עד הפקיעה"],["A lower stock price for a call","מחיר מניה נמוך יותר עבור call"],["Higher volatility of the underlying stock","תנודתיות גבוהה יותר של המניה"],["A higher strike price for a call","מחיר מימוש גבוה יותר עבור call"]],"a":2,"why":"על נכס תנודתי יותר הפרמיות גבוהות יותר. פחות זמן מוריד את ערך הזמן. ב-call, מחיר מניה נמוך יותר או מחיר מימוש גבוה יותר מורידים את הערך הפנימי.","c":["Q13","Q15","Q19"]},{"en":"An investor buys an 85 call at 4.50. What is the breakeven point at expiration?","he":"משקיע קונה call עם מחיר מימוש 85 בפרמיה של 4.50. מה נקודת האיזון בפקיעה?","o":[["$80.50","80.50 דולר"],["$76","76 דולר"],["$89.50","89.50 דולר"],["$85","85 דולר"]],"a":2,"why":"long call: מחיר מימוש + פרמיה = 85 + 4.50 = 89.50.","c":["R13"]},{"en":"An investor buys a 45 put at 2.50. What is the breakeven point at expiration?","he":"משקיע קונה put עם מחיר מימוש 45 בפרמיה של 2.50. מה נקודת האיזון בפקיעה?","o":[["$50","50 דולר"],["$47.50","47.50 דולר"],["$45","45 דולר"],["$42.50","42.50 דולר"]],"a":3,"why":"long put: מחיר מימוש − פרמיה = 45 − 2.50 = 42.50.","c":["R24"]},{"en":"An investor buys one 45 call at 3.50. What is the maximum loss?","he":"משקיע קונה call אחד עם מחיר מימוש 45 בפרמיה של 3.50. מה ההפסד המקסימלי?","o":[["$4,150","4,150 דולר"],["$35","35 דולר"],["$350","350 דולר"],["Unlimited","לא מוגבל"]],"a":2,"why":"קונה מפסיד לכל היותר את הפרמיה: 3.50 × 100 = 350.","c":["R6","R12"]},{"en":"An investor buys one 35 put at 4.50. What is the maximum gain?","he":"משקיע קונה put אחד עם מחיר מימוש 35 בפרמיה של 4.50. מה הרווח המקסימלי?","o":[["$450","450 דולר"],["$3,050","3,050 דולר"],["$3,950","3,950 דולר"],["Unlimited","לא מוגבל"]],"a":1,"why":"long put: הכי טוב שהמניה יורדת לאפס. (35 − 4.50) × 100 = 3,050.","c":["R21","R22"]},{"en":"An investor writes one uncovered 85 put at 7. What is the maximum loss?","he":"משקיע כותב put לא מכוסה אחד עם מחיר מימוש 85 בפרמיה של 7. מה ההפסד המקסימלי?","o":[["$7,800","7,800 דולר"],["$700","700 דולר"],["Unlimited","לא מוגבל"],["$9,200","9,200 דולר"]],"a":0,"why":"short put: המקרה הגרוע הוא שהמניה יורדת לאפס. (85 − 7) × 100 = 7,800.","c":["R38","Q42"]},{"en":"An investor writes one uncovered 45 call at 2.50. What is the maximum gain?","he":"משקיע כותב call לא מכוסה אחד עם מחיר מימוש 45 בפרמיה של 2.50. מה הרווח המקסימלי?","o":[["$250","250 דולר"],["Unlimited","לא מוגבל"],["$25","25 דולר"],["$4,750","4,750 דולר"]],"a":0,"why":"מוכר לא מכוסה מרוויח לכל היותר את הפרמיה: 2.50 × 100 = 250. Unlimited הוא ההפסד שלו, לא הרווח.","c":["R8","R37"]},{"en":"Which strategy exposes the investor to unlimited potential loss?","he":"איזו אסטרטגיה חושפת את המשקיע להפסד אפשרי לא מוגבל?","o":[["Buying a put on the stock","קניית put על המניה"],["Writing a put without the stock","כתיבת put בלי המניה"],["Writing a call without the stock","כתיבת call בלי המניה"],["Buying a call on margin","קניית call במרג'ין"]],"a":2,"why":"מחיר מניה יכול לעלות בלי גבול, ומוכר call לא מכוסה יצטרך לקנות אותה בכל מחיר. לקונה call יש רווח לא מוגבל, לא הפסד.","c":["Q39","R31"]},{"en":"An investor who writes an uncovered call is MOST likely:","he":"משקיע שכותב call לא מכוסה הוא ככל הנראה:","o":[["Neutral to bearish","ניטרלי עד דובי"],["Strongly bearish","דובי מאוד"],["Neutral to bullish","ניטרלי עד שורי"],["Strongly bullish","שורי מאוד"]],"a":0,"why":"מוכר call רוצה שהמניה לא תעלה, כדי שהאופציה תפקע בלי ערך.","c":["R29"]},{"en":"An investor writes an uncovered put. Her outlook is MOST likely:","he":"משקיעה כותבת put לא מכוסה. ההשקפה שלה ככל הנראה:","o":[["Neutral to bullish","ניטרלית עד שורית"],["Strongly bearish","דובית מאוד"],["Strongly bullish","שורית מאוד"],["Neutral to bearish","ניטרלית עד דובית"]],"a":0,"why":"מוכרת put רוצה שהמניה לא תרד מתחת למחיר המימוש.","c":["R36"]},{"en":"An investor owns 100 shares of DEF bought at $50 and sells one DEF 55 call at 3. What is the maximum gain?","he":"משקיע מחזיק 100 מניות DEF שקנה ב-50 דולר, ומוכר call אחד של DEF עם מחיר מימוש 55 בפרמיה של 3. מה הרווח המקסימלי?","o":[["$800","800 דולר"],["$300","300 דולר"],["$4,700","4,700 דולר"],["$5,800","5,800 דולר"]],"a":0,"why":"call מכוסה: (מימוש − מחיר קנייה + פרמיה) × 100 = (55 − 50 + 3) × 100 = 800.","c":["R46"]},{"en":"An investor buys 100 shares of GHI at $70 and buys one GHI 65 put at 2. What is the maximum loss?","he":"משקיע קונה 100 מניות GHI ב-70 דולר, וקונה put אחד של GHI עם מחיר מימוש 65 בפרמיה של 2. מה ההפסד המקסימלי?","o":[["Unlimited","לא מוגבל"],["$6,300","6,300 דולר"],["$200","200 דולר"],["$700","700 דולר"]],"a":3,"why":"put מגן: (מחיר קנייה − מימוש + פרמיה) × 100 = (70 − 65 + 2) × 100 = 700.","c":["R54"]},{"en":"An investor buys 100 shares of JKL at $44 and buys one JKL 40 put at 1.50. What is the breakeven?","he":"משקיע קונה 100 מניות JKL ב-44 דולר, וקונה put אחד של JKL עם מחיר מימוש 40 בפרמיה של 1.50. מה נקודת האיזון?","o":[["$42.50","42.50 דולר"],["$41.50","41.50 דולר"],["$45.50","45.50 דולר"],["$38.50","38.50 דולר"]],"a":2,"why":"put מגן: מחיר קנייה + פרמיה = 44 + 1.50 = 45.50.","c":["R55"]},{"en":"An investor who owns stock buys puts on that stock. This is an example of:","he":"משקיע שמחזיק מניה קונה put על אותה מניה. זו דוגמה ל:","o":[["Leverage on the stock","מינוף על המניה"],["Speculation on direction","ספקולציה על הכיוון"],["Income generation","יצירת הכנסה"],["Hedging the position","גידור העמדה"]],"a":3,"why":"קניית put על מניה שמחזיקים מקטינה את הסיכון של העמדה: גידור.","c":["Q33","R50"]},{"en":"An investor with no position in a stock buys calls on it. This is MOST likely:","he":"משקיעה בלי שום עמדה במניה קונה עליה call. זו ככל הנראה:","o":[["A protective put","put מגן"],["Speculation","ספקולציה"],["A covered call","call מכוסה"],["Hedging","גידור"]],"a":1,"why":"היא לא מגינה על שום דבר שהיא מחזיקה. היא מהמרת על כיוון המחיר: ספקולציה.","c":["Q34"]},{"en":"Which statement about European-style options is TRUE?","he":"מה נכון לגבי אופציות בסגנון אירופאי?","o":[["They trade only on European exchanges","הן נסחרות רק בבורסות באירופה"],["They can be exercised only at expiration","אפשר לממש אותן רק בפקיעה"],["They cannot be sold before expiration","אי אפשר למכור אותן לפני הפקיעה"],["They can be exercised at any time before expiration","אפשר לממש אותן בכל זמן לפני הפקיעה"]],"a":1,"why":"סגנון אירופאי = מימוש רק בפקיעה. השם לא קשור למקום המסחר.","c":["P38"]},{"en":"The writer of an American-style call can be assigned:","he":"כותב של call בסגנון אמריקאי יכול לקבל הקצאה:","o":[["After the expiration date has passed","אחרי שמועד הפקיעה עבר"],["When the call moves out of the money","כשה-call עובר אל מחוץ לכסף"],["On the expiration date, not before","ביום הפקיעה, לא לפני"],["At any time before expiration","בכל זמן לפני הפקיעה"]],"a":3,"why":"ה-holder של אופציה אמריקאית רשאי לממש בכל זמן, ולכן הכותב יכול לקבל הקצאה בכל זמן.","c":["P39","Q48"]},{"en":"When an index option is exercised, the assigned writer:","he":"כשאופציה על מדד ממומשת, הכותב שקיבל הקצאה:","o":[["Pays the premium back to the holder","מחזיר את הפרמיה למחזיק"],["Delivers the stocks in the index","מוסר את המניות שבמדד"],["Delivers 100 shares of an index fund","מוסר 100 יחידות של קרן מדד"],["Pays the cash difference","משלם את ההפרש במזומן"]],"a":3,"why":"אופציות על מדד מסולקות במזומן: עובר רק כסף בין הצדדים.","c":["P43","P44"]},{"en":"Which organization randomly assigns exercise notices to firms that have customers with short positions?","he":"איזה גוף מקצה באקראי הודעות מימוש לחברות ברוקרים שיש להן לקוחות בעמדת short?","o":[["The Options Clearing Corporation","מסלקת האופציות (OCC)"],["The Cboe","ה-Cboe"],["FINRA","FINRA"],["The firm's Registered Options Principal","המנהל המורשה לאופציות בחברה"]],"a":0,"why":"ה-OCC מקצה באקראי לחברות ברוקרים, וחברת הברוקרים מקצה ללקוח.","c":["P32","P33"]},{"en":"A brokerage firm receives an assignment notice. Under FINRA rules, it may allocate it to a customer with a short position by:","he":"חברת ברוקרים מקבלת הודעת הקצאה. לפי כללי FINRA, היא רשאית להקצות אותה ללקוח בעמדת short לפי:","o":[["Customer request or broker seniority","בקשת הלקוח, או ותק הברוקר"],["Largest position first or random selection","העמדה הגדולה ראשונה, או בחירה אקראית"],["First-in first-out or random selection","מי שנכנס ראשון, או בחירה אקראית"],["Pro rata by size or by account age","באופן יחסי לגודל, או לפי ותק החשבון"]],"a":2,"why":"FINRA מחייבת הקצאה לפי first-in first-out או בחירה אקראית.","c":["P36"]},{"en":"Under FINRA rules, when must a customer receive the Options Disclosure Document?","he":"לפי כללי FINRA, מתי לקוח חייב לקבל את מסמך הגילוי לאופציות (ODD)?","o":[["When the customer first writes an uncovered option","כשהלקוח כותב לראשונה אופציה לא מכוסה"],["Within 15 days after the account is approved","תוך 15 יום אחרי שהחשבון אושר"],["With the confirmation of the first options trade","יחד עם אישור העסקה הראשונה באופציות"],["At or before the time the account is approved","לפני אישור החשבון או באותו זמן"]],"a":3,"why":"כלל 2360: at or before the time the account is approved for options trading.","c":["P57"]},{"en":"The writer of an equity call option is assigned. How does the trade settle?","he":"לכותב של call על מניה הוקצה מימוש. איך העסקה מסולקת?","o":[["Delivers 100 shares at the market price","מוסר 100 מניות במחיר השוק"],["Buys 100 shares at the strike price","קונה 100 מניות במחיר המימוש"],["Delivers 100 shares at the strike price","מוסר 100 מניות במחיר המימוש"],["Buys 100 shares at the market price","קונה 100 מניות במחיר השוק"]],"a":2,"why":"אופציה על מניה מסולקת בדרך כלל במסירה פיזית: הכותב מוסר (מוכר) את המניות במחיר המימוש. חוזה רגיל = 100 מניות.","c":["P10","P24","P46"]},{"en":"A customer who bought a call last month sells it in the market before expiration. This sale is:","he":"לקוח שקנה call בחודש שעבר מוכר אותו בשוק לפני הפקיעה. המכירה הזאת היא:","o":[["A closing transaction","עסקת סגירה"],["An exercise","מימוש"],["An opening transaction","עסקת פתיחה"],["An assignment","הקצאה"]],"a":0,"why":"הוא מוכר משהו שכבר היה לו, ולכן מקטין עמדה קיימת: closing transaction.","c":["P64","P65"]}],"calcs":["oprem","obe","olong","oshort","omoney","ointr","occ","opp","ocash"],"words":{"Option":{"pr":"אוֹפְּשֶן","def":"A contract that gives its buyer the right, but not the duty, to buy or sell something at a fixed price.","hint":"option = אפשרות. לקונה יש אפשרות, לא חובה."},"Underlying":{"pr":"אַנְדֶרְלַייאִינְג","def":"The asset the contract is based on, such as a stock or a stock index.","hint":"under = מתחת. הנכס שנמצא \"מתחת\" לאופציה."},"Derivative":{"pr":"דִירִיוֶוטִיב","def":"A contract whose value comes from the price of another asset. Options are one kind.","hint":"derive = לגזור, לנבוע מ."},"Holder (buyer)":{"pr":"הוֹלְדֶר (בַּיֶיר)","def":"The person who pays the premium and gets the right. Also called long.","hint":"hold = להחזיק."},"Writer (seller)":{"pr":"רַייטֶר (סֶלֶר)","def":"Takes the premium, and must buy or sell the stock if the holder exercises. Also called short.","hint":"write = לכתוב. מי \"שכותב\" את החוזה ומתחייב בו."},"Premium":{"pr":"פְּרִימְיוּם","def":"The price of the contract. Paid up front by the buyer to the seller, and not refunded.","hint":"גם בביטוח: premium = דמי ביטוח. משלמים מראש, וזה לא חוזר."},"Call":{"pr":"קוֹל","def":"The right to buy the underlying at the strike price.","hint":"call = לקרוא למניה שתבוא אליך. כלומר לקנות."},"Put":{"pr":"פּוּט","def":"The right to sell the underlying at the strike price.","hint":"put = לשים אצל מישהו אחר. כלומר למכור."},"Long position":{"pr":"לוֹנְג פּוֹזִישֶן","def":"The contracts a person has bought and holds. This side has the rights."},"Short position":{"pr":"שוֹרְט פּוֹזִישֶן","def":"The contracts a person has written (sold). This side has the obligations."},"Bullish / bearish":{"pr":"בּוּלִיש / בֶּרִיש","def":"Expecting prices to rise / expecting prices to fall. A call buyer is the first; a put buyer is the second.","hint":"bull = שור (מרים את הקרניים למעלה). bear = דוב (מכה למטה)."},"Strike price (exercise price)":{"pr":"סְטְרַייק פְּרַייס (אֶקְסֶרְסַייז פְּרַייס)","def":"The fixed dollar amount at which the holder may buy (call) or sell (put) the underlying."},"Expiration date":{"pr":"אֶקְסְפִּירֵיישֶן דֵייט","def":"The last day the contract can be exercised. After it, the contract no longer exists. If it ends out of the money, it is worth nothing.","hint":"expire = לפוג."},"Contract size":{"pr":"קוֹנְטְרַקְט סַייז","def":"How much stock one standard unit covers: usually 100 shares. Three of them = 300 shares."},"Per share vs. per contract":{"pr":"פֶּר שֶר וֶרְסֶס פֶּר קוֹנְטְרַקְט","def":"Premiums are quoted for one unit of stock; multiply by 100 for the cost of one standard deal. $2.20 = $220."},"In the money":{"pr":"אִין דֶה מַאנִי","def":"Worth something if exercised now. A call: stock above the strike. A put: stock below the strike.","hint":"call: מניה מעל המימוש. put: מניה מתחת למימוש."},"Out of the money":{"pr":"אַאוּט אוֹו דֶה מַאנִי","def":"Worth nothing if exercised now. A call: strike above the stock price. A put: strike below the stock price."},"At the money":{"pr":"אֶט דֶה מַאנִי","def":"The stock price equals the strike price. This means the same for calls and puts."},"Intrinsic value":{"pr":"אִינְטְרִינְסִיק וֶולְיוּ","def":"The amount by which a contract is in the money. Zero if it is out of the money; never negative.","hint":"intrinsic = פנימי, מהותי."},"Time value":{"pr":"טַיים וֶולְיוּ","def":"The part of the premium above the in-the-money amount. It shrinks as expiration nears, faster near the end.","hint":"פרמיה = ערך פנימי + ערך זמן."},"Volatility":{"pr":"וָולֶטִילִיטִי","def":"How much the underlying's price moves. More movement means higher premiums.","hint":"volatile = הפכפך, תנודתי."},"Exercise":{"pr":"אֶקְסֶרְסַייז","def":"The holder uses the right to buy or sell at the strike price, by instructing the brokerage firm.","hint":"גם \"תרגיל\", אבל כאן: לממש."},"Assignment":{"pr":"אֲסַיינְמֶנְט","def":"The notice that tells a writer the contract was exercised, so now the writer must buy or sell. Only short positions get it.","hint":"assign = להקצות, להטיל משימה."},"OCC (Options Clearing Corporation)":{"pr":"אוֹ-סִי-סִי","def":"Issues exchange-listed contracts of this kind and guarantees them: it becomes the buyer to every seller and the seller to every buyer."},"American-style":{"pr":"אֲמֶרִיקֶן סְטַייל","def":"May be exercised at any time up to expiration, so its writer can get a notice at any time."},"European-style":{"pr":"יוּרוֹפִּיאֶן סְטַייל","def":"May be exercised only at expiration. The name is about timing, not about where it trades."},"Opening / closing transaction":{"pr":"אוֹפֶּנִינְג / קְלוֹזִינְג טְרַנְזַקְשֶן","def":"The first creates or adds to a position. The second reduces or ends a position you already have."},"Equity option":{"pr":"אֶקְוִוִיטִי אוֹפְּשֶן","def":"A contract on a single stock. One standard contract usually covers 100 shares, and the shares normally change hands when it is exercised."},"Index option":{"pr":"אִינְדֶקְס אוֹפְּשֶן","def":"A contract based on the prices of a group of securities. Settled in cash, with its size set by a multiplier."},"Physical delivery":{"pr":"פִיזִיקָל דֶלִיוֶורִי","def":"When the contract is exercised, the shares themselves change hands at the strike price.","hint":"deliver = למסור."},"Cash settlement":{"pr":"קֶש סֶטֶלְמֶנְט","def":"When the contract is exercised, only money changes hands between the two sides. Index contracts work this way.","hint":"settle = לסלק, לסגור חשבון."},"Automatic exercise":{"pr":"אוֹטוֹמַטִיק אֶקְסֶרְסַייז","def":"At expiration, a stock contract that is in the money, even by 1 cent, is usually carried out for the holder, unless the holder instructs otherwise."},"Long call":{"pr":"לוֹנְג קוֹל","def":"Buying the right to buy. Bullish. Most you can lose: the premium. Most you can make: no limit. Breakeven: strike + premium."},"Long put":{"pr":"לוֹנְג פּוּט","def":"Buying the right to sell. Bearish. Most you can lose: the premium. Most you can make: strike − premium. Breakeven: strike − premium."},"Breakeven":{"pr":"בְּרֵייק-אִיוֶון","def":"The stock price at expiration where you neither make nor lose money. Calls: strike + premium. Puts: strike − premium.","hint":"break even = לצאת \"תיקו\"."},"Maximum loss (buyer)":{"pr":"מַקְסִימוּם לוֹס (בַּיֶיר)","def":"For anyone who pays a premium, the worst case is losing all of it, and nothing more."},"Leverage":{"pr":"לֶוֶרֶג'","def":"A small premium controls a large amount of stock. It can make percentage gains large, and percentage losses too.","hint":"lever = מנוף."},"Short call":{"pr":"שוֹרְט קוֹל","def":"Selling the right to buy. Neutral to bearish. Most you can make: the premium. Breakeven: strike + premium."},"Short put":{"pr":"שוֹרְט פּוּט","def":"Selling the right to sell. Neutral to bullish. Most you can make: the premium. Most you can lose: strike − premium."},"Uncovered (naked) call":{"pr":"אַנְקַאוֶורְד (נֵייקֶד) קוֹל","def":"Selling the right to buy without owning the stock. The possible loss has no limit.","hint":"naked = ערום, בלי כיסוי."},"Covered vs. uncovered":{"pr":"קַאוֶורְד וֶרְסֶס אַנְקַאוֶורְד","def":"Whether the writer of a right-to-buy contract already owns the shares that may have to be delivered."},"Margin":{"pr":"מַרְגִ'ין","def":"Money a writer without the shares must keep with the broker as a guarantee. If the price moves against the writer, more may be required."},"Hedging":{"pr":"הֶגִ'ינְג","def":"Using contracts to reduce the risk of a position you already own, such as buying puts on stock you hold.","hint":"hedge = גדר. מקיפים את מה שיש לך בגדר הגנה."},"Speculation":{"pr":"סְפֶּקְיוּלֵיישֶן","def":"Using contracts to bet on the direction of a price: buying calls if you expect a rise, puts if you expect a fall."},"Protective put":{"pr":"פְּרוֹטֶקְטִיו פּוּט","def":"Buying the right to sell on stock you own, as insurance. Max loss: stock cost − strike + premium. Breakeven: stock cost + premium."},"Married put":{"pr":"מֶרִיד פּוּט","def":"Bought on the same day as the stock, to protect it.","hint":"married = נשוי. נקנה \"יחד\" עם המניה."},"Covered call":{"pr":"קַאוֶורְד קוֹל","def":"Owning 100 shares and selling one contract that gives someone the right to buy them. Max gain: strike − stock cost + premium. Breakeven: stock cost − premium."},"ODD (Options Disclosure Document)":{"pr":"אוֹ-דִי-דִי","def":"\"Characteristics and Risks of Standardized Options\". The firm must deliver it at or before approving the account for this kind of trading."},"Options account approval":{"pr":"אוֹפְּשֶנְז אֲקַאוּנְט אֲפְּרוּוָל","def":"Written permission a firm must give before it may accept a customer's first order in these contracts. It may allow only certain types of trades."},"Registered Options Principal (ROP)":{"pr":"רֶגִ'יסְטֶרְד אוֹפְּשֶנְז פְּרִינְסִיפֶּל (אָר-אוֹ-פִּי)","def":"A supervisor licensed to approve accounts for trading in these contracts."},"Standardized (listed) option":{"pr":"סְטַנְדֶרְדַייזְד (לִיסְטֶד) אוֹפְּשֶן","def":"A contract issued by a registered clearing agency such as the OCC, traded on exchanges."},"Conventional option":{"pr":"קוֹנְוֶנְשֶנָל אוֹפְּשֶן","def":"A contract that a registered clearing agency did not issue."}},"examWords":[["writes (an option)","כותב (=מוכר) אופציה","writes a call = מוכר call ומקבל פרמיה. buys = קונה."],["the right to","הזכות ל","לקונה יש זכות. למוכר יש חובה (obligation)."],["obligation","חובה, התחייבות","the writer has an obligation = המוכר חייב לבצע אם יקבל הקצאה."],["is exercised","ממומשת","the call is exercised = הקונה השתמש בזכות."],["is assigned","קיבל הקצאה","the writer is assigned = המוכר נבחר לבצע את החוזה."],["at expiration","בפקיעה","ביום האחרון של האופציה."],["premium of 3","פרמיה של 3 (למניה)","3 דולר למניה = 300 דולר לחוזה."],["total premium paid","סך הפרמיה ששולמה","כל החוזים יחד, כפול 100."],["breakeven point","נקודת איזון","המחיר שבו אין רווח ואין הפסד."],["maximum gain / maximum loss","רווח מקסימלי / הפסד מקסימלי","ה-\"הכי הרבה\" בכל כיוון. לפעמים התשובה Unlimited."],["Unlimited","לא מוגבל","בא ממניה שיכולה לעלות בלי גבול: רווח למי שמחזיק call או מניות (גם עם put מגן); הפסד למוכר call לא מכוסה. בצד של put אין Unlimited."],["outlook","השקפה, ציפייה","bullish / bearish / neutral: מה המשקיע מצפה שיקרה למחיר."],["neutral","ניטרלי","מצפה שהמחיר לא יזוז הרבה."],["uncovered","לא מכוסה","writes an uncovered call = מוכר call בלי להחזיק את המניות."],["owns 100 shares","מחזיק 100 מניות","רמז ל-covered call (אם מוכר call) או ל-protective put (אם קונה put)."],["no position in","אין לו עמדה ב","לא מחזיק כלום בנכס הזה: לא מניות ולא אופציות."],["randomly assigns","מקצה באקראי","The computer randomly assigns seats = המחשב מחלק מקומות באקראי."],["At or before","לפני או באותו זמן","pay at or before delivery = לשלם לפני המסירה או ברגע המסירה."],["accept an order","לקבל הוראה (לביצוע)","אסור לברוקר לקבל הוראה באופציות לפני אישור החשבון."],["closes a position","סוגר עמדה","closing transaction: מקטין או מבטל עמדה קיימת."],["All else being equal","אם כל השאר לא משתנה","בודקים רק את השינוי שהשאלה מתארת."],["generally","בדרך כלל","יש חריגים, אבל זה הכלל."],["an 85 call at 2","call עם מחיר מימוש 85 ופרמיה 2","המספר הראשון = מחיר המימוש. המספר אחרי at = הפרמיה למניה. מחיר המניה מופיע עם $ (the stock is at $86)."],["MOST likely","הכי סביר","בוחרים את התשובה הכי מתאימה, גם אם עוד תשובה נכונה חלקית."],["BEST describes","מתאר הכי טוב","כמה תשובות אולי נשמעות נכון. בוחרים את המדויקת ביותר."],["trades at $63","נסחרת ב-63 דולר","זה מחיר השוק של המניה עכשיו, לא מחיר המימוש."],["sells a call","מוכר call","עסקה חדשה = כותב (short). מוכר call שקנה קודם = סוגר עמדה (closing)."],["assignment notice","הודעת הקצאה","ההודעה שמקבל המוכר: האופציה שלך מומשה."],["allocate","להקצות, לחלק","allocate to a customer = לבחור לאיזה לקוח זה הולך."],["first-in first-out","מי שנכנס ראשון, יוצא ראשון","שיטה לבחור לקוח לפי הסדר שבו פתחו עמדות."],["strongly bullish","שורי מאוד","מצפה לעלייה חזקה."],["a sharp drop","ירידה חדה","ירידה גדולה ומהירה."],["decreases / increases","יורד / עולה","Higher = גבוה יותר. Lower = נמוך יותר."],["is not refunded","לא מוחזר","refund = החזר כספי."],["exposes the investor to","חושף את המשקיע ל","exposes to a loss = שם אותו בסיכון להפסד."],["potential loss","הפסד אפשרי","potential = פוטנציאלי, מה שיכול לקרות."],["How does the trade settle?","איך העסקה מסולקת?","settle = מה עובר בסוף: מניות או כסף."],["further out of the money","עמוק יותר מחוץ לכסף","רחוק יותר ממחיר המימוש, בכיוון הלא טוב לקונה."]],"sorter":{"title":"איזו מבין ארבע העמדות?","ask":"Which position is it?","labels":["Long call","Short call","Long put","Short put"],"intro":"הטבלה הזאת תמיד מופיעה באותו סדר, כדי שהמקום של כל עמדה ייחרט בזיכרון. בכל שאלה: שאלו קודם call או put, ואז קנה או מכר.","table":"<table class=\"grid4\" dir=\"ltr\" lang=\"en\"><tr><td><b>Long call</b><br>bullish<br>BE = K&nbsp;+&nbsp;P<br>max loss = P<br>max gain: unlimited</td><td><b>Short call</b><br>neutral to bearish<br>BE = K&nbsp;+&nbsp;P<br>max gain = P<br>max loss: unlimited (uncovered)</td></tr><tr><td><b>Long put</b><br>bearish<br>BE = K&nbsp;−&nbsp;P<br>max loss = P<br>max gain = K&nbsp;−&nbsp;P</td><td><b>Short put</b><br>neutral to bullish<br>BE = K&nbsp;−&nbsp;P<br>max gain = P<br>max loss = K&nbsp;−&nbsp;P</td></tr></table>","rule":"<p style='margin:4px 0 0'>כלל המראה: לכל קונה יש מוכר מולו. מה שהקונה מרוויח, המוכר מפסיד, ונקודת האיזון זהה לשניהם.</p>","items":[["An investor buys a call.","משקיע קונה call.",0],["An investor writes a call.","משקיע כות en as instructions to the holder's brokerage firm.","ניתן כהוראה לחברת הברוקרים של ה-holder.","a"],["Allocated by FINRA rule first-in first-out or at random.","מוקצה לפי כלל FINRA: first-in first-out או באקראי.","b"]]},{"a":"In the money","b":"Out of the money","he":"האם האופציה שווה משהו אם היא פוקעת עכשיו. שימו לב: call ו-put הפוכים.","why":"","items":[["A 40 call when the stock is at $44.","call של 40 כשהמניה ב-44.","a"],["A 40 put when the stock is at $44.","put של 40 כשהמניה ב-44.","b"],["A 50 put when the stock is at $47.","put של 50 כשהמניה ב-47.","a"],["A 50 call when the stock is at $47.","call של 50 כשהמניה ב-47.","b"],["Its intrinsic value is zero.","הערך הפנימי שלה אפס.","b"]]},{"a":"Intrinsic value","b":"Time value","he":"שני החלקים של הפרמיה.","why":"","items":[["The amount by which the option is in the money.","הסכום שבו האופציה בתוך הכסף.","a"],["The part of the premium above the in-the-money amount.","החלק של הפרמיה שמעל הסכום שבתוך הכסף.","b"],["Shrinks as expiration nears, even if the stock does not move.","קטן ככל שהפקיעה מתקרבת, גם אם המניה לא זזה.","b"],["Zero for an out-of-the-money option.","אפס לאופציה מחוץ לכסף.","a"]]},{"a":"American-style","b":"European-style","he":"מתי מותר לממש. לא קשור למקום.","why":"","items":[["May be exercised at any time before expiration.","אפשר לממש בכל זמן לפני הפקיעה.","a"],["May be exercised only at expiration.","אפשר לממש רק בפקיעה.","b"],["Its writer can be assigned on any day.","הכותב שלה יכול לקבל הקצאה בכל יום.","a"],["Cboe describes its index options this way.","Cboe מתארת כך את אופציות המדד שלה.","b"],["Cboe describes stock options this way.","Cboe מתארת כך אופציות על מניות.","a"]]},{"a":"Physical delivery","b":"Cash settlement","he":"מה עובר ידיים במימוש: מניות או כסף.","why":"","items":[["The shares change hands at the strike price.","המניות עוברות ידיים במחיר המימוש.","a"],["Only money changes hands.","רק כסף עובר ידיים.","b"],["How index options settle.","כך מסולקות אופציות על מדד.","b"],["How an assigned equity call writer usually settles.","כך מסלק בדרך כלל כותב call על מניה שקיבל הקצאה.","a"]]},{"a":"Long call","b":"Long put","he":"שני הקונים. אחד שורי, אחד דובי.","why":"","items":[["Breakeven is strike plus premium.","נקודת האיזון היא מחיר מימוש ועוד פרמיה.","a"],["Breakeven is strike minus premium.","נקודת האיזון היא מחיר מימוש פחות פרמיה.","b"],["Maximum gain is unlimited.","הרווח המקסימלי לא מוגבל.","a"],["Maximum gain is strike minus premium.","הרווח המקסימלי הוא מחיר מימוש פחות פרמיה.","b"],["Bearish.","דובי.","b"]]},{"a":"Short call","b":"Short put","he":"שני המוכרים. שניהם מרוויחים לכל היותר את הפרמיה.","why":"","items":[["If uncovered, the possible loss is unlimited.","אם לא מכוסה, ההפסד האפשרי לא מוגבל.","a"],["Maximum loss is strike minus premium.","ההפסד המקסימלי הוא מחיר מימוש פחות פרמיה.","b"],["Neutral to bullish.","ניטרלי עד שורי.","b"],["Neutral to bearish.","ניטרלי עד דובי.","a"],["If assigned, must buy the stock.","אם מקבל הקצאה, חייב לקנות את המניה.","b"]]},{"a":"Covered call","b":"Uncovered call","tb":"Uncovered (naked) call","he":"שני מוכרי call. ההבדל: האם מחזיקים את המניות.","why":"","items":[["The writer owns the shares.","הכותב מחזיק את המניות.","a"],["The writer does not own the shares.","הכותב לא מחזיק את המניות.","b"],["The possible loss is unlimited.","ההפסד האפשרי לא מוגבל.","b"],["Gives up gains above the strike, but keeps the risk of a decline.","מוותר על רווח מעל מחיר המימוש, אבל נשאר עם הסיכון של ירידה.","a"],["Requires margin from the writer.","דורש מהכותב להפקיד בטוחה.","b"]]},{"a":"Covered call","b":"Protective put","he":"שתי אסטרטגיות של מי שמחזיק מניות. אחת מכניסה כסף, אחת קונה ביטוח.","why":"","items":[["The investor sells an option on stock owned.","המשקיע מוכר אופציה על מניה שבידיו.","a"],["The investor buys an option on stock owned.","המשקיע קונה אופציה על מניה שבידיו.","b"],["Breakeven is stock cost minus premium.","נקודת האיזון היא מחיר הקנייה פחות הפרמיה.","a"],["Breakeven is stock cost plus premium.","נקודת האיזון היא מחיר הקנייה ועוד הפרמיה.","b"],["Maximum gain is unlimited.","הרווח המקסימלי לא מוגבל.","b"],["Limits losses if the stock falls.","מגביל את ההפסד אם המניה יורדת.","b"]]},{"a":"Hedging","b":"Speculation","he":"להקטין סיכון על משהו שיש לך, או להמר על כיוון.","why":"","items":[["Buying puts on stock you own.","קניית put על מניה שבידיך.","a"],["Buying calls on a stock you do not own because you expect it to rise.","קניית call על מניה שאין לך, כי אתה מצפה שתעלה.","b"],["Reduces the risk of an existing position.","מקטין את הסיכון של עמדה קיימת.","a"],["A bet on the direction of the price.","הימור על כיוון המחיר.","b"]]},{"a":"Equity option","b":"Index option","he":"על מניה אחת או על מדד.","why":"","items":[["One contract usually covers 100 shares.","חוזה אחד מכסה בדרך כלל 100 מניות.","a"],["Based on the prices of a group of securities.","מבוססת על המחירים של קבוצת ניירות ערך.","b"],["Settled in cash.","מסולקת במזומן.","b"],["Normally settled by delivery of the stock.","בדרך כלל מסולקת במסירת המניה.","a"]]},{"a":"Opening transaction","b":"Closing transaction","ta":"Opening / closing transaction","tb":"Opening / closing transaction","he":"יוצרים עמדה או סוגרים עמדה.","why":"","items":[["Buying a call you did not have before.","קניית call שלא היה לך קודם.","a"],["Selling a call you bought earlier.","מכירת call שקנית קודם.","b"],["Writing a new put.","כתיבת put חדש.","a"],["Reduces or ends an existing position.","מקטינה או מבטלת עמדה קיימת.","b"]]}]};</script>

Object.keys(S.miss).forEach(k=>{if(typeof S.miss[k]!=="object")S.miss[k]={b:0,due:today()}});
function markMiss(term){S.miss[term]={b:0,due:today()};save()}
function markHit(term){const m=S.miss[term];if(!m||m.due>today())return;if(m.b>=GAPS.length)delete S.miss[term];else{m.due=today()+GAPS[m.b];m.b++}save()}
const bidi=h=>String(h).replace(/[A-Za-z][A-Za-z0-9 .'\/&$%-]*[A-Za-z0-9%]/g,m=>`<bdi lang="en">${m}</bdi>`);
const termCard=(t,li)=>{const w=W[t[0]]||{};return `<div class="term"><div class="t-top">${sayBtn(t[0])}<span class="t-en" lang="en">${t[0]}</span></div>

  <span class="t-he">${bidi(t[1])}${li!=null?` <span class="muted" style="font-weight:400;font-size:.85rem">(שיעור ${li+1})</span>`:""}</span><p>${bidi(t[2])}</p>${w.hint?`<p class="t-hint">💡 ${bidi(w.hint)}</p>`:""}</div>`};
